<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HOME iframe 좌표 설정 | FUNY PIN</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#f4f2f7;color:#24212a}.bar{position:sticky;top:0;z-index:10;padding:12px;background:#fff;border-bottom:1px solid #e7e2eb}.bar h1{font-size:16px;margin:0 0 9px}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.controls button,.controls input{height:36px;border:1px solid #ddd6e3;border-radius:9px;background:#fff;padding:0 10px;font-size:13px}.controls button{cursor:pointer}.controls .active{background:#272331;color:#fff;border-color:#272331}.value{font-weight:800;color:#6749bd}.hint{margin:8px 0 0;font-size:11px;color:#8a8490}.frame-wrap{width:min(100%,420px);height:var(--preview-h,960px);margin:0 auto;overflow:hidden;background:#fff;position:relative}.frame-wrap iframe{position:absolute;left:0;top:0;width:100%;height:4000px;border:0;transform:translateY(var(--y));transform-origin:top left}.guide{position:fixed;left:0;right:0;top:155px;height:2px;background:#ff4d67;z-index:5;pointer-events:none}</style></head><body><div class="bar"><h1>HOME · 인포크 좌표 설정</h1><div class="controls"><button data-mode="recommend" class="active">📍 카드샵 추천</button><button data-mode="visit">📝 카드샵 방문기</button><button data-mode="links">🔗 링크 모음</button><button id="minus10">-10</button><button id="minus1">-1</button><span class="value" id="value"></span><button id="plus1">+1</button><button id="plus10">+10</button><input id="direct" type="number" step="1" aria-label="Y 좌표"><span style="font-size:12px;font-weight:700">높이</span><button id="hminus10">-10</button><button id="hminus1">-1</button><span class="value" id="hvalue"></span><button id="hplus1">+1</button><button id="hplus10">+10</button><input id="hdirect" type="number" step="1" min="100" aria-label="노출 높이"><button id="copy">설정값 복사</button></div><p class="hint">HOME의 3개 인포크 영역을 각각 선택해 Y 좌표와 노출 높이를 맞춘 뒤 설정값을 복사해 보내주세요.</p></div><div class="guide"></div><div class="frame-wrap"><iframe id="frame" src="https://link.inpock.co.kr/tcg_map" scrolling="no"></iframe></div><script>(()=>{const vals={recommend:-250,visit:-1607,links:-1238},heights={recommend:960,visit:210,links:340};let mode="recommend";const frame=document.getElementById("frame"),wrap=document.querySelector(".frame-wrap"),value=document.getElementById("value"),direct=document.getElementById("direct"),hvalue=document.getElementById("hvalue"),hdirect=document.getElementById("hdirect");function draw(){frame.style.setProperty("--y",vals[mode]+"px");wrap.style.setProperty("--preview-h",heights[mode]+"px");value.textContent="Y "+vals[mode]+"px";direct.value=vals[mode];hvalue.textContent=heights[mode]+"px";hdirect.value=heights[mode];document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode))}document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});function move(n){vals[mode]+=n;draw()}minus10.onclick=()=>move(-10);minus1.onclick=()=>move(-1);plus1.onclick=()=>move(1);plus10.onclick=()=>move(10);direct.onchange=()=>{vals[mode]=Number(direct.value)||0;draw()};function hmove(n){heights[mode]=Math.max(100,heights[mode]+n);draw()}hminus10.onclick=()=>hmove(-10);hminus1.onclick=()=>hmove(-1);hplus1.onclick=()=>hmove(1);hplus10.onclick=()=>hmove(10);hdirect.onchange=()=>{heights[mode]=Math.max(100,Number(hdirect.value)||100);draw()};copy.onclick=async()=>{const labels={recommend:"카드샵 추천",visit:"카드샵 방문기",links:"링크 모음"},t=labels[mode]+" Y 좌표: "+vals[mode]+"px / 노출 높이: "+heights[mode]+"px";try{await navigator.clipboard.writeText(t);copy.textContent="복사 완료";setTimeout(()=>copy.textContent="설정값 복사",1000)}catch(e){prompt("아래 설정값을 복사하세요",t)}};draw()})();</script></body></html>
