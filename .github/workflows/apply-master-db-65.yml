name: Apply Master DB 65
on:
  push:
    paths:
      - .github/workflows/apply-master-db-65.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply data snapshot
        run: |
          python - <<'PY'
          import re,zlib,base64,json
          wf=open('.github/workflows/sync-master-db-65.yml',encoding='utf-8').read()
          enc=re.search(r'SNAPSHOT_B64: ([A-Za-z0-9+/=]+)',wf).group(1)
          prefix=zlib.decompress(base64.b64decode(enc)).decode('utf-8')
          p='app.js'; s=open(p,encoding='utf-8').read()
          out,n=re.subn(r'^const SHOPS = .*?;const REVIEWS=.*?;',prefix,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('data prefix not found')
          shops=json.loads(re.search(r'^const SHOPS = (.*?);\nconst REVIEWS=',out,re.S).group(1))
          assert len(shops)==65 and shops[-1]['id']=='JP-TYO-023'
          open(p,'w',encoding='utf-8').write(out)
          PY
      - name: Commit data only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Sync 65 card shops from Master DB"
          git push
