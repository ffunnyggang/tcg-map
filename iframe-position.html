<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>인포크 전체 좌표 설정 | FUNY PIN</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#f4f2f7;color:#24212a}.bar{position:sticky;top:0;z-index:10;padding:12px;background:#fff;border-bottom:1px solid #e7e2eb}.bar h1{font-size:16px;margin:0 0 9px}.page-tabs,.region-tabs,.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.page-tabs{margin-bottom:7px}.bar button,.bar input{height:36px;border:1px solid #ddd6e3;border-radius:9px;background:#fff;padding:0 10px;font-size:13px}.bar button{cursor:pointer}.bar button.active{background:#272331;color:#fff;border-color:#272331}.value{font-weight:800;color:#6749bd}.hint{margin:8px 0 0;font-size:11px;color:#8a8490}.frame-wrap{width:min(100%,420px);height:var(--preview-h,800px);margin:0 auto;overflow:hidden;background:#fff;position:relative}.frame-wrap iframe{position:absolute;left:0;top:0;width:100%;height:4200px;border:0;transform:translateY(var(--y));transform-origin:top left}.guide{height:2px;background:#ff4d67;position:relative;z-index:5}</style></head><body><div class="bar"><h1>HOME / INFO · 인포크 전체 좌표 설정</h1><div class="page-tabs"><button data-page="home" class="active">🏠 HOME</button><button data-page="info">ℹ️ INFO</button></div><div class="region-tabs" id="regions"></div><div class="controls" style="margin-top:7px"><span>Y</span><button id="minus10">-10</button><button id="minus1">-1</button><span class="value" id="value"></span><button id="plus1">+1</button><button id="plus10">+10</button><input id="direct" type="number" step="1"><span>높이</span><button id="hminus10">-10</button><button id="hminus1">-1</button><span class="value" id="hvalue"></span><button id="hplus1">+1</button><button id="hplus10">+10</button><input id="hdirect" type="number" min="100" step="1"><button id="copy">현재 설정값 복사</button><button id="copyAll">전체 설정값 복사</button></div><p class="hint">HOME 3개 + INFO 2개 영역을 모두 조정할 수 있습니다. 빨간 선을 기준으로 Y 좌표와 노출 높이를 맞춰주세요.</p></div><div class="guide"></div><div class="frame-wrap"><iframe id="frame" src="https://link.inpock.co.kr/tcg_map" scrolling="no"></iframe></div><script>(()=>{const data={home:{recommend:{label:"📍 카드샵 추천",y:-215,h:1060},visit:{label:"📝 카드샵 방문기",y:-1250,h:590},links:{label:"🔗 링크 모음",y:-1820,h:400}},info:{information:{label:"💡 정보",y:-2260,h:800},review:{label:"📝 리뷰",y:-3060,h:770}}};let page="home",region="recommend";const regions=document.getElementById("regions"),frame=document.getElementById("frame"),wrap=document.querySelector(".frame-wrap"),value=document.getElementById("value"),direct=document.getElementById("direct"),hvalue=document.getElementById("hvalue"),hdirect=document.getElementById("hdirect");function buildRegions(){regions.innerHTML="";Object.entries(data[page]).forEach(([k,v])=>{const b=document.createElement("button");b.textContent=v.label;b.className=k===region?"active":"";b.onclick=()=>{region=k;draw()};regions.appendChild(b)})}function draw(){const d=data[page][region];frame.style.setProperty("--y",d.y+"px");wrap.style.setProperty("--preview-h",d.h+"px");value.textContent=d.y+"px";direct.value=d.y;hvalue.textContent=d.h+"px";hdirect.value=d.h;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));buildRegions()}document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;region=Object.keys(data[page])[0];draw()});function ym(n){data[page][region].y+=n;draw()}minus10.onclick=()=>ym(-10);minus1.onclick=()=>ym(-1);plus1.onclick=()=>ym(1);plus10.onclick=()=>ym(10);direct.onchange=()=>{data[page][region].y=Number(direct.value)||0;draw()};function hm(n){data[page][region].h=Math.max(100,data[page][region].h+n);draw()}hminus10.onclick=()=>hm(-10);hminus1.onclick=()=>hm(-1);hplus1.onclick=()=>hm(1);hplus10.onclick=()=>hm(10);hdirect.onchange=()=>{data[page][region].h=Math.max(100,Number(hdirect.value)||100);draw()};async function cp(t,b){try{await navigator.clipboard.writeText(t);const old=b.textContent;b.textContent="복사 완료";setTimeout(()=>b.textContent=old,1000)}catch(e){prompt("아래 설정값을 복사하세요",t)}}copy.onclick=()=>{const d=data[page][region];cp((page==="home"?"HOME":"INFO")+" / "+d.label.replace(/^\S+\s/,"")+" Y 좌표: "+d.y+"px / 노출 높이: "+d.h+"px",copy)};copyAll.onclick=()=>{let a=[];for(const [p,rs] of Object.entries(data))for(const d of Object.values(rs))a.push((p==="home"?"HOME":"INFO")+" / "+d.label.replace(/^\S+\s/,"")+" Y 좌표: "+d.y+"px / 노출 높이: "+d.h+"px");cp(a.join("\n"),copyAll)};draw()})();</script></body></html>
