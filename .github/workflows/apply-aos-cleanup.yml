name: Apply deterministic AOS QA cleanup

on:
  push:
    branches:
      - aos-local-qa-20261019
    paths:
      - .github/workflows/apply-aos-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic lock and no-op cleanup
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .qa/mobile-cleanup.patch.gz.b64 | gzip -d > /tmp/mobile-cleanup.patch
          git apply --check /tmp/mobile-cleanup.patch
          git apply --index /tmp/mobile-cleanup.patch
          rm -rf .qa
          rm -f .github/workflows/export-mobile-qa.yml
          rm -f .github/workflows/apply-aos-cleanup.yml
          git add -A
          git config user.name 'FUNY PIN QA'
          git config user.email 'ffunnyggang@gmail.com'
          git commit -m 'chore(aos): lock dependencies and remove QA transfer noise'
          git push origin HEAD:aos-local-qa-20261019
