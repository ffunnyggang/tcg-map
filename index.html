*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.shell{max-width:920px;margin:0 auto}

function match(s){for(const f of state.filters){if(['pokemon','onepiece','dragonball'].includes(f)){if(s.tcg[f]!==true)return false}else if(s.f[f]!==true)return false}return true}
function tags(s){const a=[];Object.entries(FEATURES).forEach(([k,v])=>{if(s.f[k]===true)a.push(v)});return a.slice(0,5)}
function renderList(){const arr=shops.filter(match);$('count').textContent=`총 ${arr.length}곳`;$('empty').hidden=arr.length>0;$('shop-list').innerHTML=arr.map(s=>`<a class="shop-card" href="#/shop/${s.id}" data-id="${s.id}"><div class="shop-thumb">매장 이미지</div><div class="shop-info"><div class="shop-head"><div class="shop-name">${s.name}</div><div class="chev">›</div></div><div class="meta">${s.area} · ${s.station} 도보 ${s.walk}분</div><div class="hours">영업시간 · ${s.hours}</div><div class="tags">${tags(s).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div></a>`).join('')}
function radar(v){const comp=(v[0]+v[1]+v[2]+v[3])/4, vals=[comp,v[4],v[5],v[6],v[7]], labels=['상품구성','가격','매장규모','매장분위기','접근성'],cx=135,cy=125,R=80,n=5;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*r*Math.cos(a),cy+R*r*Math.sin(a)]};let g='';for(let l=1;l<=5;l++)g+=`<polygon class="grid" points="${[0,1,2,3,4].map(i=>pt(i,l/5).join(',')).join(' ')}"/>`;let axes='',labs='';for(let i=0;i<n;i++){const p=pt(i,1),q=pt(i,1.25);axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`;labs+=`<text class="rlabel" x="${q[0]}" y="${q[1]}" text-anchor="middle" dominant-baseline="middle">${labels[i]}</text>`}const poly=`<polygon class="poly" points="${vals.map((v,i)=>pt(i,v/5).join(',')).join(' ')}"/>`;return `<svg viewBox="0 0 270 250">${g}${axes}${poly}${labs}</svg>`}
function bars(v){return [['싱글카드',v[0]],['등급카드',v[1]],['박스제품',v[2]],['오리파',v[3]]].map(([l,x])=>`<div class="bar-row"><span class="bar-label">${l}</span><span class="track"><span class="fill" style="width:${x/5*100}%"></span></span></div>`).join('')}
function quick(s){const a=[];if(s.naver)a.push(['네이버지도',s.naver]);if(s.google)a.push(['Google Maps',s.google]);if(s.instagram)a.push(['Instagram',s.instagram]);if(s.phone)a.push(['전화','tel:'+s.phone]);return a.map(([l,u])=>`<a class="q-btn" href="${u}" ${u.startsWith('http')?'target="_blank" rel="noopener"':''}>${l}</a>`).join('')}
function openDetail(id,push=true){const s=shops.find(x=>x.id===id);if(!s)return;state.current=id;state.scroll=window.scrollY;const v=reviews[id];$('home-view').hidden=true;$('detail-view').hidden=false;$('hero').innerHTML='<div class="hero-empty">등록된 매장 이미지가 없습니다.</div><div class="counter">1 / 1</div>';
const info=[['주소',s.address],['영업시간',s.hours],['주차',s.parking],['SNS',s.instagram?'Instagram':null]].filter(x=>x[1]);const tcgs=Object.entries(s.tcg).filter(x=>x[1]===true).map(([k])=>k==='pokemon'?'포켓몬':k==='onepiece'?'원피스':'드래곤볼');const rv=(content[id]||[]).map(c=>`<a class="review-card" href="${c.u}" target="_blank" rel="noopener"><div class="platform">${c.p}</div><div class="review-title">${c.t}</div></a>`).join('');$('detail').innerHTML=`<h1 class="d-name">${s.name}</h1><div class="d-en">${s.en||''}</div><div class="d-meta">${s.area} · ${s.station} 도보 ${s.walk}분</div><div class="d-tags">${tags(s).map(x=>`<span class="d-tag">${x}</span>`).join('')}</div>${quick(s)?`<div class="quick">${quick(s)}</div>`:''}<section class="section"><h2>기본 정보</h2><dl class="info">${info.map(([l,x])=>`<div class="info-row"><dt>${l}</dt><dd>${x}</dd></div>`).join('')}</dl></section>${v?`<section class="section"><h2>한눈에 보는 매장 분석</h2><p class="note">※ 깽퐌커플 방문 평점으로 단순 참고용으로 활용해주세요.</p><div class="radar-card">${radar(v)}</div></section><section class="section"><h2>상품 구성 상세</h2><div class="composition"><div class="comp-title">취급 TCG</div><div class="tcg-row">${tcgs.map(x=>`<span class="tcg">${x}</span>`).join('')}</div>${bars(v)}</div></section>`:''}${rv?`<section class="section"><h2>깽퐌커플 리뷰</h2><div class="reviews-grid">${rv}</div></section>`:''}`;window.scrollTo(0,0);if(push)history.pushState({shop:id},'',`#/shop/${id}`)}
function closeDetail(){ $('detail-view').hidden=true;$('home-view').hidden=false;history.replaceState(null,'',location.pathname+location.search);requestAnimationFrame(()=>window.scrollTo(0,state.scroll)) }
$('filter-track').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;const f=b.dataset.f;if(f==='all')state.filters.clear();else state.filters.has(f)?state.filters.delete(f):state.filters.add(f);renderFilters();renderList()});
$('shop-list').addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(!a)return;e.preventDefault();openDetail(a.dataset.id)});
$('back').addEventListener('click',()=>history.back());$('share').addEventListener('click',async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:'TCG MAP',url});else{await navigator.clipboard.writeText(url);alert('링크를 복사했습니다.')}}catch(e){}});
window.addEventListener('popstate',()=>{const m=location.hash.match(/^#\/shop\/(.+)$/);if(m)openDetail(m[1],false);else{ $('detail-view').hidden=true;$('home-view').hidden=false;requestAnimationFrame(()=>window.scrollTo(0,state.scroll)) }});
renderFilters();renderList();const m=location.hash.match(/^#\/shop\/(.+)$/);if(m)openDetail(m[1],false);
</script>
</body>
</html>
