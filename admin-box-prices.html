<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOX 가격 관리 | FUNY PIN 관리자</title><link rel="stylesheet" href="/funy-ui-guide.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f8;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:#181720}.wrap{max-width:1040px;padding:22px 20px 70px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.heading h1{font-size:23px;margin:0}.heading a{color:#6749bd;font-size:13px;text-decoration:none}.panel{border:1px solid #e9e5ed;background:white;border-radius:16px;padding:21px;margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700}.field input,.field select{width:100%;height:43px;border:1px solid #ddd7e6;border-radius:10px;padding:0 12px;background:#fff;font-size:14px}.upload{margin-top:14px;border:1px dashed #bdb2d0;background:#faf9fd;border-radius:13px;padding:25px;text-align:center;display:block;cursor:pointer}.upload input{display:block;margin:10px auto 0;max-width:100%}.upload img{max-width:100%;max-height:360px;object-fit:contain;margin:12px auto}.muted{font-size:12px;color:#837a8b;line-height:1.6}.primary{background:#8062d8;color:#fff;border:0;border-radius:11px;padding:12px 17px;font:750 13px inherit;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#fff;border:1px solid #e9e5ed;border-radius:10px;padding:11px 14px;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{padding:12px;border-radius:10px;background:#f0ebfb;color:#6749bd;font-size:13px;margin-bottom:14px}.status[hidden],.panel[hidden]{display:none}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:610px;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #f0edf4}th{font-size:11px;color:#837a8b}td input[type=number]{height:37px;border:1px solid #ded9e6;border-radius:8px;width:125px;padding:5px}td input[type=checkbox]{accent-color:#8062d8}.chip{font-size:11px;border-radius:15px;background:#f3effa;padding:5px 9px;color:#6749bd}.login{padding:25px;background:#fff;border-radius:14px}@media(max-width:620px){.fields{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:15px}h1{font-size:20px!important}}
</style><style id="box-price-improvements">
body{overflow-x:hidden}
.field[hidden],.panel[hidden],[hidden]{display:none!important}
.new-seller-controls{display:flex;gap:7px;margin-top:8px}.new-seller-controls select{min-width:0;flex:1}.new-seller-controls button{flex:none}
.seller-stats{margin:10px 0 0;font-size:11px;color:#756c7c}
.upload input{max-width:100%}.image-previews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.image-previews img{display:block;width:100%;height:115px;max-height:none;object-fit:contain;background:#fff;border:1px solid #eee8f3;border-radius:9px;margin:0}
.table-scroll{overflow-x:visible!important}table{min-width:0!important;width:100%;table-layout:fixed}td,th{padding:10px 5px;vertical-align:middle}
th:nth-child(1){width:48px}th:nth-child(2){width:66px}th:nth-child(4){width:155px}th:nth-child(5){width:72px}
.product-thumb{display:block;width:49px;height:59px;object-fit:contain;background:#fff;border-radius:6px}
.product-title{font-size:12px;line-height:1.4;font-weight:750;overflow-wrap:anywhere}
.price-input{width:100%!important;min-width:0!important;text-align:right;font-size:12px!important}
.review-warning{font-size:10px;color:#ac523e;margin-top:5px;line-height:1.45}
.review-row.warning{background:#fffaf5}
.confidence{font-size:11px;color:#777082}
.admin-toast{position:fixed;z-index:99999;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;min-width:180px;max-width:calc(100vw - 30px);padding:12px 17px;background:rgba(35,29,44,.95);border-radius:11px;color:#fff;font-size:12px;font-weight:700;line-height:1.5;text-align:center;transition:opacity .2s,transform .2s}
.admin-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){
.wrap{padding:12px!important}.panel{padding:12px!important}
.table-scroll{overflow:visible!important}table,tbody{display:block;width:100%}thead{display:none}
tr.review-row{display:grid;grid-template-columns:24px 50px minmax(0,1fr) 92px;grid-template-rows:auto auto;column-gap:7px;row-gap:4px;padding:11px 0;border-bottom:1px solid #eee8f3}
tr.review-row td{padding:0!important;border:0;min-width:0}
tr.review-row td:nth-child(1){grid-column:1;grid-row:1/3;align-self:center}
tr.review-row td:nth-child(2){grid-column:2;grid-row:1/3;align-self:center}
tr.review-row td:nth-child(3){grid-column:3;grid-row:1;align-self:end}
tr.review-row td:nth-child(4){grid-column:4;grid-row:1/3;align-self:center}
tr.review-row td:nth-child(5){grid-column:3;grid-row:2;font-size:10px}
.product-thumb{width:48px;height:61px}
.price-input{height:35px!important;padding:4px!important;max-width:92px}
}
</style></head><body><main class="wrap"><div class="heading"><h1>BOX 가격 관리</h1></div><div class="login" id="authNotice">관리자 로그인 상태를 확인하고 있습니다.</div><div id="app" hidden><div class="status" id="status" role="status" hidden></div><section class="panel"><h2>1. 가격표 스크린샷 등록</h2><div class="fields"><label class="field">판매처<select id="seller"><option value="">판매처 선택</option><option value="__new__">+ 신규 등록</option></select><span id="sellerStats" class="seller-stats">판매처 정보를 불러오는 중...</span></label><label class="field">가격 기준일<input type="date" id="effectiveDate" required></label></div><div id="newSellerControls" class="new-seller-controls" hidden><select id="shopSelect" aria-label="신규 판매처 카드샵 선택"><option value="">한국 카드샵 선택</option></select><button type="button" class="secondary" id="registerSeller">판매처 등록</button></div><label class="upload" for="file"><strong>가격표 이미지를 선택하거나 첨부하세요</strong><p class="muted">JPG·PNG·WebP / 장당 8MB 이하 · 최대 3장</p><input id="file" type="file" multiple accept="image/jpeg,image/png,image/webp"><div id="imagePreviews" class="image-previews"></div></label><p class="muted">퍼니핀에 등록된 BOX만 추출하며, 일반 BOX/논슈링크·팩 단위와 만원 단위 가격을 구분합니다. 기준일은 실제 가격표의 날짜를 지정하세요.</p><div class="actions"><button class="primary" id="extract">AI 가격 자동 추출</button></div></section><section class="panel" id="review" hidden><h2>2. 자동 추출 결과 확인 <span id="count" class="chip"></span></h2><p class="muted">잘못 인식된 제품은 선택 해제하고 가격을 수정하세요. 승인한 항목만 적용됩니다.</p><div class="table-scroll"><table><thead><tr><th>적용</th><th>이미지</th><th>상품명</th><th>추출 가격 (원)</th><th>신뢰도</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="secondary" id="reset">다른 이미지</button><button class="primary" id="apply">확인한 가격 일괄 적용</button></div></section></div></main>
<script>
const SUPA='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
let session='',uploadId='',catalog=new Map(),raw=[],previous={},previewUrls=[],knownSellers=[];
const $=id=>document.getElementById(id);
let toastTimer;
function status(msg,persist=false){const el=$('adminToast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);if(!persist)toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
$('effectiveDate').value=today();
async function call(action,payload={}){const r=await fetch(SUPA+'/functions/v1/box-price-admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'처리 실패');return d}
async function guard(){const token=sessionStorage.getItem('funypin_admin_token');if(!token){$('authNotice').textContent='관리자 로그인 화면으로 이동합니다…';location.replace('/admin.html?returnTo='+encodeURIComponent('/admin-box-prices.html'));return}const r=await fetch(SUPA+'/rest/v1/rpc/is_funypin_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!r.ok){sessionStorage.removeItem('funypin_admin_token');location.replace('/admin.html?returnTo='+encodeURIComponent('/admin-box-prices.html'));return}if((await r.json())!==true){$('authNotice').textContent='접근 권한이 없습니다.';return}session=token;$('authNotice').hidden=true;$('app').hidden=false;await loadSellers()}
async function loadSellers(selected=''){const d=await call('seller_options');knownSellers=d.sellers||[];const sel=$('seller');sel.replaceChildren(new Option('판매처 선택',''));for(const x of knownSellers)sel.add(new Option(x.seller_name,x.seller_name));sel.add(new Option('+ 신규 등록','__new__'));if(selected)sel.value=selected;$('sellerStats').textContent='현재 등록 판매처 '+knownSellers.length+'곳';const shops=$('shopSelect');shops.replaceChildren(new Option('한국 카드샵 선택',''));for(const shop of d.shops||[])shops.add(new Option(shop.name,shop.id));$('newSellerControls').hidden=sel.value!=='__new__'}
$('seller').onchange=()=>{$('newSellerControls').hidden=$('seller').value!=='__new__'};
$('registerSeller').onclick=async()=>{const shopId=$('shopSelect').value;if(!shopId){status('신규 등록할 카드샵을 선택해 주세요.');return}const b=$('registerSeller');b.disabled=true;try{const d=await call('register_seller',{shop_id:shopId});await loadSellers(d.seller);status(d.seller+' 판매처를 등록했습니다.')}catch(e){status('판매처 등록 실패: '+e.message)}finally{b.disabled=false}};
$('file').addEventListener('change',()=>{const files=[...$('file').files];previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];$('imagePreviews').replaceChildren();if(files.length>3){status('이미지는 최대 3장까지 선택할 수 있어요.');$('file').value='';return}for(const f of files){const url=URL.createObjectURL(f);previewUrls.push(url);const img=document.createElement('img');img.src=url;img.alt=f.name;$('imagePreviews').append(img)}});
const base64=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
function renderRows(){const list=$('rows');list.replaceChildren();raw.forEach((x,i)=>{const p=catalog.get(x.product_id)||{},prior=Number(previous[x.product_id]);const delta=Number.isFinite(prior)&&prior>0?(Number(x.price_krw)-prior)/prior:null;const warn=delta!==null&&Math.abs(delta)>=.10;const tr=document.createElement('tr');tr.className='review-row'+(warn?' warning':'');const check=document.createElement('input');check.type='checkbox';check.checked=!warn&&x.confidence>=.75;check.dataset.index=i;const first=document.createElement('td');first.append(check);const second=document.createElement('td');if(p.image_path){const img=document.createElement('img');img.className='product-thumb';img.src=SUPA+'/storage/v1/object/public/box-products/'+encodeURIComponent(p.image_path);img.alt='';img.loading='lazy';second.append(img)}const name=document.createElement('td');name.className='product-title';const title=document.createElement('div');title.textContent=p.product_name_short_ko||p.product_name_ko||x.product_id;name.append(title);if(warn){const w=document.createElement('div');w.className='review-warning';w.textContent='주의: 직전 '+prior.toLocaleString('ko-KR')+'원 대비 '+(delta>0?'+':'')+(delta*100).toFixed(1)+'%';name.append(w)}const price=document.createElement('input');price.type='number';price.min=1000;price.max=5000000;price.step=100;price.className='price-input';price.value=x.price_krw;const priceCell=document.createElement('td');priceCell.append(price);const conf=document.createElement('td');conf.className='confidence';conf.textContent='신뢰도 '+Math.round(x.confidence*100)+'%';tr.append(first,second,name,priceCell,conf);list.append(tr)})}
$('extract').addEventListener('click',async()=>{const files=[...$('file').files],seller=$('seller').value,date=$('effectiveDate').value;if(!files.length||files.length>3||!seller||seller==='__new__'||!date){status('등록된 판매처·기준일·이미지(최대 3장)를 지정해 주세요.');return}if(files.some(f=>f.size>8000000||!['image/jpeg','image/png','image/webp'].includes(f.type))){status('JPG·PNG·WebP 이미지를 장당 8MB 이하로 선택해 주세요.');return}const btn=$('extract');btn.disabled=true;status(files.length+'장 가격표에서 상품을 추출하고 있어요…',true);try{const images=await Promise.all(files.map(async f=>({mime:f.type,base64:await base64(f)})));const d=await call('extract',{seller,effective_date:date,images});uploadId=d.upload_id;catalog=new Map((d.catalog||[]).map(x=>[x.product_id,x]));previous=d.previous_prices||{};raw=d.rows||[];renderRows();$('review').hidden=false;$('count').textContent=raw.length+'개 추출';status(raw.length?'추출이 완료됐어요. 결과를 확인해 주세요.':'일치하는 상품 가격을 찾지 못했습니다.')}catch(e){status('추출 실패: '+e.message)}finally{btn.disabled=false}});
$('apply').addEventListener('click',async()=>{const items=[...$('rows').querySelectorAll('tr')].flatMap((tr,i)=>{if(!tr.querySelector('input[type=checkbox]').checked)return [];const price=Number(tr.querySelector('input[type=number]').value);return [{product_id:raw[i].product_id,raw_name:raw[i].raw_name,price_krw:price}]});if(!items.length){status('적용할 상품을 선택해 주세요.');return}if(!confirm(items.length+'개 가격을 승인하고 저장할까요?'))return;const btn=$('apply');btn.disabled=true;status('가격 정보를 저장하고 있어요…',true);try{const d=await call('apply',{upload_id:uploadId,rows:items});status(d.applied+'개 상품 가격을 저장했습니다.');$('review').hidden=true}catch(e){status('저장 실패: '+e.message)}finally{btn.disabled=false}});
$('reset').addEventListener('click',()=>{$('review').hidden=true;$('file').value='';$('imagePreviews').replaceChildren();previewUrls.forEach(URL.revokeObjectURL);previewUrls=[]});
guard().catch(e=>{$('sellerStats').textContent='판매처 조회 실패 · 새로고침 후 다시 시도해 주세요';$('authNotice').hidden=false;$('authNotice').textContent='관리자 데이터 조회 실패: '+e.message;status('판매처 조회 실패: '+e.message)});
</script><div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div></body></html>
