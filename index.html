filtersEl.onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;let k=b.dataset.f;if(k==='all')state.sel.clear();else state.sel.has(k)?state.sel.delete(k):state.sel.add(k);renderFilters();render()};cards.onclick=e=>{let a=e.target.closest('[data-id]');if(!a)return;e.preventDefault();state.scroll=scrollY;location.hash='#/shop/'+a.dataset.id};
function marker(s,lat,lng){s.pos={lat:+lat,lng:+lng};let m=new naver.maps.Marker({map,position:new naver.maps.LatLng(lat,lng),title:s.name,icon:{content:'<div class="pin"></div>',anchor:new naver.maps.Point(10,20)}});naver.maps.Event.addListener(m,'click',()=>{if(info)info.close();info=new naver.maps.InfoWindow({content:`<div class="pop"><b>${esc(s.name)}</b><small>${esc(s.area)} · ${esc(s.station)} 도보 ${s.walk}분</small></div>`,borderWidth:0});info.open(map,m)});marks.set(s.id,m)}
function syncMarkers(){if(!map)return;let b=new naver.maps.LatLngBounds(),n=0;SHOPS.forEach(s=>{let m=marks.get(s.id);if(!m)return;if(match(s)){m.setMap(map);b.extend(m.getPosition());n++}else m.setMap(null)});if(n>1)map.fitBounds(b,{top:30,right:30,bottom:30,left:30});if(n===1){let s=SHOPS.find(x=>match(x)&&marks.has(x.id));map.setCenter(marks.get(s.id).getPosition());map.setZoom(15)}}
function initMap(){if(!(window.naver&&naver.maps&&naver.maps.Service)){mapStatus.textContent='네이버 지도를 불러오지 못했습니다.';return}map=new naver.maps.Map('map',{center:new naver.maps.LatLng(37.5665,126.978),zoom:11,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.TOP_RIGHT},mapDataControl:false,scaleControl:false});SHOPS.forEach(s=>{if(s.lat&&s.lng){marker(s,s.lat,s.lng);done++;check()}else naver.maps.Service.geocode({query:'서울 '+s.address},(st,res)=>{done++;if(st===naver.maps.Service.Status.OK&&res.v2.addresses.length){let a=res.v2.addresses[0];marker(s,a.y,a.x)}check()})})}
function check(){mapStatus.textContent=`${done}/${SHOPS.length} 매장 위치 확인 중`;if(done===SHOPS.length){mapStatus.hidden=true;syncMarkers()}}
function radar(v){let vals=[(v[0]+v[1]+v[2]+v[3])/4,v[4],v[5],v[6],v[7]],lab=['상품구성','가격','매장규모','매장분위기','접근성'],cx=135,cy=125,R=78;let p=(i,r)=>{let a=-Math.PI/2+i*Math.PI*2/5;return[cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]},g='',ax='',tx='';for(let l=1;l<=5;l++)g+=`<polygon class="grid" points="${[0,1,2,3,4].map(i=>p(i,l/5).join(',')).join(' ')}"/>`;for(let i=0;i<5;i++){let q=p(i,1),t=p(i,1.27);ax+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${q[0]}" y2="${q[1]}"/>`;tx+=`<text class="rlabel" x="${t[0]}" y="${t[1]}" text-anchor="middle">${lab[i]}</text>`}return `<svg viewBox="0 0 270 250">${g}${ax}<polygon class="poly" points="${vals.map((x,i)=>p(i,x/5).join(',')).join(' ')}"/>${tx}</svg>`}
function openDetail(id){let s=SHOPS.find(x=>x.id===id);if(!s)return;homeHeader.hidden=home.hidden=true;detail.hidden=false;let q=[];if(s.naver)q.push(['네이버지도',s.naver]);if(s.google)q.push(['Google Maps',s.google]);if(s.ig)q.push(['Instagram',s.ig]);if(s.phone)q.push(['전화','tel:'+s.phone]);let i=[['주소',s.address],['영업시간',s.hours],['주차',s.parking]].filter(x=>x[1]),v=SCORES[id],tcg=Object.entries(s.tcg).filter(x=>x[1]).map(([k])=>k==='pokemon'?'포켓몬':k==='onepiece'?'원피스':'드래곤볼'),rv=CONTENT[id]||[];detailBody.innerHTML=`<h1 class="dname">${s.name}</h1><div class="den">${s.en}</div><div class="dmeta">${s.area} · ${s.station} 도보 ${s.walk}분</div><div class="dtags">${tags(s).map(x=>`<span class="dtag">${x}</span>`).join('')}</div>${q.length?`<div class="quick">${q.map(([l,u])=>`<a class="q" href="${u}" ${u.startsWith('http')?'target="_blank" rel="noopener"':''}>${l}</a>`).join('')}</div>`:''}<section class="section"><h2>기본 정보</h2><dl class="info">${i.map(([l,x])=>`<div class="row"><dt>${l}</dt><dd>${x}</dd></div>`).join('')}</dl></section>${v?`<section class="section"><h2>한눈에 보는 매장 분석</h2><p class="note">※ 깽퐌커플 방문 평점으로 단순 참고용으로 활용해주세요.</p><div class="panel radar">${radar(v)}</div></section><section class="section"><h2>상품 구성 상세</h2><div class="panel"><div class="tcgs">${tcg.map(x=>`<span class="tcg">${x}</span>`).join('')}</div>${[['싱글카드',v[0]],['등급카드',v[1]],['박스제품',v[2]],['오리파',v[3]]].map(([l,x])=>`<div class="bar"><label>${l}</label><div class="track"><div class="fill" style="width:${x*20}%"></div></div></div>`).join('')}</div></section>`:''}${rv.length?`<section class="section"><h2>깽퐌커플 리뷰</h2><div class="reviews">${rv.map(([p,t,u])=>`<a class="review" href="${u}" target="_blank" rel="noopener"><div class="platform">${p}</div><div class="rtitle">${t}</div></a>`).join('')}</div></section>`:''}`;scrollTo(0,0)}
function route(){let m=location.hash.match(/^#\/shop\/(\d{3})$/);if(m)openDetail(m[1]);else{detail.hidden=true;home.hidden=homeHeader.hidden=false;requestAnimationFrame(()=>scrollTo(0,state.scroll))}}
back.onclick=()=>history.back();share.onclick=async()=>{try{navigator.share?await navigator.share({title:'TCG MAP',url:location.href}):await navigator.clipboard.writeText(location.href)}catch(e){}};addEventListener('hashchange',route);renderFilters();render();initMap();route();
</script></body></html>
