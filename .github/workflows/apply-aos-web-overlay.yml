name: Apply local AOS web QA overlay

on:
  push:
    branches:
      - aos-web-qa-20261019
    paths:
      - .github/workflows/apply-aos-web-overlay.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify web patch
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/web-patch.gz.b64.* | tr -d '\n' | base64 -d | gzip -d > /tmp/web.patch
          git apply --check /tmp/web.patch
      - name: Apply patch and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/web.patch
          rm -rf .qa .github/workflows/apply-aos-web-overlay.yml
          git add -A
          git config user.name 'FUNY PIN QA'
          git config user.email 'ffunnyggang@gmail.com'
          git commit -m 'feat(web): add AOS bridges and event URL QA support'
          git push origin HEAD:aos-web-qa-20261019
