name: Update Instagram Feed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-instagram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Cardgarden Instagram profile via Bright Data
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          INSTAGRAM_SHOP_ID: KR-SEO-005
        run: node scripts/update-instagram-feed.mjs
      - name: Commit feed when changed
        run: |
          if git diff --quiet -- data/instagram-feed.json; then
            echo "No Instagram feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-feed.json
          git commit -m "Update Instagram feed from Bright Data"
          git push
