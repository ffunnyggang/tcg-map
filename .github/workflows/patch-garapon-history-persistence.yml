name: Patch garapon history persistence

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-history-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve all drawn balls until reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('garapon-three-v2.js')
          s=p.read_text(encoding='utf-8')
          old="const history=Array.isArray(raw.history)?raw.history.slice(0,50):[];"
          new="const history=Array.isArray(raw.history)?raw.history.slice(0,Math.max(50,total)):[];"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('history persistence anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
          node --check garapon-three-v2.js

      - name: Commit persistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon-three-v2.js
          git commit -m "fix: preserve all drawn garapon balls until reset"
          git push
