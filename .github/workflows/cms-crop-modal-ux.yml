name: Apply CMS crop modal UX
on:
  push:
    paths:
      - '.github/workflows/cms-crop-modal-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CMS link image UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cms-link-enhancements.js')
          s=p.read_text(encoding='utf-8')
          old=".cms-image-editor{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start}.cms-crop-stage{width:160px;aspect-ratio:1;border:1px solid #e5e0e8;border-radius:13px;overflow:hidden;background:#f4f2f5;position:relative}.cms-crop-stage img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}.cms-crop-empty{height:100%;display:grid;place-items:center;color:#99919e;font-size:10px;text-align:center;padding:10px}.cms-range{display:grid;grid-template-columns:42px 1fr 38px;gap:7px;align-items:center;margin-bottom:7px;font-size:9px;color:#807783}.cms-range input{width:100%}.cms-img-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.cms-img-actions button{height:34px;padding:0 10px;border:1px solid #ded8e2;border-radius:9px;background:#fff;font-size:10px;font-weight:750;cursor:pointer}.cms-img-actions .danger{border-color:#efc7cc;color:#b42318;background:#fff7f8}.cms-thumb-note{margin-top:7px;color:#918996;font-size:9px;line-height:1.45}@media(max-width:640px){.cms-image-editor{grid-template-columns:1fr}.cms-crop-stage{width:100%;max-width:220px}}"
          new=".cms-image-editor{display:flex;gap:12px;align-items:flex-start}.cms-crop-stage{width:160px;aspect-ratio:1;border:1px solid #e5e0e8;border-radius:13px;overflow:hidden;background:#f4f2f5;position:relative;cursor:pointer}.cms-crop-stage img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}.cms-crop-empty{height:100%;display:grid;place-items:center;color:#99919e;font-size:10px;text-align:center;padding:10px}.cms-image-remove{position:absolute;right:7px;top:7px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(30,27,32,.72);color:#fff;font-size:18px;line-height:1;cursor:pointer;z-index:3;box-shadow:0 2px 7px #0003}.cms-img-actions{display:flex;gap:7px;flex-wrap:wrap}.cms-img-actions button{height:34px;padding:0 10px;border:1px solid #ded8e2;border-radius:9px;background:#fff;font-size:10px;font-weight:750;cursor:pointer}.cms-thumb-note{margin-top:7px;color:#918996;font-size:9px;line-height:1.45}.cms-crop-modal{position:fixed;inset:0;z-index:220;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.cms-crop-close{position:absolute;left:22px;top:18px;border:0;background:transparent;color:#fff;font-size:36px;font-weight:200;cursor:pointer}.cms-crop-work{width:min(690px,82vw);height:min(72vh,760px);position:relative;overflow:hidden;touch-action:none;cursor:grab}.cms-crop-work:active{cursor:grabbing}.cms-crop-work img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center;user-select:none;pointer-events:none}.cms-crop-frame{position:absolute;inset:15% 0;border:2px solid #ff5a1f;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none}.cms-crop-frame:before,.cms-crop-frame:after{content:'';position:absolute;left:-7px;width:14px;height:14px;background:#ff5a1f;top:50%;transform:translateY(-50%)}.cms-crop-frame:after{left:auto;right:-7px}.cms-crop-help{margin:18px 0 14px;color:#fff;text-align:center;font-size:13px;line-height:1.55}.cms-crop-controls{width:min(690px,82vw);display:flex;align-items:center;gap:12px}.cms-crop-controls input{flex:1}.cms-crop-actions{width:min(690px,82vw);display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.cms-crop-actions button{height:58px;border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}.cms-crop-cancel{background:#666;color:#fff}.cms-crop-apply{background:#ff5a1f;color:#fff}@media(max-width:640px){.cms-crop-stage{width:130px}.cms-crop-work,.cms-crop-controls,.cms-crop-actions{width:92vw}}"
          if old not in s: raise SystemExit('CSS target not found')
          s=s.replace(old,new,1)
          old_markup='<div class="field wide"><label>이미지 · 크롭/위치</label><div class="cms-image-editor"><div id="cmsCropStage" class="cms-crop-stage"></div><div><div class="cms-range"><span>가로</span><input id="cmsPosX" type="range" min="0" max="100" value="${px}"><b id="cmsPosXVal">${px}%</b></div><div class="cms-range"><span>세로</span><input id="cmsPosY" type="range" min="0" max="100" value="${py}"><b id="cmsPosYVal">${py}%</b></div><div class="cms-range"><span>확대</span><input id="cmsZoom" type="range" min="1" max="2.5" step="0.05" value="${zoom}"><b id="cmsZoomVal">${zoom.toFixed(2)}x</b></div><div class="cms-img-actions"><input id="cmsImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button id="cmsImagePick" type="button">+ 이미지 선택</button><button id="cmsImageRemove" class="danger" type="button">이미지 제거</button></div><div id="cmsImageSource" class="cms-thumb-note"></div></div></div></div>'
          new_markup='<div class="field wide"><label>이미지</label><div class="cms-image-editor"><div id="cmsCropStage" class="cms-crop-stage" title="클릭하여 크롭/위치 조정"></div><div><div class="cms-img-actions"><input id="cmsImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button id="cmsImagePick" type="button">+ 이미지 선택</button><button id="cmsCropOpen" type="button">크롭/위치 조정</button></div><div id="cmsImageSource" class="cms-thumb-note"></div></div></div></div>'
          if old_markup not in s: raise SystemExit('markup target not found')
          s=s.replace(old_markup,new_markup,1)
          old_render="const stage=$e('cmsCropStage');stage.innerHTML=im?`<img src=\"${esc(im)}\" style=\"object-position:${px}% ${py}%;transform:scale(${zoom})\">`:'<div class=\"cms-crop-empty\">이미지를 첨부하거나<br>URL 썸네일을 불러오세요.</div>';$e('cmsImageSource').textContent=imageUrl?'직접 첨부 이미지 사용 중':autoImageUrl?'URL 대표 썸네일 사용 중':'이미지 없음';"
          new_render="const stage=$e('cmsCropStage');stage.innerHTML=im?`<img src=\"${esc(im)}\" style=\"object-position:${px}% ${py}%;transform:scale(${zoom})\"><button id=\"cmsImageRemove\" class=\"cms-image-remove\" type=\"button\" aria-label=\"이미지 제거\">×</button>`:'<div class=\"cms-crop-empty\">이미지를 첨부하거나<br>URL 썸네일을 불러오세요.</div>';$e('cmsImageSource').textContent=imageUrl?'직접 첨부 이미지 사용 중 · 이미지를 눌러 위치를 조정할 수 있습니다.':autoImageUrl?'URL 대표 썸네일 사용 중 · 이미지를 눌러 위치를 조정할 수 있습니다.':'이미지 없음';const rm=$e('cmsImageRemove');if(rm)rm.onclick=e=>{e.stopPropagation();imageUrl='';autoImageUrl='';$e('cmsImageFile').value='';px=50;py=50;zoom=1;render()};"
          if old_render not in s: raise SystemExit('render target not found')
          s=s.replace(old_render,new_render,1)
          old_handlers="[['cmsPosX','cmsPosXVal','x'],['cmsPosY','cmsPosYVal','y'],['cmsZoom','cmsZoomVal','z']].forEach(([id,val,k])=>$e(id).oninput=()=>{const n=Number($e(id).value);if(k==='x'){px=n;$e(val).textContent=n+'%'}else if(k==='y'){py=n;$e(val).textContent=n+'%'}else{zoom=n;$e(val).textContent=n.toFixed(2)+'x'}render()});\n $e('cmsImagePick').onclick=()=>$e('cmsImageFile').click();$e('cmsImageFile').onchange=()=>{const f=$e('cmsImageFile').files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);imageUrl=objectUrl;autoImageUrl='';px=50;py=50;zoom=1;$e('cmsPosX').value=50;$e('cmsPosY').value=50;$e('cmsZoom').value=1;render()};$e('cmsImageRemove').onclick=()=>{imageUrl='';autoImageUrl='';$e('cmsImageFile').value='';render()};"
          new_handlers="function openCropModal(){const im=currentImage();if(!im)return;let tx=px,ty=py,tz=zoom,drag=false,sx=0,sy=0,bx=tx,by=ty;const m=document.createElement('div');m.className='cms-crop-modal';m.innerHTML=`<button class=\"cms-crop-close\" type=\"button\" aria-label=\"닫기\">×</button><div class=\"cms-crop-work\"><img src=\"${esc(im)}\" style=\"object-position:${tx}% ${ty}%;transform:scale(${tz})\"><div class=\"cms-crop-frame\"></div></div><div class=\"cms-crop-help\">이미지를 드래그해 표시 위치를 조정하고<br>슬라이더로 크기를 변경할 수 있습니다.</div><div class=\"cms-crop-controls\"><span style=\"color:#fff\">−</span><input type=\"range\" min=\"1\" max=\"2.5\" step=\"0.05\" value=\"${tz}\"><span style=\"color:#fff\">＋</span></div><div class=\"cms-crop-actions\"><button class=\"cms-crop-cancel\" type=\"button\">취소</button><button class=\"cms-crop-apply\" type=\"button\">선택</button></div>`;document.body.appendChild(m);const work=m.querySelector('.cms-crop-work'),img=m.querySelector('img'),range=m.querySelector('input');const paint=()=>{img.style.objectPosition=tx+'% '+ty+'%';img.style.transform='scale('+tz+')'};const start=(x,y)=>{drag=true;sx=x;sy=y;bx=tx;by=ty};const move=(x,y)=>{if(!drag)return;const r=work.getBoundingClientRect();tx=Math.max(0,Math.min(100,bx-(x-sx)/r.width*100/tz));ty=Math.max(0,Math.min(100,by-(y-sy)/r.height*100/tz));paint()};work.onpointerdown=e=>{work.setPointerCapture?.(e.pointerId);start(e.clientX,e.clientY)};work.onpointermove=e=>move(e.clientX,e.clientY);work.onpointerup=work.onpointercancel=()=>drag=false;range.oninput=()=>{tz=Number(range.value);paint()};const shut=()=>m.remove();m.querySelector('.cms-crop-close').onclick=shut;m.querySelector('.cms-crop-cancel').onclick=shut;m.querySelector('.cms-crop-apply').onclick=()=>{px=Math.round(tx*10)/10;py=Math.round(ty*10)/10;zoom=tz;shut();render()}}\n $e('cmsImagePick').onclick=()=>$e('cmsImageFile').click();$e('cmsImageFile').onchange=()=>{const f=$e('cmsImageFile').files[0];if(!f)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);imageUrl=objectUrl;autoImageUrl='';px=50;py=50;zoom=1;render();setTimeout(openCropModal,0)};$e('cmsCropOpen').onclick=openCropModal;$e('cmsCropStage').onclick=()=>{if(currentImage())openCropModal()};"
          if old_handlers not in s: raise SystemExit('handler target not found')
          s=s.replace(old_handlers,new_handlers,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "FUNY PIN"
          git config user.email "ffunnyggang@gmail.com"
          git add cms-link-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m "improve CMS image crop modal UX"
          git push
