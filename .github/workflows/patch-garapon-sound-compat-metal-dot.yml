name: Patch garapon sound compatibility and metallic dot

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-sound-compat-metal-dot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply follow-up
        run: python .github/scripts/patch_garapon_sound_compat_metal_dot.py

      - name: Validate
        run: |
          node --check garapon-three-v2.js
          grep -q "new AC()" garapon-three-v2.js
          grep -q "color-dot'+(p.metallic" garapon-three-v2.js
          grep -q "20261016-sound-silver-size2" garapon.html

      - name: Commit and clean temporary files
        run: |
          rm -f .github/scripts/patch_garapon_sound_compat_metal_dot.py
          rm -f .github/workflows/patch-garapon-sound-compat-metal-dot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon-three-v2.js garapon.html tcg-tools.html .github/scripts/patch_garapon_sound_compat_metal_dot.py .github/workflows/patch-garapon-sound-compat-metal-dot.yml
          git commit -m "fix: strengthen garapon audio unlock compatibility"
          git push
