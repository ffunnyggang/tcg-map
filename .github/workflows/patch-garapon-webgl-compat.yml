# one-time compatibility patch trigger v2
name: Patch garapon WebGL compatibility

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-webgl-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Three.js compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          machine_path = Path('garapon-three-machine-v2.js')
          machine = machine_path.read_text(encoding='utf-8')

          old_imports = """import * as THREE from 'three';
          import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
          import WebGL from 'three/addons/capabilities/WebGL.js';"""
          new_imports = """import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.162.0/+esm';
          import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm';"""
          if old_imports not in machine:
              raise SystemExit('garapon machine imports anchor not found')
          machine = machine.replace(old_imports, new_imports, 1)

          old_init = "init(){if(!WebGL.isWebGL2Available())throw new Error('WEBGL2_UNAVAILABLE');this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:true,alpha:true,powerPreference:'high-performance'});this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));"
          new_init = "init(){try{this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:true,alpha:true,powerPreference:'high-performance'})}catch(primaryError){console.warn('[GARAPON 3D] high-performance context failed; retrying compatibility mode',primaryError);this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:false,alpha:true,powerPreference:'default'})}this.rendererMode=this.renderer.capabilities.isWebGL2?'webgl2':'webgl1';this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,this.renderer.capabilities.isWebGL2?1.75:1.2));"
          if old_init not in machine:
              raise SystemExit('garapon machine init anchor not found')
          machine = machine.replace(old_init, new_init, 1)
          machine_path.write_text(machine, encoding='utf-8')

          html_path = Path('garapon.html')
          html = html_path.read_text(encoding='utf-8')
          import_map = """<script type=\"importmap\">
          {
            \"imports\": {
              \"three\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js\",
              \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/\"
            }
          }
          </script>
          """
          if import_map not in html:
              raise SystemExit('garapon import map anchor not found')
          html = html.replace(import_map, '', 1)
          html = html.replace('garapon-three-v2.js?v=20261015-three1', 'garapon-three-v2.js?v=20261015-webgl1compat1')
          html = html.replace('garapon-three-v2.css?v=20261015-three1', 'garapon-three-v2.css?v=20261015-webgl1compat1')
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon.html garapon-three-machine-v2.js
          git commit -m "fix: support WebGL1 and legacy app WebViews in garapon"
          git push
