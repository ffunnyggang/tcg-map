async function refreshSession(){
 if(!refreshToken)throw new Error('관리자 세션이 만료되었습니다. 다시 로그인해주세요.');
 const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});

}
async function api(path,opt={},retried=false){
 const h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})};
 let r=await fetch(BASE+path,{...opt,headers:h});

async function setStatus(id,status){try{const rows=await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(id)+'&select=report_id&limit=1');if(!rows.length)throw new Error('신고 정보를 찾지 못했습니다.');await api('/rest/v1/live_report_flags?report_id=eq.'+encodeURIComponent(rows[0].report_id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:status,reviewed_at:new Date().toISOString()})});await load()}catch(e){alert('처리 실패: '+e.message)}}
document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;document.querySelectorAll('[data-admin-tab]').forEach(x=>x.classList.toggle('on',x.dataset.adminTab===adminTab));const meta={stores:['카드샵 관리','FUNY PIN 카드샵 마스터 DB'],shop:['매장 등록·수정 요청','사용자 접수 요청 검토'],live:['LIVE PIN 신고 관리','신고 및 게시물 조치'],event:['카드볼트 이벤트 응모','이벤트 응모 내역 관리']}[adminTab]||['관리자',''];$('toolbarTitle').textContent=meta[0];$('toolbarSub').textContent=meta[1];load()});
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{token='';refreshToken='';sessionStorage.removeItem('funypin_admin_token');sessionStorage.removeItem('funypin_admin_refresh');location.reload()};token=sessionStorage.getItem('funypin_admin_token')||'';refreshToken=sessionStorage.getItem('funypin_admin_refresh')||'';if(token)verify();
</script></body></html>
