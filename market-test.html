<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MARKET TEST | FUNY PIN</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1">
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=zi1ymjvxt9"></script>
<script src="/web-auth.js?v=20261014-web-auth6"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2f6;color:#211e25;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:0 auto;background:#fff;position:relative;padding-bottom:92px}.head{height:54px;padding:0 14px;display:flex;align-items:center;background:#fff}.head img{width:30px;height:34px;margin-right:8px}.head strong{font-size:19px;font-weight:850}.badge{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f0ebfb;color:#6749bd;font-size:9px;font-weight:900}.map-wrap{height:430px;position:relative;background:#eeeaf2}.map{position:absolute;inset:0}.map-note{position:absolute;left:12px;top:12px;z-index:5;padding:8px 10px;border:1px solid rgba(255,255,255,.92);border-radius:12px;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(36,29,46,.10);font-size:10px;font-weight:800}.list-wrap{position:relative;z-index:6;margin-top:-18px;padding:22px 14px 30px;border-radius:22px 22px 0 0;background:#fff}.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.list-head strong{font-size:14px}.count{font-size:10px;color:#958e9a}.list{display:flex;flex-direction:column}.card{display:grid;grid-template-columns:88px minmax(0,1fr) 14px;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #eeeaf2;text-decoration:none;color:inherit}.thumb{width:88px;height:88px;border-radius:13px;object-fit:cover;background:#f1eef4}.ph{width:88px;height:88px;border-radius:13px;background:#f1eef4;display:grid;place-items:center;color:#978d9d;font-size:10px;font-weight:800}.title{font-size:14px;font-weight:850;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{margin-top:4px;font-size:15px;font-weight:900}.meta{margin-top:6px;color:#928b96;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:21px;color:#9a8dab}.empty{padding:55px 12px;text-align:center;color:#9b94a0;font-size:12px;line-height:1.65}.fab{position:fixed;right:max(16px,calc((100vw - 420px)/2 + 16px));bottom:22px;z-index:50;width:132px;height:46px;border:0;border-radius:23px;background:#17151b;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;box-shadow:0 8px 24px rgba(17,16,21,.24)}.market-pin{width:38px;height:38px;border:3px solid #fff;border-radius:50% 50% 50% 6px;background:#17151b;transform:rotate(-45deg);box-shadow:0 5px 14px rgba(20,18,25,.22);display:grid;place-items:center}.market-pin span{transform:rotate(45deg);color:#fff;font-size:15px;font-weight:900}.bubble{width:268px;padding:10px;border:1px solid #e7e1ea;border-radius:17px;background:#fff;box-shadow:0 14px 34px rgba(34,28,43,.18);display:grid;grid-template-columns:66px minmax(0,1fr) 12px;gap:10px;align-items:center;font-family:'Pretendard Variable',Pretendard,sans-serif}.bubble img,.bubble .bph{width:66px;height:66px;border-radius:12px;object-fit:cover;background:#f1eef4}.bubble .bph{display:grid;place-items:center;font-size:9px;color:#91899a}.bubble-title{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bubble-price{margin-top:4px;font-size:13px;font-weight:900}.bubble-meta{margin-top:5px;color:#958e99;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bubble-chev{font-size:20px;color:#9a8dab}
</style>
</head>
<body><div class="shell">
<header class="head"><img src="/favicon.svg" alt=""><strong>TCG MAP</strong><span class="badge">MARKET TEST</span></header>
<section class="map-wrap"><div id="map" class="map"></div><div class="map-note">등록된 TCG 매물</div></section>
<section class="list-wrap"><div class="list-head"><strong>매물 리스트</strong><span class="count" id="count">0개</span></div><div id="list" class="list"><div class="empty">매물을 불러오는 중...</div></div></section>
<a class="fab" href="/market-register-test.html">+ 매물 등록</a>
</div>
<script>
(async()=>{const A=window.FUNY_WEB_AUTH;const session=await A.init();if(!session){alert('MARKET 테스트는 로그인 후 이용할 수 있어요.');A.goLogin(location.pathname+location.search);return}const map=new naver.maps.Map('map',{center:new naver.maps.LatLng(37.5665,126.9780),zoom:12,zoomControl:false,mapDataControl:false,scaleControl:false,logoControl:true});let markers=[],info=null;const list=document.getElementById('list'),count=document.getElementById('count');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원';const age=v=>{const m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));if(m<60)return m+'분 전';if(m<1440)return Math.floor(m/60)+'시간 전';return Math.floor(m/1440)+'일 전'};function detailUrl(x){return '/market-detail-test.html?id='+encodeURIComponent(x.id)}function markerHtml(){return '<div class="market-pin"><span>₩</span></div>'}function bubbleHtml(x){return '<div class="bubble" data-id="'+esc(x.id)+'">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" alt="" referrerpolicy="no-referrer">':'<div class="bph">NO IMAGE</div>')+'<div><div class="bubble-title">'+esc(x.title)+'</div><div class="bubble-price">'+money(x.price)+'</div><div class="bubble-meta">'+esc(x.location_name||'거래 희망 위치')+'</div></div><div class="bubble-chev">›</div></div>'}function render(rows){markers.forEach(m=>m.setMap(null));markers=[];if(info){info.close();info=null}count.textContent=rows.length+'개';list.innerHTML=rows.length?rows.map(x=>'<a class="card" href="'+detailUrl(x)+'">'+(x.thumbnail_url?'<img class="thumb" src="'+esc(x.thumbnail_url)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div class="ph">NO IMAGE</div>')+'<div><div class="title">'+esc(x.title)+'</div><div class="price">'+money(x.price)+'</div><div class="meta">'+esc(x.location_name||'거래 희망 위치')+' · '+age(x.created_at)+'</div></div><span class="chev">›</span></a>').join(''):'<div class="empty">등록된 매물이 없습니다.<br>매물 등록 버튼으로 첫 매물을 등록해보세요.</div>';const bounds=new naver.maps.LatLngBounds();rows.forEach(x=>{if(!Number.isFinite(Number(x.latitude))||!Number.isFinite(Number(x.longitude)))return;const pos=new naver.maps.LatLng(Number(x.latitude),Number(x.longitude));bounds.extend(pos);const marker=new naver.maps.Marker({position:pos,map,icon:{content:markerHtml(),anchor:new naver.maps.Point(19,34)}});markers.push(marker);naver.maps.Event.addListener(marker,'click',()=>{if(info)info.close();info=new naver.maps.InfoWindow({content:bubbleHtml(x),borderWidth:0,backgroundColor:'transparent',disableAnchor:true,pixelOffset:new naver.maps.Point(0,-8)});info.open(map,marker);setTimeout(()=>document.querySelector('.bubble[data-id="'+CSS.escape(x.id)+'"]')?.addEventListener('click',()=>location.href=detailUrl(x)),0)});});if(rows.length===1)map.setCenter(new naver.maps.LatLng(Number(rows[0].latitude),Number(rows[0].longitude))),map.setZoom(15);else if(rows.length>1)map.fitBounds(bounds,{top:40,right:30,bottom:50,left:30})}async function load(){try{const {data,error}=await A.client.from('market_listings').select('id,title,price,thumbnail_url,latitude,longitude,location_name,listing_status,created_at').in('listing_status',['active','reserved']).order('created_at',{ascending:false});if(error)throw error;render(data||[])}catch(e){list.innerHTML='<div class="empty">매물 정보를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>'}}load()})();
</script>
</body></html>
