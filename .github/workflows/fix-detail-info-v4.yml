name: Fix detail info fields v4
on:
  push:
    paths:
      - '.github/workflows/fix-detail-info-v4.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update detail basic info
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r"\['주소',.*?\],\['영업시간'","['주소',s.address],['영업시간'",s,count=1)
          s,n2=re.subn(r",\['SNS',[^\]]+\]","",s,count=1)
          print('address replacements:',n1,'sns replacements:',n2)
          if n1!=1 or n2!=1:
              raise SystemExit('Detail info target not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix detail address and remove SNS basic info row'
          git push
