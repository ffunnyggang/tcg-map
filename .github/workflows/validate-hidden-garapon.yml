name: Validate hidden garapon event

on:
  push:
    paths:
      - 'garapon-event-test.html'
      - 'garapon-event-test.js'
      - 'garapon-event-test.css'
      - 'admin-garapon-event-test.html'
      - 'admin-garapon-event-test.js'
      - 'admin-garapon-event-test.css'
      - 'admin-garapon-ops-test.html'
      - 'admin-garapon-ops-test.js'
      - 'admin-garapon-ops-test.css'
      - 'admin-garapon-auth.js'
      - 'admin-garapon-login.html'
      - 'my-funy-coin-test.html'
      - 'my-entries.html'
      - 'web-auth.js'
      - 'supabase/migrations/20261016025000_add_garapon_internal_ops_dashboard.sql'
      - 'docs/GARAPON_EVENT_INTERNAL_OPS.md'
      - 'tests/garapon-event-hidden.test.cjs'
      - '.github/workflows/validate-hidden-garapon.yml'
  pull_request:
    paths:
      - 'garapon-event-test.html'
      - 'garapon-event-test.js'
      - 'garapon-event-test.css'
      - 'admin-garapon-event-test.html'
      - 'admin-garapon-event-test.js'
      - 'admin-garapon-event-test.css'
      - 'admin-garapon-ops-test.html'
      - 'admin-garapon-ops-test.js'
      - 'admin-garapon-ops-test.css'
      - 'admin-garapon-auth.js'
      - 'admin-garapon-login.html'
      - 'my-funy-coin-test.html'
      - 'my-entries.html'
      - 'web-auth.js'
      - 'supabase/migrations/20261016025000_add_garapon_internal_ops_dashboard.sql'
      - 'docs/GARAPON_EVENT_INTERNAL_OPS.md'
      - 'tests/garapon-event-hidden.test.cjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          cp garapon-event-test.js /tmp/garapon-event-test.mjs
          cp admin-garapon-event-test.js /tmp/admin-garapon-event-test.mjs
          cp admin-garapon-ops-test.js /tmp/admin-garapon-ops-test.mjs
          node --check /tmp/garapon-event-test.mjs
          node --check /tmp/admin-garapon-event-test.mjs
          node --check /tmp/admin-garapon-ops-test.mjs
          node --check admin-garapon-auth.js
          node --check web-auth.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('admin-garapon-login.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(x=>x.trim());
          if(!scripts.length)throw new Error('admin garapon login inline script missing');
          scripts.forEach(source=>new Function(source));
          NODE
      - name: Validate hidden exposure rules
        run: node --test tests/garapon-event-hidden.test.cjs
