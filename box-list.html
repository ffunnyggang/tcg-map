<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f5f8;color:#222;font-family:system-ui,-apple-system,'Pretendard',sans-serif}main{max-width:460px;margin:auto;min-height:100dvh;background:#fff;padding:0 16px 40px}header{height:58px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #f0eef4;margin:0 -16px 18px;padding:0 16px}header a{color:#333;text-decoration:none;font-size:25px}header h1{font-size:17px;margin:0;font-weight:750}h2{font-size:17px;margin:23px 0 12px}h3{font-size:14px;margin:0 0 8px}.muted{color:#888;font-size:12px}.placeholder{display:grid;place-items:center;background:#f2f1f4;color:#aaa;border:1px dashed #d6d3db;border-radius:12px;aspect-ratio:1 / 1;font-size:12px;text-align:center;padding:12px}.divider{height:10px;background:#f6f5f8;margin:24px -16px}.card{border:1px solid #efedf2;border-radius:12px;padding:13px;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.price{font-size:18px;font-weight:800}.empty{border:1px dashed #d8d4df;border-radius:12px;padding:22px 14px;text-align:center;color:#777;background:#fbfaff;font-size:13px;line-height:1.6}button,select,input{font:inherit}button{cursor:pointer}a{color:inherit} .pill{border:1px solid #e6e1ee;border-radius:20px;padding:7px 12px;font-size:12px;background:white}.note{font-size:12px;color:#777;line-height:1.6} .action{background:#7555c6;border:0;color:#fff;padding:12px 15px;border-radius:10px;font-weight:700}.action:disabled{background:#cbc5d7;cursor:not-allowed}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><title>BOX 시세 목록 | FUNY PIN</title><style>.tools{display:flex;align-items:center;gap:8px;margin:14px 0}.tools input{flex:1;min-width:0;border:1px solid #e4e1e9;border-radius:9px;padding:12px}.tools select{border:1px solid #e4e1e9;border-radius:9px;padding:12px;background:#fff;max-width:125px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}.box-item{text-decoration:none;min-width:0}.box-item .placeholder{margin-bottom:9px}.box-item strong{display:block;font-size:13px;line-height:1.45;min-height:39px}.box-item small{display:block;color:#888;font-size:11px;margin-top:6px}.section-lead{font-size:13px;color:#666;line-height:1.6;margin:0 0 8px}</style></head><body><main><header><a href="/" aria-label="홈으로">‹</a><h1>포켓몬 BOX 시세</h1></header><p class="section-lead">일본판 포켓몬 BOX를 찾아보세요. 검수된 매장 판매가가 등록되면 최저가와 변동률이 표시됩니다.</p><div class="tools"><input id="search" type="search" placeholder="BOX 상품 검색" aria-label="BOX 상품 검색"><select id="sort" aria-label="정렬 방식"><option value="name">이름순</option><option value="recent">최근 등록순</option></select></div><div class="row" style="margin-bottom:15px"><strong id="count" style="font-size:13px">상품 목록</strong><span class="muted">일본판 포켓몬 BOX · 1차</span></div><div id="grid" class="grid"></div><p id="noResult" class="empty" hidden>검색 결과가 없습니다.</p><div class="divider"></div><p class="note">상품 이미지는 최종 수급 후 등록됩니다. 판매가 데이터는 관리자 검수 후 노출되며, 정보가 없는 상품에는 시세가 표시되지 않습니다.</p></main><script>
const products=[{"id":"jp-30th","name":"포켓몬카드 30주년 일본판 BOX"},{"id":"jp-storm-emerald","name":"스톰에메랄다 일본판 BOX"},{"id":"jp-inferno-x","name":"인페르노X 일본판 BOX"},{"id":"jp-mega-dream-ex","name":"메가드림 ex 일본판 BOX"},{"id":"jp-black-bolt","name":"블랙볼트 일본판 BOX"},{"id":"jp-white-flare","name":"화이트플레어 일본판 BOX"},{"id":"jp-151","name":"포켓몬카드 151 일본판 BOX"},{"id":"jp-shiny-treasure","name":"샤이니 트레저 ex 일본판 BOX"}],grid=document.querySelector('#grid'),search=document.querySelector('#search'),sort=document.querySelector('#sort');
function render(){let q=search.value.trim().toLowerCase(),a=products.filter(p=>p.name.toLowerCase().includes(q));if(sort.value==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'ko'));grid.replaceChildren();document.querySelector('#count').textContent='BOX '+a.length+'개';document.querySelector('#noResult').hidden=a.length!==0;a.forEach(p=>{const el=document.createElement('a');el.className='box-item';el.href='box-detail.html?id='+encodeURIComponent(p.id);const ph=document.createElement('div');ph.className='placeholder';ph.textContent='상품 이미지 준비 중';const title=document.createElement('strong');title.textContent=p.name;const price=document.createElement('small');price.textContent='최저가 정보 준비 중 · 전일 대비 -';el.append(ph,title,price);grid.append(el)})}search.addEventListener('input',render);sort.addEventListener('change',render);render();
</script></body></html>
