name: Update OG image cache URL

on:
  push:
    paths:
      - '.github/workflows/update-og-cache-url.yml'

permissions:
  contents: write

jobs:
  update-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update OG image URL only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.funypin.kr/assets/og/funy-pin-og.png'
          new = 'https://www.funypin.kr/assets/og/funy-pin-og.png?v=20260917'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 OG image URL occurrences, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh OG image URL for social preview'
          git push
