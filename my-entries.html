<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>응모 내역 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my2"><style>.entry-card{padding:17px}.entry-title{margin-top:10px;font-size:15px;font-weight:900}.entry-desc{margin-top:6px;color:#7e7684;font-size:11px;line-height:1.55}.entry-row{margin-top:12px;display:flex;justify-content:space-between;gap:10px}.entry-status{color:#6749bd;font-size:10px;font-weight:850}.entry-code{margin-top:12px;padding:11px;border-radius:11px;background:#f7f4fc}.entry-code small{display:block;color:#938b98;font-size:9px}.entry-code b{display:block;margin-top:4px;font-size:13px;letter-spacing:1px}</style><script src="/web-auth.js?v=20261014-web-auth4"></script><script src="/my-web-common.js?v=20261014-my2"></script><link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui1"></head><body><div class="my-page"><header class="my-head"><button class="my-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title">응모 내역</div></header><main id="root" class="my-content"><div class="my-loading">응모 내역을 불러오는 중...</div></main></div><script>(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-entries.html');if(!A)return;const root=document.getElementById('root');try{const {data,error}=await A.client.from('user_entries').select('id,title,description,code,status,created_at,source_type').order('created_at',{ascending:false});if(error)throw error;if(!data?.length){root.innerHTML='<div class="my-empty"><strong>응모 내역이 없어요</strong>퍼니몬 이벤트 등에 응모하면 이곳에서 확인할 수 있어요.</div>';return}root.innerHTML='<div class="my-list">'+data.map(x=>'<article class="my-card entry-card"><span class="my-badge">응모</span><div class="entry-title">'+H.esc(x.title)+'</div>'+(x.description?'<div class="entry-desc">'+H.esc(x.description)+'</div>':'')+'<div class="entry-row"><span class="my-meta">'+H.date(x.created_at)+'</span><span class="entry-status">'+H.esc(x.status==='active'?'응모 완료':x.status)+'</span></div>'+(x.code?'<div class="entry-code"><small>응모 코드</small><b>'+H.esc(x.code)+'</b></div>':'')+'</article>').join('')+'</div>'}catch(e){root.innerHTML='<div class="my-empty"><strong>불러오지 못했어요</strong>잠시 후 다시 시도해주세요.</div>'}})();</script></body></html>
