<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>이벤트 | FUNY PIN</title>
<link rel="icon" href="/favicon.svg?v=20261016-app-logo1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-v2.css?v=20261020-service-profile-mission1">
<link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-my-events1">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F4FC;color:#28232e;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.event-shell{width:min(100%,420px);min-height:100dvh;margin:0 auto;background:#F7F4FC}
.event-main{padding:12px 14px 40px}
.event-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:13px;background:#ECE8F1}
.event-tab{height:36px;border:0;border-radius:10px;background:transparent;color:#847C89;font-size:11px;font-weight:800;cursor:pointer}
.event-tab.on{background:#fff;color:#3E3744;box-shadow:0 1px 4px rgba(44,35,52,.08)}
.event-list{display:grid;gap:10px;margin-top:12px}
.event-card{width:100%;padding:0;border:1px solid #E8E2EC;border-radius:18px;background:#fff;display:block;overflow:hidden;text-align:left;cursor:pointer}
.event-thumb{display:block;width:100%;aspect-ratio:16/9;background:#EEEAF3;overflow:hidden}
.event-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.event-thumb.is-ended{position:relative}
.event-thumb.is-ended::after{content:"";position:absolute;inset:0;background:rgba(19,15,30,.32);pointer-events:none}
.event-ended-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;padding:7px 23px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(18,15,28,.75);color:#fff;font-size:14px;font-weight:850;line-height:1.3;white-space:nowrap}
.event-copy{display:block;min-width:0;padding:14px 16px 16px}
.event-copy b{display:block;font-size:14px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-copy span{display:block;margin-top:7px;color:#8F8794;font-size:10.5px;line-height:1.45}
.event-chevron{display:none}
.event-empty,.event-loading,.event-error{padding:48px 16px;text-align:center;color:#928A96;font-size:11px;line-height:1.6}
.event-empty strong,.event-error strong{display:block;margin-bottom:5px;color:#554E59;font-size:13px}
</style>
</head>
<body>
<div class="event-shell">
<header class="funy-sub-header"><button type="button" class="funy-sub-back" onclick="location.href='/my.html'" aria-label="뒤로가기">‹</button><div class="funy-sub-title">이벤트</div></header>
<main class="event-main">
<div class="event-tabs" role="tablist">
<button class="event-tab on" type="button" data-filter="all">전체</button>
<button class="event-tab" type="button" data-filter="active">진행</button>
<button class="event-tab" type="button" data-filter="ended">종료</button>
</div>
<div id="eventList" class="event-list"><div class="event-loading">이벤트를 불러오는 중...</div></div>
</main>
</div>
<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=v=>{const d=new Date(v);if(Number.isNaN(d.getTime()))return'-';return d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,'')};
 await A.init();if(!A.session){A.goLogin('/my-events.html');return}
 const {data,error}=await A.client.from('my_events').select('id,title,image_url,starts_at,ends_at,detail_url,sort_order').eq('is_visible',true).order('sort_order',{ascending:true}).order('starts_at',{ascending:false});
 if(error)throw error;
 const rows=data||[];let filter='all';
 const state=x=>{const now=Date.now(),start=Date.parse(x.starts_at),end=Date.parse(x.ends_at);return end<now?'ended':start<=now&&now<=end?'active':'upcoming'};
 function render(){
  const list=rows.filter(x=>filter==='all'||state(x)===filter);
  $('#eventList').innerHTML=list.length?list.map(x=>'<button type="button" class="event-card" data-url="'+esc(x.detail_url)+'"><span class="event-thumb'+(state(x)==='ended'?' is-ended':'')+'">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="">':'')+(state(x)==='ended'?'<span class="event-ended-label">종료</span>':'')+'</span><span class="event-copy"><b>'+esc(x.title)+'</b><span>'+fmt(x.starts_at)+' ~ '+fmt(x.ends_at)+'</span></span></button>').join(''):'<div class="event-empty"><strong>표시할 이벤트가 없어요</strong>해당 상태의 이벤트가 등록되면 이곳에 표시됩니다.</div>';
  $$('.event-card').forEach(b=>b.onclick=()=>{const url=String(b.dataset.url||'').trim();if(url)location.href=url});
 }
 $$('.event-tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('.event-tab').forEach(x=>x.classList.toggle('on',x===b));render()});
 render();
})().catch(e=>{const el=document.getElementById('eventList');if(el)el.innerHTML='<div class="event-error"><strong>이벤트를 불러오지 못했어요</strong>'+String(e?.message||e)+'</div>'});
</script>
</body>
</html>
