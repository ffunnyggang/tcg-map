function setupCanvas(){
  const canvas=document.getElementById('sigCanvas'),ctx=canvas.getContext('2d');
  let drawing=false,drawn=false;
  function resize(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const snap=drawn?canvas.toDataURL('image/png'):null;canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#302739';if(snap){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=snap}}
  const pt=e=>{const r=canvas.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  const start=e=>{e.preventDefault();drawing=true;drawn=true;const p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
  const end=e=>{if(drawing){e.preventDefault();drawing=false}};
  canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  window.addEventListener('resize',resize);resize();
  document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drawn=false};
  return {canvas,has:()=>drawn};
}

      <div class="actions"><button class="btn print" id="printBtn" type="button">문서 인쇄 / PDF 저장</button><button class="btn submit" id="submitBtn" type="button">동의하고 전자서명 완료</button></div>
      <div id="resultBox"></div>`}
      <div class="legal">전자서명 기록에는 서명 일시, 문서 버전과 SHA-256 문서 해시, 브라우저/기기 환경 정보가 함께 보관됩니다. 중요 계약의 법적·세무적 효력은 필요시 변호사·세무사 등 전문가의 검토를 권장합니다.</div>
    </section>`;
    if(req.signed)return;
    const sig=setupCanvas(),result=document.getElementById('resultBox');
    document.getElementById('printBtn').onclick=()=>window.print();
    document.getElementById('submitBtn').onclick=async()=>{
      const btn=document.getElementById('submitBtn'),name=document.getElementById('signerName').value.trim(),agreed=document.getElementById('agree').checked;
      result.className='result err';
      if(name!==req.signer_name){result.textContent='서명자 이름을 정확히 입력해 주세요.';return}
      if(!sig.has()){result.textContent='자필 서명을 입력해 주세요.';return}
      if(!agreed){result.textContent='계약 내용 및 전자서명 동의 항목을 확인해 주세요.';return}
      btn.disabled=true;btn.textContent='서명 저장 중...';
      try{
        const out=await rpc('submit_investment_signature',{
          p_token:token,p_signer_name:name,p_signature_data:sig.canvas.toDataURL('image/png'),
          p_user_agent:navigator.userAgent||'',p_timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',
          p_locale:navigator.language||'',p_agreed:true,p_document_hash:DOC_HASH
        });
        if(!out?.ok)throw new Error(out?.error||'서명 저장 실패');
        result.className='result ok';result.innerHTML='<b>전자서명이 완료되었습니다.</b><br>'+fmt(out.signed_at)+(out.all_signed?'<br>양측 서명이 모두 완료되었습니다.':'<br>상대방 서명 대기 중입니다.');
        btn.remove();document.getElementById('signerName').disabled=true;document.getElementById('agree').disabled=true;
        top.textContent='서명 완료 · '+roleName(req.signer_role)+' '+req.signer_name;
      }catch(e){result.className='result err';result.textContent='전자서명 저장 실패: '+e.message;btn.disabled=false;btn.textContent='동의하고 전자서명 완료'}
    };
  }catch(e){
    top.textContent='서명 요청 오류';card.innerHTML='<div class="loading">'+String(e.message||e)+'</div>';
  }
}
init();
})();
</script>
