const PALETTE=[
 {key:'gold',name:'골드',color:'#e1b43e',edge:'#a87913'},
 {key:'red',name:'레드',color:'#ef5c68',edge:'#b92e3b'},
 {key:'blue',name:'블루',color:'#5e9bea',edge:'#3265aa'},
 {key:'yellow',name:'옐로',color:'#f5d64b',edge:'#b79a16'},
 {key:'green',name:'그린',color:'#5bbb78',edge:'#31894e'},
 {key:'pink',name:'핑크',color:'#ee86bd',edge:'#b94d88'},
 {key:'purple',name:'퍼플',color:'#9a75df',edge:'#6643aa'},
 {key:'white',name:'화이트',color:'#f7f6f8',edge:'#aaa5ad'},
 {key:'black',name:'블랙',color:'#4a464e',edge:'#17151b'}
];
const DEFAULT={total:100,entries:[
 {id:'gold',colorKey:'gold',count:1,prize:'1등 상품'},
 {id:'red',colorKey:'red',count:3,prize:'2등 상품'},
 {id:'blue',colorKey:'blue',count:6,prize:'3등 상품'},
 {id:'yellow',colorKey:'yellow',count:10,prize:'참가상'},
 {id:'white',colorKey:'white',count:80,prize:'꽝'}
]};
const $=id=>document.getElementById(id);
const els={stage:$('machineStage'),draw:$('drawButton'),ball:$('drawnBall'),cloud:$('ballCloud'),title:$('resultTitle'),sub:$('resultSub'),total:$('totalBalls'),list:$('configList'),sum:$('sumStatus'),add:$('addRow'),reset:$('resetDraw'),remaining:$('remainingList'),remainingTotal:$('remainingTotal'),remainingRate:$('remainingRate'),drawCount:$('drawCount'),configuredTotal:$('configuredTotal'),configState:$('configState'),history:$('historyList'),historyCount:$('historyCount'),toast:$('toast')};
let toastTimer=0;
let state=load();
function uid(){try{return crypto.randomUUID()}catch(_){return 'row-'+Date.now()+'-'+Math.random().toString(36).slice(2)}}
function clone(v){return JSON.parse(JSON.stringify(v))}
function colorOf(key){return PALETTE.find(x=>x.key===key)||PALETTE[PALETTE.length-2]}
function secureInt(max){if(max<=1)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}catch(_){return Math.floor(Math.random()*max)}}
function load(){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(raw&&Array.isArray(raw.entries)){const entries=raw.entries.slice(0,9).map((x,i)=>({id:String(x.id||uid()),colorKey:PALETTE.some(p=>p.key===x.colorKey)?x.colorKey:PALETTE[i%PALETTE.length].key,count:Math.max(0,Math.round(Number(x.count)||0)),prize:String(x.prize||'상품')}));const total=Math.max(1,Math.min(9999,Math.round(Number(raw.total)||100)));const remaining=Array.isArray(raw.remaining)&&raw.remaining.length===entries.length?raw.remaining.map((v,i)=>Math.max(0,Math.min(entries[i].count,Math.round(Number(v)||0)))):entries.map(x=>x.count);const history=Array.isArray(raw.history)?raw.history.slice(0,50):[];return{total,entries,remaining,history,busy:false,last:raw.last||null}}}catch(_){}const d=clone(DEFAULT);return{...d,remaining:d.entries.map(x=>x.count),history:[],busy:false,last:null}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({total:state.total,entries:state.entries,remaining:state.remaining,history:state.history,last:state.last}))}catch(_){}}
function showToast(message){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1700)}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sumConfigured(){return state.entries.reduce((n,x)=>n+x.count,0)}
function sumRemaining(){return state.remaining.reduce((n,x)=>n+x,0)}
function validConfig(){return state.total>0&&state.entries.length>0&&sumConfigured()===state.total&&sumRemaining()>0}
function resetSimulation(notify=false){state.remaining=state.entries.map(x=>x.count);state.history=[];state.last=null;state.busy=false;els.stage.classList.remove('spinning','releasing');els.ball.style.opacity='0';if(notify)showToast('추첨을 초기화했어요.');save();render()}
function settingsChanged(){state.last=null;state.remaining=state.entries.map(x=>x.count);state.history=[];state.busy=false;els.stage.classList.remove('spinning','releasing');save();render()}
function renderConfig(){els.total.value=String(state.total);els.list.innerHTML=state.entries.map((entry,index)=>{const p=colorOf(entry.colorKey);return '<div class="config-row" data-row="'+esc(entry.id)+'"><div class="config-top"><div class="color-control"><span class="color-dot" style="--c:'+p.color+';--edge:'+p.edge+'"></span><select class="color-select" data-field="color" aria-label="구슬 컬러">'+PALETTE.map(x=>'<option value="'+x.key+'"'+(x.key===entry.colorKey?' selected':'')+'>'+x.name+'</option>').join('')+'</select></div><div class="stepper"><button type="button" data-step="-1" aria-label="수량 줄이기">−</button><input data-field="count" type="number" inputmode="numeric" min="0" max="9999" value="'+entry.count+'" aria-label="구슬 수량"><button type="button" data-step="1" aria-label="수량 늘리기">＋</button></div><button class="remove-row" type="button" data-remove aria-label="컬러 삭제">×</button></div><input class="prize-input" data-field="prize" maxlength="30" value="'+esc(entry.prize)+'" placeholder="상품 또는 결과를 입력해주세요"></div>'}).join('');
 els.list.querySelectorAll('.config-row').forEach(row=>{const id=row.dataset.row,entry=state.entries.find(x=>x.id===id);if(!entry)return;row.querySelector('[data-field="color"]').addEventListener('change',e=>{entry.colorKey=e.target.value;settingsChanged()});row.querySelector('[data-field="count"]').addEventListener('change',e=>{entry.count=Math.max(0,Math.min(9999,Math.round(Number(e.target.value)||0)));settingsChanged()});row.querySelector('[data-field="prize"]').addEventListener('change',e=>{entry.prize=String(e.target.value||'상품').trim()||'상품';settingsChanged()});row.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{entry.count=Math.max(0,Math.min(9999,entry.count+Number(b.dataset.step)));settingsChanged()}));row.querySelector('[data-remove]').addEventListener('click',()=>{if(state.entries.length<=1){showToast('컬러는 최소 1개 필요해요.');return}state.entries=state.entries.filter(x=>x.id!==id);settingsChanged()})});
}
function renderCloud(){const total=sumRemaining()||sumConfigured(),balls=[];if(total<=0){els.cloud.innerHTML='';return}for(let i=0;i<18;i++){let r=secureInt(total),picked=state.entries[0];for(let j=0;j<state.entries.length;j++){const weight=state.remaining[j]??state.entries[j].count;if(r<weight){picked=state.entries[j];break}r-=weight}const p=colorOf(picked.colorKey),angle=(i/18)*Math.PI*2+(i%3)*.19,radius=24+(i%4)*7,x=56+Math.cos(angle)*radius,y=56+Math.sin(angle)*radius;balls.push('<i class="mini-ball" style="--c:'+p.color+';--edge:'+p.edge+';left:'+(x-9).toFixed(1)+'px;top:'+(y-9).toFixed(1)+'px;transform:scale('+(0.78+(i%3)*.12)+')"></i>')}els.cloud.innerHTML=balls.join('')}
function renderRemaining(){const total=sumRemaining();els.remaining.innerHTML=state.entries.map((entry,i)=>{const p=colorOf(entry.colorKey),remain=state.remaining[i]||0,prob=total?remain/total*100:0;return '<div class="remaining-row"><span class="remaining-ball" style="--c:'+p.color+';--edge:'+p.edge+'"></span><span class="remaining-copy"><b>'+esc(entry.prize)+'</b><span>'+p.name+' · 설정 '+entry.count+'개</span></span><span class="remaining-value"><strong>'+remain+'개</strong><span>'+prob.toFixed(prob<10?1:0)+'%</span></span></div>'}).join('')}
function renderHistory(){els.historyCount.textContent=state.history.length+'회';if(!state.history.length){els.history.innerHTML='<div class="history-empty">아직 추첨 결과가 없어요.</div>';return}els.history.innerHTML=state.history.slice(0,20).map(item=>{const p=colorOf(item.colorKey);return '<div class="history-chip"><span class="history-ball" style="--c:'+p.color+';--edge:'+p.edge+'"></span><b>'+esc(item.prize)+'</b></div>'}).join('')}
function renderResult(){if(state.busy){els.title.textContent='가라폰이 회전 중...';els.title.classList.remove('emphasis');els.sub.textContent='구슬이 섞이고 있어요';return}if(state.last){const p=colorOf(state.last.colorKey);els.title.textContent=state.last.prize;els.title.classList.add('emphasis');els.sub.textContent=p.name+' 구슬이 나왔어요';document.documentElement.style.setProperty('--result-color',p.color);document.documentElement.style.setProperty('--result-edge',p.edge);return}els.title.textContent=sumRemaining()?'구슬을 구성하고 돌려보세요':'모든 구슬을 뽑았어요';els.title.classList.remove('emphasis');els.sub.textContent=sumRemaining()?'한 번 나온 구슬은 남은 구슬에서 제외됩니다':'추첨 초기화 후 다시 시작할 수 있어요'}
function render(){const configured=sumConfigured(),remaining=sumRemaining(),ok=configured===state.total;els.sum.textContent='구성 합계 '+configured.toLocaleString('ko-KR')+' / 총 '+state.total.toLocaleString('ko-KR');els.sum.classList.toggle('bad',!ok);els.remainingTotal.textContent=remaining.toLocaleString('ko-KR')+'개';els.remainingRate.textContent=(state.total?Math.round(remaining/state.total*100):0)+'%';els.drawCount.textContent=state.history.length+'회';els.configuredTotal.textContent=configured.toLocaleString('ko-KR')+'개';els.configState.textContent=ok?'구성 완료':'수량 확인';els.draw.disabled=state.busy||!validConfig();els.reset.disabled=state.busy||(!state.history.length&&remaining===configured);renderConfig();renderCloud();renderRemaining();renderHistory();renderResult()}
function pick(){const total=sumRemaining();if(!validConfig()){showToast(sumConfigured()!==state.total?'컬러별 수량 합계를 총 구슬 수와 맞춰주세요.':'남은 구슬이 없어요.');return}let n=secureInt(total),index=0;for(let i=0;i<state.remaining.length;i++){if(n<state.remaining[i]){index=i;break}n-=state.remaining[i]}const entry=state.entries[index],p=colorOf(entry.colorKey);state.busy=true;state.last=null;document.documentElement.style.setProperty('--result-color',p.color);document.documentElement.style.setProperty('--result-edge',p.edge);els.ball.style.opacity='0';els.stage.classList.remove('spinning','releasing');void els.stage.offsetWidth;els.stage.classList.add('spinning');renderResult();els.draw.disabled=true;try{navigator.vibrate?.(18)}catch(_){}setTimeout(()=>{els.stage.classList.add('releasing');try{navigator.vibrate?.([10,45,16])}catch(_){}},1280);setTimeout(()=>{state.remaining[index]=Math.max(0,state.remaining[index]-1);const result={id:uid(),entryId:entry.id,colorKey:entry.colorKey,prize:entry.prize,at:Date.now()};state.history.unshift(result);state.last=result;state.busy=false;els.stage.classList.remove('spinning');save();render();try{window.FUNY_TRACK?.('garapon_draw',{color:entry.colorKey,prize:entry.prize,remaining_count:sumRemaining(),total_count:state.total})}catch(_){}},2050)}
function addRow(){if(state.entries.length>=9){showToast('컬러는 최대 9개까지 설정할 수 있어요.');return}const used=new Set(state.entries.map(x=>x.colorKey)),next=PALETTE.find(x=>!used.has(x.key))||PALETTE[state.entries.length%PALETTE.length];state.entries.push({id:uid(),colorKey:next.key,count:0,prize:'상품'});settingsChanged()}
function goBack(){try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({type:'NATIVE_BACK'}));return}}catch(_){}if(history.length>1)history.back();else location.href='tcg-tools.html'}
$('backButton').addEventListener('click',goBack);els.draw.addEventListener('click',pick);els.reset.addEventListener('click',()=>resetSimulation(true));els.add.addEventListener('click',addRow);els.total.addEventListener('change',()=>{state.total=Math.max(1,Math.min(9999,Math.round(Number(els.total.value)||1)));settingsChanged()});els.total.addEventListener('focus',e=>{try{e.target.select()}catch(_){}});render();try{window.FUNY_TRACK?.('garapon_view',{total_count:state.total,color_count:state.entries.length})}catch(_){}
})();
</script>

</body>
