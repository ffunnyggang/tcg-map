<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCG MAP — 카드샵 지도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TCG MAP — 모바일 우선 · 모노크롬 잉크 + 골드 (카드 바인더 언어)
   ============================================================ */
:root{
  --ink:      #1B1815;   /* 카드 본체 잉크 */
  --ink-soft: #4A443C;
  --muted:    #857C6F;
  --faint:    #B6AE9F;
  --paper:    #F6F3EC;
  --card:     #FFFFFF;
  --line:     #E9E3D7;
  --line-strong: #D9D1BF;
  --gold:     #B98A2F;
  --gold-soft:#EBDCB8;
  --gold-wash:#F7F1E2;
  --header-h: 58px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  line-height:1.5;
  overscroll-behavior-y:none;
}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.shell{max-width:920px; margin:0 auto;}

/* ---------- Title Header (항상 고정) ---------- */
.app-header{
  position:sticky; top:0; z-index:70;
  height:var(--header-h);
  background:var(--ink);
  box-shadow:0 1px 0 rgba(27,24,21,.9), 0 6px 18px -12px rgba(27,24,21,.55);
}
.app-header .shell{
  height:100%; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:12px; height:12px; background:var(--gold);
  transform:rotate(45deg); border-radius:2px;
  box-shadow:0 0 0 2px rgba(185,138,47,.25);
}
.brand-name{
  font-family:'Space Grotesk','Pretendard Variable',sans-serif;
  font-weight:700; font-size:19px; letter-spacing:.22em; color:#FFF;
}
.brand-sub{
  font-size:11px; letter-spacing:.04em; color:#C9BA94; margin-top:1px;
}

/* ---------- Map (일반 콘텐츠 — 스크롤되며 사라짐) ---------- */
.map-wrap{
  height:290px;
  position:relative; background:#EDE9DE;
  border-bottom:1px solid var(--line-strong);
}
.map-wrap iframe{display:block; width:100%; height:100%; border:0; position:relative; z-index:1;}
.map-placeholder{
  position:absolute; inset:0;
  background:radial-gradient(#D8CFBB 1.2px, transparent 1.2px) 0 0 / 24px 24px, var(--paper);
  display:flex; align-items:center; justify-content:center;
}
.map-placeholder span{
  font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--muted);
  background:var(--card); border:1px solid var(--line-strong); border-radius:999px;
  padding:6px 14px; box-shadow:0 2px 8px -6px rgba(27,24,21,.4);
}
.map-note{
  position:absolute; left:12px; bottom:10px; z-index:2;
  font-size:11px; letter-spacing:.02em;
  background:rgba(27,24,21,.82); color:#F0EADB;
  padding:4px 10px; border-radius:999px;
  pointer-events:none;
}
@media (min-width:1024px){
  .map-wrap{height:380px;}
}

/* ---------- Filter Bar (지도가 지나간 뒤 헤더 아래 sticky) ---------- */
.filter-bar{
  position:sticky; top:var(--header-h); z-index:60;
  background:var(--card);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 14px -14px rgba(27,24,21,.5);
}
.filter-track{
  display:flex; gap:8px;
  padding:11px 16px 12px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filter-track::-webkit-scrollbar{display:none;}
.f-chip{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 15px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:var(--card); color:var(--muted);
  font-family:inherit; font-size:13.5px; font-weight:600; letter-spacing:.01em;
  cursor:pointer; transition:background .12s,color .12s,border-color .12s;
  touch-action:manipulation;
}
.f-chip .dot{width:5px; height:5px; border-radius:50%; background:var(--gold); opacity:0; transition:opacity .12s;}
.f-chip.active{
  background:var(--ink); border-color:var(--ink); color:#FFF;
}
.f-chip.active .dot{opacity:1;}
@media (hover:hover){ .f-chip:hover{ border-color:var(--gold); color:var(--ink);} .f-chip.active:hover{color:#FFF;} }

/* ---------- Shop List ---------- */
.list{padding:14px 16px 40px;}
.list-count{
  display:flex; align-items:center; gap:7px;
  margin:0 0 10px;
  font-size:12px; font-weight:600; letter-spacing:.03em; color:var(--muted);
}
.list-count i{width:6px; height:6px; background:var(--gold); border-radius:50%;}
.shop-card{
  position:relative; display:block;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px 18px 15px;
  margin-bottom:12px;
  box-shadow:0 1px 2px rgba(27,24,21,.05);
  text-decoration:none; color:inherit;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  touch-action:manipulation;
}
/* 트레이딩 카드 더블 프레임 시그니처 */
.shop-card::before{
  content:""; position:absolute; inset:4px;
  border:1px solid var(--line-strong); border-radius:11px;
  pointer-events:none;
}
.shop-card::after{
  content:""; position:absolute; top:-1px; right:16px;
  width:38px; height:3px; border-radius:0 0 3px 3px;
  background:var(--gold);
}
@media (hover:hover){
  .shop-card:hover{ transform:translateY(-2px); box-shadow:0 8px 22px -14px rgba(27,24,21,.35); border-color:var(--line-strong);}
}
.shop-card:active{ transform:scale(.994); }
.shop-name-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.shop-name{font-size:17px; font-weight:800; letter-spacing:-.01em;}
.shop-en{
  font-family:'Space Grotesk',sans-serif;
  font-size:10.5px; font-weight:600; letter-spacing:.14em;
  color:var(--muted); white-space:nowrap;
}
.shop-loc{
  display:flex; align-items:center; gap:7px;
  margin:7px 0 10px;
  font-size:13px; font-weight:600; color:var(--ink-soft);
}
.shop-loc .loc-dot{width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex:0 0 auto;}
.tags{display:flex; flex-wrap:wrap; gap:6px 6px;}
.tag{
  font-size:11.5px; font-weight:600; color:var(--ink-soft);
  background:var(--gold-wash);
  border:1px solid var(--gold-soft);
  border-radius:7px;
  padding:3px 9px;
}

/* ---------- Empty ---------- */
.empty{
  text-align:center; padding:72px 24px;
  border:1px dashed var(--line-strong); border-radius:15px;
  background:var(--card);
}
.empty .e-mark{
  width:34px; height:34px; margin:0 auto 14px;
  background:var(--gold-wash); border:1px solid var(--gold-soft); border-radius:10px;
  transform:rotate(45deg); position:relative;
}
.empty .e-mark::after{content:""; position:absolute; inset:8px; background:var(--gold); border-radius:3px;}
.empty h3{margin:0 0 6px; font-size:16px; font-weight:800;}
.empty p{margin:0 0 18px; font-size:13px; color:var(--muted);}
.empty button{
  font-family:inherit; font-size:13px; font-weight:700;
  color:#FFF; background:var(--ink);
  border:0; border-radius:999px; padding:9px 20px; cursor:pointer;
}

/* ---------- Detail ---------- */
.detail-top{
  position:sticky; top:var(--header-h); z-index:60;
  background:var(--card); border-bottom:1px solid var(--line);
}
.back-btn{
  display:flex; align-items:center; gap:8px;
  width:100%; padding:13px 16px;
  font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink);
  background:none; border:0; cursor:pointer; text-align:left;
}
.back-btn .arr{color:var(--gold); font-size:15px; line-height:1;}
.back-btn .hint{margin-left:auto; font-size:11.5px; font-weight:500; color:var(--faint);}
.detail-body{padding:22px 16px 48px;}
.d-name{border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:6px;}
.d-name h1{margin:0 0 4px; font-size:26px; font-weight:900; letter-spacing:-.02em;}
.d-name .en{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:600; letter-spacing:.2em; color:var(--muted);
}
.d-intro{margin:14px 0 8px; font-size:14px; color:var(--ink-soft);}
.d-section{margin-top:26px;}
.d-label{
  display:flex; align-items:center; gap:9px;
  margin:0 0 12px;
  font-size:13px; font-weight:800; letter-spacing:.02em; color:var(--ink);
}
.d-label::before{content:""; width:7px; height:7px; background:var(--gold); transform:rotate(45deg); flex:0 0 auto;}
.dsec-dl{margin:0; border:1px solid var(--line); border-radius:13px; background:var(--card); overflow:hidden;}
.dsec-dl > div{
  display:grid; grid-template-columns:96px 1fr; gap:10px;
  padding:12px 14px; font-size:13.5px;
}
.dsec-dl > div + div{border-top:1px solid var(--line);}
.dsec-dl dt{font-weight:600; color:var(--muted);}
.dsec-dl dd{margin:0; font-weight:500; color:var(--ink);}
.dsec-dl dd.placeholder{color:var(--faint);}

.mini-map{position:relative; border:1px solid var(--line); border-radius:13px; overflow:hidden; background:var(--gold-wash);}
.mini-map iframe{display:block; width:100%; height:190px; border:0; position:relative; z-index:1;}
.sns-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.sns-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--ink-soft);
  text-decoration:none;
  border:1px solid var(--line-strong); background:var(--card);
  border-radius:999px; padding:7px 13px;
}
.sns-chip .up{color:var(--gold);}
.sns-chip .na{font-weight:500; color:var(--faint); font-size:11px;}
@media (hover:hover){ .sns-chip:hover{border-color:var(--gold); color:var(--ink);} }

.chips{display:flex; flex-wrap:wrap; gap:8px;}
.tcg-chip{
  font-size:13px; font-weight:700;
  background:var(--card); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:9px;
  padding:7px 14px;
}
.tcg-chip .en{font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:.1em; color:var(--muted); display:block;}

.d-list{margin:0; padding:0; list-style:none; border:1px solid var(--line); border-radius:13px; background:var(--card); overflow:hidden;}
.d-list li{
  display:flex; gap:10px; align-items:baseline;
  padding:12px 14px; font-size:14px; font-weight:500;
}
.d-list li + li{border-top:1px solid var(--line);}
.d-list li::before{content:""; width:5px; height:5px; background:var(--gold); transform:rotate(45deg); flex:0 0 auto; align-self:center;}

[hidden]{display:none !important;}
.shop-name-row{margin-bottom:2px;}
.shop-name-row + .tags{margin-top:9px;}
.d-checked-note{margin-top:34px; padding-top:14px; border-top:1px dashed var(--line-strong); font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.02em;}

@media (min-width:1024px){
  .list{padding:20px 24px 60px;}
  .shop-card{padding:20px 22px 18px;}
  .detail-body{padding:30px 24px 64px;}
  .mini-map iframe{height:220px;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="shell">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">TCG MAP</span>
    </div>
    <span class="brand-sub">카드샵 지도</span>
  </div>
</header>

<!-- ================= HOME ================= -->
<div id="home-view">
  <div class="map-wrap">
    <div class="map-placeholder" aria-hidden="true"><span>지도 로드 중…</span></div>
    <!-- ────────────────────────────────────────────────────────────
         Google My Maps 임베드 URL을 여기에 붙여넣으세요.
         My Maps → 공유 → "웹에 삽입(Embed a map)"에서 나오는
         https://www.google.com/maps/d/embed?mid=... 주소를
         아래 iframe의 src에 교체하면 즉시 적용됩니다.
         ──────────────────────────────────────────────────────────── -->
    <iframe id="home-map"
      src="https://www.google.com/maps/d/u/0/embed?mid=12pEoFfhiJwtcqpBhCR0HYaVQOA5mhfw&ehbc=2E312F&noprof=1"
      title="TCG 샵 지도" loading="eager" allowfullscreen></iframe>
    <span class="map-note">TCG MAP</span>
  </div>

  <nav class="filter-bar" aria-label="카드샵 필터">
    <div class="filter-track" id="filter-track" role="group" aria-label="취급 TCG · 서비스 필터"></div>
  </nav>

  <main class="list shell">
    <p class="list-count" id="list-count" aria-live="polite"><i></i><span id="list-count-text"></span></p>
    <div id="shop-list"></div>
    <div id="empty-state" class="empty" hidden>
      <div class="e-mark" aria-hidden="true"></div>
      <h3>조건에 맞는 카드샵이 없습니다</h3>
      <p>필터를 해제하거나 다른 조건을 선택해 주세요.</p>
      <button type="button" id="empty-reset">필터 초기화</button>
    </div>
  </main>
</div>

<!-- ================= DETAIL ================= -->
<div id="detail-view" hidden>
  <div class="detail-top">
    <button type="button" class="back-btn" id="back-btn">
      <span class="arr">←</span> 카드샵 목록
      <span class="hint">필터·위치 그대로</span>
    </button>
  </div>
  <article class="detail-body shell" id="detail-body"></article>
</div>

<script>
/* ============================================================
   실제 카드샵 데이터 (KR-SEO-001 ~ KR-SEO-015)
   - 15개 매장의 상호(가게 이름)와 Shop ID를 반영했습니다.
   - 그 외 필드(주소·전화·영업시간·정기휴무·주차·좌표·링크·TCG·
     상품·서비스)는 사용자 제공 shopData가 접수되면 채워 넣습니다.
     현재는 전부 null/false이며, null/false인 값은 화면에
     렌더링되지 않습니다. (추측 데이터 없음)
   - ※ 카드노바(KR-SEO-001)의 영문명/지역/도보/특징 일부만
     첫 번째 요청의 카드 예시(와이어프레임)에서 제공된 값을 사용.
   ============================================================ */

/* 취급 TCG 표시명 등록부 (키 → 화면 표시 이름) */
/* ============================================================
   실제 카드샵 데이터 (KR-SEO-001 ~ KR-SEO-015)
   데이터 상태: true(확인됨) / false(확인된 미운영) / null(미확인)
   - null은 절대 false로 변환하지 않음
   - 화면 표시는 true인 항목만
   - 주소·링크·좌표 등은 사용자 제공 데이터 그대로 (추측 없음)
   ============================================================ */

/* 취급 TCG 표시명 등록부 (Pokemon 필터는 만들지 않음) */
const TCG_REGISTRY = {
  pokemon:    { kr: "포켓몬",   en: "POKÉMON" },
  onepiece:   { kr: "원피스",   en: "ONE PIECE" },
  dragonball: { kr: "드래곤볼", en: "DRAGON BALL" }
};

/* 리스트 카드 주요 태그 (5개 계열, FEATURE true만) */
const CARD_TAG_LABELS = {
  single:  "싱글카드",
  graded:  "그레이딩",
  vintage: "빈티지",
  oripa:   "오리파",
  play:    "플레이 공간"
};

/* 판매상품 표시명 (true만) */
const PRODUCT_LABELS = {
  single:   "싱글카드",
  pack:     "미개봉팩",
  box:      "BOX",
  promo:    "프로모카드",
  graded:   "그레이딩카드",
  vintage:  "빈티지카드",
  supplies: "카드용품"
};

/* 서비스 표시명 (true만) */
const SERVICE_LABELS = {
  buy:            "카드매입",
  consignment:    "위탁판매",
  gradingService: "그레이딩접수",
  event:          "이벤트",
  onlineShop:     "온라인판매",
  shipping:       "택배거래",
  oripa:          "오리파",
  play:           "플레이 공간"
};

/* 값 미확인(null) 상태로 기본 생성 — 명시된 true/false만 덮어씀 */
function rawShop(id, name){
  return {
    id: id, name: name, en: null,
    address: null, area: null,
    phone: null, hours: null, closedDay: null, parking: null,
    lat: null, lng: null,
    station: null, walkMin: null,
    status: null, lastVerified: null,
    links: { naver: null, google: null, instagram: null, website: null },
    tcg: { pokemon: null, onepiece: null, dragonball: null },
    features: {
      single: null, pack: null, box: null, promo: null,
      graded: null, vintage: null, supplies: null,
      buy: null, consignment: null, gradingService: null,
      event: null, onlineShop: null, shipping: null,
      oripa: null, play: null
    }
  };
}
function shop(id, name, over){
  const s = rawShop(id, name);
  if (over){
    for (const k in over){
      if (k === "features" || k === "tcg" || k === "links") Object.assign(s[k], over[k]);
      else if (over[k] !== undefined) s[k] = over[k];   // 미명시 키는 null 유지 (undefined로 덮지 않음)
    }
  }
  return s;
}

const SHOPS = [

  /* KR-SEO-001 카드노바 */
  shop("KR-SEO-001", "카드노바", {
    en: "CARD NOVA",
    address: "테헤란로1길 16 4층", area: "강남",
    phone: "010-6403-1020",
    links: { instagram: "https://www.instagram.com/tcgcardnova/", google: "https://maps.app.goo.gl/cZRfaEBzQ5m4htJn6", naver: "https://naver.me/x3caqohD" },
    station: "강남역", walkMin: 2, parking: "불가능",
    hours: "매일 13:00~22:00",
    status: "운영", lastVerified: "2026-09-09",
    tcg: { pokemon: true },
    features: { single: true, box: true, graded: true, event: true, oripa: true, play: true }
  }),

  /* KR-SEO-002 루비카드샵 */
  shop("KR-SEO-002", "루비카드샵", {
    en: "RUBY CARD SHOP",
    address: "강남대로102길 11 3층", area: "강남",
    phone: "010-2277-9424",
    links: { website: "https://rubycardshop.com/", instagram: "https://www.instagram.com/rubycard_shop", naver: "https://naver.me/G6RqQSBi" },
    station: "강남역", walkMin: 6, parking: "가능",
    hours: "매일 13:00~22:00",
    status: "운영", lastVerified: "2026-09-09",
    tcg: { pokemon: true, onepiece: true },
    features: { pack: true, box: true, supplies: true, buy: true, gradingService: true, onlineShop: true }
  }),

  /* KR-SEO-003 퍼스트카드샵 */
  shop("KR-SEO-003", "퍼스트카드샵", {
    en: "FIRST CARD SHOP",
    address: "잔다리로7안길 31 3층", area: "합정",

/* 필터 — 다중 선택 AND, true인 Shop만 포함 (Pokemon 필터 없음) */
const FILTERS = [
  { id: "onepiece",   label: "One Piece",   test: s => s.tcg.onepiece === true },
  { id: "dragonball", label: "Dragon Ball", test: s => s.tcg.dragonball === true },
  { id: "single",     label: "싱글카드",       test: s => s.features.single === true },
  { id: "grading",    label: "그레이딩",       test: s => s.features.graded === true },
  { id: "vintage",    label: "빈티지",         test: s => s.features.vintage === true },
  { id: "oripa",      label: "오리파",         test: s => s.features.oripa === true },
  { id: "play",       label: "플레이 공간",     test: s => s.features.play === true }
];

const state = {
  filters: new Set(),   // 선택된 필터 id 집합 (AND 조건)
  scrollY: 0            // 홈 스크롤 위치 보존
};

const $ = (id) => document.getElementById(id);

/* ---------- 필터 ---------- */
function renderFilters(){
  const track = $("filter-track");
  const allChip = chipHTML("all", "전체", state.filters.size === 0);
  const chips = FILTERS.map(f => chipHTML(f.id, f.label, state.filters.has(f.id)));
  track.innerHTML = allChip + chips.join("");
}
function chipHTML(id, label, active){
  return '<button type="button" class="f-chip' + (active ? ' active' : '') + '" data-fid="' + id + '" aria-pressed="' + active + '">'
       + '<span class="dot" aria-hidden="true"></span>' + label + '</button>';
}
function toggleFilter(id){
  if (id === "all") { state.filters.clear(); }
  else {
    if (state.filters.has(id)) state.filters.delete(id);
    else state.filters.add(id);
  }
  renderFilters();
  renderList();
}
$("filter-track").addEventListener("click", (e) => {
  const btn = e.target.closest(".f-chip");
  if (btn) toggleFilter(btn.dataset.fid);
});

/* ---------- 샵 리스트 ---------- */
function matchAll(shop){
  for (const fid of state.filters){
    const f = FILTERS.find(x => x.id === fid);
    if (!f || !f.test(shop)) return false;
  }
  return true;
}
function renderList(){
  const list = SHOPS.filter(matchAll);
  $("list-count-text").textContent = "총 " + list.length + "곳";
  $("empty-state").hidden = list.length > 0;
  $("shop-list").innerHTML = list.map(cardHTML).join("");
}
function cardHTML(s){
  const en = s.en ? '<span class="shop-en">' + s.en + '</span>' : "";
  const loc = (s.area && s.station && s.walkMin != null)
    ? '<p class="shop-loc"><span class="loc-dot" aria-hidden="true"></span>' + s.area + ' · ' + s.station + ' 도보 ' + s.walkMin + '분</p>'
    : "";
  const tags = Object.keys(CARD_TAG_LABELS)
    .filter(k => s.features[k] === true)
    .map(k => '<span class="tag">' + CARD_TAG_LABELS[k] + '</span>').join("");
  return '<a class="shop-card" href="#/shop/' + s.id + '" data-shop="' + s.id + '">'
       +   '<div class="shop-name-row"><span class="shop-name">' + s.name + '</span>' + en + '</div>'
       +   loc
       +   (tags ? '<div class="tags">' + tags + '</div>' : "")
       + '</a>';
}
$("shop-list").addEventListener("click", (e) => {
  const card = e.target.closest(".shop-card");
  if (!card) return;
  e.preventDefault();
  openDetail(card.dataset.shop);
});
$("empty-reset").addEventListener("click", () => { state.filters.clear(); renderFilters(); renderList(); });

/* ---------- 상세 ---------- */
function openDetail(id){
  const shop = SHOPS.find(s => s.id === id);
  if (!shop) return;
  state.scrollY = window.scrollY;          // 홈 스크롤 위치 저장
  $("detail-body").innerHTML = detailHTML(shop);
  $("home-view").hidden = true;
  $("detail-view").hidden = false;
  window.scrollTo(0, 0);
}
function closeDetail(){
  $("detail-view").hidden = true;
  $("home-view").hidden = false;
  renderList();
  requestAnimationFrame(() => window.scrollTo(0, state.scrollY));  // 필터·스크롤 복원
}
function detailHTML(s){
  /* 기본정보 — 값이 있는(null이 아닌) 행만 */
  const basicRows = [
    ["주소", s.address],
    ["전화번호", s.phone],
    ["영업시간", s.hours],
    ["정기휴무", s.closedDay],
    ["주차", s.parking]
  ].filter(r => r[1] != null && r[1] !== "")
   .map(r => '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join("");

  /* 빠른 링크 — 값이 있는 버튼만 (새 탭, 보안 속성) */
  const links = [];
  if (s.links.naver)       links.push(["네이버지도", s.links.naver]);
  if (s.links.google)      links.push(["Google Maps", s.links.google]);
  if (s.links.instagram)   links.push(["Instagram", s.links.instagram]);
  if (s.links.website)     links.push(["Website", s.links.website]);
  const linkChips = links.length
    ? '<div class="sns-row">' + links.map(l => '<a class="sns-chip" href="' + l[1] + '" target="_blank" rel="noopener noreferrer">' + l[0] + ' <span class="up">↗</span></a>').join("") + '</div>'
    : "";

  /* 상세 지도 — 위도·경도가 모두 있을 때만 (좌표 추정 금지) */
  const miniMap = (s.lat != null && s.lng != null)
    ? '<div class="mini-map"><div class="map-placeholder" aria-hidden="true"><span>지도 로드 중…</span></div>'
      + '<iframe src="https://maps.google.com/maps?q=' + s.lat + ',' + s.lng + '&z=16&output=embed&hl=ko" title="' + s.name + ' 위치" loading="lazy" allowfullscreen></iframe></div>'
    : "";

  /* 취급 TCG — true 항목만 */
  const tcgChips = Object.keys(TCG_REGISTRY)
    .filter(k => s.tcg[k] === true)
    .map(k => { const t = TCG_REGISTRY[k]; return '<span class="tcg-chip">' + t.kr + '<span class="en">' + t.en + '</span></span>'; })
    .join("");

  /* 판매상품 / 서비스 — FEATURE true 항목만 */
  const prodItems = trueLabels(s.features, PRODUCT_LABELS).map(i => '<li>' + i + '</li>').join("");
  const svcItems  = trueLabels(s.features, SERVICE_LABELS).map(i => '<li>' + i + '</li>').join("");

  let html = '<header class="d-name"><h1>' + s.name + '</h1>'
           + (s.en ? '<p class="en">' + s.en + '</p>' : '')
           + '</header>';
  if (basicRows)  html += '<section class="d-section"><h2 class="d-label">기본정보</h2><dl class="dsec-dl">' + basicRows + '</dl></section>';
  if (miniMap || linkChips) html += '<section class="d-section"><h2 class="d-label">지도 · 빠른 링크</h2>' + miniMap + linkChips + '</section>';
  if (tcgChips)   html += '<section class="d-section"><h2 class="d-label">취급 TCG</h2><div class="chips">' + tcgChips + '</div></section>';
  if (prodItems)  html += '<section class="d-section"><h2 class="d-label">판매상품</h2><ul class="d-list">' + prodItems + '</ul></section>';
  if (svcItems)   html += '<section class="d-section"><h2 class="d-label">서비스</h2><ul class="d-list">' + svcItems + '</ul></section>';
  html += '<p class="d-checked-note">정보 확인일 ' + (s.lastVerified || "") + '</p>';
  return html;
}
/* {표시명 맵}에서 FEATURE 값이 true인 라벨만 배열로 */
function trueLabels(obj, map){
  return Object.keys(map).filter(k => obj[k] === true).map(k => map[k]);
}

/* ---------- 네비게이션 (뒤로가기 보존) ---------- */
$("back-btn").addEventListener("click", () => history.back());
window.addEventListener("popstate", () => {
  const m = location.hash.match(/^#\/shop\/(.+)$/);
  if (m && SHOPS.some(s => s.id === m[1])) openDetail(m[1]);
  else closeDetail();
});

/* ---------- 초기화 ---------- */
renderFilters();
renderList();
const initMatch = location.hash.match(/^#\/shop\/(.+)$/);
if (initMatch && SHOPS.some(s => s.id === initMatch[1])){
  openDetail(initMatch[1]);   // 딥링크: 자동로그에 바로 상세
} else {
  try { history.replaceState(null, "", location.pathname + location.search); }  // 깨끗한 URL
  catch(e){ /* file://·웹뷰 등 URL 변경이 제한된 환경 — 리스트 표시에는 영향 없음 */ }
}
