<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>프로필 편집 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my2"><style>.profile-card{padding:20px}.avatar-wrap{width:104px;height:104px;margin:6px auto 0;position:relative}.avatar{width:104px;height:104px;border-radius:52px;background:#eee8fa;border:1px solid #ddd3ef;display:grid;place-items:center;overflow:hidden;color:#6749bd;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.avatar-action{position:absolute;right:-3px;bottom:-3px;width:32px;height:32px;border:1px solid #6749bd;border-radius:50%;background:#fff;color:#6749bd;font-size:19px;display:grid;place-items:center;cursor:pointer}.avatar-delete{position:absolute;right:-5px;top:-5px;width:27px;height:27px;border:1px solid #e1dbe6;border-radius:50%;background:#fff;color:#665f6b;font-size:18px;display:none}.avatar-delete.show{display:block}.profile-actions{display:grid;gap:8px;margin-top:24px}.locked{background:#f0edf3!important;color:#8e8692!important}.available{margin-bottom:7px;color:#6749bd;font-size:10px;text-align:right}</style><script src="/web-auth.js?v=20261014-web-auth4"></script><script src="/my-web-common.js?v=20261014-my2"></script></head><body><div class="my-page"><header class="my-head"><button class="my-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title">프로필 편집</div></header><main id="root" class="my-content"><div class="my-loading">프로필을 불러오는 중...</div></main></div><script>(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-profile.html');if(!A)return;const root=document.getElementById('root'),user=A.session.user;let profile=await A.getProfile(),picked=null,avatar=profile?.avatar_url||user.user_metadata?.avatar_url||user.user_metadata?.picture||'';const fallback=profile?.nickname||user.user_metadata?.nickname||user.user_metadata?.name||('FUNY회원'+String(user.id).replace(/-/g,'').slice(-4).toUpperCase());const changed=profile?.nickname_changed_at?new Date(profile.nickname_changed_at).getTime():0,next=changed+30*86400000,locked=changed&&next>Date.now();root.innerHTML='<section class="my-card profile-card"><div class="avatar-wrap"><div class="avatar" id="avatar">'+(avatar?'<img src="'+H.esc(avatar)+'" alt="">':'MY')+'</div><button id="avatarDelete" class="avatar-delete '+(avatar?'show':'')+'" type="button">×</button><label class="avatar-action" for="avatarFile">＋</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div class="my-field"><label>닉네임</label>'+(locked?'<div class="available">'+H.date(next)+'부터 변경 가능</div>':'')+'<input id="nickname" maxlength="12" value="'+H.esc(fallback)+'" '+(locked?'class="locked" readonly':'')+'><div class="my-hint">'+(locked?'닉네임은 변경 후 30일 동안 다시 변경할 수 있어요.':'한글·영문·숫자 2~12자만 사용할 수 있으며 공백·특수문자·이모지는 사용할 수 없어요.')+'</div></div><div class="profile-actions"><button id="save" class="my-btn" type="button">저장하기</button></div><div id="status" class="my-status"></div></section>';const av=document.getElementById('avatar'),file=document.getElementById('avatarFile'),del=document.getElementById('avatarDelete'),nick=document.getElementById('nickname'),save=document.getElementById('save'),status=document.getElementById('status');file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('JPG, PNG, WebP 이미지만 사용할 수 있어요.');file.value='';return}if(f.size>5*1024*1024){alert('프로필 이미지는 5MB 이하만 사용할 수 있어요.');file.value='';return}picked=f;avatar=URL.createObjectURL(f);av.innerHTML='<img src="'+avatar+'" alt="">';del.classList.add('show')};del.onclick=async()=>{if(!confirm('프로필 이미지를 삭제할까요?'))return;del.disabled=true;try{const {data:files,error}=await A.client.storage.from('profile-images').list(user.id,{limit:20});if(error)throw error;const paths=(files||[]).filter(x=>String(x.name||'').startsWith('avatar.')).map(x=>user.id+'/'+x.name);if(paths.length){const {error:e}=await A.client.storage.from('profile-images').remove(paths);if(e)throw e}const {error:e}=await A.client.from('profiles').upsert({user_id:user.id,avatar_url:null,updated_at:new Date().toISOString()});if(e)throw e;picked=null;avatar='';av.textContent='MY';del.classList.remove('show')}catch(e){alert('이미지 삭제에 실패했습니다.')}finally{del.disabled=false}};save.onclick=async()=>{status.textContent='';const n=nick.value.trim();if(!/^[가-힣A-Za-z0-9]{2,12}$/.test(n)){status.textContent='닉네임은 한글·영문·숫자 2~12자로 입력해주세요.';return}save.disabled=true;save.textContent='저장 중…';try{let avatarUrl=profile?.avatar_url??null;if(picked){const ext=picked.type==='image/png'?'png':picked.type==='image/webp'?'webp':'jpg',path=user.id+'/avatar.'+ext;const {error}=await A.client.storage.from('profile-images').upload(path,picked,{contentType:picked.type,cacheControl:'3600',upsert:true});if(error)throw error;avatarUrl=A.client.storage.from('profile-images').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}const payload={user_id:user.id,nickname:n,avatar_url:avatarUrl,updated_at:new Date().toISOString()};const {data,error}=await A.client.from('profiles').upsert(payload).select('*').single();if(error){if(error.code==='23505')throw new Error('이미 사용 중인 닉네임이에요.');if(error.code==='P0001'&&String(error.message||'').includes('NICKNAME_CHANGE_COOLDOWN'))throw new Error('닉네임은 변경 후 30일 동안 다시 변경할 수 없어요.');throw error}profile=data;status.style.color='#2f7a4a';status.textContent='프로필이 저장되었습니다.';setTimeout(()=>location.href='/my.html',500)}catch(e){status.style.color='#b42318';status.textContent=String(e?.message||'저장에 실패했습니다.')}finally{save.disabled=false;save.textContent='저장하기'}}})();</script></body></html>
