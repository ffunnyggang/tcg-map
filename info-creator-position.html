<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN · INFO 좌표 설정</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#242128;font-family:'Pretendard Variable',Pretendard,sans-serif}.page{width:min(100%,420px);min-height:100vh;margin:auto;background:#fff}.head{padding:18px;border-bottom:8px solid #f5f4f7}.back{font-size:30px;color:#29262e;text-decoration:none}.brand{margin-top:12px;color:#8062d8;font-size:10px;font-weight:800;letter-spacing:.18em}.head h1{margin:7px 0 5px;font-size:24px}.head p{margin:0;color:#8d8792;font-size:12px;line-height:1.55}.controls{padding:18px;border-bottom:8px solid #f5f4f7}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;margin-bottom:7px;font-size:11px;color:#77717c}.field input,.field select{width:100%;height:42px;border:1px solid #ddd8e2;border-radius:10px;padding:0 11px;background:#fff;font:inherit;font-size:13px}.value{margin:13px 0 0;padding:11px;border-radius:10px;background:#f7f4fc;color:#6749bd;font-size:11px;line-height:1.55}.preview-title{padding:16px 18px 10px;font-size:12px;font-weight:800}.preview-wrap{width:100%;overflow:hidden;background:#fff}.preview-frame{display:block;width:100%;height:1500px;border:0;background:#fff}</style></head><body><main class="page"><header class="head"><a class="back" href="./reviews.html">‹</a><div class="brand">FUNY PIN · INFO SETTING</div><h1>실제 INFO 기준 좌표 설정</h1><p>아래 미리보기는 별도 복제 화면이 아니라 현재 reviews.html 자체를 불러와 좌표를 조절합니다.</p></header><section class="controls"><div class="field" style="margin-bottom:12px"><label for="target">설정할 탭</label><select id="target"><option value="creator">CREATOR</option><option value="review">깽퐌커플 리뷰</option></select></div><div class="row"><div class="field"><label for="y">Y 좌표</label><input id="y" type="number" step="5"></div><div class="field"><label for="h">표시 높이</label><input id="h" type="number" min="100" step="10"></div></div><div class="value" id="value">실제 INFO 화면을 불러오는 중입니다.</div></section><div class="preview-title" id="preview-title">CREATOR · 실제 INFO 미리보기</div><section class="preview-wrap"><iframe class="preview-frame" id="preview" src="./reviews.html?info-position-preview=1" title="실제 INFO 좌표 미리보기"></iframe></section></main><script>
const target=document.getElementById('target'),y=document.getElementById('y'),h=document.getElementById('h'),preview=document.getElementById('preview'),value=document.getElementById('value'),title=document.getElementById('preview-title');
const settings={creator:{name:'CREATOR',y:-4200,h:1190},review:{name:'깽퐌커플 리뷰',y:-3440,h:730}};
function doc(){try{return preview.contentDocument}catch(_){return null}}
function activate(){
 const d=doc(); if(!d)return;
 const key=target.value,s=settings[key];
 d.querySelectorAll('.info-tab').forEach(b=>{const on=b.dataset.tab===key;b.classList.toggle('is-active',on);b.setAttribute('aria-selected',String(on))});
 d.querySelectorAll('.info-panel').forEach(p=>p.classList.toggle('is-active',p.dataset.panel===key));
 const panel=d.querySelector('.info-panel[data-panel="'+key+'"]');
 if(!panel)return;
 const crop=panel.querySelector('.inpock-crop'),frame=panel.querySelector('iframe');
 if(crop)crop.style.setProperty('height',s.h+'px','important');
 if(frame)frame.style.setProperty('--y',s.y+'px');
 const tabs=d.querySelector('.info-tabs');
 if(tabs)tabs.scrollIntoView({block:'start'});
 title.textContent=s.name+' · 실제 INFO 미리보기';
 value.textContent=s.name+': Y '+s.y+' / H '+s.h+'  →  실제 reviews.html DOM에 직접 적용해 미리보는 값입니다.';
 preview.style.height=Math.max(900,s.h+170)+'px';
}
function loadInputs(){const s=settings[target.value];y.value=s.y;h.value=s.h;activate()}
function apply(){const s=settings[target.value];s.y=Number(y.value)||0;s.h=Math.max(100,Number(h.value)||100);activate()}
target.addEventListener('change',loadInputs);[y,h].forEach(el=>el.addEventListener('input',apply));preview.addEventListener('load',()=>setTimeout(activate,250));loadInputs();
</script></body></html>
