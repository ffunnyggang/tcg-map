name: AOS final QA without build v2

on:
  push:
    branches:
      - qa/aos-web-sync-20261019
    paths:
      - .github/workflows/aos-qa-final-validate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aos-final-qa-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/aos-web-sync-20261019
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Harden scoped WebView bridges
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/components/FunyWebView.tsx')
          s=p.read_text(encoding='utf-8')

          old="""        var anchor=target.closest('a[href]');
"""
          new="""        var marketBack=target.closest('#marketDetailBack');
        var appContext=window.__FUNY_APP_CONTEXT||{};
        if(marketBack&&/\\/shops\\.html$/i.test(location.pathname)&&appContext.surface==='page'){
          event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
          earlyPost({type:'NATIVE_BACK'});
          return false;
        }
        var anchor=target.closest('a[href]');
"""
          if old in s:
            s=s.replace(old,new,1)
          elif "target.closest('#marketDetailBack')" not in s:
            raise SystemExit('market detail back anchor not found')

          old="""        var href=node.href||node.getAttribute('href')||'',fileName=node.getAttribute('download')||('FUNY-PIN-'+Date.now()+'.jpg');if(!href)return;
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
"""
          new="""        var href=node.href||node.getAttribute('href')||'',fileName=node.getAttribute('download')||('FUNY-PIN-'+Date.now()+'.jpg');if(!href)return;
        var imageDownload=/\\.(?:png|jpe?g|webp)$/i.test(fileName)||/^data:image\\//i.test(href);if(!imageDownload)return;
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
"""
          if old in s:
            s=s.replace(old,new,1)
          elif 'var imageDownload=' not in s:
            raise SystemExit('download bridge anchor not found')

          old="""  const isTalkPost=(()=>{try{const u=new URL(currentTarget);return /\\/talk\\.html$/.test(u.pathname.toLowerCase())&&/^#\\/post\\//.test(u.hash)}catch{return false}})();
"""
          new="""  const isTalkPost=(()=>{try{const u=new URL(currentTarget);return /\\/talk\\.html$/.test(u.pathname.toLowerCase())&&/^#\\/post\\//.test(u.hash)}catch{return false}})();
  const isMarketDetail=(()=>{try{const u=new URL(currentTarget);return /\\/shops\\.html$/.test(u.pathname.toLowerCase())&&/^#market\\//.test(u.hash)}catch{return false}})();
"""
          if old in s:
            s=s.replace(old,new,1)
          elif 'const isMarketDetail=' not in s:
            raise SystemExit('market detail state anchor not found')

          old="""    {showBackHeader?<FunyHeader title={backOnlyHeader?'':pageTitleFromUrl(currentTarget,backTitle||title)}"""
          new="""    {showBackHeader&&!isMarketDetail?<FunyHeader title={backOnlyHeader?'':pageTitleFromUrl(currentTarget,backTitle||title)}"""
          if old in s:
            s=s.replace(old,new,1)
          elif 'showBackHeader&&!isMarketDetail?' not in s:
            raise SystemExit('native header guard anchor not found')

          old="""if(data?.type==='NATIVE_BACK'){setWebOverlayOpen(false);router.back();return;}"""
          new="""if(data?.type==='NATIVE_BACK'){setWebOverlayOpen(false);if(router.canGoBack())router.back();else router.replace('/account');return;}"""
          if old in s:
            s=s.replace(old,new,1)
          elif "if(router.canGoBack())router.back();else router.replace('/account')" not in s:
            raise SystemExit('native back fallback anchor not found')

          required=["target.closest('#marketDetailBack')",'var imageDownload=','const isMarketDetail=','showBackHeader&&!isMarketDetail?',"router.replace('/account')"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('hardening markers missing: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')
          PY

      - name: Run final Android QA without AAB
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: bash mobile/scripts/qa-aos-ci.sh

      - name: Upload non-build QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-final-non-build-qa-v2-${{ github.run_number }}
          path: |
            /tmp/AOS_FINAL_QA_RESULT.md
            /tmp/funy-expo-config.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated bridge hardening
        if: success()
        run: |
          git config user.name "FUNY PIN QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/components/FunyWebView.tsx
          if git diff --cached --quiet; then
            echo "No bridge hardening changes to commit."
            exit 0
          fi
          git commit -m "qa(android): harden scoped WebView bridges"
          git fetch origin qa/aos-web-sync-20261019
          git rebase origin/qa/aos-web-sync-20261019
          git push origin HEAD:qa/aos-web-sync-20261019
