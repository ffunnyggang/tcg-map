name: Tune calendar D-day orange once

on:
  push:
    paths:
      - '.github/workflows/tune-calendar-dday-orange-once.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune D-day chip color and cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('map-calendar-v1.js')
          s = p.read_text()
          old = 'background:linear-gradient(135deg,#20B8A8 0%,#119C90 58%,#087C74 100%);'
          new = 'background:linear-gradient(135deg,#D89552 0%,#C47B39 58%,#A95F27 100%);'
          if old not in s:
              raise SystemExit('current D-day color not found')
          s = s.replace(old, new, 1)
          s = s.replace('box-shadow:0 2px 6px rgba(6,115,107,.22);', 'box-shadow:0 2px 6px rgba(129,73,29,.18);', 1)
          p.write_text(s)

          h = Path('shops.html')
          t = h.read_text()
          t = t.replace('map-calendar-v1.js?v=20260929-1621', 'map-calendar-v1.js?v=20260929-1624', 1)
          t = t.replace("var v='20260929-1621'", "var v='20260929-1624'", 1)
          h.write_text(t)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-calendar-v1.js shops.html
          git diff --cached --quiet || git commit -m "Tune calendar D-day chip to muted orange [skip ci]"
          git push
