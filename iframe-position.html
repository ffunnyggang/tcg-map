<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN INFO iframe 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#eceaf0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;color:#24212a}.tools{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);border-bottom:1px solid #ddd8e2;padding:10px}.tools h1{font-size:15px;margin:0 0 8px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}button,input{height:34px;border:1px solid #dcd6e2;border-radius:9px;background:#fff;padding:0 9px;font-size:12px}button.active{background:#272331;color:#fff;border-color:#272331}.val{font-size:12px;font-weight:800}.note{font-size:10.5px;color:#7e7884;margin:7px 0 0}.preview{width:min(calc(100% - 28px),420px);height:calc(100vh - 154px);min-height:520px;margin:0 auto;background:#fff}.preview iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><div class="tools"><h1>FUNY PIN INFO iframe 좌표 설정</h1><div class="row" id="regions"></div><div class="row"><b>Y</b><button data-y="-10">-10</button><button data-y="-1">-1</button><span class="val" id="yv"></span><button data-y="1">+1</button><button data-y="10">+10</button><input id="yi" type="number" style="width:78px"><b>높이</b><button data-h="-10">-10</button><button data-h="-1">-1</button><span class="val" id="hv"></span><button data-h="1">+1</button><button data-h="10">+10</button><input id="hi" type="number" min="100" style="width:78px"><button id="copy">현재값 복사</button><button id="copyAll">전체값 복사</button></div><p class="note">아래는 실제 INFO 화면입니다. 빨간 라인이 각 iframe 영역의 시작/끝이며 조정값이 바로 반영됩니다.</p></div><div class="preview"><iframe id="site" src="reviews.html?iframe-tool=1"></iframe></div><script>(()=>{const data={information:{label:"💡 정보",y:-2225,h:965,sel:'.info-panel[data-panel="information"] .inpock-crop'},review:{label:"📝 리뷰",y:-3200,h:900,sel:'.info-panel[data-panel="review"] .inpock-crop'}};let region="information";const site=document.getElementById("site"),regions=document.getElementById("regions"),yv=document.getElementById("yv"),hv=document.getElementById("hv"),yi=document.getElementById("yi"),hi=document.getElementById("hi");function target(){try{return site.contentDocument.querySelector(data[region].sel)}catch(e){return null}}function panel(){try{return site.contentDocument.querySelector('.info-panel[data-panel="'+region+'"]')}catch(e){return null}}function apply(){const d=data[region],el=target(),p=panel();try{site.contentDocument.querySelectorAll('.info-panel').forEach(x=>x.classList.remove('is-active'));if(p)p.classList.add('is-active')}catch(e){}if(el){el.style.setProperty("height",d.h+"px","important");const fr=el.querySelector("iframe");if(fr){fr.style.setProperty("--y",d.y+"px","important");fr.style.setProperty("transform","translateY("+d.y+"px)","important")}el.scrollIntoView({block:"center"})}yv.textContent=d.y+"px";hv.textContent=d.h+"px";yi.value=d.y;hi.value=d.h;render()}function render(){regions.innerHTML="";Object.entries(data).forEach(([k,d])=>{const b=document.createElement("button");b.textContent=d.label;b.className=k===region?"active":"";b.onclick=()=>{region=k;apply()};regions.appendChild(b)})}document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{data[region].y+=Number(b.dataset.y);apply()});document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{data[region].h=Math.max(100,data[region].h+Number(b.dataset.h));apply()});yi.onchange=()=>{data[region].y=Number(yi.value)||0;apply()};hi.onchange=()=>{data[region].h=Math.max(100,Number(hi.value)||100);apply()};async function cp(t,b){try{await navigator.clipboard.writeText(t);const x=b.textContent;b.textContent="복사 완료";setTimeout(()=>b.textContent=x,900)}catch(e){prompt("복사하세요",t)}}function line(d){return d.label.replace(/^\S+\s/,"")+" Y 좌표: "+d.y+"px / 노출 높이: "+d.h+"px"}copy.onclick=()=>cp(line(data[region]),copy);copyAll.onclick=()=>cp(Object.values(data).map(line).join("\n"),copyAll);site.onload=()=>setTimeout(apply,250);render()})();</script></body></html>
