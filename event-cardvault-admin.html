<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FUNY PIN · CARDVAULT EVENT ADMIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#1f1c24;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.page{width:min(100%,520px);min-height:100vh;margin:0 auto;background:#fff}.head{padding:18px}.back{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:flex-start;border:0;background:none;color:#29262e;padding:0;font-size:30px;line-height:1}.hero{padding:8px 18px 22px}.eyebrow{color:#8062d8;font-size:10px;font-weight:900;letter-spacing:.15em}.hero h1{margin:8px 0 5px;font-size:25px;line-height:1.28;letter-spacing:-.04em}.hero p{margin:0;color:#85818b;font-size:12px;line-height:1.55}.gate{padding:20px 18px;border-top:8px solid #f5f4f7}.box{padding:18px;border:1px solid #ebe7ef;border-radius:16px}.label{display:block;margin-bottom:8px;font-size:12px;font-weight:850}.input{width:100%;height:48px;border:1px solid #ded9e2;border-radius:12px;padding:0 13px;font:inherit}.btn{width:100%;height:50px;margin-top:10px;border:0;border-radius:13px;background:#8062d8;color:#fff;font-weight:850}.error{min-height:16px;margin-top:8px;color:#d35454;font-size:11px;text-align:center}.admin{display:none;border-top:8px solid #f5f4f7;padding:18px}.admin.show{display:block}.toolbar{display:flex;gap:8px}.toolbar .input{flex:1}.smallbtn{height:46px;padding:0 14px;border:0;border-radius:12px;background:#29262e;color:#fff;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{padding:15px;border-radius:14px;background:#f8f6fb}.stat b{display:block;font-size:24px}.stat span{color:#8a8490;font-size:11px}.list{border-top:1px solid #eeeaf1}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 2px;border-bottom:1px solid #eeeaf1}.id{font-size:13px;font-weight:800;word-break:break-all}.time{margin-top:4px;color:#99929e;font-size:10px}.badge{align-self:start;padding:5px 8px;border-radius:999px;background:#f0eaff;color:#7154c5;font-size:9px;font-weight:900}.empty{padding:28px 0;text-align:center;color:#9b95a0;font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;height:44px;border:1px solid #e3deea;border-radius:12px;background:#fff;font-weight:800}.note{margin-top:14px;color:#9b95a0;font-size:10px;line-height:1.55}
</style>
</head>
<body>
<main class="page">
<header class="head"><button class="back" type="button" onclick="history.length>1?history.back():location.href='./'" aria-label="뒤로가기">‹</button></header>
<section class="hero"><div class="eyebrow">FUNY PIN · EVENT ADMIN</div><h1>카드볼트 이벤트<br>응모자 관리</h1><p>응모 현황과 인스타그램 아이디를 확인할 수 있어요</p></section>
<section class="gate" id="gate">
<div class="box">
<label class="label" for="adminCode">관리자 코드</label>
<input class="input" id="adminCode" type="password" inputmode="numeric" maxlength="6" placeholder="6자리 관리자 코드">
<button class="btn" id="loginBtn" type="button">관리자 페이지 열기</button>
<div class="error" id="loginError"></div>
</div>
</section>
<section class="admin" id="admin">
<div class="toolbar"><input class="input" id="search" type="search" placeholder="인스타그램 아이디 검색"><button class="smallbtn" id="refreshBtn" type="button">새로고침</button></div>
<div class="stats"><div class="stat"><b id="totalCount">0</b><span>전체 응모</span></div><div class="stat"><b id="uniqueCount">0</b><span>고유 인스타 ID</span></div></div>
<div class="actions"><button id="csvBtn" type="button">CSV 내보내기</button><button id="logoutBtn" type="button">잠금</button></div>
<div class="list" id="list"><div class="empty">응모 데이터를 불러오는 중...</div></div>
<p class="note">응모자 정보는 이벤트 운영 목적으로만 확인해주세요</p>
</section>
</main>
<script>
const SB_URL='https://wdttzpbmqavaqfcbaywj.supabase.co';
const SB_KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
const EVENT_STORE_ID='EV-CARDVAULT-2026';
const ADMIN_HASH='aaa5a259df8c52d25307b6dfe4bc1156393b3459c47bfe2f2286d808e699fdf6';
const HEADERS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,Accept:'application/json'};
let rows=[];
const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(b=>b.toString(16).padStart(2,'0')).join('');
function fmt(v){try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch(_){return v||''}}
async function load(){
 const list=document.getElementById('list');list.innerHTML='<div class="empty">응모 데이터를 불러오는 중...</div>';
 const q=new URLSearchParams({select:'id,content,created_at,client_id,status',shop_id:'eq.'+EVENT_STORE_ID,status:'eq.EVENT_ENTRY',order:'created_at.desc'});
 const r=await fetch(SB_URL+'/rest/v1/live_reports?'+q.toString(),{headers:HEADERS,cache:'no-store'});
 if(!r.ok){list.innerHTML='<div class="empty">데이터를 불러오지 못했습니다</div>';return}
 rows=await r.json();render();
}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const filtered=rows.filter(x=>(x.content||'').toLowerCase().includes(q));
 const unique=new Set(rows.map(x=>(x.content||'').toLowerCase()).filter(Boolean));
 document.getElementById('totalCount').textContent=rows.length;
 document.getElementById('uniqueCount').textContent=unique.size;
 const list=document.getElementById('list');
 if(!filtered.length){list.innerHTML='<div class="empty">표시할 응모자가 없습니다</div>';return}
 const seen=new Set();
 list.innerHTML=filtered.map(x=>{const key=(x.content||'').toLowerCase();const dup=seen.has(key);seen.add(key);return '<div class="row"><div><div class="id">@'+escapeHtml(x.content||'')+'</div><div class="time">'+fmt(x.created_at)+'</div></div><div class="badge">'+(dup?'중복':'응모')+'</div></div>'}).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('loginBtn').onclick=async()=>{
 const err=document.getElementById('loginError');err.textContent='';
 const h=await sha(document.getElementById('adminCode').value.trim());
 if(h!==ADMIN_HASH){err.textContent='관리자 코드를 확인해주세요';return}
 sessionStorage.setItem('funypin_event_admin','1');
 document.getElementById('gate').style.display='none';document.getElementById('admin').classList.add('show');load();
};
document.getElementById('adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});
document.getElementById('search').addEventListener('input',render);
document.getElementById('refreshBtn').onclick=load;
document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('funypin_event_admin');location.reload()};
document.getElementById('csvBtn').onclick=()=>{
 const csv=['instagram_id,entered_at'].concat(rows.map(x=>'"'+String(x.content||'').replaceAll('"','""')+'","'+(x.created_at||'')+'"')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cardvault-event-entries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
};
if(sessionStorage.getItem('funypin_event_admin')==='1'){document.getElementById('gate').style.display='none';document.getElementById('admin').classList.add('show');load()}
</script>
</body>
</html>
