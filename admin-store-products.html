<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/admin.html?tab=storeproducts"><script>location.replace("/admin.html?tab=storeproducts"+location.hash)</script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상품 관리 | FUNY PIN 관리자</title><link rel="stylesheet" href="/funy-ui-guide.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#24212b;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif}.wrap{max-width:1300px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:23px}.top a{font-size:13px;color:#6749bd;text-decoration:none}.panel{background:#fff;border:1px solid #eae6ee;border-radius:15px;padding:19px;margin-bottom:14px}.muted{font-size:12px;color:#8a8290}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#faf9fc;padding:14px;border-radius:12px}.metric strong{font-size:24px;display:block;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.toolbar input,.toolbar select{height:42px;border:1px solid #ded9e5;border-radius:10px;padding:0 12px;background:white;font-size:13px}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:125px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #f0edf2;font-size:12px}th{color:#857d8c;font-size:11px}td.product{font-weight:700}.thumb{width:49px;height:57px;object-fit:contain;background:#faf9fb;border-radius:7px}.pill{font-size:11px;padding:4px 7px;border-radius:8px;background:#f0ecf7;color:#6b51ae}.empty-thumb{width:49px;height:57px;display:grid;place-items:center;border-radius:7px;background:#f6f5f7;color:#999;font-size:10px}.amount{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}.footnote{font-size:12px;color:#8a8290;line-height:1.7}.hidden{display:none!important}@media(max-width:640px){.wrap{padding:12px}.panel{padding:12px}.top h1{font-size:19px}.metrics{gap:6px}.metric{padding:10px}.metric strong{font-size:19px}}</style></head><body><main class="wrap"><header class="top"><h1>STORE · 상품 관리</h1><a href="admin.html">관리자 메뉴로 돌아가기 ›</a></header><section class="panel" id="auth">관리자 권한을 확인하고 있습니다…</section><div id="app" class="hidden"><section class="panel"><div class="metrics"><div class="metric"><span class="muted">전체 등록 상품</span><strong id="total">—</strong></div><div class="metric"><span class="muted">포켓몬 BOX</span><strong id="pokemon">—</strong></div><div class="metric"><span class="muted">원피스 BOX</span><strong id="onepiece">—</strong></div></div><div class="toolbar"><input id="search" type="search" placeholder="상품명 또는 상품 ID 검색" aria-label="상품 검색"><select id="type"><option value="">전체 TCG</option><option value="pokemon">포켓몬</option><option value="one_piece">원피스</option></select><select id="image"><option value="">전체 이미지 상태</option><option value="yes">이미지 등록</option><option value="no">이미지 없음</option></select><select id="price"><option value="">전체 가격 상태</option><option value="yes">가격 등록</option><option value="no">가격 없음</option></select></div><div class="muted" id="count"></div><div class="scroll"><table><thead><tr><th>이미지</th><th>상품명 / ID</th><th>TCG</th><th>언어</th><th>발매일</th><th>최저 가격표</th><th>이미지 상태</th></tr></thead><tbody id="rows"></tbody></table></div><p class="footnote">최저가는 수집된 판매처 가격표 기준이며 거래 체결가가 아닙니다. 발매일이나 이미지가 없는 상품은 미등록 상태로 표시합니다.</p></section><div style="text-align:right"><a href="admin-box-prices.html" style="color:#6749bd;font-weight:750;font-size:13px">BOX 가격표 관리 ›</a></div></div></main><script>
const BASE='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq',IMAGE=BASE+'/storage/v1/object/public/box-products/';let all=[],sources=[];
const $=x=>document.getElementById(x);
async function guard(){const jwt=sessionStorage.getItem('funypin_admin_token');if(!jwt)throw Error('관리자 로그인 후 이용할 수 있습니다.');const r=await fetch(BASE+'/rest/v1/rpc/is_funypin_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:'{}'});if(!r.ok||await r.json()!==true)throw Error('관리자 권한 확인에 실패했습니다.');$('auth').classList.add('hidden');$('app').classList.remove('hidden')}
function render(){const q=$('search').value.trim().toLowerCase(),type=$('type').value,image=$('image').value,price=$('price').value;let filtered=all.filter(p=>{const offers=sources.flatMap(s=>typeof s.quotes?.[p.id]==='number'?[s.quotes[p.id]]:[]);p.lowest=offers.length?Math.min(...offers):null;return (!type||p.tcg_type===type)&&(!image||(image==='yes')===!!p.image_path)&&(!price||(price==='yes')===(p.lowest!==null))&&(!q||(p.name+' '+p.id).toLowerCase().includes(q))});$('count').textContent=filtered.length+'개 상품 표시';$('rows').replaceChildren();for(const p of filtered){const tr=document.createElement('tr'),imgTd=document.createElement('td');if(p.image_path){const img=document.createElement('img');img.className='thumb';img.src=IMAGE+encodeURIComponent(p.image_path);img.loading='lazy';img.alt='';imgTd.append(img)}else{const box=document.createElement('div');box.className='empty-thumb';box.textContent='미등록';imgTd.append(box)}const td=(value,cls)=>{const d=document.createElement('td');d.textContent=value;d.className=cls||'';return d};const name=td(p.name,'product');const sub=document.createElement('div');sub.className='muted';sub.textContent=p.id;name.append(sub);tr.append(imgTd,name,td(p.tcg_type==='one_piece'?'원피스':'포켓몬'),td(p.language||'—'),td(p.release_date||'미확인'),td(p.lowest===null?'가격 없음':'최저 '+p.lowest.toLocaleString('ko-KR')+'원','amount'),td(p.image_path?'등록':'미등록'));$('rows').append(tr)}}
async function load(){const [catalog,prices]=await Promise.all([fetch('data/box-products-v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('상품 목록 조회 실패');return r.json()}),fetch('data/box-price-candidates-v1.json',{cache:'no-store'}).then(r=>r.json())]);all=catalog.products.map(p=>({...p,tcg_type:p.tcg_type||'pokemon'}));sources=prices.sources||[];try{const r=await fetch(BASE+'/functions/v1/box-price-public',{cache:'no-store'});if(r.ok){const data=await r.json();for(const v of data.rows||[]){for(const src of sources){if(src.source===v.seller)delete src.quotes[v.product_id]}sources.push({source:v.seller,quotes:{[v.product_id]:v.price_krw},price_effective_date:v.price_effective_date})}}}catch(_){}$('total').textContent=all.length;$('pokemon').textContent=all.filter(p=>p.tcg_type==='pokemon').length;$('onepiece').textContent=all.filter(p=>p.tcg_type==='one_piece').length;render()}
for(const id of ['search','type','image','price'])$(id).addEventListener(id==='search'?'input':'change',render);
guard().then(load).catch(e=>{$('auth').textContent=e.message;$('auth').classList.remove('hidden')});
</script></body></html>
