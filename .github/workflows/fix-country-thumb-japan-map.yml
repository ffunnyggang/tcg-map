name: Fix country flag thumbnail and Japan map
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-country-thumb-japan-map.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested fixes
        shell: python
        run: |
          import base64,re,pathlib
          root=pathlib.Path('.')
          png=''
          (root/'images/ui').mkdir(parents=True,exist_ok=True)
          (root/'images/ui/korea-flag-circle.png').write_bytes(base64.b64decode(png))
          p=root/'map-country-v1.js'; s=p.read_text()
          s=re.sub(r"function flagSvg\(code\)\{.*?\}\n  function updateCountryVisual", "function flagSvg(code){if(code==='KR')return '<img src=\"images/ui/korea-flag-circle.png\" alt=\"\" width=\"22\" height=\"22\">';return '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"11.2\" fill=\"#fff\" stroke=\"#d8d8dc\" stroke-width=\".8\"/><circle cx=\"12\" cy=\"12\" r=\"4.55\" fill=\"#bc002d\"/></svg>'}\n  function updateCountryVisual", s, count=1, flags=re.S)
          s=s.replace("function japanGeocodeAddress(s){let a=String(s.address||'').trim();if(!/japan|日本/i.test(a))a='Japan, Tokyo, '+a.replace(/^도쿄\\s*/,'');return a}","function japanGeocodeAddress(s){let a=String(s.address||'').trim().replace(/^도쿄\\s*/,'');const n=String(s.en||s.name||'').trim();return [n,a,'Tokyo','Japan'].filter(Boolean).join(', ')}")
          old="if(hasCoord(s)){const p={lat:Number(s.lat),lng:Number(s.lng)};s._coord=p;addGoogleMarker(s,p);bounds.extend(p);done();return}if(hasCachedCoord(s)){addGoogleMarker(s,s._coord);bounds.extend(s._coord);done();return}geocoder.geocode({address:japanGeocodeAddress(s),region:'JP',componentRestrictions:{country:'JP'}},(results,status)=>{if(status==='OK'&&results&&results[0]){const loc=results[0].geometry.location,p={lat:loc.lat(),lng:loc.lng()};s._coord=p;addGoogleMarker(s,p);bounds.extend(p)}else{console.warn('[FUNY PIN] Japan geocode failed:',s.id,status,japanGeocodeAddress(s))}done()})"
          new="geocoder.geocode({address:japanGeocodeAddress(s),region:'JP',componentRestrictions:{country:'JP'}},(results,status)=>{if(status==='OK'&&results&&results[0]){const loc=results[0].geometry.location,p={lat:loc.lat(),lng:loc.lng()};const inTokyo=p.lat>35.45&&p.lat<35.90&&p.lng>139.45&&p.lng<140.05;if(inTokyo){s._coord=p;addGoogleMarker(s,p);bounds.extend(p)}else console.warn('[FUNY PIN] Japan geocode outside Tokyo:',s.id,p)}else{console.warn('[FUNY PIN] Japan geocode failed:',s.id,status,japanGeocodeAddress(s))}done()})"
          if old not in s: raise SystemExit('Japan marker block not found')
          s=s.replace(old,new)
          p.write_text(s)
          p=root/'map-country-v1.css'; s=p.read_text()
          s=re.sub(r"\.map-filter-bar \.country-filter-flag\{.*?\}", ".map-filter-bar .country-filter-flag{position:absolute;left:10px;top:50%;z-index:2;width:22px;height:22px;transform:translateY(-50%);border-radius:50%;overflow:hidden;pointer-events:none;box-shadow:0 1px 3px rgba(35,30,43,.10);background:#fff}", s, count=1)
          s=s.replace('.map-filter-bar .country-filter-flag svg{display:block;width:100%;height:100%}', '.map-filter-bar .country-filter-flag svg,.map-filter-bar .country-filter-flag img{display:block;width:100%;height:100%;object-fit:cover}')
          s=s.replace('padding:0 32px 0 38px','padding:0 32px 0 39px')
          s=s.replace('.shop-thumb.is-fallback{background:linear-gradient(145deg,#f7f4fc,#eee8f8)!important}.shop-thumb-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#77727c}.shop-thumb-fallback svg{width:27px;height:37px;overflow:visible}.shop-thumb-fallback .fallback-pin-body{fill:#817d86}.shop-thumb-fallback .fallback-pin-line{fill:none;stroke:#f8f7f9;stroke-width:4;stroke-linecap:round}.shop-thumb-fallback .fallback-pin-center{fill:#f8f7f9}.shop-thumb-fallback b{font-size:8px;line-height:1;letter-spacing:.08em;font-weight:850;color:#77727c}', '.shop-thumb.is-fallback{background:linear-gradient(145deg,#f7f4fc,#eee8f8)!important}.shop-thumb-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8d8992;opacity:.82}.shop-thumb-fallback svg{width:23px;height:31px;overflow:visible}.shop-thumb-fallback .fallback-pin-body{fill:#99959e}.shop-thumb-fallback .fallback-pin-line{fill:none;stroke:#faf9fb;stroke-width:4;stroke-linecap:round}.shop-thumb-fallback .fallback-pin-center{fill:#faf9fb}.shop-thumb-fallback b{font-size:7px;line-height:1;letter-spacing:.07em;font-weight:800;color:#8d8992}')
          s=s.replace('.map-filter-bar .country-filter-flag{left:10px;width:20px;height:14px}', '.map-filter-bar .country-filter-flag{left:9px;width:21px;height:21px}')
          s=s.replace('padding-left:36px','padding-left:37px')
          p.write_text(s)
          p=root/'shops.html'; s=p.read_text(); s=re.sub(r'map-country-v1\.css\?v=[^\"<]+','map-country-v1.css?v=20260915-1718',s); s=re.sub(r'map-country-v1\.js\?v=[^\"<]+','map-country-v1.js?v=20260915-1718',s); p.write_text(s)
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-country-thumb-japan-map.yml
      - name: Commit changes
        run: |
          git config user.name 'ffunnyggang'
          git config user.email 'ffunnyggang@gmail.com'
          git add -A
          git commit -m 'Refine country flag fallback thumbnail and Japan pins'
          git push