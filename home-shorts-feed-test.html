*{box-sizing:border-box}body{margin:0;background:#f8f7fb;color:#27232d;font:14px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:440px;margin:auto;min-height:100dvh;background:white;padding:22px 0 68px}.pad{padding:0 16px}h1{font-size:19px;margin:0 0 6px}p{margin:5px 0 14px}.muted{color:#857e8a;font-size:12px}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 16px 12px}.head h2{font-size:16px;margin:0}.head a{font-size:12px;color:#8870b5}.rail{display:flex;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:9px;padding:0 16px 10px}.rail::-webkit-scrollbar{display:none}.videoCard{flex:0 0 calc((100% - 32px - 18px)/2.5);min-width:0;scroll-snap-align:start;cursor:pointer}.frame{width:100%;aspect-ratio:9/16;border-radius:11px;overflow:hidden;background:#18131f;position:relative}.frame img{width:100%;height:100%;object-fit:cover}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.frame .cover{position:absolute;inset:0;display:grid;place-items:center;background:#0004;color:white;font-size:22px;pointer-events:none}.name{font-size:11px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel{margin:20px 16px;padding:15px;border-radius:14px;border:1px solid #eee7f3}.panel h3{font-size:13px;margin:0 0 9px}.row{display:flex;gap:6px}.row input{flex:1;min-width:0;padding:10px;border:1px solid #dcd4e7;border-radius:8px}button{background:#7759be;border:0;color:white;padding:9px 12px;border-radius:8px;font-size:12px;cursor:pointer}.switch{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.switch button{background:#f0ebf6;color:#705d91}.switch button.on{background:#7759be;color:white}.status{font-size:11px;color:#655c73;margin:10px 0}.detail{display:none;position:fixed;inset:0;background:white;z-index:9}.detail.on{display:flex;flex-direction:column}.detail .top{padding:13px 16px;display:flex;align-items:center;justify-content:space-betwe </style></head><body><main class="wrap"><header class="pad"><h1>FUNY PIN HOME Shorts 테스트</h1><p class="muted">실험용 화면 · 운영 HOME/어드민 미수정</p></header><div class="head"><h2>🎬 60초로 보는 퍼니핀</h2><a href="#admin">영상 관리 ›</a></div><section class="rail" id="rail" aria-label="퍼니핀 유튜브 쇼츠 목록"></section><div class="pad"><p class="status" id="status" role="status">미리보기 재생 조건을 확인하고 있습니다.</p><div class="switch"><button id="auto" class="on">무음 자동재생 실험</button><button id="thumb">정적 썸네일 비교</button></div><p class="note">카드 영역은 화면 너비 기준 2개 + 절반 노출을 목표로 합니다. 사용자 선택 시 이 테스트 페이지 안의 상세 화면으로 이동하여 소리를 포함한 재생을 시도합니다.</p></div><section class="panel" id="admin"><h3>테스트 영상 관리</h3><p class="muted">URL 저장은 이 브라우저의 localStorage에만 적용됩니다. 운영 DB·어드민과 연동하지 않습니다.</p><div class="row"><input id="url" type="url" placeholder="YouTube Shorts URL 입력"><button id="add">저장</button></div><div class="row" style="margin-top:8px"><button id="reset">초기 5개 복원</button></div><p class="status" id="saveStatus"></p><div id="list" class="muted"></div></section></main><div id="detail" class="detail"><div class="top"><strong>퍼니핀 영상 보기</strong><button id="back">닫기 ✕</button></div><div class="viewer"><iframe id="detailPlayer" title="YouTube Shorts 영상 재생" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="details"><a id="original" target="_blank" rel="noopener noreferrer">YouTube 원본 보기</a></div></div>
<script>
(()=>{'use strict';const defaults=['urCihNoqAfs','q5ryDsPZxUk','bXh20c5e6wU','urCihNoqAfs','KJKjIPAAK34'],key='funypin:shorts-home-poc';let ids;try{ids=JSON.parse(localStorage.getItem(key)||'null')||defaults.slice()}catch{ids=defaults.slice()}let mode='auto',observer=null,active=null;
const $=id=>document.getElementById(id);function extract(url){try{const u=new URL(url);if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname))return null;let id=u.hostname==='youtu.be'?u.pathname.slice(1):u.pathname.match(/^\/(shorts|embed)\/([\w-]{11})/)?.[2]||u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}
function card(id,i){const item=document.createElement('article');item.className='videoCard';item.tabIndex=0;item.setAttribute('role','button');item.setAttribute('aria-label','영상 '+(i+1)+' 재생');item.dataset.id=id;const frame=document.createElement('div');frame.className='frame';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';img.alt='영상 '+(i+1)+' 썸네일';img.loading='lazy';const cover=document.createElement('div');cover.className='cover';cover.textContent='▶';frame.append(img,cover);const name=document.createElement('div');name.className='name';name.textContent='퍼니핀 영상 '+(i+1);item.append(frame,name);item.addEventListener('click',()=>openVideo(id));item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openVideo(id)}});return item}
function stop(){document.querySelectorAll('.frame iframe').forEach(x=>x.remove());active=null}
function preview(item){if(mode!=='auto'||!item||!item.isConnected)return;const frame=item.querySelector('.frame'),id=item.dataset.id;if(active===item)return;stop();const iframe=document.createElement('iframe');iframe.title='무음 미리보기';iframe.setAttribute('allow','autoplay; encrypted-media; picture-in-picture');iframe.setAttribute('tabindex','-1');iframe.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&mute=1&playsinline=1&loop=1&playlist='+id+'&controls=0&rel=0';frame.appendChild(iframe);active=item;$('status').textContent='영상 '+id+' 무음 자동재생 요청 중 · 실제 재생은 브라우저/YouTube 정책에 따라 제한될 수 있습니다.'}
function render(){stop();$('rail').replaceChildren(...ids.map(card));$('list').textContent=ids.map((id,i)=>(i+1)+'. '+id).join('   |   ');observer?.disconnect();observer=new IntersectionObserver(entries=>{if(mode!=='auto'||$('detail').classList.contains('on'))return;const showing=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>.75).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(showing.length)preview(showing[0].target);else if(active&&!document.querySelector('.videoCard:hover'))stop()},{root:$('rail'),threshold:[0,.75,1]});document.querySelectorAll('.videoCard').forEach(item=>observer.observe(item))}
function openVideo(id){stop();$('detail').classList.add('on');$('detailPlayer').src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0';$('original').href='https://www.youtube.com/shorts/'+id;history.replaceState(null,'','#watch='+id)}function close(){ $('detail').classList.remove('on');$('detailPlayer').removeAttribute('src');history.replaceState(null,'',location.pathname+location.search);if(mode==='auto')preview(document.querySelector('.videoCard'))}
$('back').onclick=close;$('auto').onclick=()=>{mode='auto';$('auto').classList.add('on');$('thumb').classList.remove('on');render()};$('thumb').onclick=()=>{mode='thumb';$('thumb').classList.add('on');$('auto').classList.remove('on');stop();$('status').textContent='정적 썸네일 모드 · 목록에서 iframe 재생하지 않음'};
$('add').onclick=()=>{const id=extract($('url').value.trim());if(!id){$('saveStatus').textContent='유효한 YouTube Shorts URL을 입력해주세요.';return}ids.push(id);localStorage.setItem(key,JSON.stringify(ids));$('saveStatus').textContent='테스트 피드에 영상이 추가됐습니다.';$('url').value='';render()};$('reset').onclick=()=>{ids=defaults.slice();localStorage.setItem(key,JSON.stringify(ids));render();$('saveStatus').textContent='요청하신 최초 5개(중복 포함)를 복원했습니다.'};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(mode==='auto'&&!$('detail').classList.contains('on'))preview(document.querySelector('.videoCard'))});render()})();
</script></body></html>
