<!doctype html>
<html lang="ko">
<head>

<title>한가위 카드볼트 방문 인증 이벤트 추첨</title>
<style>
*{box-sizing:border-box}:root{--ink:#27222d;--muted:#817987;--purple:#7353b7;--line:#ece7f0}body{margin:0;background:#f4f1f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;padding:38px 20px 52px;overflow:hidden}.event-kicker{margin-bottom:9px;font-size:12px;line-height:1.2;font-weight:900;letter-spacing:.055em;color:#7650c8}.event-title{font-size:27px;line-height:1.3;font-weight:900;letter-spacing:-.048em;color:#111}.event-title>div+div{margin-top:2px}.rule{margin-top:18px;padding:0;font-size:12.5px;line-height:1.72;color:#77707c;letter-spacing:-.018em}.stage{margin-top:22px}.slot{height:132px;border:1px solid #e8e0f1;border-radius:22px;background:radial-gradient(circle at 50% 0%,#fff 0%,#faf7ff 38%,#f4edff 100%);display:flex;align-items:center;justify-content:center;padding:18px;box-shadow:0 12px 32px rgba(82,54,120,.09),inset 0 1px 0 rgba(255,255,255,.9);position:relative;overflow:hidden}.slot:after{content:"✦";position:absolute;right:16px;top:13px;color:#a98ada;font-size:15px;opacity:.55}.slot:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.88),transparent);transform:translateX(-120%)}.slot.running:before{animation:shine 1.25s linear infinite}@keyframes shine{to{transform:translateX(120%)}}.slot-id{font-size:20px;font-weight:850;letter-spacing:-.035em;text-align:center;word-break:break-all;transition:opacity .12s ease,transform .12s ease}.slot.running .slot-id{font-size:27px;animation:pulse .28s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.58;transform:scale(.975)}to{opacity:1;transform:scale(1.02)}}.status{text-align:center;margin:13px 0 17px;min-height:21px;font-size:12.5px;font-weight:800;color:var(--purple);opacity:0;transition:opacity .2s ease}.status.show{opacity:1}#draw{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#312a38,#241f2a);color:#fff;padding:18px 16px;font-size:15px;font-weight:850;letter-spacing:-.02em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 10px 24px rgba(49,39,57,.17)}#draw:active{transform:scale(.985)}.results{display:none;margin-top:30px}.result-title{font-size:17px;font-weight:900;margin-bottom:12px}.winner{display:flex;align-items:center;gap:13px;padding:15px 14px;border:1px solid var(--line);border-radius:17px;margin:9px 0;background:#fff;opacity:0;transform:translateY(12px) scale(.98)}.winner.show{animation:reveal .5s cubic-bezier(.2,.8,.2,1) forwards}@keyframes reveal{to{opacity:1;transform:none}}.rank{width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:#2c2532;color:#fff;font-weight:900;font-size:12px}.winner[data-rank="1"]{border-color:#e5d5a7;background:#fffdf7}.winner[data-rank="1"] .rank{background:linear-gradient(135deg,#d6a62e,#f0c85a)}.winner[data-rank="2"] .rank{background:linear-gradient(135deg,#8d929c,#bcc0c8)}.winner[data-rank="3"] .rank{background:linear-gradient(135deg,#a66c43,#ca9167)}.winner-id{font-size:15px;font-weight:900;word-break:break-all}.prize{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45;font-weight:650}.final-note{display:none;margin-top:18px;padding:13px 14px;border-radius:13px;background:#faf8fc;border:1px solid #eee9f2;text-align:left;font-size:11.5px;line-height:1.65;color:#8e8593}.final-note:before{content:"※ ";font-weight:900;color:#7353b7}.confetti{position:fixed;pointer-events:none;width:7px;height:12px;border-radius:2px;z-index:10;animation:fall 1.15s ease-out forwards}@keyframes fall{0%{opacity:1;transform:translateY(-10px) rotate(0)}100%{opacity:0;transform:translateY(260px) rotate(420deg)}}@media(max-width:380px){.wrap{padding-left:17px;padding-right:17px}.event-title{font-size:25px}.rule{font-size:12px}.slot{height:124px}}
</style></head><body><div class="wrap"><div class="event-kicker">FUNY PIN × CARDVAULT</div><div class="event-title"><div>한가위 카드볼트</div><div>방문 인증 이벤트 🌕 🐰</div><div>당첨자 추첨</div></div><div class="rule">3등 → 2등 → 1등 순서로 당첨자를 무작위로 선정하고,<br>각 순위 추첨 시 이미 선정된 Instagram ID는 자동 제외됩니다</div><div class="stage"><div class="slot" id="slot"><div class="slot-id" id="slotId">당첨자를 추첨해 주세요 🎁</div></div><div class="status" id="status"></div><button id="draw" type="button">당첨자 추첨하기</button><div class="results" id="results"><div class="result-title">🎁 최종 추첨 결과</div><div id="winnerList"></div></div><div class="final-note" id="finalNote">당첨자의 깽퐌커플 · 카드볼트 Instagram 팔로우 여부를 확인하여 조건 미충족시 당첨이 취소될 수 있습니다</div></div></div><script>
const entries=[{"instagram_id":"hobby._.dragonite"},{"instagram_id":"dooooooon_12"},{"instagram_id":"sw_0x0"},{"instagram_id":"jihoo0814v"},{"instagram_id":"cardoppa777"},{"instagram_id":"rise1115"},{"instagram_id":"oraclethkim"},{"instagram_id":"excellent_yu_"},{"instagram_id":"sheep._.wish"},{"instagram_id":"jji_y_"},{"instagram_id":"bol2_00"},{"instagram_id":"_.tmdgks"},{"instagram_id":"to_.hugu0"},{"instagram_id":"kbo_data_lab"},{"instagram_id":"gyu_0813_"},{"instagram_id":"yongkkaard"},{"instagram_id":"oowgnaj_"},{"instagram_id":"odd_ogg"},{"instagram_id":"woo_rakburak"},{"instagram_id":"zxxmiin"}];
const draw=document.getElementById('draw'),slot=document.getElementById('slot'),slotId=document.getElementById('slotId'),status=document.getElementById('status'),results=document.getElementById('results'),winnerList=document.getElementById('winnerList'),finalNote=document.getElementById('finalNote');
function secureInt(max){if(window.crypto&&window.crypto.getRandomValues){const limit=Math.floor(0x100000000/max)*max,a=new Uint32Array(1);do{window.crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}const wait=ms=>new Promise(r=>setTimeout(r,ms));
function confetti(){const colors=['#7650c8','#ffad35','#ff6688','#54b7a8'];for(let i=0;i<22;i++){const x=document.createElement('i');x.className='confetti';x.style.left=(20+Math.random()*60)+'vw';x.style.top='20vh';x.style.background=colors[secureInt(colors.length)];x.style.animationDelay=(Math.random()*.22)+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}}
async function roll(pool,rank){status.textContent=`${rank}등 당첨자를 추첨 중입니다...`;status.classList.add('show');slot.classList.add('running');let delay=68;for(let i=0;i<30;i++){slotId.textContent='@'+pool[secureInt(pool.length)].instagram_id;await wait(delay);if(i>15)delay+=11;if(i>23)delay+=22}const idx=secureInt(pool.length),winner=pool[idx];slot.classList.remove('running');slotId.style.opacity='0';slotId.style.transform='scale(.92)';await wait(170);slotId.textContent='@'+winner.instagram_id;slotId.style.opacity='1';slotId.style.transform='scale(1.07)';await wait(230);slotId.style.transform='scale(1)';status.textContent=`🎉 ${rank}등 당첨자가 선정되었습니다`;confetti();await wait(950);return{winner,index:idx}}
const prizes={1:'포켓몬 퍼스트파트너 시리즈1 1BOX',2:'유미의 세포들 콜렉션 카드 1BOX',3:'캐치 티니핑 콜렉션 카드 1BOX'};
function addWinner(winner,rank){results.style.display='block';const el=document.createElement('div');el.className='winner';el.dataset.rank=rank;el.innerHTML=`<div class="rank">${rank}등</div><div><div class="winner-id">@${winner.instagram_id}</div><div class="prize">${prizes[rank]}</div></div>`;const existing=[...winnerList.querySelectorAll('.winner')],next=existing.find(node=>Number(node.dataset.rank)>rank);if(next)winnerList.insertBefore(el,next);else winnerList.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'))}
let drawing=false;async function startDraw(){if(drawing)return;drawing=true;draw.disabled=true;draw.style.display='none';status.textContent='3등 당첨자 추첨을 시작합니다';status.classList.add('show');await wait(650);let pool=entries.slice();for(const rank of [3,2,1]){if(rank!==3){slotId.textContent='잠시만 기다려 주세요';status.textContent=`잠시 후 ${rank}등 당첨자를 추첨합니다`;await wait(1000)}const picked=await roll(pool,rank);addWinner(picked.winner,rank);pool.splice(picked.index,1);if(rank!==1)await wait(850)}slotId.textContent='추첨 완료 🎉';status.textContent='모든 당첨자 추첨이 완료되었습니다';finalNote.style.display='block'}
draw.addEventListener('click',startDraw,{passive:true});draw.addEventListener('touchend',function(e){e.preventDefault();startDraw()},{passive:false});
</script></body></html>
