<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FUNY PIN | 회원 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f7;color:#28232e;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}.wrap{max-width:1200px;margin:auto;min-height:100dvh;background:#fff}.head{height:64px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #ece8ef;position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);z-index:5}.head b{font-size:18px}.head span{margin-left:8px;color:#9a929e;font-size:10px}.head button{margin-left:auto;border:1px solid #e4dfe8;background:#fff;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:800}.content{padding:20px}.login{max-width:420px;margin:90px auto;padding:24px;border:1px solid #e7e2ea;border-radius:18px}.login h1{font-size:21px;margin:0 0 6px}.sub{font-size:11px;color:#918996;line-height:1.5;margin-bottom:16px}.input{width:100%;height:44px;border:1px solid #e3dee7;border-radius:10px;padding:0 12px;margin-bottom:9px;outline:none}.btn{width:100%;height:44px;border:0;border-radius:10px;background:#28232e;color:#fff;font-weight:850}.error{margin-top:10px;color:#b42318;font-size:11px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.toolbar .input{margin:0;flex:1}.toolbar button{height:44px;border:0;border-radius:10px;background:#28232e;color:#fff;padding:0 14px;font-size:10px;font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{padding:14px;border-radius:13px;background:#f7f4fb}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:#918996}.table{border:1px solid #ece8ef;border-radius:15px;overflow:auto}.row{min-width:980px;display:grid;grid-template-columns:250px 210px 90px 90px 90px 90px 130px;gap:10px;align-items:center;padding:11px 13px;border-top:1px solid #f0edf2}.row:first-child{border-top:0}.row.headrow{background:#faf9fb;color:#9a929e;font-size:9px;font-weight:850;border-top:0}.member{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:19px;background:#eee8fa;display:grid;place-items:center;color:#6f4fc2;font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.member b{display:block;font-size:12px}.member small{display:block;margin-top:2px;color:#938b98;font-size:9px}.email{font-size:10px;color:#625b67;overflow:hidden;text-overflow:ellipsis}.num{font-size:12px;font-weight:850;text-align:center}.date{font-size:9px;color:#8d8591}.empty{padding:55px;text-align:center;color:#9a929e;font-size:12px}@media(max-width:700px){.content{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="head"><b>FUNY PIN</b><span>회원 관리</span><button id="logout" style="display:none">로그아웃</button></header>
<main id="app" class="content"></main>
</div>
<script>
const SUPABASE_URL='https://wdttzpbmqavaqfcbaywj.supabase.co';
const SUPABASE_KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app'),logout=document.getElementById('logout');
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date=v=>v?new Date(v).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}):'-';
function loginView(error=''){app.innerHTML='<section class="login"><h1>회원 관리</h1><p class="sub">FUNY PIN 관리자 계정으로 로그인해주세요.</p><input id="email" class="input" type="email" placeholder="관리자 이메일"><input id="password" class="input" type="password" placeholder="비밀번호"><button id="login" class="btn">로그인</button><div class="error">'+esc(error)+'</div></section>';document.getElementById('login').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginView('이메일과 비밀번호를 입력해주세요.');const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return loginView(error.message);await load()}
async function load(){app.innerHTML='<div class="empty">회원 데이터를 불러오는 중...</div>';try{const {data,error}=await supabase.rpc('admin_list_members',{p_search:null});if(error)throw error;rows=data||[];logout.style.display='block';render(rows)}catch(e){await supabase.auth.signOut();logout.style.display='none';loginView(e.message||'관리자 권한이 없습니다.')}}
function render(items){app.innerHTML='<div class="toolbar"><input id="q" class="input" placeholder="닉네임 또는 이메일 검색"><button id="csv">CSV 내보내기</button></div><div class="stats"><div class="stat"><b>'+rows.length+'</b><span>전체 회원</span></div><div class="stat"><b>'+rows.filter(x=>x.favorite_count>0).length+'</b><span>관심 매장 보유</span></div><div class="stat"><b>'+rows.filter(x=>x.funymon_count>0).length+'</b><span>퍼니몬 포획 회원</span></div><div class="stat"><b>'+rows.filter(x=>x.entry_count>0).length+'</b><span>응모 회원</span></div></div><div class="table"><div class="row headrow"><div>회원</div><div>이메일</div><div>가입일</div><div>관심 매장</div><div>퍼니몬</div><div>응모</div><div>최근 로그인</div></div><div id="list"></div></div>';drawList(items);document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();drawList(rows.filter(x=>(x.nickname||'').toLowerCase().includes(q)||(x.email||'').toLowerCase().includes(q)))};document.getElementById('csv').onclick=exportCsv}
function drawList(items){const el=document.getElementById('list');if(!items.length){el.innerHTML='<div class="empty">회원 데이터가 없습니다.</div>';return}el.innerHTML=items.map(x=>'<div class="row"><div class="member"><div class="avatar">'+(x.avatar_url?'<img src="'+esc(x.avatar_url)+'">':esc((x.nickname||'F').slice(0,1)))+'</div><div><b>'+esc(x.nickname||'닉네임 미설정')+'</b><small>'+esc(x.user_id)+'</small></div></div><div class="email">'+esc(x.email||'-')+'</div><div class="date">'+date(x.created_at)+'</div><div class="num">'+Number(x.favorite_count||0)+'</div><div class="num">'+Number(x.funymon_count||0)+'</div><div class="num">'+Number(x.entry_count||0)+'</div><div class="date">'+(x.last_sign_in_at?date(x.last_sign_in_at):'-')+'</div></div>').join('')}
function exportCsv(){const head=['user_id','nickname','email','created_at','favorite_count','funymon_count','entry_count','coupon_count','last_sign_in_at'];const csv=[head.join(','),...rows.map(x=>head.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='funypin-members-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
logout.onclick=async()=>{await supabase.auth.signOut();logout.style.display='none';loginView()};loginView();
</script>
</body></html>
