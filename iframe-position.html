<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN 실제 화면 iframe 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#eceaf0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;color:#24212a}.tools{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);border-bottom:1px solid #ddd8e2;padding:10px}.tools h1{font-size:15px;margin:0 0 8px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}button,input{height:34px;border:1px solid #dcd6e2;border-radius:9px;background:#fff;padding:0 9px;font-size:12px}button.active{background:#272331;color:#fff;border-color:#272331}.val{font-size:12px;font-weight:800}.note{font-size:10.5px;color:#7e7884;margin:7px 0 0}.preview{width:min(100%,420px);height:calc(100vh - 188px);min-height:520px;margin:0 auto;background:#fff}.preview iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style></head><body><div class="tools"><h1>실제 FUNY PIN 화면에서 인포크 위치 설정</h1><div class="row" id="pages"><button data-page="home" class="active">🏠 HOME</button><button data-page="info">ℹ️ INFO</button></div><div class="row" id="regions"></div><div class="row"><b>Y</b><button data-y="-10">-10</button><button data-y="-1">-1</button><span class="val" id="yv"></span><button data-y="1">+1</button><button data-y="10">+10</button><input id="yi" type="number" style="width:78px"><b>높이</b><button data-h="-10">-10</button><button data-h="-1">-1</button><span class="val" id="hv"></span><button data-h="1">+1</button><button data-h="10">+10</button><input id="hi" type="number" min="100" style="width:78px"><button id="copy">현재값 복사</button><button id="copyAll">전체값 복사</button></div><p class="note">아래 화면은 좌표 전용 미리보기가 아니라 실제 HOME / INFO 페이지 자체입니다. 조정값이 실제 페이지의 crop 요소에 바로 적용됩니다.</p></div><div class="preview"><iframe id="site" src="./?iframe-tool=1"></iframe></div><script>(()=>{const data={home:{recommend:{label:"📍 카드샵 추천",y:-255,h:1015,sel:'[data-region="homeRecommend"]'},visit:{label:"📝 카드샵 방문기",y:-1295,h:540,sel:'section[aria-label="깽퐌커플 카드샵 방문기"] .inpock-crop'},links:{label:"🔗 링크 모음",y:-1855,h:360,sel:'section[aria-label="링크 모음"] .inpock-crop'}},info:{information:{label:"💡 정보",y:-2275,h:765,sel:'.info-panel[data-panel="information"] .inpock-crop'},review:{label:"📝 리뷰",y:-3075,h:740,sel:'.info-panel[data-panel="review"] .inpock-crop'}}};let page="home",region="recommend";const site=document.getElementById("site"),regions=document.getElementById("regions"),yv=document.getElementById("yv"),hv=document.getElementById("hv"),yi=document.getElementById("yi"),hi=document.getElementById("hi");function target(){try{return site.contentDocument.querySelector(data[page][region].sel)}catch(e){return null}}function apply(){const d=data[page][region],el=target();if(el){el.style.height=d.h+"px";const fr=el.querySelector("iframe");if(fr)fr.style.setProperty("--y",d.y+"px");el.scrollIntoView({block:"center"})}yv.textContent=d.y+"px";hv.textContent=d.h+"px";yi.value=d.y;hi.value=d.h;renderRegions()}function renderRegions(){regions.innerHTML="";Object.entries(data[page]).forEach(([k,d])=>{const b=document.createElement("button");b.textContent=d.label;b.className=k===region?"active":"";b.onclick=()=>{region=k;apply()};regions.appendChild(b)})}function loadPage(){site.src=page==="home"?"./?iframe-tool=1":"reviews.html?iframe-tool=1";site.onload=()=>setTimeout(apply,250)}document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;region=Object.keys(data[page])[0];document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===page));loadPage()});document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{data[page][region].y+=Number(b.dataset.y);apply()});document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{data[page][region].h=Math.max(100,data[page][region].h+Number(b.dataset.h));apply()});yi.onchange=()=>{data[page][region].y=Number(yi.value)||0;apply()};hi.onchange=()=>{data[page][region].h=Math.max(100,Number(hi.value)||100);apply()};async function cp(t,b){try{await navigator.clipboard.writeText(t);let x=b.textContent;b.textContent="복사 완료";setTimeout(()=>b.textContent=x,900)}catch(e){prompt("복사하세요",t)}}function line(p,d){return (p==="home"?"HOME":"INFO")+" / "+d.label.replace(/^\S+\s/,"")+" Y 좌표: "+d.y+"px / 노출 높이: "+d.h+"px"}copy.onclick=()=>cp(line(page,data[page][region]),copy);copyAll.onclick=()=>cp(Object.entries(data).flatMap(([p,rs])=>Object.values(rs).map(d=>line(p,d))).join("\n"),copyAll);site.onload=()=>setTimeout(apply,250);renderRegions()})();</script></body></html>
