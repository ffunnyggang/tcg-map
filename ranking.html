<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 await A.init();if(!A.session){A.goLogin(location.pathname+location.search+location.hash);return}const uid=A.session.user.id;
 let category='attendance',metric='primary',publicOn=false,shopId='',cache={},savingPublic=false;
 function setPublicVisual(value){publicOn=!!value;const b=$('#publicToggle');b.classList.toggle('on',publicOn);b.setAttribute('aria-pressed',String(publicOn));b.setAttribute('aria-label','랭킹 공개 참여 '+(publicOn?'켜짐':'꺼짐'))}
 const now=new Date(Date.now()+9*3600000),first=new Date(2026,9,1);
 const monthList=[];for(let i=0;i<6;i++){const d=new Date(now.getUTCFullYear(),now.getUTCMonth()-i,1);if(d<first)break;monthList.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
 $('#monthPicker').innerHTML=monthList.map(m=>'<option value="'+m+'">'+m.slice(0,4)+'년 '+Number(m.slice(5))+'월</option>').join('');
 let month=monthList[0]||'2026-10';
 function updateRankPeriod(){
  const [year,mon]=month.split('-').map(Number);

  const last=new Date(Date.UTC(year,mon,0)).getUTCDate();
  const kstNow=new Date(Date.now()+9*3600000);
  const isCurrent=year===kstNow.getUTCFullYear()&&mon===kstNow.getUTCMonth()+1;

 }
 updateRankPeriod();
 const labels={attendance:['출석','연속 출석','일'],visit:['카드샵 방문','방문 매장','회'],funymon:['퍼니몬 포획','포획 종류','회']};
 const metricLabels={attendance:['출석 일수','연속 출석 일수'],visit:['방문 횟수','방문 매장 수'],funymon:['포획 횟수','포획한 퍼니몬 종류']};
 const summaryLabels={attendance:['출석 일수','연속 출석'],visit:['방문 횟수','방문 매장 수'],funymon:['포획 횟수','퍼니몬 종류']};
 let rankRequestId=0;
 function updateMetrics(){$$('#metricChips [data-metric]').forEach((b,i)=>{b.textContent=metricLabels[category][i];b.classList.toggle('on',b.dataset.metric===metric);b.setAttribute('aria-pressed',String(b.dataset.metric===metric))})}
 async function getRank(c,shop=''){
  const key=[month,c,shop].join(':');if(cache[key])return cache[key];

 }
 async function refreshSummary(){

  $('#summary').innerHTML='<div class="rank-summary-grid">'+keys.map((c,i)=>{
   const a=data[i*2],b=data[i*2+1];
   const render=(d,k)=>{const my=d.my||{},r=Number(my.rank||0),pop=Number(d.population||0),value=Number(my.value||0),rankLabel=!publicOn?'비공개':r>0&&r<=100?r+'위':r>100&&pop>0?'상위 '+Math.max(1,Math.min(100,Math.ceil(r*100/pop)))+'%':value>0?'집계 대기':'기록 없음';return '<div class="rank-summary-metric'+(value===0?' is-empty':'')+'"><small>'+summaryLabels[c][k]+'</small><strong>'+value.toLocaleString('ko-KR')+'<span>'+units[i*2+k]+'</span></strong><em>'+rankLabel+'</em></div>'};
   return '<div class="rank-summary-group"><b>'+labels[c][0]+'</b>'+render(a,0)+render(b,1)+'</div>';
  }).join('')+'</div>';
  const shops=data[2].shops||[];
  $('#shopFilter').innerHTML='<option value="">전체</option>'+shops.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');
  $('#shopFilter').value=shopId;
  updateShopLabel();
 }
 function updateShopLabel(){
  const dropdown=$('#shopFilter'),label=$('#shopFilterLabel');
  const current=dropdown.options[dropdown.selectedIndex];
  const name=current?current.textContent:'전체';
  label.textContent=name;
  $('#shopFilterWrap').title=name;
 }
 function rankingDelta(x){
  if(month==='2026-10')return '<span class="rank-delta rank-delta--na" title="2026년 10월부터 랭킹을 집계합니다.">전월 —</span>';
  const previous=Number(x.previous_value),current=Number(x.value||0);
  if(!Number.isFinite(previous)||previous<0)return '<span class="rank-delta rank-delta--na">전월 —</span>';
  if(previous===0)return '<span class="rank-delta rank-delta--new">신규</span>';
  const percent=(current-previous)/previous*100;
  if(Math.abs(percent)<.05)return '<span class="rank-delta rank-delta--flat">— 0%</span>';
  const up=percent>0;
  const amount=Math.round(Math.abs(percent)*10)/10;
  const formatted=amount.toLocaleString('ko-KR',{maximumFractionDigits:1});
  return '<span class="rank-delta '+(up?'rank-delta--up':'rank-delta--down')+'">'+(up?'▲ ':'▼ ')+formatted+'%</span>';
 }
 function rankingAvatar(x){
  const fallback='/assets/profile/default-profile.svg?v=20261018-neutral1';
  const url=(x?.avatar_url&&/^(https?:\/\/|\/(?!\/))/.test(x.avatar_url))?x.avatar_url:fallback;
  return '<img src="'+esc(url)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+fallback+'\'">';
 }

 async function loadRanking(){
  const requestId=++rankRequestId;
  if(!publicOn){renderJoinPrompt();return}
  const field=category,subMetric=metric;
  $('#ranking').innerHTML='<div class="loading">랭킹을 불러오는 중...</div>';
  const type=field+(subMetric==='secondary'?'_secondary':'');
  const data=await getRank(type,field==='visit'?shopId:'');
  if(requestId!==rankRequestId)return;
  const rows=Array.isArray(data.rows)?data.rows:[];
  const unit=subMetric==='secondary'?(field==='attendance'?'일':field==='visit'?'곳':'종'):labels[field][2];
  if(!rows.length){
   $('#ranking').innerHTML='<div class="empty"><strong>아직 공개 랭킹이 없어요</strong>선택한 월과 지표에 해당하는 기록이 없습니다.</div>';
   return;
  }
  const podium=(x,place)=>{
   if(!x)return '<div class="rank-podium rank-podium--empty" aria-hidden="true"></div>';
   const rank=Number(x.rank)||place;
   const ornament=place===1?'👑':'✦';
   const name=esc(x.nickname||'FUNY 회원');
   return '<div class="rank-podium rank-podium--'+(place===1?'first':place===2?'second':'third')+'">'+
    '<span class="rank-podium-crown" aria-hidden="true">'+ornament+'</span>'+
    '<span class="rank-podium-avatar">'+rankingAvatar(x)+'</span>'+
    '<b class="rank-podium-name" title="'+name+'">'+name+'</b>'+
    '<strong class="rank-podium-value">'+Number(x.value||0).toLocaleString('ko-KR')+'<small>'+unit+'</small></strong>'+
    '<div class="rank-podium-delta">'+rankingDelta(x)+'</div>'+
    '<div class="rank-podium-step">'+rank+'위</div></div>';
  };
  const top=rows.slice(0,3),remaining=rows.slice(3);
  const stage='<div class="rank-ceremony"><div class="rank-stage">'+
   podium(top[1],2)+podium(top[0],1)+podium(top[2],3)+'</div></div>';
  const list=remaining.length?'<p class="rank-results-count">4위부터 · '+Math.min(rows.length,100)+'명 중</p><div class="rank-list">'+remaining.map(x=>{
   const name=esc(x.nickname||'FUNY 회원');
   return '<div class="rank-row"><span class="rank-no">'+Number(x.rank||0)+'위</span>'+
    '<span class="rank-avatar">'+rankingAvatar(x)+'</span>'+
    '<span class="rank-name" title="'+name+'">'+name+'</span>'+
    '<span class="rank-record"><strong class="rank-record-value">'+Number(x.value||0).toLocaleString('ko-KR')+'<small>'+unit+'</small></strong>'+
    rankingDelta(x)+'</span></div>';
  }).join('')+'</div>':'';
  $('#ranking').innerHTML=stage+list;
 }
 $('#publicToggle').onclick=async()=>{

  }finally{savingPublic=false;b.disabled=false;b.removeAttribute('aria-busy')}
 };
