<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>프로필 편집 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my3"><style>
.my-content{padding:22px 22px 40px!important}.avatar-wrap{width:112px;height:112px;margin:12px auto 0;position:relative}.avatar-tap{width:112px;height:112px;border:0;padding:0;border-radius:56px;background:transparent;overflow:hidden;display:block;cursor:pointer}.avatar{width:112px;height:112px;border-radius:56px;background:#EEE8FA;border:1px solid #DDD3F1;display:grid;place-items:center;overflow:hidden;color:#6749bd;font-size:14px;font-weight:800}.avatar img{width:112px;height:112px;border-radius:56px;object-fit:cover}.avatar img.default-profile-icon{padding:0;object-fit:cover}.avatar-add,.avatar-delete{position:absolute;z-index:3;display:grid;place-items:center;background:#fff;cursor:pointer}.avatar-add[hidden],.avatar-delete[hidden]{display:none!important}.avatar-add{right:-3px;bottom:-3px;width:30px;height:30px;border:1.5px solid #6749bd;border-radius:15px;color:#6749bd;font-size:20px;line-height:30px;text-align:center;padding:0;font-family:Arial,sans-serif}.avatar-delete{right:-5px;top:-5px;width:28px;height:28px;border:1px solid #E0DAE5;border-radius:14px;color:#4D4852;font-size:20px;line-height:22px;box-shadow:0 2px 5px rgba(33,26,46,.12)}.field{margin-top:30px}.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.label{font-size:13px;font-weight:900;color:#181720}.available{flex:1;text-align:right;color:#6749bd;font-size:10.5px;font-weight:700}.nick{width:100%;height:52px;border:1px solid #E9E5ED;border-radius:14px;background:#fff;padding:0 16px;color:#181720;font:700 15px/1 var(--funy-system-font);outline:none}.nick:focus{border-color:#8062D8}.nick.locked{background:#F1EEF4;color:#8D8993}.count{margin-top:6px;text-align:right;color:#8D8993;font-size:11px}.policy{margin-top:5px;color:#8D8993;font-size:10.5px;line-height:17px}.save{margin-top:28px;width:100%;height:54px;border:0;border-radius:16px;background:#6749bd;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.save:disabled{opacity:.55}.status{min-height:20px;margin-top:8px;text-align:center;font-size:11px;color:#C62828}
.crop-modal[hidden]{display:none!important}.crop-modal{position:fixed;inset:0;z-index:2147483600;background:#18161D;color:#fff;display:flex;flex-direction:column;align-items:center}.crop-top{height:54px;flex:0 0 54px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:800 15px/1.2 var(--funy-system-font)}.crop-wrap{flex:1;width:100%;display:grid;place-items:center;min-height:0}.crop-stage{position:relative;width:300px;height:300px;border-radius:50%;overflow:hidden;background:#232129;touch-action:none;box-shadow:0 0 0 2px rgba(255,255,255,.96),0 10px 30px rgba(0,0,0,.28)}.crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;will-change:transform}.crop-guide{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);pointer-events:none}.crop-bottom{flex:0 0 126px;width:100%;padding:10px 18px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;font-size:12.5px;font-weight:700}.crop-range{width:min(100%,320px);accent-color:#8b6cf0}.crop-actions{width:min(100%,320px);display:grid;grid-template-columns:1fr 1fr;gap:10px}.crop-actions button{height:46px;border-radius:12px;font-size:14px;font-weight:900}.crop-cancel{border:1px solid #6c6672;background:#2a272f;color:#fff}.crop-save{border:0;background:#8b6cf0;color:#fff;box-shadow:0 5px 16px rgba(128,98,216,.35)}
</style><script src="/web-auth.js?v=20261014-web-auth6"></script><script src="/my-web-common.js?v=20261021-history-scroll1"></script><link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-back-align2"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="/web-safe-area.css?v=20261023-safe2"><script defer src="/web-safe-area.js?v=20261023-safe1"></script></head><body><div class="my-page"><header class="my-head funy-sub-header"><button class="my-back funy-sub-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title funy-sub-title">프로필 편집</div></header><main id="root" class="my-content"><div class="my-loading">프로필을 불러오는 중...</div></main></div>
<div id="cropModal" class="crop-modal" hidden><div class="crop-top">프로필 이미지 조정</div><div class="crop-wrap"><div id="cropStage" class="crop-stage"><img id="cropImage" alt=""><div class="crop-guide"></div></div></div><div class="crop-bottom"><div>드래그로 이동 · 두 손가락 또는 슬라이더로 확대/축소</div><input id="cropRange" class="crop-range" type="range" min="1" max="5" step=".01" value="1"><div class="crop-actions"><button id="cropCancel" class="crop-cancel" type="button">취소</button><button id="cropSave" class="crop-save" type="button">완료</button></div></div></div>
<script>(async()=>{
 const H=FUNY_MY_WEB,A=await H.ready('/my-profile.html');if(!A)return;
 const root=document.getElementById('root'),user=A.session.user;
 const {data:profileRow}=await A.client.from('profiles').select('*').eq('user_id',user.id).maybeSingle();
 let profile=profileRow||null,pickedBlob=null,pickedPreview='',avatar=profile?(profile.avatar_url||''):(user.user_metadata?.avatar_url||user.user_metadata?.picture||'');
 const fallback=profile?.nickname||('FUNY회원'+String(user.id).replace(/-/g,'').slice(-4).toUpperCase());
 const changed=profile?.nickname_changed_at?new Date(profile.nickname_changed_at).getTime():0,next=changed+30*86400000,locked=!!changed&&next>Date.now();
 const dateLabel=d=>{const x=new Date(d);return x.getFullYear()+'년 '+String(x.getMonth()+1).padStart(2,'0')+'월 '+String(x.getDate()).padStart(2,'0')+'일'};
 root.innerHTML='<div class="avatar-wrap"><button id="avatarTap" class="avatar-tap" type="button"><div class="avatar" id="avatar">'+(avatar?'<img src="'+H.esc(avatar)+'" alt="">':'<img class="default-profile-icon" src="/assets/profile/default-profile.svg?v=20261018-neutral1" alt="">')+'</div></button><button id="avatarDelete" class="avatar-delete" type="button" aria-label="프로필 이미지 삭제" '+(avatar?'':'hidden')+'>×</button><button id="avatarAdd" class="avatar-add" type="button" aria-label="프로필 이미지 추가" '+(avatar?'hidden':'')+'>＋</button><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><div class="field"><div class="label-row"><span class="label">닉네임</span>'+(locked?'<span class="available">'+dateLabel(next)+'부터 닉네임 변경 가능</span>':'')+'</div><input id="nickname" class="nick '+(locked?'locked':'')+'" maxlength="12" value="'+H.esc(fallback)+'" '+(locked?'readonly':'')+' placeholder="2~12자 · 한글/영문/숫자"><div id="count" class="count">'+fallback.length+'/12</div>'+(!locked?'<div class="policy">한글·영문·숫자 2~12자만 사용할 수 있어요. 공백·특수문자·이모지는 입력되지 않으며, 다른 사용자와 같은 닉네임은 사용할 수 없어요. 변경 후 30일 동안 다시 변경할 수 있어요.</div>':'')+'</div><button id="save" class="save" type="button">저장하기</button><div id="status" class="status"></div>';
 const file=document.getElementById('avatarFile'),avatarTap=document.getElementById('avatarTap'),add=document.getElementById('avatarAdd'),del=document.getElementById('avatarDelete'),av=document.getElementById('avatar'),nick=document.getElementById('nickname'),count=document.getElementById('count'),save=document.getElementById('save'),status=document.getElementById('status');
 const choose=()=>file.click();avatarTap.onclick=choose;add.onclick=choose;
 nick.addEventListener('input',()=>{if(locked)return;const clean=nick.value.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣᄀ-ᇿA-Za-z0-9]/g,'');if(clean!==nick.value)nick.value=clean;count.textContent=nick.value.length+'/12'});

 const modal=document.getElementById('cropModal'),stage=document.getElementById('cropStage'),img=document.getElementById('cropImage'),range=document.getElementById('cropRange'),cropCancel=document.getElementById('cropCancel'),cropSave=document.getElementById('cropSave');
 const V=300,pointers=new Map();let x=0,y=0,scale=1,minScale=1,start=null,pinch=null,objectUrl='';
 function clamp(){const w=img.naturalWidth*scale,h=img.naturalHeight*scale;x=Math.min(0,Math.max(V-w,x));y=Math.min(0,Math.max(V-h,y))}
 function draw(){clamp();img.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';range.value=String(Math.max(1,scale/minScale))}
 function openCrop(src){objectUrl=src;img.src=src;modal.hidden=false;document.body.style.overflow='hidden';img.onload=()=>{minScale=Math.max(V/img.naturalWidth,V/img.naturalHeight);scale=minScale;x=(V-img.naturalWidth*scale)/2;y=(V-img.naturalHeight*scale)/2;range.value='1';draw()}}
 function closeCrop(){modal.hidden=true;document.body.style.overflow='';pointers.clear();start=null;pinch=null;if(objectUrl.startsWith('blob:'))URL.revokeObjectURL(objectUrl);objectUrl=''}
 function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
 stage.addEventListener('pointerdown',e=>{stage.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,e);const ps=[...pointers.values()];if(ps.length===1)start={px:e.clientX,py:e.clientY,x,y};if(ps.length===2)pinch={d:dist(ps[0],ps[1]),scale,x,y,cx:(ps[0].clientX+ps[1].clientX)/2-stage.getBoundingClientRect().left,cy:(ps[0].clientY+ps[1].clientY)/2-stage.getBoundingClientRect().top}});
 stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,e);const ps=[...pointers.values()];if(ps.length===1&&start){x=start.x+(e.clientX-start.px);y=start.y+(e.clientY-start.py);draw()}else if(ps.length===2&&pinch){const ns=Math.max(minScale,Math.min(minScale*5,pinch.scale*(dist(ps[0],ps[1])/Math.max(1,pinch.d))));const ratio=ns/pinch.scale;x=pinch.cx-(pinch.cx-pinch.x)*ratio;y=pinch.cy-(pinch.cy-pinch.y)*ratio;scale=ns;draw()}});
 function pointerEnd(e){pointers.delete(e.pointerId);const ps=[...pointers.values()];if(ps.length===1)start={px:ps[0].clientX,py:ps[0].clientY,x,y};else start=null;if(ps.length<2)pinch=null}
 stage.addEventListener('pointerup',pointerEnd);stage.addEventListener('pointercancel',pointerEnd);
 stage.addEventListener('wheel',e=>{e.preventDefault();const old=scale,ratioStep=e.deltaY<0?1.08:.92;scale=Math.max(minScale,Math.min(minScale*5,scale*ratioStep));const r=stage.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,ratio=scale/old;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;draw()},{passive:false});
 range.oninput=()=>{const old=scale,ns=minScale*Number(range.value),cx=V/2,cy=V/2,ratio=ns/old;scale=ns;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;draw()};
 cropCancel.onclick=closeCrop;
 cropSave.onclick=()=>{const out=document.createElement('canvas'),S=800,r=S/V;out.width=S;out.height=S;const ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);ctx.drawImage(img,x*r,y*r,img.naturalWidth*scale*r,img.naturalHeight*scale*r);out.toBlob(blob=>{if(!blob)return;pickedBlob=blob;if(pickedPreview)URL.revokeObjectURL(pickedPreview);pickedPreview=URL.createObjectURL(blob);avatar=pickedPreview;av.innerHTML='<img src="'+pickedPreview+'" alt="">';del.hidden=false;add.hidden=true;closeCrop()},'image/jpeg',.88)};
 file.onchange=()=>{const chosen=file.files?.[0];file.value='';if(!chosen)return;if(!['image/jpeg','image/png','image/webp'].includes(chosen.type)){alert('JPG, PNG, WebP 이미지만 사용할 수 있어요.');return}if(chosen.size>5*1024*1024){alert('프로필 이미지는 5MB 이하만 사용할 수 있어요.');return}openCrop(URL.createObjectURL(chosen))};

 if(del)del.onclick=async()=>{if(!confirm('프로필 이미지를 삭제할까요?\n\n기본 프로필 이미지로 변경돼요.'))return;del.disabled=true;try{const {data:files,error}=await A.client.storage.from('profile-images').list(user.id,{limit:20});if(error)throw error;const paths=(files||[]).filter(v=>String(v.name||'').startsWith('avatar.')).map(v=>user.id+'/'+v.name);if(paths.length){const {error:e}=await A.client.storage.from('profile-images').remove(paths);if(e)throw e}const {error:e}=await A.client.from('profiles').upsert({user_id:user.id,avatar_url:null,updated_at:new Date().toISOString()});if(e)throw e;profile={...(profile||{}),avatar_url:null};pickedBlob=null;avatar='';av.innerHTML='<img class="default-profile-icon" src="/assets/profile/default-profile.svg?v=20261018-neutral1" alt="">';del.hidden=true;add.hidden=false;alert('프로필 이미지가 삭제되었습니다.')}catch(e){alert('프로필 이미지 삭제에 실패했습니다.')}finally{del.disabled=false}};

 save.onclick=async()=>{status.textContent='';const n=nick.value.trim();if(!n){alert('닉네임을 입력해주세요.');return}if(locked&&n!==fallback){alert('아직 닉네임을 변경할 수 없어요\n'+dateLabel(next)+'부터 다시 변경할 수 있어요.');return}if(!/^[가-힣A-Za-z0-9]{2,12}$/.test(n)){status.textContent='닉네임은 한글·영문·숫자 2~12자로 입력해주세요.';return}save.disabled=true;save.textContent='저장 중…';try{let avatarUrl=profile?.avatar_url||null;if(pickedBlob){const path=user.id+'/avatar.jpg';const {error}=await A.client.storage.from('profile-images').upload(path,pickedBlob,{contentType:'image/jpeg',cacheControl:'3600',upsert:true});if(error)throw error;avatarUrl=A.client.storage.from('profile-images').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}const {data,error}=await A.client.from('profiles').upsert({user_id:user.id,nickname:n,avatar_url:avatarUrl,updated_at:new Date().toISOString()}).select('*').single();if(error){if(error.code==='23505')throw new Error('이미 사용 중인 닉네임이에요.');if(error.code==='23514')throw new Error('닉네임은 한글, 영문, 숫자만 사용할 수 있어요.');if(error.code==='P0001'&&String(error.message||'').includes('NICKNAME_CHANGE_COOLDOWN'))throw new Error('닉네임은 변경 후 30일 동안 다시 변경할 수 없어요.');throw error}profile=data;alert('프로필이 변경되었습니다.');location.replace('/my.html')}catch(e){status.textContent=String(e?.message||'저장에 실패했습니다.')}finally{save.disabled=false;save.textContent='저장하기'}};
})();
</script></body></html>
