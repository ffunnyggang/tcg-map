name: Fix detail address duplication
on:
  push:
    paths:
      - '.github/workflows/fix-detail-address.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicated Seoul district prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="['주소',`서울 ${s.city||''} ${s.address}`.replace(/\\s+/g,' ').trim()]"
          new="['주소',s.address]"
          if old not in s:
              raise SystemExit('Target address expression not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix duplicated address in detail page'
          git push
