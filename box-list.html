<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui3"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><title>포켓몬 BOX 시세 | FUNY PIN</title><style>*{box-sizing:border-box}html{background:#f5f3f8;overflow-x:hidden}body{margin:0;overflow-x:hidden;font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--funy-text,#181720)}main{max-width:var(--funy-content-max,420px);background:var(--funy-bg,#fff);min-height:100dvh;margin:0 auto;padding:0 var(--funy-screen-pad,14px) 44px}header{height:54px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #efecf2;margin:0 -16px 18px;padding:0 16px}header a{text-decoration:none;color:#24202b;font-size:30px;line-height:1}header h1{font-size:17px;margin:0;font-weight:750}.muted{font-size:12px;color:#89818e;line-height:1.55}.placeholder{background:var(--funy-surface-soft,#FAF9FC);border:1px dashed #ded8e5;display:grid;place-items:center;color:#aaa2b0;text-align:center;font-size:12px;border-radius:12px}.divider{height:9px;background:#f6f4f8;margin:24px -16px}h2{font-size:17px;margin:0 0 15px}button,input,select{font:inherit}button{cursor:pointer}.note{font-size:11px;line-height:1.65;color:#8a8290}.empty{border:1px dashed #e0dbe6;border-radius:14px;background:#fcfbfd;text-align:center;color:#857c8d;padding:25px 15px;font-size:13px;line-height:1.7}a{color:inherit}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}.intro{padding-top:4px}.intro h2{font-size:23px;margin:5px 0 8px;letter-spacing:-.5px}.tools{display:flex;gap:8px;margin:23px 0 16px}.tools input{width:100%;min-width:0;flex:1;padding:12px;border:1px solid #e5e1e9;border-radius:11px;outline-color:var(--funy-purple,#8062D8)}.tools select{width:113px;border-radius:11px;background:white;border:1px solid #e5e1e9;padding:9px 6px;font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px;font-size:12px}.toolbar strong{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.item{text-decoration:none;min-width:0;display:block}.item .placeholder{aspect-ratio:1/1;width:100%;margin-bottom:10px}.item strong{display:block;font-size:14px;line-height:1.4;min-height:39px;overflow-wrap:anywhere}.item .price{display:block;margin-top:8px;font-size:13px;font-weight:750;color:#5b5363}.item .delta{display:block;font-size:11px;color:#918a97;margin-top:4px}.item:focus-visible{outline:3px solid #8063d7;outline-offset:3px;border-radius:10px}#empty[hidden]{display:none}html.app-shell header.funy-sub-header{display:none!important}html.app-shell main{padding-top:12px} .placeholder img{max-width:100%;max-height:100%;display:block;object-fit:contain}.item .placeholder{overflow:hidden} .item .placeholder img{transition:transform .2s ease}@media(hover:hover){.item:hover .placeholder img{transform:scale(1.025)}}@media(max-width:360px){.grid{gap:16px 10px}.item strong{font-size:13px}.tools select{width:102px}} .funy-sub-header{margin-bottom:18px!important}</style></head><body><main><header class="funy-sub-header"><a class="funy-sub-back" href="/" aria-label="이전">‹</a><h1 class="funy-sub-title">BOX 시세</h1></header><section class="intro"><span class="muted">Pokémon TCG · 일본판 BOX</span><h2>포켓몬 BOX 전체 목록</h2><p class="muted">카드샵에서 확인된 BOX별 판매가격을 비교하는 공간입니다.<br>현재는 상품 이미지는 등록되었으며 카드샵 시세를 준비하고 있습니다.</p></section><div class="tools"><input id="search" type="search" placeholder="BOX 상품명 검색" aria-label="BOX 상품명 검색"><select id="sort" aria-label="정렬"><option value="popular">인기순</option><option value="name">이름순</option><option value="oldest">출시 오래된순</option><option value="newest">최신 출시순</option></select></div><div class="toolbar"><strong id="count">BOX 17개</strong><span class="muted">포켓몬 · 일본판</span></div><section id="grid" class="grid" aria-label="BOX 상품 목록"></section><div id="empty" class="empty" hidden>해당 상품을 찾을 수 없습니다.<br>검색어를 다시 확인해주세요.</div><div class="divider"></div><p class="note">표시되는 BOX 상품명은 1차 구성 예시입니다. 최저가는 관리자 승인된 카드샵 판매가격 기준으로 표시되며, 가격 정보가 없으면 ‘시세 준비 중’으로 안내합니다. 홈 공개 전까지 별도 개발 브랜치에서 검수합니다.</p></main><script>const BOX_PRODUCTS=[{id:"jp-30th",name:"포켓몬카드 30주년 일본판 BOX",short:"30주년 일본판",popularity:1},{id:"jp-storm-emerald",name:"스톰에메랄다 일본판 BOX",short:"스톰에메랄다",popularity:2},{id:"jp-inferno-x",name:"인페르노X 일본판 BOX",short:"인페르노X",popularity:3},{id:"jp-mega-dream-ex",name:"메가드림 ex 일본판 BOX",short:"메가드림 ex",popularity:4},{id:"jp-black-bolt",name:"블랙볼트 일본판 BOX",short:"블랙볼트",popularity:5},{id:"jp-white-flare",name:"화이트플레어 일본판 BOX",short:"화이트플레어",popularity:6},{id:"jp-151",name:"포켓몬카드 151 일본판 BOX",short:"포켓몬카드 151",popularity:7},{id:"jp-shiny-treasure",name:"샤이니 트레저 ex 일본판 BOX",short:"샤이니 트레저 ex",popularity:8}];
const qs=new URLSearchParams(location.search),search=document.getElementById('search'),sort=document.getElementById('sort'),grid=document.getElementById('grid'),empty=document.getElementById('empty');search.value=qs.get('q')||'';
function render(){const q=search.value.trim().toLocaleLowerCase('ko'),items=BOX_PRODUCTS.filter(p=>p.name.toLocaleLowerCase('ko').includes(q));if(sort.value==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sort.value==='oldest')items.sort((a,b)=>(a.release_date||'9999').localeCompare(b.release_date||'9999'));if(sort.value==='newest')items.sort((a,b)=>(b.release_date||'0000').localeCompare(a.release_date||'0000'));grid.replaceChildren();document.getElementById('count').textContent='BOX '+items.length+'개';empty.hidden=items.length>0;for(const p of items){const link=document.createElement('a');link.className='item';link.href='box-detail.html?id='+encodeURIComponent(p.id);const img=document.createElement('div');img.className='placeholder';img.textContent='상품 이미지 준비 중';if(p.image_path){const photo=document.createElement('img');photo.src='https://wdttzpbmqavaqfcbaywj.supabase.co/storage/v1/object/public/box-products/'+encodeURIComponent(p.image_path);photo.alt=p.name;photo.loading='lazy';photo.style.cssText='width:100%;height:100%;object-fit:contain;';photo.onerror=()=>{photo.remove();img.textContent='상품 이미지 준비 중'};img.textContent='';img.append(photo);}const name=document.createElement('strong');name.textContent=p.name;const price=document.createElement('span');price.className='price';price.textContent='시세 준비 중';const delta=document.createElement('span');delta.className='delta';delta.textContent='전일 대비 —';link.append(img,name,price,delta);grid.append(link)}}
search.addEventListener('input',render);sort.addEventListener('change',render);render();</script><script>fetch('data/box-products-v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(d=>{if(!Array.isArray(d.products))return;BOX_PRODUCTS.splice(0,BOX_PRODUCTS.length,...d.products.map((p,i)=>({...p,popularity:i+1})));render()}).catch(()=>{});</script></body></html>
