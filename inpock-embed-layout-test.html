<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TCG MAP · Inpock Coordinate Test</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f6f2eb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{width:min(100%,460px);margin:auto;padding:18px 14px 36px}.title{font-size:20px;font-weight:800;letter-spacing:-.5px}.sub{margin-top:6px;font-size:12px;line-height:1.55;color:#766e64}.group{margin:22px 2px 8px;font-size:12px;font-weight:800;color:#8b6f47}.panel{margin-top:10px;background:#fff;border:1px solid #e6dfd4;border-radius:18px;padding:14px;box-shadow:0 7px 24px rgba(46,37,25,.05)}.panel h2{margin:0 0 4px;font-size:15px}.desc{margin:0 0 12px;font-size:11px;color:#8b8277}.crop{position:relative;overflow:hidden;border-radius:14px;background:#eee8df;border:1px solid #e7e0d7}.crop iframe{position:absolute;left:0;top:0;width:100%;height:2800px;border:0;background:#fff;transform:translateY(var(--y));transform-origin:top left}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.controls button,.hrow button{border:1px solid #ded5ca;background:#faf8f4;border-radius:10px;padding:8px 3px;font-size:11px}.hrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.readout{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#665e55}.value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b6f47;font-weight:700}.direct{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.direct label{font-size:10px;color:#766e64}.direct input{width:100%;margin-top:4px;border:1px solid #ded5ca;border-radius:9px;padding:8px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.copy{margin-top:10px;width:100%;border:0;border-radius:11px;padding:10px;background:#8b6f47;color:#fff;font-weight:700}.copyall{position:sticky;bottom:12px;margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;background:#222;color:#fff;font-weight:800;box-shadow:0 6px 18px #0002}.note{font-size:11px;line-height:1.55;color:#81786e;margin-top:16px}</style></head><body><main class="wrap"><header><div class="title">TCG MAP · 인포크 좌표 설정</div><div class="sub">현재 추천 화면 구조에 맞춰 7개 영역을 각각 조정할 수 있습니다.<br>Y 좌표와 높이를 맞춘 뒤 하단의 전체 복사 버튼으로 값을 보내주세요.</div></header><div id="panels"></div><button class="copyall" id="copyAll">7개 설정값 전체 복사</button><p class="note">추천 카드샵 1~4는 서로 독립된 영역입니다. 버튼 또는 숫자 직접 입력으로 1px 단위까지 조정할 수 있습니다.</p></main><script>
const SRC='https://link.inpock.co.kr/tcg_map';
const defs=[
{id:'homeRecommend1',group:'HOME · 카드샵 추천 4분할',title:'추천 카드샵 1',desc:'첫 번째 추천 카드샵 영역',y:-535,h:230},
{id:'homeRecommend2',group:'HOME · 카드샵 추천 4분할',title:'추천 카드샵 2',desc:'두 번째 추천 카드샵 영역',y:-773,h:230},
{id:'homeRecommend3',group:'HOME · 카드샵 추천 4분할',title:'추천 카드샵 3',desc:'세 번째 추천 카드샵 영역',y:-1013,h:230},
{id:'homeRecommend4',group:'HOME · 카드샵 추천 4분할',title:'추천 카드샵 4',desc:'네 번째 추천 카드샵 영역',y:-1250,h:230},
{id:'homeReview',group:'HOME · 리뷰',title:'홈 · 리뷰',desc:'추천 화면의 카드샵 방문기 영역',y:-1646,h:180},
{id:'homeLinks',group:'HOME · 링크',title:'홈 · 링크 모음',desc:'추천 화면 하단 링크 모음',y:-1311,h:300},
{id:'reviewAll',group:'REVIEW',title:'리뷰 · 전체 영역',desc:'리뷰 화면 전체 Inpock 영역',y:-1862,h:699}
];
const root=document.getElementById('panels');let last='';root.innerHTML=defs.map(d=>{const g=d.group!==last?`<div class="group">${last=d.group}</div>`:'';return g+`<section class="panel" data-id="${d.id}" data-y="${d.y}" data-h="${d.h}"><h2>${d.title}</h2><p class="desc">${d.desc}</p><div class="crop" style="height:${d.h}px"><iframe src="${SRC}" title="${d.title}" style="--y:${d.y}px" loading="eager"></iframe></div><div class="controls"><button data-move="-50">▲50</button><button data-move="-10">▲10</button><button data-move="-1">▲1</button><button data-move="1">▼1</button><button data-move="10">▼10</button><button data-move="50">▼50</button></div><div class="hrow"><button data-height="-10">H-10</button><button data-height="-1">H-1</button><button data-height="1">H+1</button><button data-height="10">H+10</button></div><div class="direct"><label>Y 직접 입력<input data-yinput type="number" value="${d.y}"></label><label>H 직접 입력<input data-hinput type="number" min="80" value="${d.h}"></label></div><div class="readout"><span>현재 설정</span><span class="value">Y ${d.y}px · H ${d.h}px</span></div><button class="copy" data-copy>설정값 복사</button></section>`}).join('');
function sync(p){const y=+p.dataset.y,h=+p.dataset.h;p.querySelector('iframe').style.setProperty('--y',y+'px');p.querySelector('.crop').style.height=h+'px';p.querySelector('.value').textContent=`Y ${y}px · H ${h}px`;p.querySelector('[data-yinput]').value=y;p.querySelector('[data-hinput]').value=h}
function text(p){return `${p.dataset.id}: Y ${p.dataset.y}px / H ${p.dataset.h}px`}
async function copy(t,b){try{await navigator.clipboard.writeText(t);const old=b.textContent;b.textContent='복사 완료';setTimeout(()=>b.textContent=old,900)}catch{prompt('아래 값을 복사해주세요',t)}}
root.addEventListener('click',e=>{const p=e.target.closest('.panel');if(!p)return;if(e.target.dataset.move){p.dataset.y=String(+p.dataset.y + +e.target.dataset.move);sync(p)}if(e.target.dataset.height){p.dataset.h=String(Math.max(80,+p.dataset.h + +e.target.dataset.height));sync(p)}if(e.target.matches('[data-copy]'))copy(text(p),e.target)});
root.addEventListener('change',e=>{const p=e.target.closest('.panel');if(!p)return;if(e.target.matches('[data-yinput]'))p.dataset.y=String(+e.target.value||0);if(e.target.matches('[data-hinput]'))p.dataset.h=String(Math.max(80,+e.target.value||80));sync(p)});
document.getElementById('copyAll').onclick=e=>copy([...document.querySelectorAll('.panel')].map(text).join('\n'),e.currentTarget);
</script></body></html>
