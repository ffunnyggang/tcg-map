<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN · Inpock Coordinate</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f7f8;color:#1f1f24;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{width:min(100%,480px);margin:auto;padding:20px 14px 40px}.title{font-size:21px;font-weight:850;letter-spacing:-.6px}.sub{margin-top:7px;font-size:12px;line-height:1.6;color:#77727f}.group{margin:24px 2px 8px;font-size:11px;font-weight:850;letter-spacing:.06em;color:#7557c8}.panel{margin-top:10px;background:#fff;border:1px solid #eceaf0;border-radius:18px;padding:14px;box-shadow:0 7px 24px rgba(40,34,52,.05)}.panel h2{margin:0 0 4px;font-size:15px}.desc{margin:0 0 12px;font-size:11px;color:#8a8590}.crop{position:relative;overflow:hidden;border-radius:14px;background:#f2f1f4;border:1px solid #e9e7ed}.crop iframe{position:absolute;left:0;top:0;width:100%;height:2800px;border:0;background:#fff;transform:translateY(var(--y));transform-origin:top left}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.controls button,.hrow button{border:1px solid #e2dfe8;background:#faf9fc;border-radius:10px;padding:8px 3px;font-size:11px;color:#514c59}.hrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.readout{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#716b78}.value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#7557c8;font-weight:800}.direct{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.direct label{font-size:10px;color:#77727f}.direct input{width:100%;margin-top:4px;border:1px solid #e2dfe8;border-radius:9px;padding:8px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.copy{margin-top:10px;width:100%;border:0;border-radius:11px;padding:10px;background:#7557c8;color:#fff;font-weight:800}.copyall{position:sticky;bottom:12px;margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;background:#211f26;color:#fff;font-weight:850;box-shadow:0 6px 18px #0002}.note{font-size:11px;line-height:1.6;color:#817c86;margin-top:16px}.back{display:inline-block;margin-bottom:12px;color:#7557c8;text-decoration:none;font-size:12px;font-weight:800}</style></head><body><main class="wrap"><a class="back" href="./">← FUNY PIN 홈</a><header><div class="title">인포크 노출영역 좌표 설정</div><div class="sub">현재 실제 적용값을 기준으로 홈/리뷰 인포크 영역의 Y 좌표와 높이(H)를 실시간으로 조절할 수 있습니다. 값 조정 후 복사해서 바로 적용하면 됩니다.</div></header><div id="panels"></div><button class="copyall" id="copyAll">전체 설정값 복사</button><p class="note">▲는 위로, ▼는 아래로 이동합니다. Y와 높이는 숫자 직접 입력으로 1px 단위까지 조정할 수 있습니다.</p></main><script>
const SRC='https://link.inpock.co.kr/tcg_map';
const defs=[
{id:'homeRecommend',group:'HOME · 카드샵 추천',title:'홈 · 카드샵 추천',desc:'추천 카드샵 묶음 노출 영역',y:-250,h:950},
{id:'homeReview',group:'HOME · 방문기',title:'홈 · 카드샵 방문기',desc:'깽퐌커플 카드샵 방문기 영역',y:-1606,h:210},
{id:'homeLinks',group:'HOME · 링크',title:'홈 · 링크 모음',desc:'홈 하단 링크 모음 영역',y:-1245,h:340},
{id:'reviewAll',group:'REVIEW',title:'리뷰 · 전체 영역',desc:'리뷰 화면의 인포크 노출 영역',y:-1847,h:1050}
];
const root=document.getElementById('panels');let last='';
root.innerHTML=defs.map(d=>{const g=d.group!==last?`<div class="group">${last=d.group}</div>`:'';return g+`<section class="panel" data-id="${d.id}" data-y="${d.y}" data-h="${d.h}"><h2>${d.title}</h2><p class="desc">${d.desc}</p><div class="crop" style="height:${d.h}px"><iframe src="${SRC}" title="${d.title}" style="--y:${d.y}px" loading="eager" scrolling="no"></iframe></div><div class="controls"><button data-move="-50">▲50</button><button data-move="-10">▲10</button><button data-move="-1">▲1</button><button data-move="1">▼1</button><button data-move="10">▼10</button><button data-move="50">▼50</button></div><div class="hrow"><button data-height="-10">H-10</button><button data-height="-1">H-1</button><button data-height="1">H+1</button><button data-height="10">H+10</button></div><div class="direct"><label>Y 직접 입력<input data-yinput type="number" value="${d.y}"></label><label>H 직접 입력<input data-hinput type="number" min="80" value="${d.h}"></label></div><div class="readout"><span>현재 설정</span><span class="value">Y ${d.y}px · H ${d.h}px</span></div><button class="copy" data-copy>설정값 복사</button></section>`}).join('');
function sync(p){const y=+p.dataset.y,h=+p.dataset.h;p.querySelector('iframe').style.setProperty('--y',y+'px');p.querySelector('.crop').style.height=h+'px';p.querySelector('.value').textContent=`Y ${y}px · H ${h}px`;p.querySelector('[data-yinput]').value=y;p.querySelector('[data-hinput]').value=h}
function text(p){return `${p.dataset.id}: Y ${p.dataset.y}px / H ${p.dataset.h}px`}
async function copy(t,b){try{await navigator.clipboard.writeText(t);const old=b.textContent;b.textContent='복사 완료';setTimeout(()=>b.textContent=old,900)}catch{prompt('아래 값을 복사해주세요',t)}}
root.addEventListener('click',e=>{const p=e.target.closest('.panel');if(!p)return;if(e.target.dataset.move){p.dataset.y=String(+p.dataset.y + +e.target.dataset.move);sync(p)}if(e.target.dataset.height){p.dataset.h=String(Math.max(80,+p.dataset.h + +e.target.dataset.height));sync(p)}if(e.target.matches('[data-copy]'))copy(text(p),e.target)});
root.addEventListener('change',e=>{const p=e.target.closest('.panel');if(!p)return;if(e.target.matches('[data-yinput]'))p.dataset.y=String(+e.target.value||0);if(e.target.matches('[data-hinput]'))p.dataset.h=String(Math.max(80,+e.target.value||80));sync(p)});
document.getElementById('copyAll').onclick=e=>copy([...document.querySelectorAll('.panel')].map(text).join('\n'),e.currentTarget);
</script></body></html>
