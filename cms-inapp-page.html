<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FUNY PIN</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
#page{display:block;width:100%;height:100%;border:0;background:#fff}
#error{display:none;height:100%;align-items:center;justify-content:center;padding:24px;text-align:center;color:#777;font:600 13px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,sans-serif}
</style>
</head>
<body>
<iframe id="page" title="FUNY PIN" allow="geolocation; camera; microphone; clipboard-read; clipboard-write"></iframe>
<div id="error">페이지를 불러오지 못했습니다.</div>
<script>
(()=>{
  const frame=document.getElementById('page'),error=document.getElementById('error');
  const params=new URLSearchParams(location.search),raw=params.get('target')||'';
  const validHost=h=>h==='funypin.kr'||h==='www.funypin.kr';
  let target;
  try{
    target=new URL(raw,location.origin);
    if(!/^https?:$/.test(target.protocol)||!validHost(target.hostname.toLowerCase()))throw new Error('invalid');
    target.protocol='https:';
    target.hostname='funypin.kr';
    target.port='';
  }catch(_){
    frame.style.display='none';error.style.display='flex';return;
  }

  const isApp=params.get('app')==='1';
  if(!isApp){
    location.replace(target.toString());
    return;
  }

  target.searchParams.set('app','1');
  target.searchParams.set('cmsInappPage','1');
  const platform=params.get('appPlatform');
  const appv=params.get('appv');
  if(platform)target.searchParams.set('appPlatform',platform);
  if(appv)target.searchParams.set('appv',appv);

  // Binder owns its app header bridge and must run in the main WebView.
  // The CMS iframe has no Android ReactNativeWebView bridge; forwarding just
  // context would also leave native actions and ACKs targeting the wrong window.
  if(target.pathname==='/binder.html'){
    target.searchParams.delete('cmsInappPage');
    location.replace(target.toString());
    return;
  }

  const css=[
    'html,body{background:#fff!important}',
    'body>header,body>.header,body>.head,.shell>header,.shell>.header,.shell>.head,.page>header,.page>.header,.page>.head,.portal-shell>.portal-header,.portal-header,.app-header,.site-header,.main-header{display:none!important;visibility:hidden!important;opacity:0!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;border:0!important;pointer-events:none!important}',
    '.portal-bottom-nav,.shops-bottom-nav,.mobile-bottom-nav,.bottom-navigation,#bottom-nav,#bottomNav,.funy-lang-switch{display:none!important;visibility:hidden!important;opacity:0!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;border:0!important;pointer-events:none!important}',
    '.live-pin-entry-wrap,.live-pin-detail-entry{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}',
    '.info-tabs{top:0!important}',
    '.filters{top:0!important}',
    'input:not([type="checkbox"]):not([type="radio"]),textarea{font-size:16px!important;-webkit-text-size-adjust:100%!important}'
  ].join('');

  const apply=()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      doc.documentElement.classList.add('app-shell','cms-inapp-page');
      let style=doc.getElementById('__funy_cms_inapp_page__');
      if(!style){style=doc.createElement('style');style.id='__funy_cms_inapp_page__';(doc.head||doc.documentElement).appendChild(style)}
      style.textContent=css;
      if(!doc.__funyCmsInappBound){
        doc.__funyCmsInappBound=true;
        doc.addEventListener('click',e=>{
          const a=e.target&&e.target.closest?e.target.closest('a[target="_blank"]'):null;
          if(a&&a.href){e.preventDefault();frame.contentWindow.location.href=a.href}
        },true);
      }
    }catch(_){}
  };
  frame.addEventListener('load',()=>{apply();setTimeout(apply,50);setTimeout(apply,300)});
  frame.src=target.toString();
})();
</script>
</body>
</html>
