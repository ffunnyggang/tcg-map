<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더카드룸 테스트 쿠폰 확인</title><script src="/web-auth.js?v=20261014-web-auth6"></script><script src="/my-web-common.js?v=20261021-history-scroll1"></script><style>body{font-family:system-ui;margin:24px auto;padding:0 20px;max-width:440px;line-height:1.6}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font:inherit}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#redeem{background:#7554c8;color:white;border:0}button:disabled{opacity:.5}</style></head><body><h2>더카드룸 테스트 쿠폰 확인</h2><p>활성 관리자 계정으로 로그인한 운영자 전용입니다. 고객의 쿠폰 화면과 아래 코드·상품을 대조한 후 확정하세요.</p><form id="form"><label>고객 화면의 운영자 확인용 ID<input id="couponId" required autocomplete="off" placeholder="쿠폰 ID"></label><button id="lookup" disabled>쿠폰 확인 / 상태 다시 조회</button></form><pre id="result" role="status">로그인·권한 확인 중...</pre><button id="redeem" hidden disabled>실물 교환 확인 · 사용 확정</button><script>
(async()=>{
 const A=await FUNY_MY_WEB.ready('/admin-test-cardroom-coupons.html');if(!A)return;
 const input=document.getElementById('couponId'),lookup=document.getElementById('lookup'),result=document.getElementById('result'),redeem=document.getElementById('redeem');
 let current=null,busy=false;
 const rpc=async(name,args)=>{let timer;try{const r=await Promise.race([A.client.rpc(name,args),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('응답을 확인하지 못했습니다. 상태를 다시 조회해주세요.')),15000)})]);if(r.error)throw r.error;return r.data}finally{clearTimeout(timer)}};
 const show=x=>{current=x;redeem.hidden=!x?.can_redeem;redeem.disabled=!x?.can_redeem;result.textContent=x?['상품: '+x.title,'코드: '+(x.code||'-'),'ID: '+x.id,'상태: '+(x.status==='used'?'사용 완료 · 재사용 불가':x.can_redeem?'사용 가능':'사용 불가 / 기간 만료'),'유효기간: '+(x.expires_at?new Date(x.expires_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'제한 없음')].join('\n'):'해당 이벤트 테스트 쿠폰을 찾을 수 없습니다.'};
 const inspect=async id=>{show(await rpc('inspect_test_cardroom_coupon',{p_coupon_id:id}))};
 try{if(await rpc('is_funypin_admin')!==true)throw Error('운영자 권한이 필요합니다.');lookup.disabled=false;result.textContent='고객 화면의 쿠폰 ID를 입력하세요.'}catch(e){result.textContent=e.message;return}
 input.addEventListener('input',()=>{current=null;redeem.hidden=true;redeem.disabled=true});
 document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const id=input.value.trim();if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){result.textContent='올바른 쿠폰 ID를 입력하세요.';return}busy=true;lookup.disabled=true;redeem.disabled=true;try{await inspect(id)}catch(e){show(null);result.textContent='조회 실패: '+e.message}finally{busy=false;lookup.disabled=false}});
 redeem.addEventListener('click',async()=>{if(busy||!current?.can_redeem)return;const x=current;if(!confirm(x.title+' / '+(x.code||'-')+'\n고객 화면과 코드를 대조하고 실물 교환을 확인했나요? 확정 후 다시 사용할 수 없습니다.'))return;busy=true;lookup.disabled=true;redeem.disabled=true;try{await rpc('redeem_test_cardroom_coupon',{p_coupon_id:x.id});await inspect(x.id)}catch(e){current=null;redeem.hidden=true;result.textContent='처리 결과를 확인하지 못했습니다: '+e.message+'\n재사용 처리 전에 반드시 상태를 다시 조회하세요.'}finally{busy=false;lookup.disabled=false}});
})();
</script></body></html>
