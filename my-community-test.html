<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>게시글 관리 TEST | FUNY PIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-test-v1.css?v=20261018-mytest1">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<script src="/my-test-gate.js?v=20261018-mytest1"></script>
</head><body><div class="test-shell">
<header class="test-head"><button class="test-back" onclick="location.href='/my-test.html'" aria-label="뒤로가기">‹</button><div class="test-title">게시글 관리</div><span></span></header>
<main class="test-main">
<div class="test-banner"><span class="test-pill">TEST</span>작성한 게시글·댓글·좋아요한 게시물을 한곳에서 관리합니다.</div>
<div class="tabs"><button class="tab on" data-tab="posts">내 게시글</button><button class="tab" data-tab="comments">내 댓글</button><button class="tab" data-tab="likes">좋아요</button></div>
<div id="root"><div class="loading">활동 내역을 불러오는 중...</div></div>
</main></div><div id="toast" class="toast"></div>
<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],root=$('#root'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const date=v=>v?new Date(v).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,''):'';
 const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)};
 if(!await FUNY_MY_TEST_GATE.ensure(A))returnconst uid=A.session.user.id;
 let posts=[],comments=[],likes=[],postMap={};
 async function load(){
  root.innerHTML='<div class="loading">활동 내역을 불러오는 중...</div>';
  const [p,c,l]=await Promise.all([
   A.client.from('community_posts').select('id,title,category,status,view_count,like_count,comment_count,created_at,updated_at').eq('user_id',uid).order('created_at',{ascending:false}),
   A.client.from('community_comments').select('id,post_id,body,status,created_at,updated_at').eq('user_id',uid).order('created_at',{ascending:false}),
   A.client.from('community_post_likes').select('post_id,created_at').eq('user_id',uid).order('created_at',{ascending:false})
  ]);
  if(p.error)throw p.error;if(c.error)throw c.error;if(l.error)throw l.error;
  posts=p.data||[];comments=c.data||[];likes=l.data||[];
  const ids=[...new Set([...comments.map(x=>x.post_id),...likes.map(x=>x.post_id)].filter(Boolean))];
  postMap={};
  if(ids.length){const q=await A.client.from('community_posts').select('id,title,category,status,author_nickname,created_at').in('id',ids);if(q.error)throw q.error;(q.data||[]).forEach(x=>postMap[x.id]=x)}
  render(current);
 }
 let current=location.hash.replace('#','')||'posts';if(!['posts','comments','likes'].includes(current))current='posts';
 function statusBadge(s){const map={published:['공개','green'],deleted:['삭제','gray'],hidden:['비공개','red']},v=map[s]||[s||'상태','gray'];return '<span class="badge '+v[1]+'">'+esc(v[0])+'</span>'}
 function render(tab){
  current=tab;location.hash=tab;$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  let html='';
  if(tab==='posts') html=posts.length?posts.map(x=>'<article class="item"><div class="item-head">'+statusBadge(x.status)+'<span class="badge gray">'+esc(x.category||'TALK')+'</span><span class="time">'+date(x.created_at)+'</span></div><div class="item-title">'+esc(x.title||'제목 없음')+'</div><div class="item-meta">조회 '+Number(x.view_count||0)+' · 좋아요 '+Number(x.like_count||0)+' · 댓글 '+Number(x.comment_count||0)+'</div><div class="actions"><a class="primary" href="/talk.html#/post/'+esc(x.id)+'">게시글 보기</a>'+(x.status!=='deleted'?'<button class="danger" data-delete-post="'+esc(x.id)+'">삭제</button>':'')+'</div></article>').join(''):'<div class="empty"><strong>작성한 게시글이 없어요</strong>TALK에서 첫 이야기를 남겨보세요.</div>';
  if(tab==='comments') html=comments.length?comments.map(x=>{const p=postMap[x.post_id]||{};return '<article class="item"><div class="item-head">'+statusBadge(x.status)+'<span class="time">'+date(x.created_at)+'</span></div><div class="item-title">'+esc(p.title||'게시글')+'</div><div class="item-body">'+esc(x.body||'')+'</div><div class="actions"><a class="primary" href="/talk.html#/post/'+esc(x.post_id)+'">원문 보기</a><button class="danger" data-delete-comment="'+esc(x.id)+'">댓글 삭제</button></div></article>'}).join(''):'<div class="empty"><strong>작성한 댓글이 없어요</strong>관심 있는 게시물에 의견을 남겨보세요.</div>';
  if(tab==='likes') html=likes.length?likes.map(x=>{const p=postMap[x.post_id]||{};return '<article class="item"><div class="item-head"><span class="badge">좋아요</span><span class="badge gray">'+esc(p.category||'TALK')+'</span><span class="time">'+date(x.created_at)+'</span></div><div class="item-title">'+esc(p.title||'삭제되거나 확인할 수 없는 게시글')+'</div><div class="actions">'+(p.id?'<a class="primary" href="/talk.html#/post/'+esc(x.post_id)+'">게시글 보기</a>':'')+'<button data-unlike="'+esc(x.post_id)+'">좋아요 취소</button></div></article>'}).join(''):'<div class="empty"><strong>좋아요한 게시물이 없어요</strong>마음에 드는 게시물을 저장해보세요.</div>';
  root.innerHTML='<div class="list">'+html+'</div>';bind();
 }
 function bind(){
  $$('[data-delete-post]').forEach(b=>b.onclick=async()=>{if(!confirm('이 게시글을 삭제할까요?'))return;b.disabled=true;const {error}=await A.client.from('community_posts').update({status:'deleted',updated_at:new Date().toISOString()}).eq('id',b.dataset.deletePost).eq('user_id',uid);if(error){alert(error.message);b.disabled=false;return}toast('게시글을 삭제했습니다.');await load()});
  $$('[data-delete-comment]').forEach(b=>b.onclick=async()=>{if(!confirm('이 댓글을 삭제할까요?'))return;b.disabled=true;const {error}=await A.client.from('community_comments').delete().eq('id',b.dataset.deleteComment).eq('user_id',uid);if(error){alert(error.message);b.disabled=false;return}toast('댓글을 삭제했습니다.');await load()});
  $$('[data-unlike]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await A.client.from('community_post_likes').delete().eq('post_id',b.dataset.unlike).eq('user_id',uid);if(error){alert(error.message);b.disabled=false;return}toast('좋아요를 취소했습니다.');await load()});
 }
 $$('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));await load();
})().catch(e=>{document.getElementById('root').innerHTML='<div class="error"><strong>불러오지 못했어요</strong>'+String(e?.message||e)+'</div>'});
</script></body></html>
