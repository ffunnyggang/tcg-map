<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="245" y1="122" x2="314" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A98BF4"/>
      <stop offset=".48" stop-color="#8061DD"/>
      <stop offset="1" stop-color="#6546C5"/>
    </linearGradient>
    <radialGradient id="btnGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 155) rotate(48) scale(34)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE8FA"/>
    </radialGradient>
    <filter id="pinShadow" x="210" y="104" width="150" height="170" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7152C8" flood-opacity=".20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="bubble" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#8A72D8" flood-opacity=".06"/></filter>
  </defs>

  <!-- soft ripple field -->
  <ellipse cx="280" cy="226" rx="57" ry="24" fill="#8D70DF" fill-opacity=".055"/>
  <ellipse cx="280" cy="226" rx="86" ry="39" stroke="#8D70DF" stroke-opacity=".065" stroke-width="10"/>
  <ellipse cx="280" cy="226" rx="122" ry="59" stroke="#8D70DF" stroke-opacity=".048" stroke-width="10"/>
  <ellipse cx="280" cy="226" rx="160" ry="82" stroke="#8D70DF" stroke-opacity=".032" stroke-width="10"/>
  <ellipse cx="280" cy="226" rx="198" ry="109" stroke="#8D70DF" stroke-opacity=".018" stroke-width="10"/>

  <!-- floating dots -->
  <circle cx="220" cy="78" r="5" fill="#9275E8" fill-opacity=".22"/>
  <circle cx="327" cy="128" r="4.5" fill="#9275E8" fill-opacity=".16"/>
  <circle cx="177" cy="214" r="5" fill="#9275E8" fill-opacity=".18"/>
  <circle cx="235" cy="298" r="4" fill="#9275E8" fill-opacity=".11"/>

  <!-- store bubble -->
  <g opacity=".42" filter="url(#bubble)">
    <circle cx="188" cy="112" r="30" fill="#FFFFFF" fill-opacity=".52" stroke="#FFFFFF" stroke-opacity=".7"/>
    <path d="M174 110h27v19h-27zM171 110l4-8h24l5 8M181 110v19M194 110v19" stroke="#8065DF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- chat bubble -->
  <g opacity=".30" filter="url(#bubble)">
    <circle cx="354" cy="100" r="30" fill="#FFFFFF" fill-opacity=".5" stroke="#FFFFFF" stroke-opacity=".68"/>
    <path d="M340 90h28v19h-18l-10 7V90z" stroke="#8065DF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="347" cy="99.5" r="1.7" fill="#8065DF"/>
    <circle cx="354" cy="99.5" r="1.7" fill="#8065DF"/>
    <circle cx="361" cy="99.5" r="1.7" fill="#8065DF"/>
  </g>

  <!-- pin: 20% smaller, tip aligned to ripple origin -->
  <g filter="url(#pinShadow)">
    <ellipse cx="280" cy="226" rx="27" ry="8" fill="#7859D0" fill-opacity=".09" filter="url(#soft)"/>
    <g transform="translate(0 -23) translate(280 179) scale(.8) translate(-280 -179)">
      <path d="M280 130c-27 0-49 22-49 49 0 37 49 87 49 87s49-50 49-87c0-27-22-49-49-49Z" fill="url(#pinGrad)"/>
      <path d="M233 179h31M296 179h31" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="280" cy="179" r="16.5" fill="url(#btnGrad)"/>
      <ellipse cx="258" cy="149" rx="12" ry="6" transform="rotate(-28 258 149)" fill="#FFFFFF" fill-opacity=".18"/>
    </g>
  </g>

  <!-- favorite bubble -->
  <g opacity=".22" filter="url(#bubble)">
    <circle cx="350" cy="247" r="31" fill="#FFFFFF" fill-opacity=".54" stroke="#FFFFFF" stroke-opacity=".72"/>
    <path d="m350 230 5.3 10.8 12 1.8-8.7 8.5 2.1 12-10.7-5.6-10.7 5.6 2.1-12-8.7-8.5 12-1.8 5.3-10.8Z" fill="#8065DF"/>
  </g>
</svg>