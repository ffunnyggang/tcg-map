<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>박스 제품 HOME 미리보기 | FUNY PIN</title><link rel="stylesheet" href="/funy-ui-guide.css"><link rel="stylesheet" href="/web-responsive-420.css"><style>
*{box-sizing:border-box}html{background:#f3f1f5}body{margin:0;color:#181720;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}.page{max-width:420px;min-height:100dvh;background:#fff;margin:auto;padding-bottom:35px}.preview-head{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #eeeaf2;position:sticky;top:0;background:#fff;z-index:10}.preview-head a{display:grid;place-items:center;width:38px;height:38px;font-size:26px;color:#181720;text-decoration:none}.preview-head strong{font-size:17px}.test-info{padding:14px;background:#faf9fd;font-size:12px;line-height:1.6;color:#706779}.block{padding:23px 0 24px;border-bottom:9px solid #f6f5f8;overflow:hidden}.block-title{display:flex;justify-content:space-between;align-items:center;padding:0 16px 15px}.block-title h2{font-size:16px;line-height:1.4;margin:0;font-weight:800}.block-title a{font-size:12px;color:#8d8993;text-decoration:none}.track{display:flex;overflow:auto hidden;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}.group{display:flex;gap:12px;flex-shrink:0;padding-right:12px}.group:first-child{padding-left:16px}.card{display:grid;grid-template-rows:132px 40px 24px;align-content:start;gap:4px;width:126px;min-width:126px;text-decoration:none;color:inherit}.photo{width:126px;height:132px;display:grid;place-items:center}.photo img{width:120px;height:122px;object-fit:contain}.name{font-size:12px;line-height:1.45;font-weight:750;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:40px;max-height:40px;word-break:keep-all}.price{font-size:13px;line-height:24px;height:24px;font-weight:800;color:#8062d8;white-space:nowrap;font-variant-numeric:tabular-nums}.controls{padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.controls label{display:flex;align-items:center;gap:7px;font-size:12px}.controls button{border:1px solid #e6e1ea;background:#fff;border-radius:9px;padding:9px 12px;font:inherit;font-size:12px}.message{padding:15px 16px;color:#8d8993;font-size:12px}.message:empty{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="page"><header class="preview-head"><a href="/" aria-label="이전">‹</a><strong>박스 제품 미리보기</strong></header><div class="test-info">HOME에 공개되지 않는 별도 테스트 화면입니다. 이미지 · 상품명 · 최저가 정렬과 가로 스크롤을 확인할 수 있습니다.</div><section class="block" aria-label="박스 제품"><div class="block-title"><h2>박스 제품</h2><a href="box-list.html">더보기 ›</a></div><div class="track" id="track"></div><div class="message" id="message">상품 데이터를 불러오는 중…</div></section><div class="controls"><label><input type="checkbox" id="auto" checked> 자동 흐름</label><button id="restart" type="button">처음부터</button></div></main><script>
(()=>{const track=document.getElementById('track'),message=document.getElementById('message'),auto=document.getElementById('auto');
const base='https://wdttzpbmqavaqfcbaywj.supabase.co/storage/v1/object/public/box-products/';
const ids=['jp_30th_celebration','jp_storm_emerald','jp_mega_dream_ex','jp_abyss_eye','jp_ninja_spinner','jp_inferno_x','jp_mega_symphonia','jp_mega_brave','jp_white_flare','jp_151'];
const names={jp_30th_celebration:'30th CELEBRATION',jp_storm_emerald:'스톰에메랄다',jp_mega_dream_ex:'MEGA 드림 ex',jp_abyss_eye:'어비스아이',jp_ninja_spinner:'닌자스피너',jp_inferno_x:'인페르노 X',jp_mega_symphonia:'메가심포니아',jp_mega_brave:'메가브레이브',jp_white_flare:'화이트플레어',jp_151:'포켓몬카드 151'};
const local=Promise.all([fetch('data/box-products-v1.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/box-price-candidates-v1.json',{cache:'no-store'}).then(r=>r.json())]);
const latest=fetch('https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/box-price-public').then(r=>r.ok?r.json():{rows:[]}).catch(()=>({rows:[]}));
Promise.all([local,latest]).then(([[catalog,prices],live])=>{
const policy=new Map((live.products||[]).map(p=>[p.product_id,p]));for(const src of prices.sources){for(const id of Object.keys(src.quotes)){if(policy.get(id)?.price_enabled!==true)delete src.quotes[id]}}for(const item of live.rows||[]){if(policy.get(item.product_id)?.price_enabled!==true)continue;for(const src of prices.sources){if(src.source===item.seller)delete src.quotes[item.product_id]}prices.sources.push({source:item.seller,quotes:{[item.product_id]:item.price_krw},price_effective_date:item.price_effective_date})}
const byId=new Map(catalog.products.map(p=>[p.id,p]));
const items=ids.map(id=>{const p=byId.get(id),q=prices.sources.flatMap(s=>Number.isInteger(s.quotes[id])?[s.quotes[id]]:[]);return p&&policy.get(id)?.is_active===true&&p.image_path&&q.length?{...p,price:Math.min(...q)}:null}).filter(Boolean);
if(!items.length){message.textContent='현재 가격이 등록된 BOX 제품이 없습니다.';return}
function makeGroup(){const group=document.createElement('div');group.className='group';for(const p of items){const a=document.createElement('a');a.href='box-detail.html?id='+encodeURIComponent(p.id);a.className='card';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=base+encodeURIComponent(p.image_path);img.alt=p.product_name_ko||p.name||'';img.loading='lazy';photo.append(img);const name=document.createElement('div');name.className='name';name.textContent=names[p.id]||p.product_name_ko||p.name;const price=document.createElement('div');price.className='price';price.textContent='최저 '+p.price.toLocaleString('ko-KR')+'원';a.append(photo,name,price);group.append(a)}return group}
track.append(makeGroup(),makeGroup());message.textContent='';
let last=0,pauseUntil=0;const pause=()=>{pauseUntil=performance.now()+1900};['pointerdown','touchstart','wheel','focusin'].forEach(type=>track.addEventListener(type,pause,{passive:true}));document.getElementById('restart').onclick=()=>{track.scrollLeft=0};
if(matchMedia('(prefers-reduced-motion:reduce)').matches){auto.checked=false;return}
function tick(now){if(last&&auto.checked&&now>pauseUntil&&document.visibilityState==='visible'){const w=track.firstElementChild.getBoundingClientRect().width;track.scrollLeft+=(now-last)*0.028;if(w>0&&track.scrollLeft>=w)track.scrollLeft-=w}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick)
}).catch(e=>{message.textContent='상품 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'})})();
</script></body></html>
