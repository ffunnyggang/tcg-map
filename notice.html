<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공지사항 | FUNY PIN</title>
<meta name="description" content="FUNY PIN 서비스 공지사항을 확인하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f4f7;color:#1d1b22;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.page{width:min(100%,420px);min-height:100vh;margin:0 auto;background:#fff}
.header{position:sticky;top:0;z-index:55;height:58px;padding:0 14px;background:rgba(255,255,255,.96);display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center}
.back{grid-column:1;grid-row:1;display:flex;width:42px;height:58px;align-items:center;justify-content:flex-start;color:#29262e;text-decoration:none;font-size:30px;line-height:1}
.header h1{grid-column:2;grid-row:1;margin:0;font-size:17px;line-height:1.2;font-weight:800;letter-spacing:-.03em;text-align:center}
.page-intro{padding:16px 18px 18px;background:#fff;border-bottom:8px solid #f5f4f7}
.intro-kicker{margin:0 0 8px;color:#8062d8;font-size:10px;font-weight:800;letter-spacing:.2em}
.page-intro p{margin:0;color:#85818b;font-size:13px;line-height:1.6}
.notice-list{padding:8px 18px 28px}
.notice-item{border-bottom:1px solid #eeeaf1}
.notice-toggle{width:100%;min-height:68px;padding:17px 2px;border:0;background:#fff;color:#29262e;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;font:inherit;cursor:pointer}
.notice-title{display:block;font-size:14px;font-weight:780;line-height:1.45;letter-spacing:-.02em}
.notice-date{display:block;margin-top:5px;color:#aaa3af;font-size:10px;font-weight:550}
.arrow{color:#a19aa6;font-size:19px;transition:transform .18s}
.notice-item.open .arrow{transform:rotate(180deg)}
.notice-body{display:none;padding:0 18px 22px 2px;color:#68616d;font-size:12.5px;line-height:1.8;letter-spacing:-.01em;white-space:normal}
.notice-item.open .notice-body{display:block}
.notice-body p{margin:0 0 12px}
.notice-body p:last-child{margin-bottom:0}
.notice-body .emoji-lines{line-height:1.9}
.notice-body strong{color:#514b56}
</style>
</head>
<body>
<main class="page">
<header class="header"><a class="back" href="javascript:history.back()" aria-label="뒤로가기">‹</a><h1>공지사항</h1></header>
<div class="page-intro"><div class="intro-kicker">FUNY PIN · NOTICE</div><p>FUNY PIN의 새로운 소식과 안내를 확인해보세요.</p></div>
<section id="noticeList" class="notice-list" aria-label="공지사항"></section>
</main>
<script>
const BASE='https://wdttzpbmqavaqfcbaywj.supabase.co';
const KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
const FALLBACK_NOTICES=[
 {title:'추석 연휴 카드샵 영업시간 안내',published_at:'2026-09-23T00:00:00+09:00',body:'추석 연휴 기간에는 카드샵별 영업시간과 휴무 일정이 평소와 다를 수 있습니다.\n\nFUNY PIN에 등록된 영업정보도 연휴 기간의 임시 운영시간까지 실시간으로 반영되지 않을 수 있으니, 방문 전에는 꼭 해당 카드샵의 공식 SNS나 매장에 직접 확인해주세요.\n\n즐겁고 편안한 추석 연휴 보내시고, FUNY PIN도 앞으로 더 편리하고 좋은 서비스로 보답하겠습니다 💜\n\nby 깽퐌커플'},
 {title:'FUNY PIN 서비스 안내',published_at:'2026-09-21T00:00:00+09:00',body:'FUNY PIN은 TCG 카드샵 탐색 및 커뮤니티 서비스를 제공하고 있습니다.\n\n카드샵 데이터는 지속적으로 업데이트하고 있으며, 일부 정보는 실제 매장 정보와 다를 수 있습니다.\n\n이용 중 발견한 오류나 잘못된 정보, 개선 의견이 있다면 편하게 제보해주세요 :)'},
 {title:'FUNY PIN 서비스 오픈🎉',published_at:'2026-09-19T00:00:00+09:00',body:'포켓몬카드를 수집하면서 카드샵을 직접 다니다 보니 “카드샵 정보를 한곳에서 편하게 볼 수 있으면 좋겠다”는 생각으로 시작한 FUNY PIN!\n\n아직 부족한 부분도 많고 카드샵 데이터도 계속 업데이트 중이지만, 더 미루지 않고 그냥 오픈합니다 😂\n\n🗺️ TCG 카드샵 지도\n🔍 카드샵 검색 & 필터\n📍 매장 상세정보\n📝 TCG 소식 • 일정 • 방문 리뷰\n💬 FUNY TALK\n\n여러분과 함께 하나씩 채워가는 TCG 서비스로 만들어보겠습니다 💜\n\nby 깽퐌커플'}
];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=value=>{
 const d=new Date(value);if(Number.isNaN(d.getTime()))return '';
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 return parts.year+'.'+parts.month+'.'+parts.day;
};
const bodyHtml=body=>String(body||'').split(/\n{2,}/).filter(Boolean).map(p=>{
 const emoji=/^[🗺️🔍📍📝💬]/u.test(p.trim());
 return '<p'+(emoji?' class="emoji-lines"':'')+'>'+esc(p).replace(/\n/g,'<br>')+'</p>';
}).join('');

function renderNotices(rows){
 const list=document.getElementById('noticeList');
 if(!rows.length){list.innerHTML='<div style="padding:42px 2px;text-align:center;color:#aaa3af;font-size:12px">등록된 공지사항이 없습니다.</div>';return}
 list.innerHTML=rows.map(x=>'<article class="notice-item"><button class="notice-toggle" type="button" aria-expanded="false"><span><span class="notice-title">'+esc(x.title)+'</span><span class="notice-date">'+esc(dateText(x.published_at))+'</span></span><span class="arrow">⌄</span></button><div class="notice-body">'+bodyHtml(x.body)+'</div></article>').join('');
 list.querySelectorAll('.notice-toggle').forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('.notice-item'),open=item.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))}));
}

async function loadNotices(){
 try{
  const now=encodeURIComponent(new Date().toISOString());
  const res=await fetch(BASE+'/rest/v1/notices?select=title,body,published_at,is_pinned&status=eq.published&published_at=lte.'+now+'&order=is_pinned.desc,published_at.desc',{headers:{apikey:KEY,Accept:'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const rows=await res.json();
  renderNotices(Array.isArray(rows)?rows:[]);
 }catch(_){
  renderNotices(FALLBACK_NOTICES);
 }
}
loadNotices();
</script>
</body>
</html>
