name: Install PICK schedule CMS v1
on:
  push:
    paths:
      - '.github/workflows/install-pick-schedule-cms-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject admin script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="cms-pick-schedule-admin.js?v=20260929-1405"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'FUNY PIN'
          git config user.email 'ffunnyggang@gmail.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'wire PICK schedule placement into CMS admin'
          git push
