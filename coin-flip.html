<style>

.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:18px;padding:4px;border:1px solid #e9e3ee;border-radius:14px;background:#f8f6fa}.mode-tab{height:39px;border:0;border-radius:10px;background:transparent;color:#837b88;font-size:12px;font-weight:850;cursor:pointer;transition:.18s ease}.mode-tab.on{background:#fff;color:var(--purple-dark);box-shadow:0 4px 14px rgba(66,48,86,.09)}

.history-card{margin-top:12px;padding:15px;border:1px solid var(--line);border-radius:19px;background:#fff}.history-head{display:flex;align-items:center;gap:8px}.history-title{font-size:12px;font-weight:900}.history-count{font-size:9px;color:#9a929e}.reset-history{margin-left:auto;border:0;background:#f4f1f6;color:#817a86;border-radius:9px;height:29px;padding:0 10px;font-size:9px;font-weight:850;cursor:pointer}.reset-history:disabled{opacity:.45}.history-list{display:flex;gap:7px;overflow-x:auto;padding:12px 1px 2px;scrollbar-width:none}.history-list::-webkit-scrollbar{display:none}.history-empty{width:100%;padding:12px 4px 7px;color:#a098a5;font-size:10.5px;text-align:center}.history-chip{min-width:48px;height:48px;padding:0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:1px solid #e9e3ef;background:#faf8fc}.history-chip.front{background:#f2eefb;border-color:#e0d6f4;color:#684bbb}.history-chip.back{background:#f2f0f3;border-color:#e1dde4;color:#433d47}.history-chip b{font-size:11px;line-height:1.1}.history-chip span{margin-top:3px;font-size:8px;opacity:.68;font-weight:750}
.tip{margin:13px 2px 0;color:#9a929e;font-size:10px;line-height:1.55;text-align:center}.tip b{color:#766e7b}
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px));z-index:100;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:rgba(38,33,43,.92);color:#fff;font-size:11px;font-weight:750;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.22s ease}.toast.show{transform:translate(-50%,0);opacity:1}
@keyframes coinToss{0%{transform:translateY(0) scale(1)}37%{transform:translateY(-54px) scale(1.05)}72%{transform:translateY(-12px) scale(1.01)}100%{transform:translateY(0) scale(1)}}@keyframes shadowToss{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}37%{opacity:.3;transform:translateX(-50%) scale(.55)}72%{opacity:.65;transform:translateX(-50%) scale(.82)}}
@media(max-height:730px){main{padding-top:12px}.mode-tabs{margin-top:13px}.game-card{padding-top:14px}.coin-stage{height:190px}.coin{width:145px;height:145px}.coin-mark{font-size:35px}.coin-mark.wide{font-size:26px}.coin-shadow{bottom:7px}.stats{margin-top:10px}.history-card{margin-top:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.mode-tab,.flip-button,.toast{transition:none}.coin-stage.flipping .coin-rise,.coin-stage.flipping .coin-shadow{animation:none}.coin{transition-duration:.28s!important}}

<script>
(()=>{
  const STORAGE_KEY='funypin-coin-flip-v1';
  const MODES={
    coin:{labels:['앞면','뒷면'],marks:['앞','뒤'],sideNames:['HEADS','TAILS'],button:'코인 던지기',ready:'코인을 던져보세요',desc:'앞면과 뒷면 중 하나를 공정하게 결정해요. 코인을 직접 누르거나 아래 버튼을 눌러주세요.'},
    turn:{labels:['선공','후공'],marks:['선공','후공'],sideNames:['FIRST','SECOND'],button:'선공 · 후공 정하기',ready:'순서를 정해보세요',desc:'TCG 대전의 선공과 후공을 빠르게 결정해요. 코인을 직접 누르거나 아래 버튼을 눌러주세요.'}
  };
  const $=id=>document.getElementById(id);
  const els={coin:$('coin'),stage:$('coinStage'),flip:$('flipButton'),kicker:$('resultKicker'),text:$('resultText'),sub:$('resultSub'),desc:$('pageDesc'),frontMark:$('frontMark'),backMark:$('backMark'),frontName:$('frontName'),backName:$('backName'),frontCount:$('frontCount'),backCount:$('backCount'),frontRate:$('frontRate'),backRate:$('backRate'),frontLabel:$('statFrontLabel'),backLabel:$('statBackLabel'),streakCount:$('streakCount'),streakLabel:$('streakLabel'),historyList:$('historyList'),historyCount:$('historyCount'),reset:$('resetHistory'),toast:$('toast')};
  let state=loadState(),busy=false,currentAngle=0,flipToken=0,toastTimer=0;

  function loadState(){
    try{
      const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
      const mode=raw.mode==='turn'?'turn':'coin';
      const coin=Array.isArray(raw.histories?.coin)?raw.histories.coin.filter(v=>v===0||v===1).slice(-20):[];
      const turn=Array.isArray(raw.histories?.turn)?raw.histories.turn.filter(v=>v===0||v===1).slice(-20):[];
      return{mode,histories:{coin,turn}};
    }catch(_){return{mode:'coin',histories:{coin:[],turn:[]}}}
  }
  function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(_){}}
  function secureRandom(){
    try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0}catch(_){return Math.floor(Math.random()*4294967296)>>>0}
  }
  function labels(){return MODES[state.mode].labels}
  function currentHistory(){return state.histories[state.mode]}
  function setBusy(value){busy=value;els.stage.disabled=value;els.flip.disabled=value;els.flip.textContent=value?'결정 중...':MODES[state.mode].button}
  function showToast(message){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1500)}
  function track(name,params={}){try{window.FUNY_TRACK?.(name,{tool_name:'coin_flip',mode:state.mode,...params})}catch(_){}}
  function alignCoinTo(outcome){
    const base=Math.floor(currentAngle/360)*360;
    currentAngle=base+(outcome===1?180:0);
    els.coin.style.transition='none';
    els.coin.style.transform=`rotateY(${currentAngle}deg) rotateX(7deg)`;
    void els.coin.offsetWidth;
    els.coin.style.removeProperty('transition');
  }
  function setMode(next){
    if(busy||!MODES[next]||next===state.mode)return;
    state.mode=next;saveState();
    document.querySelectorAll('.mode-tab').forEach(button=>{const on=button.dataset.mode===next;button.classList.toggle('on',on);button.setAttribute('aria-selected',String(on))});
    renderMode();renderStats();
    const h=currentHistory();alignCoinTo(h.length?h[h.length-1]:0);
    track('coin_flip_mode_change',{selected_mode:next});
  }
  function renderMode(){
    const m=MODES[state.mode];
    els.desc.textContent=m.desc;els.frontMark.textContent=m.marks[0];els.backMark.textContent=m.marks[1];els.frontName.textContent=m.sideNames[0];els.backName.textContent=m.sideNames[1];
    els.frontMark.classList.toggle('wide',state.mode==='turn');els.backMark.classList.toggle('wide',state.mode==='turn');
    els.frontLabel.textContent=m.labels[0];els.backLabel.textContent=m.labels[1];els.flip.textContent=m.button;
    const h=currentHistory();
    if(h.length){const last=h[h.length-1];els.kicker.textContent='LAST RESULT';els.text.textContent=m.labels[last]+'!';els.text.classList.add('emphasis');els.sub.textContent='코인을 다시 던져 새로운 결과를 확인해보세요.'}
    else{els.kicker.textContent='READY';els.text.textContent=m.ready;els.text.classList.remove('emphasis');els.sub.textContent='결과는 브라우저에서 무작위로 결정됩니다.'}
  }
  function renderStats(){
    const h=currentHistory(),total=h.length,front=h.filter(v=>v===0).length,back=total-front;
    els.frontCount.textContent=String(front);els.backCount.textContent=String(back);els.frontRate.textContent=(total?Math.round(front/total*100):0)+'%';els.backRate.textContent=(total?Math.round(back/total*100):0)+'%';
    let streak=0,last=null;if(total){last=h[total-1];for(let i=total-1;i>=0&&h[i]===last;i--)streak++}
    els.streakCount.textContent=String(streak);els.streakLabel.textContent=last===null?'-':labels()[last];els.historyCount.textContent=total+'회';els.reset.disabled=!total;
    if(!total){els.historyList.innerHTML='<div class="history-empty">아직 결과가 없습니다.</div>';return}
    els.historyList.innerHTML=h.slice().reverse().map((value,index)=>`<div class="history-chip ${value===0?'front':'back'}"><b>${labels()[value]}</b><span>${total-index}번째</span></div>`).join('');
  }
  function finishFlip(outcome,token){
    if(token!==flipToken)return;
    const h=currentHistory();h.push(outcome);if(h.length>20)h.shift();saveState();setBusy(false);els.stage.classList.remove('flipping');
    els.kicker.textContent='RESULT';els.text.textContent=labels()[outcome]+'!';els.text.classList.add('emphasis');els.sub.textContent=state.mode==='turn'?(outcome===0?'이번 게임은 선공으로 시작하세요.':'이번 게임은 후공으로 시작하세요.'):'코인플립 결과가 결정되었습니다.';
    renderStats();try{navigator.vibrate?.([35,35,60])}catch(_){}track('coin_flip_result',{result:outcome===0?'front':'back',flip_count:h.length});
  }
  function flip(){
    if(busy)return;
    const token=++flipToken,outcome=secureRandom()&1,extraSpins=5+(secureRandom()%3),normalized=((currentAngle%360)+360)%360,desired=outcome*180,delta=(desired-normalized+360)%360;
    currentAngle+=extraSpins*360+delta;setBusy(true);els.kicker.textContent='FLIPPING';els.text.textContent='결과 확인 중...';els.text.classList.remove('emphasis');els.sub.textContent='잠시만 기다려주세요.';els.stage.classList.remove('flipping');void els.stage.offsetWidth;els.stage.classList.add('flipping');
    const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches,duration=reduced?320:1320;els.coin.style.transitionDuration=duration+'ms';requestAnimationFrame(()=>{els.coin.style.transform=`rotateY(${currentAngle}deg) rotateX(7deg)`});
    try{navigator.vibrate?.(28)}catch(_){}track('coin_flip_start');setTimeout(()=>finishFlip(outcome,token),duration+70);
  }
  function resetHistory(){
    if(busy||!currentHistory().length)return;
    state.histories[state.mode]=[];saveState();alignCoinTo(0);renderMode();renderStats();showToast('현재 모드의 기록을 초기화했어요.');track('coin_flip_reset');
  }
  $('backButton').addEventListener('click',()=>{try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({type:'NATIVE_BACK'}));return}}catch(_){}if(window.history.length>1)window.history.back();else location.href='./'});
  document.querySelectorAll('.mode-tab').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));
  els.stage.addEventListener('click',flip);els.flip.addEventListener('click',flip);els.reset.addEventListener('click',resetHistory);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy){flipToken++;setBusy(false);els.stage.classList.remove('flipping');renderMode();const h=currentHistory();alignCoinTo(h.length?h[h.length-1]:0)}});
  document.querySelectorAll('.mode-tab').forEach(button=>{const on=button.dataset.mode===state.mode;button.classList.toggle('on',on);button.setAttribute('aria-selected',String(on))});
  renderMode();renderStats();const initial=currentHistory();alignCoinTo(initial.length?initial[initial.length-1]:0);track('coin_flip_view');
})();
</script>
</body>
</html>
