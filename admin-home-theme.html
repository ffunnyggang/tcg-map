<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HOME 시즌 테마 관리 | FUNY PIN</title><style>body{font:14px/1.5 system-ui,sans-serif;background:#f7f5fa;color:#221b29;margin:0}.panel{max-width:460px;margin:35px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 25px #271a3010}h1{font-size:20px;margin:0 0 15px}label{display:block;margin:15px 0}input[type=datetime-local]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd5e6;border-radius:9px}button{background:#8062d8;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:750;cursor:pointer}button:disabled{opacity:.45}.muted{color:#807689;font-size:12px}#status{min-height:22px;margin-top:16px}</style><script src="/web-auth.js"></script></head><body><main class="panel"><h1>🎃 HOME 시즌 테마 관리</h1><p class="muted">관리자 전용. WEB/iOS/AOS HOME에 공통 적용됩니다.</p><form id="f" hidden><label><input id="enabled" type="checkbox"> 할로윈 스킨 ON</label><label>시작 일시 (비워두면 즉시)<input id="start" type="datetime-local"></label><label>종료 일시 (비워두면 수동 종료)<input id="end" type="datetime-local"></label><button type="submit">설정 저장</button><p class="muted">시간은 한국시간(KST) 기준입니다. 화면 반영은 다음 HOME 로드부터 적용됩니다.</p></form><p id="status" role="status">관리자 인증 확인 중...</p><a href="/" class="muted">HOME으로 이동</a></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),status=$('status');const A=window.FUNY_WEB_AUTH;const dateInput=v=>v?new Date(v).toLocaleString('sv-SE',{timeZone:'Asia/Seoul'}).replace(' ','T').slice(0,16):'';const iso=v=>v?new Date(v+':00+09:00').toISOString():null;(async()=>{try{await A.init();const client=A.client;if(!A.session?.user)throw Error('관리자 로그인이 필요합니다.');const auth=await client.rpc('is_funypin_admin');if(auth.error||auth.data!==true)throw Error('관리자 권한이 없습니다.');const {data,error}=await client.from('home_season_theme').select('*').eq('id','default').single();if(error)throw error;$('enabled').checked=!!data.enabled;$('start').value=dateInput(data.start_at);$('end').value=dateInput(data.end_at);$('f').hidden=false;status.textContent='현재 설정을 불러왔습니다.';$('f').onsubmit=async e=>{e.preventDefault();const start=iso($('start').value),end=iso($('end').value);if(start&&end&&start>=end){status.textContent='종료 일시는 시작 이후여야 합니다.';return}const button=$('f').querySelector('button');button.disabled=true;try{const r=await client.from('home_season_theme').update({enabled:$('enabled').checked,theme:'halloween',start_at:start,end_at:end,updated_at:new Date().toISOString()}).eq('id','default').select('id');if(r.error)throw r.error;if(!r.data?.length)throw Error('저장 권한이 없습니다.');status.textContent='저장 완료. HOME을 새로 열어 확인하세요.'}catch(err){status.textContent='저장 실패: '+err.message}finally{button.disabled=false}}}catch(err){status.textContent=err.message||String(err)}})()})();</script></body></html>
