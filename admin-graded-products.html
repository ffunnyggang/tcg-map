<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>등급카드 등록 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-back-align2"><link rel="stylesheet" href="/admin-graded-products.css?v=20261105-accordion1"><script src="/web-auth.js?v=20261018-web-auth10"></script></head>
<body><div class="shell"><header class="funy-sub-header"><a class="funy-sub-back" href="/my.html" aria-label="뒤로가기">‹</a><strong class="funy-sub-title">등급카드 등록</strong></header><main>
<section id="authNotice" class="panel"><p id="authText" role="status">등록 권한을 확인하고 있습니다.</p><button type="button" id="loginBtn" hidden>로그인</button><a href="/admin.html?returnTo=/admin-graded-products.html" id="adminLogin" hidden>운영 관리자 로그인</a></section>
<div id="app" hidden><p id="permissionLink" hidden><a href="/admin-box-permissions.html">관리자 권한 관리 ›</a></p>
<section id="adminShopPicker" class="panel" hidden><label for="adminShopSelect">관리할 카드샵</label><select id="adminShopSelect" aria-label="전체 관리자 카드샵 선택"></select></section>
<div id="noAccess" class="panel" hidden>등급카드 등록 권한이 없습니다. 운영자에게 퍼니핀 가입 이메일과 카드샵명을 전달해주세요.</div>
<div id="shopWorkspaces"></div></div>
<template id="shopWorkspaceTemplate"><section class="shop-workspace"><section class="panel seller"><div class="section-top"><span class="eyebrow">판매 카드샵</span><a href="/products.html?kind=graded">상품 목록 보기 ›</a></div><strong id="shopName"></strong><p id="shopAddress" class="muted"></p></section>
<nav class="workspace-tabs" aria-label="등급카드 관리"><button id="registerTab" type="button" aria-pressed="true">등급카드 등록</button><button id="manageTab" type="button" aria-pressed="false">등록카드 관리</button></nav><div id="managePane" hidden><section class="panel"><div class="section-top"><h2>등록카드 관리</h2><button id="refreshList" type="button" class="text-button">새로고침</button></div><div id="productsList" class="registered-list"></div><p class="muted">카드를 선택해 가격·판매 상태·문의 방식을 수정할 수 있습니다.</p><div class="list-pagination"><button id="prevPage" type="button" class="secondary">이전</button><span id="pageNumber"></span><button id="nextPage" type="button" class="secondary">다음</button></div></section>
</div><div id="registerPane"><ol class="steps" aria-label="상품 등록 순서"><li id="step1" class="on"><b>1</b>PSA 번호</li><li id="step2"><b>2</b>카드정보 확인</li><li id="step3"><b>3</b>판매가격</li></ol>
<section class="panel"><h2>1. PSA 번호 입력</h2><form id="lookupForm"><label for="certNumber">인증번호</label><div class="input-row"><input id="certNumber" type="text" inputmode="numeric" maxlength="15" placeholder="예: 153578569" autocomplete="off" required><button id="lookupBtn" type="submit">카드 조회</button></div></form><p class="muted">포켓몬·원피스 PSA 카드정보를 불러옵니다.</p><p id="lookupStatus" role="status" aria-live="polite"></p></section>
<section id="preview" class="panel" hidden><h2>2. 카드정보 확인</h2><div id="photos" class="photos"></div><div id="cardChips" class="chips"></div><h3 id="cardTitle"></h3><dl id="cardMeta"></dl><p class="source">카드정보·이미지 출처: <a href="https://index.renaissos.com" target="_blank" rel="noopener noreferrer">Renaiss Index</a></p><button id="confirmCard" type="button" class="secondary full">카드정보 확인 · 판매가격 입력</button></section>
<section id="pricePanel" class="panel" hidden><h2>3. 판매가격 입력</h2><form id="registerForm"><label for="priceMode">판매가격</label><select id="priceMode"><option value="fixed">가격 입력</option><option value="inquiry">가격 문의</option></select><label for="salePrice" id="salePriceLabel">판매가격 (원)</label><input id="salePrice" type="text" inputmode="numeric" autocomplete="off" placeholder="판매할 가격을 입력해주세요" required><p id="priceHint" class="muted"></p><label for="contactType">문의하기 연결</label><select id="contactType"><option value="none">미설정</option><option value="phone" disabled>휴대폰번호 (사용 불가)</option><option value="email" disabled>이메일 (사용 불가)</option><option value="instagram">인스타그램</option><option value="visit">매장방문 요청</option></select><label for="contactValue" id="contactLabel" hidden>연락처</label><input id="contactValue" maxlength="300" hidden><p id="contactHelp" class="muted">연락처는 상품 상세에서 구매자에게 공개됩니다.</p><p class="muted">등록하면 퍼니핀 등급카드 목록에 바로 노출됩니다.</p><button type="submit" id="publishBtn" class="full">상품 등록</button></form></section>
<section id="success" class="panel success" role="status" hidden><h2>상품을 등록했습니다.</h2><a id="detailLink" class="button" data-funy-link-mode="inapp" data-funy-inapp-presentation="page">등록한 상품 보기</a><button id="nextCard" type="button" class="secondary">다른 카드 등록</button></section>
</div></section></template>
<div id="toast" role="status" aria-live="polite" hidden></div></main></div><script src="/admin-graded-products.js?v=20261105-accordion1"></script></body></html>
