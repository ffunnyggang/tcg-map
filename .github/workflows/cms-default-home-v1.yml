name: CMS default HOME v1

'on':
  push:
    paths:
      - '.github/workflows/cms-default-home-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CMS default HOME behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          code = '''<script id="cms-default-home-v1">
          (()=>{
            const HOME='home';
            const KEEP_KEY='funypin:cms:keep-current-view';
            const placementSelect=()=>document.querySelector('#cmsPlacement,.cms-placement-select,select[data-cms-placement],select[name="placement"]')||[...document.querySelectorAll('select')].find(el=>[...el.options].some(o=>o.value===HOME));
            const applyHome=()=>{const sel=placementSelect();if(!sel)return false;if(sel.value!==HOME){sel.value=HOME;sel.dispatchEvent(new Event('change',{bubbles:true}));}return true;};
            const keepCurrent=()=>sessionStorage.setItem(KEEP_KEY,'1');
            document.addEventListener('click',e=>{if(e.target.closest('#cmsEditor button,.cms-new,.cms-add,[data-cms-new],[data-cms-add]'))keepCurrent();},true);
            document.addEventListener('submit',e=>{if(e.target.closest('#cmsEditor')||e.target.matches('.cms-form'))keepCurrent();},true);
            window.addEventListener('DOMContentLoaded',()=>{
              if(sessionStorage.getItem(KEEP_KEY)==='1'){sessionStorage.removeItem(KEEP_KEY);return;}
              let tries=0;const t=setInterval(()=>{tries++;if(applyHome()||tries>40)clearInterval(t);},100);
            });
          })();
          </script>'''
          if 'id="cms-default-home-v1"' not in s:
              if marker not in s:
                  raise SystemExit('admin.html closing body not found')
              s = s.replace(marker, code + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q 'cms-default-home-v1' admin.html
          grep -q "const HOME='home'" admin.html
          grep -q 'keep-current-view' admin.html
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'FUNY PIN'
          git config user.email 'ffunnyggang@gmail.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'default CMS block management to HOME while preserving edit context'
          git push
