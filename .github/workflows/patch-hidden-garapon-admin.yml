name: Patch hidden garapon admin

on:
  push:
    paths:
      - '.github/workflows/patch-hidden-garapon-admin.yml'
      - '.github/scripts/patch_hidden_garapon_admin.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_hidden_garapon_admin.py
      - name: Validate
        run: |
          cp admin-garapon-event-test.js /tmp/admin-garapon-event-test.mjs
          node --check /tmp/admin-garapon-event-test.mjs
          grep -q 'refreshDashboard(false)' admin-garapon-event-test.js
          grep -q 'if(!keepForm)renderFeature' admin-garapon-event-test.js
      - name: Commit patch
        run: |
          if git diff --quiet -- admin-garapon-event-test.js; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-garapon-event-test.js
          git commit -m 'fix: preserve hidden garapon admin edits during polling'
          git push
