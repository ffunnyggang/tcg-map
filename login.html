<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>로그인 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#211d27;font-family:'Pretendard Variable',Pretendard,sans-serif}.page{width:min(100%,420px);min-height:100dvh;margin:0 auto;padding:18px 22px 28px;display:flex;flex-direction:column}.head{height:44px;display:flex;align-items:center}.back{width:36px;height:36px;border:0;background:transparent;font-size:30px;color:#332d39}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 0}.logo{width:82px;height:82px;margin-bottom:22px}.hero h1{margin:0;font-size:26px;letter-spacing:-.04em}.hero p{margin:10px 0 0;color:#7b7380;font-size:13px;line-height:1.6}.providers{display:grid;gap:10px}.social{height:54px;border-radius:14px;border:1px solid #ded9e3;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;position:relative}.social .icon{position:absolute;left:18px;font-size:18px}.kakao{background:#fee500;border-color:#fee500;color:#191600}.google{background:#fff;color:#27232c}.terms{margin:14px 4px 0;color:#8f8794;font-size:10px;line-height:1.55;text-align:center}.terms a{color:inherit}.msg{min-height:20px;margin-top:10px;color:#b42318;font-size:11px;text-align:center}</style><script src="/web-auth.js?v=20261014-web-auth4"></script></head><body><main class="page"><div class="head"><button class="back" type="button" aria-label="뒤로가기" onclick="history.length>1?history.back():location.href='/'">‹</button></div><section class="hero"><img class="logo" src="/favicon.svg" alt=""><h1>FUNY PIN</h1><p>로그인하고 관심 매장, 퍼니몬,<br>응모 내역을 한 곳에서 확인하세요.</p></section><div class="providers"><button id="kakao" class="social kakao"><span class="icon">●</span>카카오로 시작하기</button><button id="google" class="social google"><span class="icon">G</span>Google로 시작하기</button></div><p class="terms">계속하면 <a href="/terms.html">이용약관</a>, <a href="/privacy.html">개인정보처리방침</a>, <a href="/community-guidelines.html">커뮤니티 운영정책</a>에 동의한 것으로 간주합니다.</p><div id="msg" class="msg"></div></main><script>(async()=>{const A=window.FUNY_WEB_AUTH,msg=document.getElementById('msg');if(A.isAppShell()){location.replace('/');return}try{await A.init();if(A.session){location.replace(A.consumeReturn()||'/my.html');return}}catch(e){msg.textContent='로그인 상태를 확인하지 못했습니다.'}const run=async p=>{msg.textContent='';try{await A.signInSocial(p)}catch(e){msg.textContent=String(e?.message||'로그인에 실패했습니다.')}};document.getElementById('kakao').onclick=()=>run('kakao');document.getElementById('google').onclick=()=>run('google')})();</script></body></html>
