<style>
*{box-sizing:border-box}html,body{margin:0;background:#f2f0f4;color:#211e25;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff}.head{position:sticky;top:0;z-index:30;height:54px;padding:0 14px;display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:#fff}.back{width:36px;height:36px;border:0;background:transparent;font-size:28px;color:#181720}.ht{text-align:center;font-size:16px;font-weight:900}.page{padding:14px 14px 34px}.notice{padding:11px 12px;border-radius:13px;background:#faf9fc;border:1px solid #ece8ef;color:#817985;font-size:9.5px;line-height:1.55}.section{margin-top:21px}.label{display:block;margin-bottom:8px;font-size:12px;font-weight:900}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{height:40px;border:1px solid #ddd8e2;border-radius:12px;background:#fff;color:#817a85;font-size:11px;font-weight:850}.seg .on{background:#eceaec;border-color:#9f99a3;color:#2e2932}.seg .disabled{opacity:.42}.select{width:100%;height:42px;border:1px solid #d9d3de;border-radius:11px;background:#fff;padding:0 11px;font-size:12px;color:#49434e}.types{display:flex;gap:7px;flex-wrap:wrap}.type{height:36px;padding:0 12px;border:1px solid #ddd7e2;border-radius:12px;background:#fff;color:#716a76;font-size:10px;font-weight:800}.type.on{background:#efedf0;border-color:#aaa3ad;color:#2c2830}.url-row{display:flex;gap:7px}.url{flex:1;min-width:0;height:43px;border:1px solid #d9d3de;border-radius:11px;padding:0 11px;font-size:11px;outline:0}.load{width:70px;border:0;border-radius:11px;background:#17151b;color:#fff;font-size:11px;font-weight:900}.status{margin-top:7px;color:#978f9b;font-size:9.5px}.preview{display:none;margin-top:12px}.preview.show{display:block}.images{display:flex;gap:8px;overflow:hidden}.img,.iph{width:74px;height:82px;flex:0 0 74px;border-radius:11px;background:#f0edf3}.img{object-fit:cover}.iph{display:grid;place-items:center;color:#958c9a;font-size:9px}.pt{margin:12px 4px 0;font-size:18px;font-weight:900}.pp{margin:3px 4px 0;font-size:18px;font-weight:900}.pd{margin:7px 4px 0;color:#665f6a;font-size:11px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.map-box{height:300px;border-radius:15px;overflow:hidden;position:relative;background:#eeeaf2}.map{position:absolute;inset:0}.pin{position:absolute;left:50%;top:50%;z-index:5;width:42px;height:42px;margin:-38px 0 0 -21px;border:3px solid #fff;border-radius:50% 50% 50% 7px;background:#17151b;transform:rotate(-45deg);box-shadow:0 6px 16px rgba(20,18,25,.22);pointer-events:none}.pin:after{content:'₩';position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg);color:#fff;font-size:16px;font-weight:900}.map-tip{position:absolute;left:50%;top:10px;z-index:6;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:9px;font-weight:850;white-space:nowrap;box-shadow:0 4px 14px rgba(30,25,38,.08)}.loc{margin-top:8px;display:flex;align-items:center;gap:8px}.loccopy{flex:1;min-width:0}.lname{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coords{margin-top:3px;color:#a29aa6;font-size:9px}.here{height:34px;border:1px solid #ddd7e2;border-radius:10px;background:#fff;padding:0 10px;font-size:10px;font-weight:850}.submit{width:100%;height:50px;margin-top:25px;border:0;border-radius:14px;background:#17151b;color:#fff;font-size:14px;font-weight:900}.submit:disabled,.load:disabled{opacity:.4}.error{display:none;margin-top:10px;color:#c64f5c;font-size:10px;line-height:1.5}

<body><div class="shell"><header class="head"><button class="back" type="button" onclick="history.back()">‹</button><div class="ht">매물 등록</div><span></span></header>
<main class="page"><div class="notice">1차 MARKET 테스트입니다. <b>팝니다</b>만 지원하며, 실제 거주지가 아닌 만나서 거래하기 편한 장소를 선택해주세요.</div>
<section class="section"><div class="label">거래 유형</div><div class="seg"><button class="on" type="button">팝니다</button><button class="disabled" type="button" disabled>삽니다 · 준비중</button></div></section>
<section class="section"><label class="label" for="category">카테고리</label><select id="category" class="select"><option value="pokemon">포켓몬스터</option><option value="onepiece">원피스</option><option value="dragonball">드래곤볼</option><option value="other">기타</option></select></section>
<section class="section"><div class="label">구분</div><div class="types"><button class="type on" data-type="single" type="button">싱글카드</button><button class="type" data-type="vintage" type="button">빈티지카드</button><button class="type" data-type="graded" type="button">등급카드</button><button class="type" data-type="box" type="button">박스제품</button><button class="type" data-type="other" type="button">기타</button></div></section>
<section class="section"><label class="label" for="url">당근 매물 링크</label><div class="url-row"><input id="url" class="url" value="https://www.daangn.com/articles/1263844918?share=true" placeholder="당근 매물 URL"><button id="load" class="load" type="button">불러오기</button></div><div id="status" class="status">링크를 입력하면 매물 정보를 자동으로 불러옵니다.</div><div id="preview" class="preview"><div id="images" class="images"></div><div id="pt" class="pt"></div><div id="pp" class="pp"></div><div id="pd" class="pd"></div></div></section>
<section class="section"><div class="label">거래 희망 위치</div><div class="map-box"><div id="marketRegisterMap" class="map"></div><div class="map-tip">지도를 움직여 거래 장소를 선택하세요</div><div class="pin"></div></div><div class="loc"><div class="loccopy"><div id="lname" class="lname">위치를 확인하는 중...</div><div id="coords" class="coords"></div></div><button id="here" class="here" type="button">현재 위치로 이동</button></div></section>
<div id="error" class="error"></div><button id="submit" class="submit" type="button" disabled>매물 등록하기</button></main></div>
<script>
(async()=>{const A=window.FUNY_WEB_AUTH,$=q=>document.querySelector(q);const s=await A.init();if(!s){alert('매물 등록은 로그인 후 이용할 수 있어요.');A.goLogin(location.pathname+location.search);return}
let product=null,itemType='single',lat=37.5665,lng=126.9780,locationName='거래 희망 위치',timer=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=new naver.maps.Map('marketRegisterMap',{center:new naver.maps.LatLng(lat,lng),zoom:15,minZoom:7,maxZoom:19,zoomControl:false,mapDataControl:false,scaleControl:false,logoControl:false});setTimeout(()=>naver.maps.Event.trigger(map,'resize'),80);
function err(m){$('#error').textContent=m||'';$('#error').style.display=m?'block':'none'}function images(x){const arr=[...(Array.isArray(x.images)?x.images:[]),x.image].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);const slots=[];for(let i=0;i<4;i++){slots.push(arr[i]?'<img class="img" src="'+esc(arr[i])+'" alt="" referrerpolicy="no-referrer">':'<div class="iph">이미지</div>')}$('#images').innerHTML=slots.join('')}
function preview(x){product=x;$('#preview').classList.add('show');images(x);$('#pt').textContent=x.title||'상품명 없음';$('#pp').textContent=x.price||'가격 정보 없음';$('#pd').textContent=x.description||'상품 설명 없음';$('#submit').disabled=false}
async function load(){const url=$('#url').value.trim();if(!url)return;err('');$('#load').disabled=true;$('#status').textContent='당근 매물 정보를 불러오는 중...';try{const {data,error}=await A.client.functions.invoke('daangn-listing-preview-test',{body:{url}});if(error)throw error;if(!data?.ok)throw Error(data?.error||'매물 정보를 불러오지 못했습니다.');preview(data);$('#status').textContent='자동 추출 완료 · 내용을 확인해주세요.'}catch(e){product=null;$('#preview').classList.remove('show');$('#submit').disabled=true;err(String(e?.message||e));$('#status').textContent='매물 정보를 불러오지 못했습니다.'}finally{$('#load').disabled=false}}
function reverse(){const c=map.getCenter();lat=c.lat();lng=c.lng();$('#coords').textContent=lat.toFixed(6)+', '+lng.toFixed(6);clearTimeout(timer);timer=setTimeout(()=>{if(!naver.maps.Service?.reverseGeocode){$('#lname').textContent=locationName;return}naver.maps.Service.reverseGeocode({coords:c,orders:[naver.maps.Service.OrderType.ROAD_ADDR,naver.maps.Service.OrderType.ADDR].join(',')},(st,res)=>{if(st!==naver.maps.Service.Status.OK){locationName='거래 희망 위치';$('#lname').textContent=locationName;return}const it=res.v2?.results?.[0],rg=it?.region;locationName=it?.land?.name||[rg?.area1?.name,rg?.area2?.name,rg?.area3?.name].filter(Boolean).join(' ')||'거래 희망 위치';$('#lname').textContent=locationName})},180)}
naver.maps.Event.addListener(map,'idle',reverse);reverse();document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('on'));b.classList.add('on');itemType=b.dataset.type});$('#load').onclick=load;$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('#here').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.setCenter(new naver.maps.LatLng(p.coords.latitude,p.coords.longitude));map.setZoom(16)},()=>alert('위치 권한을 확인해주세요.'),{enableHighAccuracy:true,timeout:7000});
$('#submit').onclick=async()=>{if(!product)return;err('');$('#submit').disabled=true;$('#submit').textContent='등록 중...';try{const profile=await A.getProfile(),user=A.session.user,nick=profile?.nickname||user.user_metadata?.nickname||user.user_metadata?.name||('FUNY회원'+String(user.id).replace(/-/g,'').slice(-4).toUpperCase());const raw=String(product.price_raw||'').replace(/,/g,'').trim(),price=raw&&Number.isFinite(Number(raw))?Math.round(Number(raw)):null;const urls=[...(Array.isArray(product.images)?product.images:[]),product.image].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8);const row={seller_user_id:user.id,seller_nickname:nick,provider:'daangn',external_url:product.final_url||product.source_url||$('#url').value.trim(),external_listing_id:product.article_id||null,title:product.title||'당근 매물',description:product.description||null,price,currency:product.currency||'KRW',thumbnail_url:urls[0]||null,image_urls:urls,external_status:product.availability||null,listing_status:'active',listing_side:'sell',tcg_category:$('#category').value,item_type:itemType,country_code:'KR',latitude:lat,longitude:lng,location_name:locationName,fetched_at:product.fetched_at||new Date().toISOString(),updated_at:new Date().toISOString()};const {data,error}=await A.client.from('market_listings').insert(row).select('id').single();if(error)throw error;location.href='/market-detail-test.html?id='+encodeURIComponent(data.id)}catch(e){err(String(e?.message||e));$('#submit').disabled=false;$('#submit').textContent='매물 등록하기'}};load()})();
</script></body></html>
