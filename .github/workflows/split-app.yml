name: Apply Card Nova gallery
on:
  push:
    paths:
      - '.github/workflows/split-app.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery
        run: python3 tools/add_gallery.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Add Card Nova hero gallery" || exit 0
          git push
