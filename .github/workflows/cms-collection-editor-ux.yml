name: Apply CMS collection editor UX
on:
  push:
    paths:
      - '.github/workflows/cms-collection-editor-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collection editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cms-link-enhancements.js')
          s=p.read_text(encoding='utf-8')
          marker='const oldOpen=window.openCmsBlockEditor;'
          if marker not in s: raise SystemExit('marker missing')
          css=""".cms-collection-live{padding:12px!important;text-align:left!important}.cms-collection-live .collection-title{margin:0 0 9px;font-size:13px;font-weight:800;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}.cms-collection-live .collection-grid{display:grid;gap:7px}.cms-collection-live .collection-grid.g2{grid-template-columns:repeat(2,1fr)}.cms-collection-live .collection-grid.g3{grid-template-columns:repeat(3,1fr)}.cms-collection-live .collection-card{display:block;border:1px solid #eee8f0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 6px #0000000a}.cms-collection-live .collection-card img,.cms-collection-live .collection-ph{width:100%;aspect-ratio:1.1;display:block;object-fit:cover;background:#eee}.cms-collection-live .collection-card b{display:block;padding:7px 5px;font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cms-collection-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cms-collection-group{border:1px solid #e8e3eb;border-radius:13px;background:#faf9fb;overflow:hidden}.cms-collection-group.included{border-color:#cfc2ef;background:#f8f5ff}.cms-collection-group-head{padding:10px 12px;border-bottom:1px solid #e8e3eb;font-size:11px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.cms-collection-group.included .cms-collection-group-head{color:#6749bd;border-color:#ddd3f3}.cms-collection-group-body{padding:8px;max-height:310px;overflow:auto}.cms-collection-group .cms-collection-items,.cms-collection-group .cms-item-pick{margin:0}.cms-collection-empty{padding:22px 10px;text-align:center;color:#99919e;font-size:10px}.cms-collection-title-input{min-height:62px!important;resize:none}.cms-collection-align{margin-top:8px}@media(max-width:700px){.cms-collection-groups{grid-template-columns:1fr}}\n"""
          s=s.replace(marker,"const collectionStyle=document.createElement('style');collectionStyle.textContent=`"+css+"`;document.head.appendChild(collectionStyle);\n"+marker,1)
          old="type=block?.block_type||type;if(type!=='link')return oldOpen(block,blockItems,contents,shops,onDone,type,placement);"
          new="type=block?.block_type||type;if(type==='collection')return openEnhancedCollection(block,blockItems,contents,shops,onDone,placement);if(type!=='link')return oldOpen(block,blockItems,contents,shops,onDone,type,placement);"
          if old not in s: raise SystemExit('dispatch marker missing')
          s=s.replace(old,new,1)
          insert="""
function openEnhancedCollection(block,blockItems,contents,shops,onDone,placement){
 placement=block?.placement||placement||'home_news';const old=document.getElementById('cmsEditor');if(old)old.remove();
 let itemIds=blockItems.slice().sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.content_id),style=block?.style||'grid_3',align=block?.title_align||'left';
 const wrap=document.createElement('div');wrap.id='cmsEditor';wrap.className='editor show';wrap.setAttribute('aria-hidden','false');
 const contentOptions=()=>contents.filter(x=>!itemIds.includes(x.id)).map(x=>`<button type="button" data-pick-content="${x.id}">${x.image_url||x.auto_image_url?`<img src="${esc(x.image_url||x.auto_image_url)}" alt="">`:'<span class="cms-block-icon">↗</span>'}<span><b>${esc(x.title)}</b><br><small>${esc(x.target_url||'')}</small></span></button>`).join('')||'<div class="cms-collection-empty">추가 가능한 링크가 없습니다.</div>';
 const collectionHtml=()=>itemIds.map(id=>{const x=contents.find(c=>c.id===id);if(!x)return '';return `<div class="cms-collection-item" data-item-id="${id}"><span>⠿</span>${x.image_url||x.auto_image_url?`<img src="${esc(x.image_url||x.auto_image_url)}" alt="">`:'<span class="cms-block-icon">↗</span>'}<div><b>${esc(x.title)}</b><br><small>${esc(x.target_url||'')}</small></div><button class="cms-icon-btn" data-remove-item="${id}" type="button">×</button></div>`}).join('')||'<div class="cms-collection-empty">아직 포함된 링크가 없습니다.</div>';
 wrap.innerHTML=`<div class="editor-panel"><div class="editor-head"><div><b>컬렉션 블록</b><br><span>${esc(CMS_PLACEMENTS[placement]||placement)}</span></div><button class="editor-close" type="button">×</button></div><div class="editor-body"><div class="editor-section"><h3>미리보기</h3><div id="cmsEditPreview" class="cms-builder-empty cms-collection-live"></div></div><div class="editor-section"><h3>컬렉션 정보</h3><div class="field wide"><label>스타일</label><div class="cms-style-grid"><button type="button" class="cms-style-option ${style==='grid_2'?'on':''}" data-style="grid_2">2열 그리드</button><button type="button" class="cms-style-option ${style==='grid_3'?'on':''}" data-style="grid_3">3열 그리드</button></div></div><div class="field wide"><label>블록 제목 · 최대 2줄</label><textarea id="cmsBlockTitle" class="textarea cms-collection-title-input" rows="2">${esc(block?.title||'')}</textarea><div class="cms-align-row cms-collection-align"><button type="button" data-align="left">좌측</button><button type="button" data-align="center">가운데</button><button type="button" data-align="right">우측</button></div></div><div class="field wide"><label>컬렉션 링크 구성</label><div class="cms-collection-groups"><section class="cms-collection-group included"><div class="cms-collection-group-head"><span>포함된 링크</span><span id="cmsIncludedCount">${itemIds.length}개</span></div><div class="cms-collection-group-body"><div id="cmsCollectionItems" class="cms-collection-items">${collectionHtml()}</div></div></section><section class="cms-collection-group"><div class="cms-collection-group-head"><span>추가 가능한 링크</span><span>클릭하여 추가</span></div><div class="cms-collection-group-body"><div id="cmsItemPick" class="cms-item-pick">${contentOptions()}</div></div></section></div></div><div class="field wide"><label>공개 설정</label><select id="cmsBlockStatus" class="select"><option value="published" ${block?.status==='published'?'selected':''}>바로 공개</option><option value="draft" ${!block||block?.status==='draft'?'selected':''}>임시저장</option><option value="hidden" ${block?.status==='hidden'?'selected':''}>숨김</option></select></div></div><p id="cmsEditorMsg" class="editor-msg"></p></div><div class="editor-foot">${block?'<button id="cmsDelete" class="editor-delete" type="button">삭제</button>':''}<button id="cmsCancel" class="editor-cancel" type="button">취소</button><button id="cmsSave" class="editor-save" type="button">${block?'수정 완료':'추가 완료'}</button></div></div>`;
 document.body.appendChild(wrap);const $e=id=>wrap.querySelector('#'+id),close=()=>wrap.remove();wrap.querySelector('.editor-close').onclick=close;$e('cmsCancel').onclick=close;
 const render=()=>{const title=$e('cmsBlockTitle').value;const cards=itemIds.map(id=>contents.find(c=>c.id===id)).filter(Boolean).map(x=>{const im=x.image_url||x.auto_image_url||'';return `<div class="collection-card">${im?`<img src="${esc(im)}" style="object-position:${x.image_position_x??50}% ${x.image_position_y??50}%;transform:scale(${Math.max(1,Number(x.image_zoom||1))})" alt="">`:'<span class="collection-ph"></span>'}<b>${esc(x.title)}</b></div>`}).join('');$e('cmsEditPreview').innerHTML=`${title?`<h3 class="collection-title" style="text-align:${align}">${esc(title)}</h3>`:''}<div class="collection-grid ${style==='grid_2'?'g2':'g3'}">${cards||'<div class="cms-collection-empty">링크를 추가하면 실제 UI 형태로 미리보기가 표시됩니다.</div>'}</div>`;wrap.querySelectorAll('[data-align]').forEach(b=>b.classList.toggle('on',b.dataset.align===align))};
 const redrawLists=()=>{$e('cmsCollectionItems').innerHTML=collectionHtml();$e('cmsItemPick').innerHTML=contentOptions();$e('cmsIncludedCount').textContent=itemIds.length+'개';bind();render()};
 const bind=()=>{wrap.querySelectorAll('[data-remove-item]').forEach(b=>b.onclick=()=>{itemIds=itemIds.filter(id=>id!==b.dataset.removeItem);redrawLists()});wrap.querySelectorAll('[data-pick-content]').forEach(b=>b.onclick=()=>{itemIds.push(b.dataset.pickContent);redrawLists()})};
 wrap.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;wrap.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('on',x.dataset.style===style));render()});wrap.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>{align=b.dataset.align;render()});$e('cmsBlockTitle').oninput=()=>{let lines=$e('cmsBlockTitle').value.split('\\n');if(lines.length>2)$e('cmsBlockTitle').value=lines.slice(0,2).join('\\n');render()};bind();render();
 if(block)$e('cmsDelete').onclick=async()=>{if(!confirm('이 블록을 삭제할까요?'))return;try{await api('/rest/v1/cms_blocks?id=eq.'+encodeURIComponent(block.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});close();await onDone()}catch(e){$e('cmsEditorMsg').className='editor-msg error';$e('cmsEditorMsg').textContent='삭제 실패: '+e.message}};
 $e('cmsSave').onclick=async()=>{try{$e('cmsSave').disabled=true;const title=$e('cmsBlockTitle').value.trim();const bp={placement,block_type:'collection',title:title||null,style,title_align:align,sort_order:block?.sort_order??999,is_active:true,status:$e('cmsBlockStatus').value,updated_at:new Date().toISOString()};let bid=block?.id;if(bid)await api('/rest/v1/cms_blocks?id=eq.'+encodeURIComponent(bid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(bp)});else{const br=await api('/rest/v1/cms_blocks?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(bp)});bid=br[0].id}await api('/rest/v1/cms_block_items?block_id=eq.'+encodeURIComponent(bid),{method:'DELETE',headers:{Prefer:'return=minimal'}});if(itemIds.length)await api('/rest/v1/cms_block_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(itemIds.map((id,i)=>({block_id:bid,content_id:id,sort_order:(i+1)*10,is_active:true})))});close();await onDone()}catch(e){$e('cmsSave').disabled=false;$e('cmsEditorMsg').className='editor-msg error';$e('cmsEditorMsg').textContent='저장 실패: '+e.message}};
}
"""
          idx=s.rfind('\n})();')
          if idx<0: raise SystemExit('footer missing')
          s=s[:idx]+insert+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "FUNY PIN"
          git config user.email "ffunnyggang@gmail.com"
          git add cms-link-enhancements.js
          git commit -m "improve CMS collection block editor UX"
          git push
