name: Verify FUNY PIN SVG brand icon

on:
  push:
    paths:
      - 'favicon.svg'
      - 'apple-touch-icon.png'
      - 'favicon.ico'
      - '*.html'
      - '.github/workflows/seo-platform-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy raster icon removal and SVG parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          legacy_files = [Path('apple-touch-icon.png'), Path('favicon.ico')]
          existing = [str(p) for p in legacy_files if p.exists()]
          if existing:
              raise SystemExit('Legacy raster icon files still exist: ' + ', '.join(existing))

          workflow = '.github/workflows/seo-platform-fix.yml'
          text_suffixes = {'.html', '.htm', '.js', '.ts', '.tsx', '.css', '.json', '.xml', '.md', '.yml', '.yaml'}
          refs = []
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          for name in tracked:
              if not name or name == workflow or '/node_modules/' in f'/{name}/':
                  continue
              path = Path(name)
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'apple-touch-icon.png' in text or 'favicon.ico' in text:
                  refs.append(name)
          if refs:
              raise SystemExit('Legacy raster icon references remain: ' + ', '.join(refs))

          svg = Path('favicon.svg').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          marker_path = 'M18 2.8A10.5 10.5 0 0 0 7.5 13.3c0 7.7 10.5 17.8 10.5 17.8s10.5-10.1 10.5-17.8A10.5 10.5 0 0 0 18 2.8Z'
          required_svg = ['viewBox="0 0 36 40"', marker_path, 'ellipse cx="18" cy="36.2"', 'funyPinButton']
          missing = [item for item in required_svg if item not in svg]
          if missing:
              raise SystemExit('favicon.svg does not match the HOME header SVG: ' + ', '.join(missing))
          if marker_path not in home or '/favicon.svg' not in home:
              raise SystemExit('HOME header SVG or SVG favicon link is missing')
          print('FUNY PIN SVG brand icon verification passed')
          PY
