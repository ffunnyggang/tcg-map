<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INFO 좌표 설정 | FUNY PIN</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#242128;font-family:'Pretendard Variable',Pretendard,sans-serif}.page{width:min(100%,420px);min-height:100vh;margin:auto;background:#fff}.head{padding:18px;border-bottom:8px solid #f5f4f7}.back{font-size:30px;color:#29262e;text-decoration:none}.brand{margin-top:12px;color:#8062d8;font-size:10px;font-weight:800;letter-spacing:.18em}.head h1{margin:7px 0 5px;font-size:24px}.head p{margin:0;color:#8d8792;font-size:12px;line-height:1.55}.controls{padding:18px;border-bottom:8px solid #f5f4f7}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;margin-bottom:7px;font-size:11px;color:#77717c}.field input{width:100%;height:42px;border:1px solid #ddd8e2;border-radius:10px;padding:0 11px;font:inherit;font-size:13px}.value{margin:13px 0 0;padding:11px;border-radius:10px;background:#f7f4fc;color:#6749bd;font-size:11px;line-height:1.55}.preview-title{padding:16px 18px 10px;font-size:12px;font-weight:800}.preview{width:100%;overflow:hidden;background:#fff}.crop{position:relative;width:100%;overflow:hidden;height:900px}.crop iframe{position:absolute;left:0;top:0;width:100%;height:4200px;border:0;transform:translateY(-3420px);transform-origin:top left}</style></head><body><main class="page"><header class="head"><a class="back" href="./reviews.html">‹</a><div class="brand">FUNY PIN · INFO SETTING</div><h1>CREATOR 좌표 설정</h1><p>Y 좌표와 표시 높이를 조절하면서 인포크 영역을 확인할 수 있어요.</p></header><section class="controls"><div class="row"><div class="field"><label for="y">Y 좌표</label><input id="y" type="number" value="-3420" step="5"></div><div class="field"><label for="h">표시 높이</label><input id="h" type="number" value="900" min="100" step="10"></div></div><div class="value" id="value"></div></section><div class="preview-title">미리보기</div><section class="preview"><div class="crop" id="crop"><iframe id="frame" src="https://link.inpock.co.kr/tcg_map" title="CREATOR 좌표 미리보기" scrolling="no"></iframe></div></section></main><script>const y=document.getElementById('y'),h=document.getElementById('h'),crop=document.getElementById('crop'),frame=document.getElementById('frame'),value=document.getElementById('value');function apply(){const yy=Number(y.value)||0,hh=Math.max(100,Number(h.value)||900);crop.style.height=hh+'px';frame.style.transform='translateY('+yy+'px)';value.textContent='CREATOR: Y '+yy+' / H '+hh+'  →  이 값을 알려주면 실제 INFO 페이지에 적용할게요.'}[y,h].forEach(el=>el.addEventListener('input',apply));apply();</script></body></html>
