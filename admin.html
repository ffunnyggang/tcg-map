<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN | 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#28232e;font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:40px}.head{height:58px;padding:0 14px;display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #f0edf2}.head strong{font-size:20px}.test{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f0e9ff;color:#7557c8;font-size:10px;font-weight:800}.box{margin:18px 14px;padding:16px;border:1px solid #ece8ef;border-radius:17px}.box h1{font-size:20px;margin:0 0 5px}.sub{font-size:11px;color:#918996;line-height:1.5;margin:0 0 14px}.input{width:100%;height:45px;border:1px solid #e4dfe8;border-radius:12px;padding:0 12px;margin:0 0 9px;font-size:14px}.primary{width:100%;height:45px;border:0;border-radius:12px;background:#28232e;color:#fff;font-weight:800}.toolbar{display:none;padding:14px;gap:8px;align-items:center}.toolbar.show{display:flex}.toolbar b{font-size:13px}.toolbar button{margin-left:auto;border:0;background:#f4f1f6;border-radius:9px;padding:7px 10px;font-size:10px}.admin-tabs{display:none;padding:0 14px 14px;gap:7px}.admin-tabs.show{display:grid;grid-template-columns:repeat(3,1fr)}.admin-tabs button{height:40px;border:1px solid #e4dfe8;border-radius:11px;background:#fff;color:#716b79;font-size:11px;font-weight:800}.admin-tabs button.on{border-color:#8062d8;background:#f3effc;color:#6749bd}.feed{padding:0 14px}.card{padding:14px;margin-bottom:10px;border:1px solid #ece8ef;border-radius:16px}.top{display:flex;gap:7px;align-items:center}.reason{font-size:12px;font-weight:850}.flag-count{font-size:9px;font-weight:850;padding:4px 7px;border-radius:999px;background:#f0e9ff;color:#7557c8}.time{font-size:9px;color:#aaa3af}.status{margin-left:auto;font-size:9px;padding:4px 7px;border-radius:999px;background:#fff3df;color:#a16b14}.status.done{background:#edf8f0;color:#4d8c60}.shop{margin:10px 0 5px;font-size:14px;font-weight:850}.meta,.body{font-size:11px;color:#716a76;line-height:1.5}.body{margin-top:8px;padding:10px;background:#faf8fc;border-radius:10px;color:#514b56}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}.actions button{border:1px solid #e4dfe8;background:#fff;border-radius:9px;padding:8px 3px;font-size:9px}.actions .hide-post{border-color:#efc7cc;color:#b42318;background:#fff7f8}.hidden-badge{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:999px;background:#f5e9eb;color:#a33b48;font-size:9px;font-weight:800}.empty{padding:35px 10px;text-align:center;color:#9c949f;font-size:12px}.error{color:#b42318}.request-type{font-size:9px;font-weight:850;padding:4px 7px;border-radius:999px;background:#f0e9ff;color:#7557c8}.request-grid{display:grid;gap:5px;margin-top:9px;font-size:11px;line-height:1.55;color:#716a76}.request-grid b{color:#403a45}.request-images{display:flex;gap:7px;overflow:auto;margin-top:10px}.request-images img{width:76px;height:76px;flex:none;border-radius:10px;object-fit:cover;background:#f5f3f7}.request-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}.request-actions button{border:1px solid #e4dfe8;background:#fff;border-radius:9px;padding:8px 3px;font-size:9px}.request-actions button.on{border-color:#8062d8;background:#f3effc;color:#6749bd;font-weight:800}.event-tools{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:10px}.event-tools .input{margin:0}.event-refresh{height:45px;border:0;border-radius:11px;background:#28232e;color:#fff;padding:0 13px;font-size:10px;font-weight:800}.event-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.event-stat{padding:13px;border-radius:13px;background:#f7f4fb}.event-stat b{display:block;font-size:22px}.event-stat span{font-size:9px;color:#948c99}.event-export{width:100%;height:40px;margin-bottom:10px;border:1px solid #e4dfe8;border-radius:10px;background:#fff;font-size:10px;font-weight:800}.event-id{font-size:13px;font-weight:850}.event-time{margin-top:4px;font-size:9px;color:#aaa3af}.hidden{display:none}
</style></head><body><main class="shell"><header class="head"><strong>FUNY PIN 관리자</strong><span class="test">ADMIN</span></header>
<section id="login" class="box"><h1>관리자 로그인</h1><p class="sub">Supabase에 등록한 FUNY PIN 관리자 계정으로 로그인하세요.</p><input id="email" class="input" type="email" autocomplete="username" placeholder="이메일"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginBtn" class="primary">로그인</button><p id="loginMsg" class="sub" style="margin-top:10px"></p></section>
<div id="toolbar" class="toolbar"><b id="toolbarTitle">LIVE PIN 신고 관리</b><button id="logout">로그아웃</button></div><nav id="adminTabs" class="admin-tabs"><button class="on" data-admin-tab="live">LIVE PIN 신고</button><button data-admin-tab="shop">매장 등록·수정 요청</button><button data-admin-tab="event">이벤트 응모</button></nav><section id="feed" class="feed"></section></main>
<script>
let adminTab='live';
const BASE='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';let token='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.message||('HTTP '+r.status))}return r.status===204?null:r.json()}
async function login(){const b=$('loginBtn');b.disabled=true;b.textContent='로그인 중...';$('loginMsg').textContent='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.access_token;sessionStorage.setItem('funypin_admin_token',token);await verify()}catch(e){$('loginMsg').className='sub error';$('loginMsg').textContent='로그인 실패: '+e.message}finally{b.disabled=false;b.textContent='로그인'}}
async function verify(){try{const rows=await api('/rest/v1/admin_users?select=user_id&limit=1');if(!rows.length)throw new Error('관리자 권한이 없는 계정입니다.');$('login').classList.add('hidden');$('toolbar').classList.add('show');$('adminTabs').classList.add('show');await load()}catch(e){token='';sessionStorage.removeItem('funypin_admin_token');$('login').classList.remove('hidden');$('toolbar').classList.remove('show');$('adminTabs').classList.remove('show');$('loginMsg').className='sub error';$('loginMsg').textContent=e.message}}
async function load(){if(adminTab==='shop')return loadShopRequests();if(adminTab==='event')return loadEventEntries();const f=$('feed');f.innerHTML='<div class="empty">불러오는 중...</div>';try{const flags=await api('/rest/v1/live_report_flags?select=*&order=created_at.desc&limit=100');if(!flags.length){f.innerHTML='<div class="empty">접수된 신고가 없습니다.</div>';return}const ids=[...new Set(flags.map(x=>x.report_id))].join(',');let reports=[];if(ids)reports=await api('/rest/v1/live_reports?select=id,shop_name,post_type,category,status,content,created_at,is_hidden&id=in.('+ids+')');const map=Object.fromEntries(reports.map(x=>[x.id,x])),counts=flags.reduce((a,x)=>(a[x.report_id]=(a[x.report_id]||0)+1,a),{}),seen=new Set();f.innerHTML='';flags.forEach(x=>{if(seen.has(x.report_id))return;seen.add(x.report_id);const r=map[x.report_id]||{},c=document.createElement('article');c.className='card';c.innerHTML='<div class="top"><span class="reason">'+esc(x.reason)+'</span>'+(counts[x.report_id]>1?'<span class="flag-count">신고 '+counts[x.report_id]+'건</span>':'')+'<span class="time">'+new Date(x.created_at).toLocaleString('ko-KR')+'</span><span class="status '+(x.admin_status!=='pending'?'done':'')+'">'+esc(x.admin_status)+'</span></div><div class="shop">📍 '+esc(r.shop_name||'삭제된 게시물')+'</div><div class="meta">'+esc((r.post_type==='request'?'정보 요청':'현장 제보')+' · '+(r.category||''))+'</div><div class="body">'+esc(r.status||'')+(r.status&&r.content?'<br>':'')+esc(r.content||'내용 없음')+'</div><div class="actions"><button data-id="'+x.id+'" data-status="reviewed">확인</button><button data-id="'+x.id+'" data-status="dismissed">문제없음</button><button data-id="'+x.id+'" data-status="actioned">조치완료</button></div>';f.appendChild(c)});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status));document.querySelectorAll('.hide-post').forEach(b=>b.onclick=()=>hidePost(b.dataset.flag,b.dataset.report,b.dataset.reason))}catch(e){f.innerHTML='<div class="empty error">신고 조회 실패: '+esc(e.message)+'</div>'}}
async function signedImage(path){if(!path)return null;const d=await api('/storage/v1/object/sign/shop-request-images/'+path,{method:'POST',body:JSON.stringify({expiresIn:3600})});return d.signedURL?BASE+'/storage/v1'+d.signedURL:null}
async function loadShopRequests(){const f=$('feed');f.innerHTML='<div class="empty">불러오는 중...</div>';try{const rows=await api('/rest/v1/shop_requests?select=*&order=created_at.desc&limit=100');if(!rows.length){f.innerHTML='<div class="empty">접수된 매장 요청이 없습니다.</div>';return}f.innerHTML='';for(const r of rows){const paths=[r.logo_path,...(r.photo_paths||[])].filter(Boolean),urls=[];for(const p of paths){try{const u=await signedImage(p);if(u)urls.push(u)}catch(_){}}const c=document.createElement('article');c.className='card';const statusName={received:'접수',reviewing:'검토중',completed:'반영완료'}[r.status]||r.status;c.innerHTML='<div class="top"><span class="request-type">'+(r.request_type==='edit'?'정보 수정':'신규 등록')+'</span><span class="time">'+new Date(r.created_at).toLocaleString('ko-KR')+'</span><span class="status '+(r.status==='completed'?'done':'')+'">'+esc(statusName)+'</span></div><div class="shop">'+esc(r.shop_name)+'</div><div class="request-grid"><div><b>주소</b> '+esc(r.address)+'</div>'+(r.items?.length?'<div><b>취급</b> '+esc(r.items.join(', '))+'</div>':'')+(r.hours?'<div><b>영업시간</b> '+esc(r.hours)+'</div>':'')+(r.instagram?'<div><b>SNS/웹</b> '+esc(r.instagram)+'</div>':'')+(r.phone?'<div><b>전화</b> '+esc(r.phone)+'</div>':'')+(r.contact?'<div><b>요청자 연락처</b> '+esc(r.contact)+'</div>':'')+(r.detail?'<div class="body">'+esc(r.detail)+'</div>':'')+'</div>'+(urls.length?'<div class="request-images">'+urls.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="첨부 이미지 '+(i+1)+'"></a>').join('')+'</div>':'')+'<div class="request-actions"><button data-request-id="'+r.id+'" data-request-status="received" class="'+(r.status==='received'?'on':'')+'">접수</button><button data-request-id="'+r.id+'" data-request-status="reviewing" class="'+(r.status==='reviewing'?'on':'')+'">검토중</button><button data-request-id="'+r.id+'" data-request-status="completed" class="'+(r.status==='completed'?'on':'')+'">반영완료</button></div>';f.appendChild(c)}document.querySelectorAll('[data-request-status]').forEach(b=>b.onclick=()=>setRequestStatus(b.dataset.requestId,b.dataset.requestStatus))}catch(e){f.innerHTML='<div class="empty error">매장 요청 조회 실패: '+esc(e.message)+'</div>'}}

let eventRows=[];
async function loadEventEntries(){
 const f=$('feed');f.innerHTML='<div class="empty">불러오는 중...</div>';
 try{
  eventRows=await api('/rest/v1/live_reports?select=id,content,created_at,client_id,status&shop_id=eq.EV-CARDVAULT-2026&status=eq.EVENT_ENTRY&order=created_at.desc&limit=1000');
  renderEventEntries('');
 }catch(e){f.innerHTML='<div class="empty error">이벤트 응모 조회 실패: '+esc(e.message)+'</div>'}
}
function renderEventEntries(query){
 const f=$('feed'),q=(query||'').trim().toLowerCase(),filtered=eventRows.filter(x=>(x.content||'').toLowerCase().includes(q));
 const unique=new Set(eventRows.map(x=>(x.content||'').toLowerCase()).filter(Boolean));
 f.innerHTML='<div class="event-tools"><input id="eventSearch" class="input" type="search" placeholder="인스타그램 아이디 검색" value="'+esc(query||'')+'"><button id="eventRefresh" class="event-refresh">새로고침</button></div><div class="event-stats"><div class="event-stat"><b>'+eventRows.length+'</b><span>전체 응모</span></div><div class="event-stat"><b>'+unique.size+'</b><span>고유 인스타 ID</span></div></div><button id="eventCsv" class="event-export">CSV 내보내기</button><div id="eventList"></div>';
 const list=$('eventList');
 if(!filtered.length){list.innerHTML='<div class="empty">표시할 응모자가 없습니다.</div>'}
 else{
  const counts={};eventRows.forEach(x=>{const k=(x.content||'').toLowerCase();counts[k]=(counts[k]||0)+1});
  list.innerHTML=filtered.map(x=>{const k=(x.content||'').toLowerCase();return '<article class="card"><div class="top"><div class="event-id">@'+esc(x.content||'')+'</div>'+(counts[k]>1?'<span class="flag-count">중복 '+counts[k]+'건</span>':'')+'</div><div class="event-time">'+new Date(x.created_at).toLocaleString('ko-KR')+'</div></article>'}).join('');
 }
 $('eventSearch').oninput=e=>renderEventEntries(e.target.value);
 $('eventRefresh').onclick=loadEventEntries;
 $('eventCsv').onclick=exportEventCsv;
}
function exportEventCsv(){
 const csv=['instagram_id,entered_at'].concat(eventRows.map(x=>'"'+String(x.content||'').replaceAll('"','""')+'","'+String(x.created_at||'').replaceAll('"','""')+'"')).join('\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='cardvault-event-entries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
async function setRequestStatus(id,status){try{await api('/rest/v1/shop_requests?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});await loadShopRequests()}catch(e){alert('상태 변경 실패: '+e.message)}}
async function hidePost(flagId,reportId,reason){if(!confirm('문제가 있는 게시물로 판단하고 LIVE PIN에서 숨길까요?\n\n원문과 신고 기록은 DB에 유지됩니다.'))return;try{const now=new Date().toISOString();await api('/rest/v1/live_reports?id=eq.'+encodeURIComponent(reportId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_hidden:true,hidden_at:now,hidden_reason:reason})});await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(flagId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:'actioned',reviewed_at:now})});await load()}catch(e){alert('숨김 처리 실패: '+e.message)}}
async function setStatus(id,status){try{const rows=await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(id)+'&select=report_id&limit=1');if(!rows.length)throw new Error('신고 정보를 찾지 못했습니다.');await api('/rest/v1/live_report_flags?report_id=eq.'+encodeURIComponent(rows[0].report_id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:status,reviewed_at:new Date().toISOString()})});await load()}catch(e){alert('처리 실패: '+e.message)}}
document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.adminTab;document.querySelectorAll('[data-admin-tab]').forEach(x=>x.classList.toggle('on',x===b));$('toolbarTitle').textContent=adminTab==='live'?'LIVE PIN 신고 관리':adminTab==='shop'?'매장 등록·수정 요청':'카드볼트 이벤트 응모';load()});
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{token='';sessionStorage.removeItem('funypin_admin_token');location.reload()};token=sessionStorage.getItem('funypin_admin_token')||'';if(token)verify();
</script></body></html>
