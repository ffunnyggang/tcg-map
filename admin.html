async function refreshSession(){
 if(!refreshToken)throw new Error('관리자 세션이 만료되었습니다. 다시 로그인해주세요.');

function bindShopIdControls(shop){
 const country=$('country_code'),region=$('region_code'),custom=$('region_custom'),id=$('shop_id');if(!country||!region||!custom||!id)return;
 const originalCountry=String(shop.country_code||'KR').toUpperCase(),originalRegion=String(shop.region_code||'').toUpperCase();
 country.value=originalCountry;
 function fillRegions(preferred){
   const opts=REGION_OPTIONS[country.value]||REGION_OPTIONS.KR,known=opts.some(([v])=>v===preferred);
   region.innerHTML=opts.map(([v,label])=>'<option value="'+v+'">'+label+'</option>').join('');
   region.value=known?preferred:'OTHER';custom.classList.toggle('show',region.value==='OTHER');custom.value=known?'':preferred;
 }
 function currentRegion(){return region.value==='OTHER'?custom.value.trim().toUpperCase():region.value}
 function syncId(){
   if(!isNewShop)return;
   const code=currentRegion();
   custom.value=custom.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
   if(code.length===3)id.value=nextShopId(country.value,code);else id.value=country.value+'-'+(code||'---')+'-___';
 }
 fillRegions(originalRegion||((REGION_OPTIONS[originalCountry]||[])[0]?.[0]||''));
 if(isNewShop){
   country.addEventListener('change',()=>{fillRegions((REGION_OPTIONS[country.value]||[])[0]?.[0]||'');syncId();renderCoordPreview()});
   region.addEventListener('change',()=>{custom.classList.toggle('show',region.value==='OTHER');if(region.value!=='OTHER')custom.value='';syncId()});
   custom.addEventListener('input',syncId);
   syncId();
 }else{
   custom.classList.toggle('show',region.value==='OTHER');
 }
}

function renderImagePreviews(){const p=$('primaryImagePreview'),g=$('galleryImagePreview');if(p){if(!editorImageState.primary)p.innerHTML='<div class="image-empty">등록된 대표 이미지가 없습니다.</div>';else{const src=imagePreviewUrl(editorImageState.primary);p.innerHTML='<div class="image-preview-list"><div class="image-preview-card"><img src="'+esc(src)+'" alt="대표 이미지 미리보기"><div class="image-actions"><button class="remove" type="button" data-image-remove-primary>삭제</button></div></div></div>';p.querySelector('[data-image-remove-primary]').onclick=()=>removeImageItem('primary')}}if(g){if(!editorImageState.gallery.length)g.innerHTML='<div class="image-empty">등록된 상세 이미지가 없습니다.</div>';else g.innerHTML='<div class="image-preview-list">'+editorImageState.gallery.map((item,i)=>'<div class="image-preview-card"><img src="'+esc(imagePreviewUrl(item))+'" alt="상세 이미지 '+(i+1)+' 미리보기"><div class="image-actions"><button type="button" data-image-left="'+i+'">←</button><button type="button" data-image-right="'+i+'">→</button><button class="remove" type="button" data-image-remove="'+i+'">×</button></div></div>').join('')+'</div>';g.querySelectorAll('[data-image-left]').forEach(b=>b.onclick=()=>moveGalleryImage(Number(b.dataset.imageLeft),-1));g.querySelectorAll('[data-image-right]').forEach(b=>b.onclick=()=>moveGalleryImage(Number(b.dataset.imageRight),1));g.querySelectorAll('[data-image-remove]').forEach(b=>b.onclick=()=>removeImageItem('gallery',Number(b.dataset.imageRemove)))}}
function bindImageUploadTools(){const p=$('primary_image_file'),g=$('gallery_image_files'),legacyP=$('primary_image'),legacyG=$('gallery_images');if(p)p.onchange=()=>{try{const file=p.files?.[0];if(!file)return;validateImageFile(file);if(editorImageState.primary?.storage&&editorImageState.primary.url)editorImageState.removedStorageUrls.push(editorImageState.primary.url);editorImageState.primary={file,url:'',storage:false};renderImagePreviews()}catch(e){alert(e.message);p.value=''}};if(g)g.onchange=()=>{try{const files=[...(g.files||[])];files.forEach(validateImageFile);editorImageState.gallery.push(...files.map(file=>({file,url:'',storage:false})));renderImagePreviews();g.value=''}catch(e){alert(e.message);g.value=''}};legacyP?.addEventListener('input',()=>{if(editorImageState.primary?.file)return;editorImageState.primary=legacyP.value.trim()?{url:legacyP.value.trim(),storage:legacyP.value.includes('/storage/v1/object/public/'+SHOP_IMAGE_BUCKET+'/'),file:null}:null;renderImagePreviews()});legacyG?.addEventListener('change',()=>{if(editorImageState.gallery.some(x=>x.file))return;editorImageState.gallery=legacyG.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(url=>({url,storage:url.includes('/storage/v1/object/public/'+SHOP_IMAGE_BUCKET+'/'),file:null}));renderImagePreviews()});renderImagePreviews()}
function encodeStoragePath(path){return String(path).split('/').map(encodeURIComponent).join('/')}
function storageObjectPathFromUrl(url){const marker='/storage/v1/object/public/'+SHOP_IMAGE_BUCKET+'/';const i=String(url||'').indexOf(marker);return i<0?null:decodeURIComponent(String(url).slice(i+marker.length))}
async function storageFetch(path,opt={},retried=false){const headers={apikey:KEY,Authorization:'Bearer '+token,...(opt.headers||{})};let r=await fetch(BASE+'/storage/v1/'+path,{...opt,headers});if(!r.ok&&!retried&&r.status===401){await refreshSession();return storageFetch(path,opt,true)}if(!r.ok){let msg='Storage HTTP '+r.status;try{const d=await r.json();msg=d.message||d.error||msg}catch{}throw new Error(msg)}return r}
async function uploadShopImage(file,shopId,kind,index){validateImageFile(file);const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',rand=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),objectPath=shopId+'/'+kind+'-'+String(index).padStart(2,'0')+'-'+rand+'.'+ext;await storageFetch('object/'+SHOP_IMAGE_BUCKET+'/'+encodeStoragePath(objectPath),{method:'POST',headers:{'Content-Type':file.type,'x-upsert':'false','cache-control':'3600'},body:file});return BASE+'/storage/v1/object/public/'+SHOP_IMAGE_BUCKET+'/'+encodeStoragePath(objectPath)}

async function uploadFunyMonRewardImage(file,rewardId){
 if(!file)return null;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('상품 이미지는 JPG, PNG, WEBP만 업로드할 수 있습니다.');
 if(file.size>5*1024*1024)throw new Error('상품 이미지는 5MB 이하만 업로드할 수 있습니다.');
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',rand=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));

async function saveFunyMonEvent(id){
 const shopId=$('monEventShop').value,start=$('monEventStart').value,end=$('monEventEnd').value,selected=[...document.querySelectorAll('[data-monster]:checked')].map(x=>x.dataset.monster),spawn=Math.max(1,Math.min(10,Number($('monSpawnCount').value)||1)),distanceEnabled=$('monDistanceEnabled').value==='true',distanceLimit=Math.max(10,Math.min(5000,Number($('monDistanceLimit').value)||100)),dailyLimit=Math.max(0,Math.min(100,Number($('monDailyLimit').value)||0)),btn=$('monEventSave');
 if(!shopId||!start||!end){alert('적용 카드샵과 이벤트 기간을 모두 설정해주세요.');return}if(!selected.length){alert('노출할 퍼니몬을 1종 이상 선택해주세요.');return}if(spawn>selected.length){alert('지도 노출 개수는 선택한 퍼니몬 수보다 많을 수 없습니다.');return}if(new Date(end)<=new Date(start)){alert('종료 일시는 시작 일시보다 뒤여야 합니다.');return}
 btn.disabled=true;try{const body={shop_id:shopId,starts_at:new Date(start).toISOString(),ends_at:new Date(end).toISOString(),selected_monsters:selected,spawn_count:spawn,distance_limit_enabled:distanceEnabled,distance_limit_m:distanceLimit,daily_catch_limit:dailyLimit,title:'FUNY MON 이벤트'};
 if(id==='new'){const rows=await api('/rest/v1/funy_mon_events',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});funyMonEditingEventId=rows[0]?.id||null}else await api('/rest/v1/funy_mon_events?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});
 await loadFunyMonRewards()}catch(e){alert('이벤트 설정 저장 실패: '+e.message)}finally{btn.disabled=false}

 const card=document.querySelector('.mon-card[data-mon-id="'+CSS.escape(id)+'"]');if(!card)return;const old=funyMonRewards.find(x=>x.id===id),val=k=>card.querySelector('[data-k="'+k+'"]')?.value,win=val('is_win')==='true',prob=Math.max(0,Math.min(100,Number(val('probability'))||0)),total=Math.max(0,Math.round(Number(val('stock_total'))||0));let imageUrl=String(val('image_url')||'').trim()||null;const file=card.querySelector('[data-k="image_file"]')?.files?.[0]||null,oldImage=imageUrl;

function renderEventEntries(query){
 const f=$('feed'),q=(query||'').trim().replace(/^@/,'').toLowerCase(),filtered=eventRows.filter(x=>(x.content||'').toLowerCase().includes(q)),exact=q?eventRows.filter(x=>(x.content||'').toLowerCase()===q):[];
