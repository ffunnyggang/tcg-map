name: Patch garapon sound silver and size

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-sound-silver-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply garapon sound silver and ball-size refinements
        run: python .github/scripts/patch_garapon_sound_silver_size.py

      - name: Validate JavaScript syntax and required output
        run: |
          node --check garapon-three-v2.js
          node --check garapon-three-machine-v2.js
          grep -q "key:'silver'" garapon-three-v2.js
          grep -q "unlockGaraponAudio" garapon-three-v2.js
          grep -q "SphereGeometry(0.127" garapon-three-machine-v2.js
          grep -q "20261016-sound-silver-size1" garapon.html

      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/scripts/patch_garapon_sound_silver_size.py
          rm -f .github/workflows/patch-garapon-sound-silver-size.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon-three-v2.js garapon-three-machine-v2.js garapon-three-v2.css garapon.html tcg-tools.html .github/scripts/patch_garapon_sound_silver_size.py .github/workflows/patch-garapon-sound-silver-size.yml
          git commit -m "fix: restore garapon sound and add smaller silver balls"
          git push
