name: Sync Master DB shops
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-master-db-shops.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Master DB snapshot
        shell: bash
        env:
          DATA: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,zlib,re
          prefix=zlib.decompress(base64.b64decode(os.environ['DATA'])).decode('utf-8')
          p=Path('app.js'); text=p.read_text(encoding='utf-8')
          m=re.search(r'^const SHOPS = .*?;const REVIEWS=.*?;',text,re.S)
          if not m: raise SystemExit('SHOPS/REVIEWS constants not found')
          p.write_text(prefix+text[m.end():],encoding='utf-8')
          Path('.github/workflows/sync-master-db-shops.yml').unlink()
          PY
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync card shops through KR-SEO-042 from Master DB'
          git push origin main