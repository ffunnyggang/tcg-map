name: Apply local AOS QA overlay

on:
  push:
    branches:
      - aos-local-qa-20261019
    paths:
      - .github/workflows/apply-aos-overlay.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify local patch
        shell: bash
        run: |
          set -euo pipefail
          cat .qa/mobile-patch.gz.b64.* | tr -d '\n' | base64 -d | gzip -d > /tmp/mobile.patch
          git apply --check /tmp/mobile.patch
      - name: Apply patch and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/mobile.patch
          rm -rf .qa .github/workflows/apply-aos-overlay.yml
          git add -A
          git config user.name 'FUNY PIN QA'
          git config user.email 'ffunnyggang@gmail.com'
          git commit -m 'feat(aos): integrate current web flows and native QA safeguards'
          git push origin HEAD:aos-local-qa-20261019
