name: Patch garapon controls and sound

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-controls-sound.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply garapon control and sound refinements
        run: python .github/scripts/patch_garapon_controls_sound.py

      - name: Validate JavaScript syntax and required output
        run: |
          node --check garapon-three-machine-v2.js
          node --check garapon-three-v2.js
          grep -q "autoMixSequence" garapon-three-machine-v2.js
          grep -q "playBallReleaseSound" garapon-three-v2.js
          grep -q "id=\"mixButton\"" garapon.html
          grep -q "id=\"soundToggle\"" garapon.html
          ! grep -q "class=\"gesture-guide\"" garapon.html

      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/scripts/patch_garapon_controls_sound.py
          rm -f .github/workflows/patch-garapon-controls-sound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon-three-machine-v2.js garapon-three-v2.js garapon-three-v2.css garapon.html tcg-tools.html .github/scripts .github/workflows
          git commit -m "refine: align garapon rotation add sound controls and split actions"
          git push
