<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FUNY PIN Instagram capture</title><style>html,body{margin:0;padding:0;background:#fff;width:1200px;height:760px;overflow:hidden}.capture-window{width:540px;height:760px;overflow:hidden}iframe{display:block;width:555px;height:780px;border:0}</style></head><body><div class="capture-window" id="capture-window"></div><script>
'use strict';
try{const params=new URLSearchParams(location.search),media=params.get('media');if(media){const m=new URL(media),h=Number(params.get('height'));if(m.protocol!=='https:'||m.username||m.password||m.port||!/(^|\.)(cdninstagram\.com|fbcdn\.net)$/i.test(m.hostname)||!Number.isInteger(h)||h<270||h>1026)throw Error();document.documentElement.style.width=document.body.style.width='540px';document.documentElement.style.height=document.body.style.height=h+'px';const root=document.getElementById('capture-window');root.style.height=h+'px';const image=document.createElement('img');image.alt='Instagram 게시물 이미지';image.style.cssText='display:block;width:540px;height:'+h+'px;object-fit:contain';image.src=m.href;root.append(image);}else{const u=new URL(new URLSearchParams(location.search).get('url'));if(u.protocol!=='https:'||!['instagram.com','www.instagram.com'].includes(u.hostname)||u.username||u.password||u.port||!/^\/(p|reel)\/[A-Za-z0-9_-]{1,100}\/?$/.test(u.pathname))throw Error();const frame=document.createElement('iframe');frame.title='Instagram 원본';frame.setAttribute('scrolling','no');frame.src='https://www.instagram.com'+u.pathname.replace(/\/?$/,'/')+'embed/';document.getElementById('capture-window').append(frame)}}catch{document.body.textContent='Invalid Instagram URL'}
</script></body></html>
