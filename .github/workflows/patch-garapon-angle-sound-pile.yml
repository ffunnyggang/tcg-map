name: Patch garapon angle sound and ball pile

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-angle-sound-pile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply garapon refinements
        run: python .github/scripts/patch_garapon_angle_sound_pile.py

      - name: Validate JavaScript syntax and patch output
        run: |
          node --check garapon-three-machine-v2.js
          node --check garapon-three-v2.js
          grep -q 'id="drawnBalls"' garapon.html
          grep -q 'playGaraponRattle' garapon-three-v2.js
          grep -q '20261016-angle-sound-pile1' garapon.html

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon.html garapon-three-v2.css garapon-three-v2.js garapon-three-machine-v2.js tcg-tools.html
          git commit -m "refine: match garapon angle add dynamic rattle and ball pile"
          git push
