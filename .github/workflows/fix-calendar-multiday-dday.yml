name: Apply multi-day calendar D-DAY fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-calendar-multiday-dday.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extend D-DAY through the event end time
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const calendarPath = 'map-calendar-v1.js';
          const shopsPath = 'shops.html';
          let source = fs.readFileSync(calendarPath, 'utf8');

          const replaceOnce = (from, to, label) => {
            if (!source.includes(from)) throw new Error(`Missing calendar patch anchor: ${label}`);
            source = source.replace(from, to);
          };

          replaceOnce(
            "function eventEnd(e){if(e.end?.date){const d=new Date(e.end.date+'T00:00:00+09:00');d.setDate(d.getDate()-1);d.setHours(23,59,59,999);return d}return new Date(e.end?.dateTime||e.start?.dateTime||Date.now())}",
            "function eventEnd(e){if(e.end?.date){const exclusiveEnd=new Date(e.end.date+'T00:00:00+09:00');return new Date(exclusiveEnd.getTime()-1)}return new Date(e.end?.dateTime||e.start?.dateTime||Date.now())}",
            'all-day event end'
          );

          replaceOnce(
            "function ddayLabel(e){const diff=seoulDayNumber(eventStart(e))-seoulDayNumber(new Date());if(diff===0)return'D-DAY';if(diff>=1&&diff<=7)return'D-'+diff;return''}",
            "function ddayLabel(e){const now=new Date(),start=eventStart(e),end=eventEnd(e),today=seoulDayNumber(now),startDay=seoulDayNumber(start),diff=startDay-today;if(today>=startDay&&now<=end)return'D-DAY';if(diff>=1&&diff<=7)return'D-'+diff;return''}",
            'D-DAY range'
          );

          replaceOnce(
            "addStyle();let zoomBound=false;function bindZoomRefresh(){if(zoomBound)return;zoomBound=true;naver.maps.Event.addListener(naverMap,'zoom_changed',()=>{markers.forEach(m=>{try{m.setIcon(icon(m.__event))}catch(_){}})})}let tries=0,t=setInterval(()=>{tries++;if(window.naver?.maps?.Service&&typeof naverMap!=='undefined'&&naverMap){clearInterval(t);bindZoomRefresh();load()}else if(tries>60)clearInterval(t)},250);",
            "addStyle();let zoomBound=false,clockTimer=0;function refreshMarkers(){const now=new Date();markers.forEach(m=>{try{if(eventEnd(m.__event)<now){m.setMap(null);return}m.setIcon(icon(m.__event))}catch(_){}})}function bindZoomRefresh(){if(zoomBound)return;zoomBound=true;naver.maps.Event.addListener(naverMap,'zoom_changed',refreshMarkers);if(!clockTimer)clockTimer=setInterval(refreshMarkers,30000)}let tries=0,t=setInterval(()=>{tries++;if(window.naver?.maps?.Service&&typeof naverMap!=='undefined'&&naverMap){clearInterval(t);bindZoomRefresh();load().then(refreshMarkers)}else if(tries>60)clearInterval(t)},250);",
            'time-aware marker refresh'
          );

          if (!source.includes("today>=startDay&&now<=end") || !source.includes('exclusiveEnd.getTime()-1') || !source.includes('setInterval(refreshMarkers,30000)')) {
            throw new Error('Calendar D-DAY validation failed');
          }
          new Function(source);
          fs.writeFileSync(calendarPath, source, 'utf8');

          let shops = fs.readFileSync(shopsPath, 'utf8');
          shops = shops.replace(/map-calendar-v1\.js\?v=[^"']+/, 'map-calendar-v1.js?v=20261010-multiday-dday1');
          shops = shops.replace(/var v='[^']+',k='funypin-deploy-version'/, "var v='20261010-calendar-dday1',k='funypin-deploy-version'");
          if (!shops.includes('map-calendar-v1.js?v=20261010-multiday-dday1')) throw new Error('Calendar cache key update failed');
          fs.writeFileSync(shopsPath, shops, 'utf8');

          fs.unlinkSync('.github/workflows/fix-calendar-multiday-dday.yml');
          NODE
      - name: Commit production calendar fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map-calendar-v1.js shops.html .github/workflows/fix-calendar-multiday-dday.yml
          git commit -m 'fix: keep event D-DAY visible through event end'
          git push origin HEAD:main
