name: Apply AOS web FAB handshake

on:
  push:
    branches:
      - aos-local-qa-20261019
    paths:
      - .github/workflows/apply-mobile-webfab.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply handshake patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .qa/mobile-webfab.patch.gz.b64 | gzip -d > /tmp/mobile-webfab.patch
          git apply --check /tmp/mobile-webfab.patch
          git apply --index /tmp/mobile-webfab.patch
          rm -rf .qa
          rm -f .github/workflows/apply-mobile-webfab.yml
          git add -A
          git config user.name 'FUNY PIN QA'
          git config user.email 'ffunnyggang@gmail.com'
          git commit -m 'fix(aos): request full web floating launcher'
          git push origin HEAD:aos-local-qa-20261019
