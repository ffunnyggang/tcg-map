h(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});fetch('data/pokamo-feed.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{items=d.items||[];render()}).catch(()=>feed.innerHTML='<div class="empty">게시글을 불러오지 못했습니다.<br>잠시 후 다시 확인해주세요.</div>');</script></body></html>
