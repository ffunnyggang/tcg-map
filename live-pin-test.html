*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#28232e;font-family:'Pretendard Variable',Pretendard,sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:96px}.head{height:58px;padding:0 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff;z-index:5}.head svg{width:32px;height:36px}.head strong{font-size:24px;font-weight:850}.test{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f0e9ff;color:#7557c8;font-size:10px;font-weight:800}.hero{padding:14px}.hero h1{margin:0;font-size:21px}.hero p{margin:6px 0 0;color:#8e8794;font-size:12px;line-height:1.5}.filters{display:flex;gap:7px;padding:0 14px 13px;overflow:auto}.filters button{flex:none;border:1px solid #e5e1e9;background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:750;color:#6f6874}.filters .on{background:#28232e;color:#fff;border-color:#28232e}.feed{padding:0 14px}.card{padding:14px;margin-bottom:10px;border:1px solid #ece8ef;border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(51,41,65,.045)}.top{display:flex;align-items:center;gap:7px}.type{font-size:11px;font-weight:850}.time{font-size:10px;color:#aaa3af}.live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#ee5967}.shop{margin:9px 0 6px;font-size:14px;font-weight:850}.body{font-size:13px;line-height:1.55;color:#514b56}.body b{color:#28232e}.help{margin-top:11px;border:0;background:#f7f5f9;border-radius:10px;padding:7px 9px;color:#756e7b;font-size:10px}.fab{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(calc(100% - 42px),378px);height:50px;border:0;border-radius:16px;background:#7557c8;color:#fff;font-weight:850;box-shadow:0 8px 24px rgba(91,66,157,.25);z-index:10}.sheetbg{display:none;position:fixed;inset:0;background:rgba(25,20,30,.35);z-index:20}.sheetbg.open{display:block}.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,420px);background:#fff;border-radius:22px 22px 0 0;padding:10px 14px max(20px,env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#ded9e2;border-radius:9px;margin:0 auto 15px}.sheet h2{margin:0 0 14px;font-size:18px}.label{display:block;margin:13px 0 7px;font-size:11px;font-weight:800}.select,.memo{width:100%;border:1px solid #e4dfe8;border-radius:13px;background:#fff;padding:12px;font:inherit;font-size:13px}.types,.states{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.types button,.states button{border:1px solid #e4dfe8;border-radius:12px;background:#fff;padding:10px 5px;font-size:11px}.types .on,.states .on{border-color:#8062d8;background:#f3effc;color:#6749bd;font-weight:800}.submit{width:100%;height:48px;margin-top:16px;border:0;border-radius:14px;background:#28232e;color:#fff;font-weight:850}.note{text-align:center;color:#aaa3af;font-size:10px;margin:11px 0 0}
</style></head><body><div class="shell"><header class="head"><svg viewBox="0 0 36 40"><defs><linearGradient id="g" x1="8" y1="3" x2="27" y2="29"><stop stop-color="#b093f4"/><stop offset=".48" stop-color="#8062d8"/><stop offset="1" stop-color="#6749bd"/></linearGradient></defs><path fill="url(#g)" d="M18 2.8A10.5 10.5 0 0 0 7.5 13.3c0 7.7 10.5 17.8 10.5 17.8s10.5-10.1 10.5-17.8A10.5 10.5 0 0 0 18 2.8Z"/><path d="M7.75 13.05h6.38a4.2 4.2 0 0 1 7.74 0h6.38v1.15h-6.08a4.2 4.2 0 0 1-8.34 0H7.75Z" fill="#fff"/><circle cx="18" cy="13.65" r="3.15" fill="#f7f4ff"/></svg><strong>LIVE PIN</strong><span class="test">UI TEST</span></header><section class="hero"><h1>지금 카드샵은? 🔴</h1><p>대기 현황과 재고 정보를 실시간으로 공유해보세요.<br>최근 현장 제보를 빠르게 확인할 수 있어요.</p></section><div class="filters"><button class="on">전체</button><button>👥 대기</button><button>📦 재고</button><button>🏪 매장</button></div><main class="feed"><article class="card" data-type="대기"><div class="top"><span class="type">👥 대기 현황</span><span class="time">3분 전</span><span class="live"></span></div><div class="shop">📍 홍대 더카드룸</div><div class="body">현재 대기 약 <b>20명</b><br>아직 입장 시작 전이에요.</div><button class="help">👍 도움됐어요 12</button></article><article class="card" data-type="재고"><div class="top"><span class="type">📦 재고 현황</span><span class="time">8분 전</span><span class="live"></span></div><div class="shop">📍 카드스토리 논현</div><div class="body"><b>포켓몬 30주년 박스 재고 있음</b><br>현재 1인 1박스 구매 가능</div><button class="help">👍 도움됐어요 7</button></article><article class="card" data-type="매장"><div class="top"><span class="type">🏪 매장 현황</span><span class="time">21분 전</span><span class="live"></span></div><div class="shop">📍 용산 카드샵</div><div class="body">현재 매장 한산해요.<br>바로 입장 가능합니다.</div><button class="help">👍 도움됐어요 4</button></article></main><button class="fab" id="open">＋ 현장 제보하기</button></div><div class="sheetbg" id="bg"><div class="sheet" id="sheet"><div class="handle"></div><h2>현장 제보</h2><label class="label">카드샵</label><select class="select"><option>카드샵을 선택해주세요</option><option>홍대 더카드룸</option><option>카드스토리 논현</option></select><label class="label">제보 종류</label><div class="types"><button class="on">👥 대기</button><button>📦 재고</button><button>🏪 매장</button></div><label class="label">현재 상태</label><div class="states"><button>없음</button><button class="on">10~30명</button><button>30명+</button></div><label class="label">한 줄 추가 <span style="font-weight:400;color:#aaa">선택</span></label><input class="memo" placeholder="현장 상황을 간단히 알려주세요"><button class="submit" type="button">제보 등록</button><p class="note">UI 테스트 페이지 · 실제 데이터는 저장되지 않습니다.</p></div></div><script>
const bg=document.getElementById('bg');document.getElementById('open').onclick=()=>bg.classList.add('open');bg.onclick=e=>{if(e.target===bg)bg.classList.remove('open')};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const k=b.textContent.trim();document.querySelectorAll('.card').forEach(c=>c.style.display=k==='전체'||k.includes(c.dataset.type)?'block':'none')});document.querySelectorAll('.types button,.states button').forEach(b=>b.onclick=()=>{[...b.parentElement.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
