name: Fix detail address row v5
on:
  push:
    paths:
      - '.github/workflows/fix-detail-address-v5.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore address row with pin icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="['주소',s.address],['영업시간','clock',s.hours]"
          new="['주소','pin',s.address],['영업시간','clock',s.hours]"
          if old not in s:
              raise SystemExit('Target address row not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          node --check app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Restore detail address row'
          git push
