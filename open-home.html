*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f8f7fd;color:#111015;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif}
body{background:radial-gradient(circle at 50% 46%,rgba(128,98,216,.055) 0,rgba(128,98,216,0) 34%),#f8f7fd}
.wrap{min-height:100dvh;display:grid;place-items:center;padding:max(30px,env(safe-area-inset-top)) 30px max(30px,env(safe-area-inset-bottom))}
.card{width:min(100%,456px);padding:31px 28px 34px;border:1px solid #e7e2ef;border-radius:29px;background:rgba(255,255,255,.985);text-align:center;box-shadow:0 18px 46px rgba(72,54,105,.075)}
.app-icon{display:block;width:94px;height:94px;margin:0 auto 22px;border-radius:22px;object-fit:cover}
h1{margin:0;color:#0c0b0e;font-size:26px;font-weight:800;line-height:1.24;letter-spacing:-.045em;word-break:keep-all}
p{margin:14px 0 0;color:#8f8996;font-size:15px;font-weight:600;line-height:1.55;letter-spacing:-.025em}
.actions{display:grid;gap:12px;margin-top:28px}
.btn{height:64px;border:0;border-radius:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;font-weight:800;letter-spacing:-.025em;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.995)}
.primary{background:#805fdf;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.secondary{border:1.5px solid #dfd4f2;background:#fff;color:#6749bd}
.muted{background:#f3f1f5;color:#655f6b}
.note{margin-top:18px;color:#aaa4ae;font-size:12px;font-weight:500;line-height:1.55;letter-spacing:-.02em;word-break:keep-all}
@media(max-width:420px){
  .wrap{padding-left:20px;padding-right:20px}
  .card{padding:28px 24px 30px;border-radius:26px}
  .app-icon{width:88px;height:88px;margin-bottom:20px;border-radius:21px}
  h1{font-size:22px}
  p{font-size:14px}
  .actions{margin-top:25px;gap:10px}
  .btn{height:56px;font-size:15px;border-radius:14px}
  .note{font-size:11px}
}

    </div>
    <div class="note">iPhone에서는 FUNY PIN이 설치되어 있으면 앱이 열리고, 설치되어 있지 않으면 App Store로 이동합니다.</div>
  </main>
</div>
<script>
(function(){
  var PLAY_STORE='https://play.google.com/store/apps/details?id=kr.funypin.app';
  var APP_STORE='https://apps.apple.com/us/app/funy-pin/id6817652126';
  var qs=new URLSearchParams(location.search);
  var event=qs.get('event')||'';
  var campaign=qs.get('campaign')||'';
  var from=qs.get('from')||'pokemon-match-share';

  function webUrl(){
    var u=new URL('https://funypin.kr/');
    
    u.searchParams.set('from',from);
    if(event)u.searchParams.set('event',event);
    if(campaign)u.searchParams.set('campaign',campaign);
    return u.toString();
  }
  function appUrl(){
    var q=new URLSearchParams();
    
    q.set('from',from);
    if(event)q.set('event',event);
    if(campaign)q.set('campaign',campaign);
    return 'funypin:///?'+q.toString();
  }

  var ua=navigator.userAgent||'';
  var isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var isAndroid=/Android/i.test(ua);
  var status=document.getElementById('status');
  var openBtn=document.getElementById('openAppBtn');
  var webBtn=document.getElementById('webHomeBtn');
  var storeBtn=document.getElementById('storeBtn');
  webBtn.href=webUrl();
  storeBtn.href=APP_STORE;

  function openIOSApp(){
    var launched=false;
    var timer;
    function cleanup(){
      if(timer)clearTimeout(timer);
      document.removeEventListener('visibilitychange',onVisibility);
      window.removeEventListener('pagehide',onGone);
      window.removeEventListener('blur',onGone);
    }
    function onGone(){launched=true;cleanup()}
    function onVisibility(){if(document.hidden)onGone()}
    document.addEventListener('visibilitychange',onVisibility);
    window.addEventListener('pagehide',onGone,{once:true});
    window.addEventListener('blur',onGone,{once:true});
    timer=setTimeout(function(){
      cleanup();
      if(!launched&&!document.hidden)location.replace(APP_STORE);
    },1300);
    location.href=appUrl();
  }

  function openAndroidApp(){
    location.href=appUrl().replace(/^funypin:/,'intent:')+'#Intent;scheme=funypin;package=kr.funypin.app;S.browser_fallback_url='+encodeURIComponent(PLAY_STORE)+';end';
  }

  openBtn.onclick=function(){
    if(isIOS){openIOSApp();return}
    if(isAndroid){openAndroidApp();return}
    location.href=webUrl();
  };

  if(isAndroid){
    status.textContent='아래 버튼을 눌러 FUNY PIN 앱을 열어주세요.';
    openBtn.textContent='FUNY PIN 앱 열기';
    storeBtn.href=PLAY_STORE;
    storeBtn.textContent='Google Play에서 설치하기';
    document.querySelector('.note').textContent='Android에서는 앱 열기 버튼을 눌러주세요. 앱이 설치되어 있지 않으면 Google Play로 이동합니다.';
  }else if(isIOS){
    status.textContent='FUNY PIN 앱을 확인하고 있어요.';
    setTimeout(openIOSApp,250);
  }else{
    status.textContent='Web FUNY PIN 홈으로 이동합니다.';
    openBtn.textContent='Web FUNY PIN 홈 열기';
    storeBtn.style.display='none';
    setTimeout(function(){location.replace(webUrl())},250);
  }
})();
</script>
</body>
</html>
