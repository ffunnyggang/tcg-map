name: Binder flipbook check
on:
  pull_request:
    paths:
      - 'binder*'
      - 'cms-inapp-page.html'
      - 'talk.html'
      - 'talk-community-v1.js'
      - 'tests/binder-*'
      - 'tests/talk-binder-*'
      - 'vendor/page-flip/**'
      - '.github/workflows/binder-flipbook-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check talk-community-v1.js && node --check binder.js && node --check binder-flipbook.js && node tests/binder-core.mjs && node tests/binder-flipbook-state.cjs
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/binder-flipbook.cjs
      - run: node tests/binder-header.cjs
      - run: node tests/binder-images.cjs
      - run: node tests/binder-app-menu.cjs
      - run: node tests/binder-sticky-title.cjs
      - run: node tests/binder-mode-scroll.cjs
      - run: node tests/talk-binder-tab.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binder-flipbook-visual-qa
          path: /tmp/binder-*-qa.png
          retention-days: 3
