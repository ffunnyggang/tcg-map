/* ===== Design System v3: warm minimal / home + detail ===== */
:root{
  --bg:#f4f1eb;
  --surface:#fffdfa;
  --text:#1e1b18;
  --muted:#7e776f;
  --ter:#a59d93;
  --line:#e7e1d8;
  --chip:#f2ece4;
  --accent:#a57a47;
  --accent-soft:#eadfce;
  --shadow:0 8px 24px rgba(37,30,23,.055);
  --shadow-soft:0 3px 12px rgba(37,30,23,.035);
  --radius-card:18px;
}
body{background:#eeeae3}
.app{background:var(--bg)}

/* HOME */
.app-header{
  height:62px;
  background:rgba(248,246,241,.94);
  border-bottom:1px solid rgba(225,219,210,.88);
  backdrop-filter:blur(18px) saturate(135%);
  -webkit-backdrop-filter:blur(18px) saturate(135%);
}
.header-inner{padding:0 18px;gap:7px}
.brand-title{font-size:20px;font-weight:820;letter-spacing:-.035em}
.brand-sub{font-size:10px;color:#9a8d7e;font-weight:560;letter-spacing:.01em;margin-top:4px}
.filter-bar{
  top:62px;
  background:rgba(248,246,241,.95);
  border-bottom:1px solid rgba(225,219,210,.72);
  backdrop-filter:blur(18px) saturate(135%);
  -webkit-backdrop-filter:blur(18px) saturate(135%);
}
.filter-track{padding:11px 16px 12px;gap:7px}
.filter-chip{
  height:33px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid #e3ddd4;
  background:#fffdfa;
  color:#6f6860;
  font-size:11.5px;
  font-weight:650;
  box-shadow:none;
  transition:.18s ease;
}
.filter-chip.active{background:#26221e;border-color:#26221e;color:#fff;box-shadow:0 3px 10px rgba(28,24,21,.10)}
.map-wrap{height:232px;background:#e9e5de;border-bottom:1px solid #e4ded5}
.map-status{font-size:10.5px;border-color:#e4ddd4;background:rgba(255,253,250,.95);box-shadow:0 5px 16px rgba(35,29,23,.08)}
.list-wrap{padding:20px 14px 48px}
.list-count{font-size:11px;font-weight:650;color:#8c847a;margin:0 4px 13px}
.shop-list{gap:11px}
.shop-card{
  grid-template-columns:90px minmax(0,1fr) 14px;
  gap:12px;
  height:128px;
  padding:11px;
  border-radius:17px;
  border:1px solid #e6dfd6;
  background:rgba(255,253,250,.98);
  box-shadow:var(--shadow-soft);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.shop-card:active{transform:scale(.992)}
.shop-thumb{width:90px;height:90px;border-radius:13px;background:#ece8e1}
.shop-thumb img{object-fit:cover}
.shop-name{font-size:16px;font-weight:800;letter-spacing:-.025em;margin-bottom:4px;color:#211e1a}
.shop-meta,.shop-hours{font-size:10.8px;color:#847c73}
.shop-hours{margin-top:1px;color:#706960}
.tag-row{margin-top:8px;gap:5px;max-height:42px}
.tag{font-size:9.8px;font-weight:560;color:#6d5d4c;background:#f2ece4;border:0;padding:4px 7px}
.chev{font-size:20px;color:#a0876b}

/* DETAIL */
.detail-shell{background:var(--bg)}
.detail-sticky{
  height:56px;
  background:rgba(248,246,241,.95);
  border-bottom:1px solid rgba(225,219,210,.86);
  backdrop-filter:blur(18px) saturate(135%);
  -webkit-backdrop-filter:blur(18px) saturate(135%);
  padding:0 14px;
  box-shadow:0 2px 10px rgba(30,25,20,.025);
}
.detail-sticky-name{font-size:14.5px;font-weight:790;letter-spacing:-.02em}
.icon-btn{width:36px;height:36px;background:rgba(255,253,250,.94);border:1px solid rgba(226,219,210,.9);box-shadow:0 3px 12px rgba(35,29,23,.06)}
.icon-btn svg{width:18px;height:18px}
.hero{aspect-ratio:4/3;background:linear-gradient(145deg,#ece8e1,#ded8ce);color:#958d83}
.hero:before{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.72),transparent 42%)}
.hero-top{padding:14px}
.hero-count{right:14px;bottom:14px;padding:4px 9px;font-size:10px;background:rgba(34,30,26,.62)}
.detail-content{padding:0 16px 64px}
.summary-card{
  margin:-18px 0 0;
  padding:22px 16px 18px;
  position:relative;
  z-index:3;
  background:rgba(255,253,250,.98);
  border:1px solid #e6dfd6;
  border-radius:20px;
  box-shadow:var(--shadow);
}
.d-name{font-size:23px;font-weight:830;letter-spacing:-.035em}
.d-en{font-size:10.5px;color:#9e9386;font-weight:560;letter-spacing:.055em;margin-top:2px}
.d-loc{font-size:11.8px;color:#716a62;margin-top:10px;font-weight:590}
.d-tags{margin-top:12px;gap:5px;max-height:none}
.d-tags .tag{font-size:10px;padding:5px 8px;background:#f1ebe3;color:#695b4c}
.quick-actions{gap:8px;margin-top:16px}
.quick-action{
  min-height:67px;
  border-radius:14px;
  border:1px solid #e6dfd6;
  background:#fffdfa;
  padding:10px 4px 8px;
  font-size:9.8px;
  color:#5e5750;
  box-shadow:0 2px 8px rgba(36,30,24,.025);
}
.quick-action svg{width:19px;height:19px;color:#967044}
.section{margin-top:30px}
.section-title{font-size:16px;font-weight:810;letter-spacing:-.025em;margin-bottom:13px;color:#28231f}
.section-title .accent-icon{color:#a77e4e;font-size:13px}
.info-card,.radar-card,.comp-card,.quote-card{
  background:#fffdfa;
  border:1px solid #e6dfd6;
  border-radius:18px;
  box-shadow:var(--shadow-soft);
}
.info-card{padding:0 15px}
.info-row{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px 0;font-size:11.8px}
.info-label{color:#948b81;font-weight:570}
.info-value{color:#4e4841}
.analysis-note{font-size:10px;color:#9d958c;margin:-5px 0 11px}
.radar-card{padding:18px 10px 12px}
.radar-card svg{max-width:360px}
.radar-grid{stroke:#e8e2da}
.radar-axis{stroke:#eee8e0}
.radar-poly{fill:rgba(165,122,71,.18);stroke:#a57a47;stroke-width:1.8}
.radar-label{fill:#5a524a;font-size:10.8px;font-weight:650}
.comp-card{padding:16px 15px;margin-top:10px}
.sub-title{font-size:13.5px;font-weight:790;margin-bottom:12px}
.tcg-line{font-size:11.5px;margin-bottom:14px}
.tcg-label{color:#3e3934}
.bar-list{gap:13px}.bar-row{grid-template-columns:64px minmax(0,1fr);gap:12px}
.bar-label{font-size:11.5px;color:#5c554e}
.bar-track{height:7px;background:#ece6df}
.bar-fill{background:linear-gradient(90deg,#b98f5e,#9f7443)}
.review-grid{gap:10px}
.content-card{border-radius:16px;border:1px solid #e6dfd6;background:#fffdfa;box-shadow:var(--shadow-soft)}
.content-thumb{aspect-ratio:16/10;background:#eae5dd}
.content-body{padding:11px}
.content-title{font-size:11.8px;font-weight:740;line-height:1.4;color:#342f2a}
.content-platform{font-size:9.5px;color:#9d9489;margin-top:5px}

@media (min-width:760px){
  body{padding:22px 0}

let i=0;i<n;i++){const [x,y]=pt(i,1);axes+=`<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;const [lx,ly]=pt(i,1.35);labs+=`<text class="radar-label" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${labels[i]}</text>`}const poly=vals.map((v,i)=>pt(i,v/5).join(',')).join(' ');return `<svg viewBox="0 0 260 245" aria-label="매장 분석 레이더 차트">${grid}${axes}<polygon class="radar-poly" points="${poly}"/>${labs}</svg>`}function actionsHTML(s){const a=[];if(s.naver)a.push([s.naver,'map','네이버지도']);if(s.google)a.push([s.google,'pin','Google Maps']);if(s.instagram)a.push([s.instagram,'ig','Instagram']);if(s.phone)a.push([`tel:${s.phone}`,'phone','전화하기']);return a.length?`<div class="quick-actions">${a.map(([u,i,l])=>`<a class="quick-action" href="${u}" ${u.startsWith('http')?'target="_blank" rel="noopener"':''}><span class="qa-icon">${icon(i)}</span><span>${l}</span></a>`).join('')}</div>`:''}function infoHTML(s){const rows=[['주소','pin',`서울 ${s.city||''} ${s.address}`.replace(/\s+/g,' ').trim()],['영업시간','clock',s.hours],['정기휴무','calendar',s.closed],['주차','parking',s.parking],['SNS','ig',s.instagram]].filter(r=>r[2]);return rows.length?`<section class="section"><h2 class="section-title"><span class="accent-icon">${icon('info')}</span>기본 정보</h2><div class="info-card">${rows.map(([l,i,v])=>`<div class="info-row"><div class="info-label"><span class="info-label-icon">${icon(i)}</span><span>${l}</span></div><div class="info-value">${esc(v)}</div></div>`).join('')}</div></section>`:''}function compHTML(s,rv){const tcg=[s.tcg.pokemon&&'포켓몬',s.tcg.onePiece&&'원피스',s.tcg.dragonBall&&'드래곤볼'].filter(Boolean).join(' · ');const bars=[['싱글카드',rv.single],['등급카드',rv.graded],['박스제품',rv.box],['오리파',rv.oripa]];return `<div class="comp-card"><h3 class="sub-title with-icon"><span class="sub-icon">${icon('cards')}</span>상품 구성 상세</h3>${tcg?`<div class="tcg-line"><span class="tcg-label">취급 TCG</span><span class="tcg-value">${tcg}</span></div>`:''}<div class="bar-list">${bars.map(([l,v])=>`<div class="bar-row"><div class="bar-label">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${v/5*100}%"></div></div></div>`).join('')}</div></div>`}function reviewHTML(s){const cs=CONTENTS.filter(c=>c.shop===s.id);if(!cs.length)return'';const picks=[];const reel=cs.find(c=>c.type==='Reel'),blog=cs.find(c=>c.type==='Blog');if(reel)picks.push(reel);if(blog)picks.push(blog);return `<section class="section"><h2 class="section-title"><span class="accent-icon">${icon('review')}</span>깽퐌커플 리뷰</h2><div class="review-grid">${picks.map(c=>`<a class="content-card" href="${c.url}" target="_blank" rel="noopener"><div class="content-thumb loading" data-review-url="${esc(c.url)}" data-platform="${esc(c.platform)}">${esc(c.platform)}</div><div class="content-body"><p class="content-title">${esc(c.title)}</p><div class="content-platform"><span class="platform-icon">${icon(c.platform==='Instagram'?'ig':'globe')}</span>${esc(c.platform)}</div></div></a>`).join('')}</div></section>`}const REVIEW_THUMB_TTL=1000*60*60*24*7;function reviewThumbKey(url){return'tcg-review-thumb:'+url}function getCachedReviewThumb(url){try{const v=JSON.parse(localStorage.getItem(reviewThumbKey(url))||'null');if(v&&v.url&&Date.now()-v.ts<REVIEW_THUMB_TTL)return v.url}catch(e){}return''}function setCachedReviewThumb(url,img){try{localStorage.setItem(reviewThumbKey(url),JSON.stringify({url:img,ts:Date.now()}))}catch(e){}}async function loadReviewThumb(el){const url=el.dataset.reviewUrl;if(!url)return;const cached=getCachedReviewThumb(url);if(cached){el.innerHTML=`<img src="${esc(cached)}" alt="리뷰 썸네일" loading="lazy" referrerpolicy="no-referrer">`;el.classList.remove('loading');return}try{const target=/^https:\/\/blog\.naver\.com\//.test(url)?url.replace('https://blog.naver.com/','https://m.blog.naver.com/'):url;const api='https://api.microlink.io/?meta=true&url='+encodeURIComponent(target);const r=await fetch(api,{mode:'cors'});if(!r.ok)throw new Error('metadata');const j=await r.json();const img=j&&j.data&&j.data.image&&(j.data.image.url||j.data.image);if(!img)throw new Error('no image');setCachedReviewThumb(url,img);el.innerHTML=`<img src="${esc(img)}" alt="리뷰 썸네일" loading="lazy" referrerpolicy="no-referrer">`;el.classList.remove('loading')}catch(e){el.classList.remove('loading');el.textContent=el.dataset.platform||'Review'}}function loadReviewThumbs(){document.querySelectorAll('.content-thumb[data-review-url]').forEach(loadReviewThumb)}function detailHTML(s){const rv=REVIEWS[s.id],tags=tagList(s).slice(0,8);return `<div class="hero"><div class="hero-top"><button class="icon-btn" id="hero-back" aria-label="뒤로가기">${icon('back')}</button><button class="icon-btn share-btn" aria-label="공유">${icon('share')}</button></div><div class="hero-placeholder">매장 이미지 준비 중</div><div class="hero-count">${icon('image')}<span>1 / 1</span></div></div><div class="detail-content"><section class="summary-card"><h1 class="d-name">${esc(s.name)}</h1><p class="d-en">${esc(s.en)}</p><p class="d-loc"><span class="loc-icon">${icon('pin')}</span>${esc(s.area)} · ${esc(s.station)} 도보 ${s.walkMin}분</p><div class="d-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${actionsHTML(s)}</section>${infoHTML(s)}${rv?`<section class="section"><h2 class="section-title"><span class="accent-icon">${icon('chart')}</span>한눈에 보는 매장 분석</h2><p class="analysis-note">※ 깽퐌커플 방문 평점으로 단순 참고용으로 활용해주세요.</p><div class="radar-card">${radarSVG(rv)}</div>${compHTML(s,rv)}</section>`:''}${reviewHTML(s)}<div style="height:10px"></div></div>`}function openDetail(id){const s=SHOPS.find(x=>x.id===id);if(!s)return;state.current=id;$('#home-view').hidden=true;$('#detail-view').hidden=false;$('#detail').innerHTML=detailHTML(s);$('#sticky-name').textContent=s.name;window.scrollTo(0,0);setTimeout(()=>{bindDetail();loadReviewThumbs()},0)}function bindDetail(){const b=$('#hero-back');if(b)b.addEventListener('click',()=>history.back());$('#sticky-back').onclick=()=>history.back();document.querySelectorAll('.share-btn').forEach(btn=>btn.onclick=shareCurrent);window.onscroll=()=>{const sticky=$('#detail-sticky');if($('#detail-view').hidden)return;sticky.classList.toggle('show',window.scrollY>0)}}async function shareCurrent(){const s=SHOPS.find(x=>x.id===state.current);const data={title:s?`${s.name} | TCG MAP`:'TCG MAP',text:s?`${s.name} 카드샵 정보`:'TCG MAP',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('링크를 복사했습니다.')}}catch(e){}}function closeDetail(){state.current=null;$('#detail-view').hidden=true;$('#home-view').hidden=false;$('#detail-sticky').classList.remove('show');window.onscroll=null;renderFilters();renderList();requestAnimationFrame(()=>window.scrollTo(0,state.scrollY))}function route(){const m=location.hash.match(/^#\/shop\/(KR-SEO-\d{3})$/);if(m)openDetail(m[1]);else closeDetail()}window.addEventListener('hashchange',route);renderFilters();renderList();route();initNaverMap();</script></body></html>
