name: AOS QA apply and validate

on:
  push:
    branches:
      - qa/aos-web-sync-20261019
    paths:
      - scripts/apply-aos-qa-update.py
      - .github/workflows/aos-qa-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aos-qa-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/aos-web-sync-20261019
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Normalize guarded patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-aos-qa-update.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if count != 1:\n        raise RuntimeError(f"{path}: expected one match, found {count}: {old[:120]!r}")', 'if count < 1:\n        raise RuntimeError(f"{path}: expected at least one match, found {count}: {old[:120]!r}")')
          s=s.replace('"              ref.current?.injectJavaScript(`window.dispatchEvent', '"ref.current?.injectJavaScript(`window.dispatchEvent')
          s=s.replace('"              exitBlockedTalkPost(ownerId,postId);\\n"', '"exitBlockedTalkPost(ownerId,postId);\\n"')
          s=s.replace("fontWeight:'850'", "fontWeight:'800'")
          s=s.replace("fontWeight:'750'", "fontWeight:'700'")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply guarded AOS QA patch
        id: patch
        continue-on-error: true
        run: |
          set +e
          python scripts/apply-aos-qa-update.py 2>&1 | tee /tmp/aos-qa-patch.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Apply Android-only location startup optimization
        if: steps.patch.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mobile/components/FunyWebView.tsx')
          s=p.read_text(encoding='utf-8')
          pattern=r"  const requestNativeLocation=useCallback\(async\(once=false\)=>\{.*?\},\[injectEvent,stopNativeLocation\]\);"
          replacement="""  const requestNativeLocation=useCallback(async(once=false)=>{
            try{
              let permission;
              if(Platform.OS==='ios'){
                permission=await Location.getForegroundPermissionsAsync();
                if(permission.status!=='granted')permission=await Location.requestForegroundPermissionsAsync();
              }else permission=await Location.requestForegroundPermissionsAsync();
              if(permission.status!=='granted'){
                stopNativeLocation();
                injectEvent('funy:nativelocationerror',{code:1,message:'위치 권한을 허용하면 내 위치를 표시할 수 있어요.'});
                return;
              }
              let lastSentTimestamp=0,bestAccuracy=Number.POSITIVE_INFINITY;
              const send=(pos:Location.LocationObject,force=false)=>{
                const ts=Number(pos.timestamp)||Date.now(),accuracy=Number(pos.coords.accuracy)||Number.POSITIVE_INFINITY;
                if(!force&&ts<lastSentTimestamp)return;
                if(!force&&lastSentTimestamp>0&&accuracy>bestAccuracy*1.8&&ts-lastSentTimestamp<5000)return;
                lastSentTimestamp=Math.max(lastSentTimestamp,ts);bestAccuracy=Math.min(bestAccuracy,accuracy);
                injectEvent('funy:nativelocation',{latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy??0,altitude:pos.coords.altitude??null,altitudeAccuracy:pos.coords.altitudeAccuracy??null,heading:pos.coords.heading??null,speed:pos.coords.speed??null,timestamp:ts});
              };
              if(Platform.OS==='ios'){
                if(!once){
                  const cachedPromise=Location.getLastKnownPositionAsync({maxAge:30000,requiredAccuracy:150}).catch(()=>null);
                  stopNativeLocation();
                  locationSub.current=await Location.watchPositionAsync({accuracy:Location.Accuracy.High,distanceInterval:2,timeInterval:1000},send);
                  const cached=await cachedPromise;if(cached)send(cached,true);return;
                }
                const first=await Location.getCurrentPositionAsync({accuracy:Location.Accuracy.High});send(first,true);stopNativeLocation();return;
              }
              const cached=await Location.getLastKnownPositionAsync({maxAge:30000,requiredAccuracy:150}).catch(()=>null);
              if(cached)send(cached,true);
              if(once&&cached){stopNativeLocation();return;}
              if(!cached){
                const first=await Location.getCurrentPositionAsync({accuracy:Location.Accuracy.Balanced});send(first,true);
                if(once){stopNativeLocation();return;}
              }
              stopNativeLocation();
              locationSub.current=await Location.watchPositionAsync({accuracy:Location.Accuracy.High,distanceInterval:3,timeInterval:1800},send);
            }catch(e:any){
              stopNativeLocation();
              injectEvent('funy:nativelocationerror',{code:2,message:String(e?.message||'현재 위치를 확인하지 못했습니다.')});
            }
          },[injectEvent,stopNativeLocation]);"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'location bridge replacement count={n}')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-qa-patch-log-${{ github.run_number }}
          path: /tmp/aos-qa-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload patched sources for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-qa-patched-sources-${{ github.run_number }}
          path: |
            mobile/components/FunyBackButton.tsx
            mobile/components/FunyHeader.tsx
            mobile/components/MySubHeader.tsx
            mobile/components/FunyWebView.tsx
            mobile/app/(tabs)/index.tsx
            mobile/app/(tabs)/pick.tsx
            mobile/app/live-pin.tsx
            mobile/app/account.tsx
            mobile/app/my/profile-edit.tsx
            mobile/app/shop/[id].tsx
            mobile/lib/shops.ts
            mobile/QA_AOS_PREBUILD_20261019.md
            admin.html
          if-no-files-found: warn
          retention-days: 3

      - name: Stop after patch failure
        if: steps.patch.outcome != 'success'
        run: exit 1

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Expo SDK-compatible native modules
        id: deps
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          npx --no-install expo install expo-file-system expo-sharing 2>&1 | tee /tmp/aos-qa-deps.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-qa-deps-log-${{ github.run_number }}
          path: /tmp/aos-qa-deps.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop after dependency failure
        if: steps.deps.outcome != 'success'
        run: exit 1

      - name: Verify reproducible dependency install
        working-directory: mobile
        run: |
          rm -rf node_modules
          npm ci

      - name: TypeScript
        id: typescript
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/aos-qa-typescript.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-qa-typescript-log-${{ github.run_number }}
          path: /tmp/aos-qa-typescript.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop after TypeScript failure
        if: steps.typescript.outcome != 'success'
        run: exit 1

      - name: Expo public config
        working-directory: mobile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: npx expo config --type public > /tmp/funy-expo-config.json

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Current production web JavaScript syntax
        id: websyntax
        continue-on-error: true
        run: |
          set +e
          code=0
          mkdir -p /tmp/funy-current-web
          for file in talk-community-v1.js talk-safety-v1.js funy-mon-v1.js map-market-v1.js; do
            echo "=== ${file} ===" | tee -a /tmp/aos-qa-web-syntax.log
            if ! curl -fsSL "https://raw.githubusercontent.com/ffunnyggang/tcg-map/main/${file}" -o "/tmp/funy-current-web/${file}"; then
              echo "download failed" | tee -a /tmp/aos-qa-web-syntax.log
              code=1
              continue
            fi
            node --check "/tmp/funy-current-web/${file}" 2>&1 | tee -a /tmp/aos-qa-web-syntax.log
            test_code=${PIPESTATUS[0]}
            if [ "$test_code" -ne 0 ]; then code="$test_code"; fi
          done
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload current-web syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-qa-web-syntax-log-${{ github.run_number }}
          path: /tmp/aos-qa-web-syntax.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop after current-web syntax failure
        if: steps.websyntax.outcome != 'success'
        run: exit 1

      - name: Commit validated QA changes
        run: |
          git config user.name "FUNY PIN QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile admin.html
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "qa(android): sync native shell with current web service"
          git push origin HEAD:qa/aos-web-sync-20261019
