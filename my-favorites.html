<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>관심 목록 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my3"><style>
.my-content{padding-top:12px}.favorite-tabs{position:sticky;top:54px;z-index:12;display:flex;gap:8px;padding:10px 0 10px;background:#f7f4fc;overflow-x:auto;scrollbar-width:none}.favorite-tabs::-webkit-scrollbar{display:none}.favorite-tab{height:35px;padding:0 14px;border:1px solid #e5e1eb;border-radius:999px;background:#fff;color:#716b79;font-size:12px;font-weight:750;white-space:nowrap}.favorite-tab.active{border-color:#272331;background:#272331;color:#fff}.favorite-section{display:none}.favorite-section.active{display:block}.favorite-list{display:flex;flex-direction:column;gap:12px}.fav-card{position:relative;display:flex;min-height:112px;overflow:hidden;color:inherit}.fav-img{width:112px;min-width:112px;height:112px;background:#eee;object-fit:cover}.fav-fallback{width:112px;min-width:112px;height:112px;display:grid;place-items:center;background:#EEE8FA;color:#6749bd;font-size:11px;font-weight:900}.fav-copy{min-width:0;flex:1;padding:15px 42px 15px 15px;display:flex;flex-direction:column;justify-content:center;text-decoration:none!important;color:inherit!important}.fav-name{font-size:16px;line-height:20px;font-weight:900;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none!important}.fav-meta{margin-top:7px;color:#6749bd;font-size:11.5px;line-height:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none!important}.fav-address{margin-top:5px;color:#8D8993;font-size:11px;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none!important}.fav-remove{position:absolute;right:9px;top:9px;width:30px;height:30px;border:0;border-radius:50%;background:#fff;color:#8062d8;font-size:21px;line-height:1;cursor:pointer}.fav-remove svg{width:24px;height:24px;display:block}.fav-remove.market{color:#8062d8}.fav-market-provider{display:inline-flex;align-items:center;height:18px;padding:0 6px;margin-right:5px;border-radius:999px;background:#f3effc;color:#6749bd;font-size:8px;font-weight:850;vertical-align:1px}.favorite-empty{padding:88px 24px 40px;text-align:center;color:#8d8993;font-size:12px;line-height:1.65}.favorite-empty strong{display:block;margin-bottom:7px;color:#28232e;font-size:15px}.favorite-empty .my-btn{margin-top:18px;display:inline-flex;align-items:center;padding:0 17px;text-decoration:none}.favorite-loading{padding:80px 20px;text-align:center;color:#99919d;font-size:12px}
</style><script src="/web-auth.js?v=20261014-web-auth6"></script><script src="/my-web-common.js?v=20261014-my2"></script><link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui2"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"></head><body><div class="my-page"><header class="my-head funy-sub-header"><button class="my-back funy-sub-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title funy-sub-title">관심 목록</div></header><main class="my-content"><div class="favorite-tabs" role="tablist" aria-label="관심 목록 구분"><button class="favorite-tab active" type="button" data-fav-tab="all">전체</button><button class="favorite-tab" type="button" data-fav-tab="shops">카드샵</button><button class="favorite-tab" type="button" data-fav-tab="market">매물</button></div><div id="root"><div class="favorite-loading">관심 목록을 불러오는 중...</div></div></main></div><script>
(async()=>{
 const H=FUNY_MY_WEB,A=await H.ready('/my-favorites.html');if(!A)return;
 const root=document.getElementById('root'),tabs=[...document.querySelectorAll('[data-fav-tab]')];
 const providerNames={daangn:'당근',bunjang:'번개장터',break:'BREAK'};
 const money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원';
 const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.2-4.35-9.55-8.36C.48 9.27 1.53 5.1 5.2 3.74 7.54 2.87 10.08 3.7 12 5.7c1.92-2 4.46-2.83 6.8-1.96 3.67 1.36 4.72 5.53 2.75 8.9C19.2 16.65 12 21 12 21Z"/></svg>';
 let current='all',items=[];
 const emptyHtml=tab=>tab==='shops'
   ?'<div class="favorite-empty"><strong>아직 관심 카드샵이 없어요</strong>카드샵 상세에서 ♡ 버튼을 눌러 관심 목록에 추가해보세요.<br><a href="/shops.html" class="my-btn">TCG MAP 둘러보기</a></div>'
   :tab==='market'
     ?'<div class="favorite-empty"><strong>아직 관심 매물이 없어요</strong>매물 상세에서 ♡ 버튼을 눌러 관심 목록에 추가해보세요.<br><a href="/shops.html" class="my-btn">TCG 거래 둘러보기</a></div>'
     :'<div class="favorite-empty"><strong>아직 관심 목록이 비어 있어요</strong>좋아하는 카드샵과 매물을 모아보세요.</div>';
 function render(){
   const list=current==='all'?items:items.filter(x=>x.kind===current);
   if(!list.length){root.innerHTML=emptyHtml(current);return}
   root.innerHTML='<div class="favorite-list">'+list.map(x=>{
     if(x.kind==='shops'){
       const s=x.data,imgs=Array.isArray(s.images)?s.images:[],im=imgs.slice().sort((a,b)=>Number(b.is_primary)-Number(a.is_primary))[0],src=H.img(im?.storage_path||im?.source_path||''),station=s.nearest_station?(s.nearest_station+(s.walk_minutes!=null?' 도보 '+s.walk_minutes+'분':'')):'카드샵';
       return '<article class="my-card fav-card" data-kind="shops" data-id="'+H.esc(x.id)+'">'+(src?'<img class="fav-img" src="'+H.esc(src)+'" alt="">':'<div class="fav-fallback">FUNY PIN</div>')+'<a class="fav-copy" href="/shops.html#/shop/'+encodeURIComponent(x.id)+'"><div class="fav-name">'+H.esc(s.name)+'</div><div class="fav-meta">'+H.esc((s.area||s.city||'카드샵')+' · '+station)+'</div><div class="fav-address">'+H.esc(s.address||'')+'</div></a><button class="fav-remove" type="button" aria-label="관심 카드샵 해제">'+heart+'</button></article>';
     }
     const m=x.data,src=m.thumbnail_url||'',provider=providerNames[m.provider]||'외부 플랫폼',loc=(m.road_address||((m.location_name&&m.location_name!=='거래 희망 위치')?m.location_name:''))||'TCG 거래 매물';
     return '<article class="my-card fav-card" data-kind="market" data-id="'+H.esc(x.id)+'">'+(src?'<img class="fav-img" src="'+H.esc(src)+'" alt="" referrerpolicy="no-referrer">':'<div class="fav-fallback">TCG 거래</div>')+'<a class="fav-copy" href="/shops-market-test.html#market/'+encodeURIComponent(x.id)+'"><div class="fav-name">'+H.esc(m.title||'매물')+'</div><div class="fav-meta"><span class="fav-market-provider">'+H.esc(provider)+'</span>'+H.esc(money(m.price))+'</div><div class="fav-address">'+H.esc(loc)+'</div></a><button class="fav-remove market" type="button" aria-label="관심 매물 해제">'+heart+'</button></article>';
   }).join('')+'</div>';
   root.querySelectorAll('.fav-remove').forEach(btn=>btn.onclick=async()=>{
     const card=btn.closest('[data-id]'),id=card?.dataset.id,kind=card?.dataset.kind;if(!id||!kind)return;btn.disabled=true;
     const q=kind==='shops'
       ?A.client.from('shop_favorites').delete().eq('user_id',A.session.user.id).eq('shop_id',id)
       :A.client.from('market_listing_favorites').delete().eq('user_id',A.session.user.id).eq('listing_id',id);
     const {error}=await q;if(error){btn.disabled=false;alert('관심 목록 해제에 실패했습니다.');return}
     items=items.filter(x=>!(x.kind===kind&&x.id===id));render();
   });
 }
 tabs.forEach(b=>b.onclick=()=>{current=b.dataset.favTab;tabs.forEach(x=>x.classList.toggle('active',x===b));render()});
 async function load(){
   const [shopFavRes,marketFavRes,marketBlockRes]=await Promise.all([
     A.client.from('shop_favorites').select('shop_id,created_at').eq('user_id',A.session.user.id).order('created_at',{ascending:false}),
     A.client.from('market_listing_favorites').select('listing_id,created_at').eq('user_id',A.session.user.id).order('created_at',{ascending:false}),
     A.client.from('market_user_blocks').select('blocked_user_id').eq('blocker_user_id',A.session.user.id)
   ]);
   if(shopFavRes.error)throw shopFavRes.error;if(marketFavRes.error)throw marketFavRes.error;
   const blockedMarketUsers=new Set((marketBlockRes.data||[]).map(x=>String(x.blocked_user_id)));
   const shopFavs=shopFavRes.data||[],marketFavs=marketFavRes.data||[],shopIds=shopFavs.map(x=>x.shop_id),marketIds=marketFavs.map(x=>x.listing_id);
   const [shopsRes,marketRes]=await Promise.all([
     shopIds.length?A.client.from('v_app_shops').select('*').in('id',shopIds):Promise.resolve({data:[],error:null}),
     marketIds.length?A.client.from('market_listings').select('id,title,price,thumbnail_url,provider,road_address,location_name,seller_user_id,listing_status,created_at').in('id',marketIds):Promise.resolve({data:[],error:null})
   ]);
   if(shopsRes.error)throw shopsRes.error;if(marketRes.error)throw marketRes.error;
   const shopBy=new Map((shopsRes.data||[]).map(x=>[String(x.id),x])),marketBy=new Map((marketRes.data||[]).filter(x=>!blockedMarketUsers.has(String(x.seller_user_id))).map(x=>[String(x.id),x]));
   items=[
     ...shopFavs.map(f=>({kind:'shops',id:String(f.shop_id),favAt:f.created_at,data:shopBy.get(String(f.shop_id))})).filter(x=>x.data),
     ...marketFavs.map(f=>({kind:'market',id:String(f.listing_id),favAt:f.created_at,data:marketBy.get(String(f.listing_id))})).filter(x=>x.data)
   ].sort((a,b)=>new Date(b.favAt)-new Date(a.favAt));
   render();
 }
 try{await load()}catch(e){root.innerHTML='<div class="favorite-empty"><strong>불러오지 못했어요</strong>잠시 후 다시 시도해주세요.</div>'}
})();
</script></body></html>
