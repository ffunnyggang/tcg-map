<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BOX 가격 관리 | FUNY PIN 관리자</title><link rel="stylesheet" href="/funy-ui-guide.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f8;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:#181720}.wrap{max-width:1040px;padding:22px 20px 70px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.heading h1{font-size:23px;margin:0}.heading a{color:#6749bd;font-size:13px;text-decoration:none}.panel{border:1px solid #e9e5ed;background:white;border-radius:16px;padding:21px;margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700}.field input,.field select{width:100%;height:43px;border:1px solid #ddd7e6;border-radius:10px;padding:0 12px;background:#fff;font-size:14px}.upload{margin-top:14px;border:1px dashed #bdb2d0;background:#faf9fd;border-radius:13px;padding:25px;text-align:center;display:block;cursor:pointer}.upload input{display:block;margin:10px auto 0;max-width:100%}.upload img{max-width:100%;max-height:360px;object-fit:contain;margin:12px auto}.muted{font-size:12px;color:#837a8b;line-height:1.6}.primary{background:#8062d8;color:#fff;border:0;border-radius:11px;padding:12px 17px;font:750 13px inherit;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#fff;border:1px solid #e9e5ed;border-radius:10px;padding:11px 14px;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.status{padding:12px;border-radius:10px;background:#f0ebfb;color:#6749bd;font-size:13px;margin-bottom:14px}.status[hidden],.panel[hidden]{display:none}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:610px;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #f0edf4}th{font-size:11px;color:#837a8b}td input[type=number]{height:37px;border:1px solid #ded9e6;border-radius:8px;width:125px;padding:5px}td input[type=checkbox]{accent-color:#8062d8}.chip{font-size:11px;border-radius:15px;background:#f3effa;padding:5px 9px;color:#6749bd}.login{padding:25px;background:#fff;border-radius:14px}@media(max-width:620px){.fields{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:15px}h1{font-size:20px!important}}
</style></head><body><main class="wrap"><div class="heading"><h1>BOX 가격 관리</h1><a href="admin.html">관리자로 돌아가기 ›</a></div><div class="login" id="authNotice">관리자 로그인 상태를 확인하고 있습니다.</div><div id="app" hidden><div class="status" id="status" role="status" hidden></div><section class="panel"><h2>1. 가격표 스크린샷 등록</h2><div class="fields"><label class="field">판매처<select id="seller"><option value="">판매처 선택</option><option value="용산골드카드">용산골드카드</option><option value="리안 TCG">리안 TCG</option><option value="카드성지">카드성지</option><option value="더카드룸">더카드룸</option></select></label><label class="field">가격 기준일<input type="date" id="effectiveDate" required></label></div><label class="upload" for="file"><strong>가격표 이미지를 선택하거나 첨부하세요</strong><p class="muted">JPG·PNG·WebP / 8MB 이하 · 1회 1장</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" hidden alt="선택한 가격표 미리보기"></label><p class="muted">퍼니핀에 등록된 BOX만 추출하며, 일반 BOX/논슈링크·팩 단위와 만원 단위 가격을 구분합니다. 기준일은 실제 가격표의 날짜를 지정하세요.</p><div class="actions"><button class="primary" id="extract">AI 가격 자동 추출</button></div></section><section class="panel" id="review" hidden><h2>2. 자동 추출 결과 확인 <span id="count" class="chip"></span></h2><p class="muted">잘못 인식된 제품은 선택 해제하고 가격을 수정하세요. 승인한 항목만 적용됩니다.</p><div class="table-scroll"><table><thead><tr><th>적용</th><th>BOX 제품명</th><th>추출 가격 (원)</th><th>신뢰도</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="secondary" id="reset">다른 이미지</button><button class="primary" id="apply">확인한 가격 일괄 적용</button></div></section></div></main>
<script>
const SUPA='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';let session='',uploadId='',catalog=new Map(),raw=[];
const $=id=>document.getElementById(id),status=msg=>{$('status').hidden=false;$('status').textContent=msg};
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
$('effectiveDate').value=today();
async function guard(){const token=sessionStorage.getItem('funypin_admin_token');if(!token){$('authNotice').textContent='관리자 로그인 후 이용할 수 있습니다. admin.html에서 먼저 로그인해주세요.';return}const r=await fetch(SUPA+'/rest/v1/rpc/is_funypin_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!r.ok||(await r.json())!==true){$('authNotice').textContent='관리자 권한을 확인할 수 없습니다. 관리자 페이지에서 다시 로그인해주세요.';return}session=token;$('authNotice').hidden=true;$('app').hidden=false}
async function call(action,payload){const r=await fetch(SUPA+'/functions/v1/box-price-admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'처리 실패');return d}
$('file').addEventListener('change',()=>{const f=$('file').files[0];if(!f)return;const url=URL.createObjectURL(f);$('preview').src=url;$('preview').hidden=false;$('preview').onload=()=>URL.revokeObjectURL(url)});
const base64=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
$('extract').addEventListener('click',async()=>{const f=$('file').files[0],seller=$('seller').value,date=$('effectiveDate').value;if(!f||!seller||!date){status('판매처·기준일·이미지를 모두 지정해주세요.');return}if(f.size>8000000){status('이미지는 8MB 이하로 선택해주세요.');return}const btn=$('extract');btn.disabled=true;status('이미지를 분석하고 있습니다…');try{const data=await call('extract',{seller,effective_date:date,mime:f.type,base64:await base64(f)});uploadId=data.upload_id;catalog=new Map(data.catalog.map(x=>[x.product_id,x.product_name_ko]));raw=data.rows;$('rows').replaceChildren();raw.forEach((x,i)=>{const tr=document.createElement('tr');const check=document.createElement('input');check.type='checkbox';check.checked=x.confidence>=0.75;check.dataset.index=i;const first=document.createElement('td');first.append(check);const name=document.createElement('td');name.textContent=catalog.get(x.product_id)||x.product_id;const price=document.createElement('input');price.type='number';price.min=1000;price.max=5000000;price.step=100;price.value=x.price_krw;price.dataset.index=i;const cell=document.createElement('td');cell.append(price);const conf=document.createElement('td');conf.textContent=Math.round(x.confidence*100)+'%';tr.append(first,name,cell,conf);$('rows').append(tr)});$('review').hidden=false;$('count').textContent=raw.length+'개 추출';status(raw.length?'추출이 완료됐습니다. 확인 후 반영하세요.':'등록된 BOX와 일치하는 가격을 추출하지 못했습니다.') }catch(e){status('추출 실패: '+e.message)}finally{btn.disabled=false}});
$('apply').addEventListener('click',async()=>{const items=[...$('rows').querySelectorAll('tr')].flatMap((tr,i)=>{if(!tr.querySelector('input[type=checkbox]').checked)return [];const price=Number(tr.querySelector('input[type=number]').value);return [{product_id:raw[i].product_id,raw_name:raw[i].raw_name,price_krw:price}]});if(!items.length){status('적용할 상품을 선택해주세요.');return}if(!confirm(items.length+'개 BOX 가격을 확정하여 저장할까요?'))return;const btn=$('apply');btn.disabled=true;try{const d=await call('apply',{upload_id:uploadId,rows:items});status(d.applied+'개 BOX 가격을 저장했습니다.');$('review').hidden=true}catch(e){status('저장 실패: '+e.message)}finally{btn.disabled=false}});
$('reset').addEventListener('click',()=>{$('review').hidden=true;$('file').value='';$('preview').hidden=true});
guard().catch(e=>{$('authNotice').textContent='로그인 상태 확인 실패: '+e.message});
</script></body></html>
