<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>퍼니코인 비공개 테스트 | FUNY PIN</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-web.css?v=20261014-my3">
<link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui2">
<style>
.wallet-hero{padding:25px 19px;background:linear-gradient(145deg,#2b2630,#5e459d);color:#fff}.wallet-hero small{font-size:10px;opacity:.7}.wallet-hero strong{display:block;margin-top:8px;font-size:34px}.wallet-hero span{font-size:11px;opacity:.8}.private{display:inline-block;margin-top:14px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-size:8px;font-weight:900}.section{padding:19px}.section h2{margin:0 0 12px;font-size:15px}.ledger{display:grid;gap:8px}.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:13px;border:1px solid #ece8ef;border-radius:13px}.tx b{display:block;font-size:11px}.tx span{display:block;margin-top:4px;color:#918996;font-size:9px}.tx strong{font-size:12px}.tx strong.plus{color:#348554}.tx strong.minus{color:#b42318}.empty{padding:30px;text-align:center;color:#9a929e;font-size:10px}
</style>
<script src="/web-auth.js?v=20261016-auth-fix1"></script>
<script src="/my-web-common.js?v=20261014-my2"></script>
</head>
<body>
<div class="my-page">
<header class="my-head funy-sub-header"><button class="my-back funy-sub-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title funy-sub-title">퍼니코인</div></header>
<main id="root" class="my-content"><div class="my-loading">퍼니코인을 불러오는 중...</div></main>
</div>
<script>
(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-funy-coin-test.html');if(!A)return;const root=document.getElementById('root');const labels={signup_bonus:'회원가입 보너스',mission_reward:'미션 보상',event_reward:'이벤트 보상',garapon_spend:'가라폰 참여',garapon_refund:'가라폰 환불',admin_grant:'관리자 지급',admin_deduct:'관리자 회수'};try{const {data,error}=await A.client.rpc('get_my_funy_coin_wallet');if(error)throw error;if(!data?.ok)throw new Error(data?.error||'wallet');const rows=data.transactions||[];root.innerHTML='<section class="wallet-hero"><small>보유 퍼니코인</small><strong>'+Number(data.balance||0).toLocaleString('ko-KR')+'</strong><span>FUNY COIN</span><div class="private">PRIVATE TEST</div></section><section class="section"><h2>사용·적립 내역</h2><div class="ledger">'+(rows.length?rows.map(x=>'<article class="tx"><div><b>'+H.esc(x.description||labels[x.type]||x.type)+'</b><span>'+H.date(x.created_at)+' · 잔액 '+Number(x.balance_after||0).toLocaleString('ko-KR')+'개</span></div><strong class="'+(Number(x.amount)>0?'plus':'minus')+'">'+(Number(x.amount)>0?'+':'')+Number(x.amount).toLocaleString('ko-KR')+'</strong></article>').join(''):'<div class="empty">아직 퍼니코인 내역이 없어요.</div>')+'</div></section>'}catch(e){console.warn(e);root.innerHTML='<div class="my-empty"><strong>불러오지 못했어요</strong>테스트 계정 권한과 로그인 상태를 확인해주세요.</div>'}})();
</script>
</body>
</html>
