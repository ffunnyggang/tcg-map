name: Patch garapon hole release

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-hole-release.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hole-linked release animation
        run: python .github/scripts/patch_garapon_hole_release.py

      - name: Validate JavaScript syntax
        run: |
          cp garapon-three-machine-v2.js /tmp/garapon-three-machine-v2.mjs
          cp garapon-three-v2.js /tmp/garapon-three-v2.mjs
          node --check /tmp/garapon-three-machine-v2.mjs
          node --check /tmp/garapon-three-v2.mjs
          grep -q "phase: 'mouth'" garapon-three-machine-v2.js
          grep -q '20261016-hole-release1' garapon.html

      - name: Commit patch
        run: |
          if git diff --quiet -- garapon-three-machine-v2.js garapon-three-v2.js garapon.html tcg-tools.html; then
            echo 'Garapon hole release patch is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garapon-three-machine-v2.js garapon-three-v2.js garapon.html tcg-tools.html
          git commit -m 'fix: anchor garapon balls to the rotating outlet'
          git push
