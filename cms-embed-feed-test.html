const entries=[{name:'인스타 게시물',kind:'Instagram 이미지 게시물',url:'https://www.instagram.com/p/DeYMUH4H_AB/?img_index=1',type:'ig',path:'/p/DeYMUH4H_AB/',aspect:'1/1'},{name:'인스타 릴스',kind:'Instagram Reels',url:'https://www.instagram.com/reel/De6ajSGCXNH/',type:'ig',path:'/reel/De6ajSGCXNH/',aspect:'9/16'},{name:'유튜브 쇼츠',kind:'YouTube Shorts',url:'https://www.youtube.com/shorts/urCihNoqAfs',type:'yt',id:'urCihNoqAfs',aspect:'9/16'},{name:'유튜브 롱폼',kind:'YouTube 영상',url:'https://www.youtube.com/watch?v=1M9b4DOHQeE',type:'yt',id:'1M9b4DOHQeE',aspect:'16/9'}];let current=0,mode='compact';const $=id=>document.getElementById(id);const tabs=$('tabs');entries.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.name;b.onclick=()=>{current=i;render()};tabs.append(b)});$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;render()};
function iframe(src,title,aspect,instagram){const i=document.createElement('iframe');i.src=src;i.title=title;i.loading='lazy';i.referrerPolicy='strict-origin-when-cross-origin';i.allowFullscreen=true;i.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';i.style.width='100%';i.style.height=instagram?'710px':'100%';i.style.border='0';return i}
function render(){const x=entries[current],m=$('cardMedia');tabs.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===current));$('modes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));$('title').textContent=x.name;$('kind').textContent=x.kind;$('source').href=x.url;m.replaceChildren();m.style.aspectRatio='';m.style.maxHeight='none';

else if(mode==='official'){m.append(iframe('https://www.instagram.com'+x.path+'embed/',x.name,x.aspect,true));$('description').textContent='Instagram 공식 Embed 방식입니다. 원본 게시물/릴스를 볼 수 있지만 계정 정보·인터랙션 UI도 포함될 수 있습니다.';$('notice').textContent='공식 임베드 내부 영역을 크롭하거나 계정 정보만 CSS로 제거하는 방식은 적용하지 않습니다.';}
else{m.style.aspectRatio=x.aspect;const img=document.createElement('img');img.alt=x.name+' 대표 미디어';img.className='previewImage';img.loading='lazy';if(x.path.startsWith('/p/')){img.src='https://www.instagram.com/p/DeYMUH4H_AB/media/?size=l'}else{img.src='https://www.instagram.com/reel/De6ajSGCXNH/media/?size=l'}img.onerror=()=>{m.replaceChildren();const p=document.createElement('div');p.className='photo-placeholder';p.textContent='대표 이미지 직접 표시가 제한됩니다. 공식 임베드 전체 모드를 사용해주세요.';m.append(p)};m.append(img);$('description').textContent='이미지·영상 영역만 간결하게 표시하는 피드형 시안입니다. Instagram 릴스는 대표 이미지 미리보기만 제공하며, 재생은 공식 임베드 전체 모드에서 테스트합니다.';$('notice').textContent='Instagram 원본 이미지를 직접 표시하는 방식은 접근 차단·만료될 수 있으며 모든 슬라이드를 보장하지 않습니다. 미디어만 재생하는 공식 임베드 옵션은 확인되지 않았습니다.';}
}render();</script></body></html>
