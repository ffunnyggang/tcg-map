<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>퍼니몬 도감 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my2"><style>.mon-hero{padding:18px;background:#eee8fa}.mon-kicker{color:#6749bd;font-size:9px;font-weight:900;letter-spacing:1px}.mon-title{margin-top:5px;font-size:20px;font-weight:900}.mon-progress-text{margin-top:6px;color:#7e7684;font-size:11px}.mon-progress{height:7px;margin-top:14px;border-radius:4px;background:rgba(255,255,255,.72);overflow:hidden}.mon-progress>i{display:block;height:100%;background:#6749bd;border-radius:4px}.mon-card{padding:11px;min-height:205px}.mon-img-wrap{height:128px;border-radius:13px;background:#f7f4fc;display:grid;place-items:center;position:relative;overflow:hidden}.mon-img{width:88%;height:88%;object-fit:contain}.mon-img.locked{filter:grayscale(1);opacity:.27}.mon-lock{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.78);display:grid;place-items:center;color:#777;font-weight:900}.mon-no{margin-top:10px;color:#6749bd;font-size:9px;font-weight:900}.mon-name{margin-top:3px;font-size:15px;font-weight:900}.mon-type{margin-top:4px;color:#938b98;font-size:10px}</style><script src="/web-auth.js?v=20261014-web-auth3"></script><script src="/my-web-common.js?v=20261014-my2"></script></head><body><div class="my-page"><header class="my-head"><button class="my-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title">퍼니몬 도감</div></header><main id="root" class="my-content"><div class="my-loading">퍼니몬 도감을 불러오는 중...</div></main></div><script>(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-funymon.html');if(!A)return;const defs=[['ponanyang','01','포냐냥','노말',1],['bubblelong','02','버블롱','물',1],['hatring','03','하트링','페어리',2],['bulgi','04','불기','불',2],['namumong','05','나무몽','풀',2],['ggomagureum','06','꼬마구름','비행',3],['bawidong','07','바위동','바위',3],['grimjamong','08','그림자몽','고스트',4],['beonjjeogi','09','번쩍이','전기',4],['neon','10','네온','코스믹',5]];const root=document.getElementById('root');try{const {data,error}=await A.client.from('funy_mon_catches').select('monster_id,result').in('result',['caught','winner']);if(error)throw error;const caught=new Set((data||[]).map(x=>String(x.monster_id)));root.innerHTML='<section class="my-card mon-hero"><div class="mon-kicker">FUNY MON COLLECTION</div><div class="mon-title">나만의 퍼니몬 도감</div><div class="mon-progress-text">'+caught.size+' / '+defs.length+'종 포획 완료</div><div class="mon-progress"><i style="width:'+Math.min(100,caught.size/defs.length*100)+'%"></i></div></section><section class="my-grid" style="margin-top:12px">'+defs.map(([id,no,name,type,stars])=>{const on=caught.has(id),src='/assets/funymon/'+no+'-'+id+'.png';return '<article class="my-card mon-card"><div class="mon-img-wrap"><img class="mon-img '+(on?'':'locked')+'" src="'+src+'" alt="">'+(on?'':'<div class="mon-lock">?</div>')+'</div><div class="mon-no">No.'+no+'</div><div class="mon-name">'+(on?name:'???')+'</div><div class="mon-type">'+type+' · '+'★'.repeat(stars)+'</div></article>'}).join('')+'</section>'}catch(e){root.innerHTML='<div class="my-empty"><strong>도감을 불러오지 못했어요</strong>잠시 후 다시 시도해주세요.</div>'}})();</script></body></html>
