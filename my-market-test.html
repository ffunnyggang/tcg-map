<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>거래 매물 관리 TEST | FUNY PIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-test-v1.css?v=20261018-mytest1">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<script src="/my-test-gate.js?v=20261018-mytest1"></script>
<style>
.market-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:11px}.thumb{width:74px;height:82px;border-radius:12px;background:#F0EDF3;overflow:hidden;display:grid;place-items:center;color:#9A929E;font-size:9px}.thumb img{width:100%;height:100%;object-fit:cover}.copy{min-width:0}.price{margin-top:5px;font-size:14px;font-weight:900}.reason{margin-top:6px;padding:7px 8px;border-radius:9px;background:#FAF8FB;color:#8C8490;font-size:9px;line-height:1.45}.fab-add{position:fixed;right:max(16px,calc((100vw - 420px)/2 + 16px));bottom:18px;z-index:70;height:44px;padding:0 16px;border:0;border-radius:22px;background:#28232E;color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;box-shadow:0 8px 22px rgba(40,35,46,.18)}
</style>
</head><body><div class="test-shell">
<header class="test-head"><button class="test-back" onclick="location.href='/my-test.html'" aria-label="뒤로가기">‹</button><div class="test-title">거래 매물 관리</div><span></span></header>
<main class="test-main"><div class="test-banner"><span class="test-pill">TEST</span>등록한 TCG 거래 매물의 상태와 원본 매물 연결 상태를 관리합니다.</div>
<div class="tabs"><button class="tab on" data-tab="active">판매중</button><button class="tab" data-tab="hidden">숨김·만료</button><button class="tab" data-tab="sold">판매완료</button></div>
<div id="root"><div class="loading">매물을 불러오는 중...</div></div></main>
<a class="fab-add" href="/market-register-test.html"><span>＋</span><span>매물 등록</span></a>
</div><div id="toast" class="toast"></div>
<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],root=$('#root'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원';
 const date=v=>v?new Date(v).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,''):'';
 const provider={daangn:'당근',bunjang:'번개장터',break:'BREAK'},reason={seller_hidden:'내가 숨김',seller_deleted:'삭제한 매물',listing_expired:'노출 기간 만료',source_sold:'원본 판매완료',source_unavailable:'원본 접근불가',break_not_instant:'바로구매 불가',report_action:'신고 처리',admin_manual:'관리자 비노출'};
 const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)};
 if(!await FUNY_MY_TEST_GATE.ensure(A))return;const uid=A.session.user.id;
 let rows=[],current=location.hash.replace('#','')||'active';if(!['active','hidden','sold'].includes(current))current='active';
 async function load(){
  root.innerHTML='<div class="loading">매물을 불러오는 중...</div>';
  const {data,error}=await A.client.from('market_listings').select('id,provider,title,price,thumbnail_url,listing_status,source_status,location_name,external_url,created_at,expires_at,hidden_reason,source_last_checked_at').eq('seller_user_id',uid).order('created_at',{ascending:false});
  if(error)throw error;rows=data||[];render(current);
 }
 function group(x){if(['active','reserved'].includes(x.listing_status))return'active';if(x.listing_status==='sold')return'sold';return'hidden'}
 function status(x){const m={active:'판매중',reserved:'예약중',sold:'판매완료',hidden:'비노출',expired:'만료',deleted:'삭제'};return m[x.listing_status]||x.listing_status}
 function render(tab){
  current=tab;location.hash=tab;$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));const list=rows.filter(x=>group(x)===tab);
  root.innerHTML='<div class="list">'+(list.length?list.map(x=>'<article class="item"><div class="market-row"><div class="thumb">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" alt="" referrerpolicy="no-referrer">':'NO IMAGE')+'</div><div class="copy"><div class="item-head"><span class="badge">'+esc(provider[x.provider]||x.provider)+'</span><span class="badge '+(tab==='active'?'green':tab==='sold'?'gray':'red')+'">'+esc(status(x))+'</span><span class="time">'+date(x.created_at)+'</span></div><div class="item-title">'+esc(x.title)+'</div><div class="price">'+money(x.price)+'</div><div class="item-meta">'+esc(x.location_name||'거래 희망 위치')+(x.source_last_checked_at?' · 원본 확인 '+date(x.source_last_checked_at):'')+'</div>'+(tab==='hidden'?'<div class="reason">'+esc(reason[x.hidden_reason]||x.hidden_reason||'비노출 상태')+'</div>':'')+'</div></div><div class="actions"><a class="primary" href="/market-detail-test.html?id='+encodeURIComponent(x.id)+'">상세보기</a><a href="'+esc(x.external_url)+'" target="_blank" rel="noopener">원본 열기</a>'+(tab==='active'?'<button data-act="refresh" data-id="'+esc(x.id)+'">원본 새로고침</button><button class="danger" data-act="hide" data-id="'+esc(x.id)+'">숨기기</button>':tab==='hidden'&&x.listing_status!=='deleted'?'<button data-act="refresh" data-id="'+esc(x.id)+'">원본 상태 확인</button>':'')+'</div></article>').join(''):'<div class="empty"><strong>해당 상태의 매물이 없어요</strong>등록한 매물이 이곳에 상태별로 표시됩니다.</div>')+'</div>';bind();
 }
 function bind(){$$('[data-act]').forEach(b=>b.onclick=async()=>{const action=b.dataset.act,id=b.dataset.id;if(action==='hide'&&!confirm('이 매물을 숨길까요?'))return;b.disabled=true;const {data,error}=await A.client.functions.invoke('market-listing-owner-action-test',{body:{action,listing_id:id}});if(error||data?.ok===false){alert(data?.error||error?.message||'처리하지 못했습니다.');b.disabled=false;return}toast(action==='hide'?'매물을 숨겼습니다.':'원본 상태를 새로고침했습니다.');await load()})}
 $$('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));await load();
})().catch(e=>{document.getElementById('root').innerHTML='<div class="error"><strong>불러오지 못했어요</strong>'+String(e?.message||e)+'</div>'});
</script></body></html>
