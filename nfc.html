<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>NFC 방문인증 | FUNY PIN</title><link rel="icon" href="/favicon.svg">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f6fa;color:#241e2b;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:420px;min-height:100dvh;margin:auto;padding:24px 18px 48px;background:#fff}.brand{font-size:13px;font-weight:800;color:#7c4ed5}.panel{margin-top:22px;border:1px solid #ebe5f0;border-radius:18px;padding:20px 18px;box-shadow:0 4px 18px #3c235708}h1{font-size:23px;margin:10px 0}.muted{font-size:13px;line-height:1.7;color:#766e7f}.shop{margin:20px 0 15px;border-radius:13px;background:#f6f2fc;padding:16px}.shop strong{font-size:18px}.shop small{display:block;margin-top:6px;color:#7c6b8c}button{border:0;border-radius:12px;padding:15px 13px;font-size:14px;font-weight:800;width:100%;cursor:pointer}button.primary{background:#7b3dff;color:#fff}button.secondary{background:#f3eef8;color:#6342ab;margin-top:10px}button[disabled]{opacity:.55;cursor:wait}#status{white-space:pre-line;line-height:1.5;font-size:13px;color:#7350bc;min-height:24px;margin-top:12px}.note{border-top:1px solid #eee7f4;margin-top:20px;padding-top:15px;font-size:11px;line-height:1.7;color:#8a8190}</style></head>
<body><main class="wrap"><div class="brand">FUNY PIN · NFC CHECK-IN</div>
<section class="panel"><h1>매장 방문인증</h1><p class="muted">매장에서 NFC 태그를 터치하셨나요? 위치를 확인하고 방문인증을 진행할 수 있습니다.</p>
<div class="shop"><strong id="shopName">매장 확인 중…</strong><small id="shopDetail">NTAG213 · NFC 방문인증</small></div>
<button id="checkin" type="button" class="primary" disabled>GPS 확인 후 방문인증</button>
<button id="login" type="button" class="secondary" hidden>퍼니핀 로그인</button>
<p id="status" role="status" aria-live="polite">NFC 태그를 확인하고 있어요.</p>
<p class="note">NFC 태그 URL은 복사할 수 있어 NFC 접촉만으로 방문을 인정하지 않습니다. 로그인 및 매장 반경 50m·GPS 정확도 50m 이내 조건을 확인합니다. 정식 미션 반영은 매장별 운영 승인 이후에만 적용됩니다.</p></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),submit=$('checkin'),login=$('login'),status=$('status');
const token=(new URLSearchParams(location.search).get('t')||'').toLowerCase(),endpoint='https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/shop-visit-nfc-pilot',key='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
const messages={invalid_tag:'등록되지 않았거나 사용 중지된 NFC 태그예요.',login_required:'퍼니핀 로그인이 필요해요.',too_far:'현재 GPS 위치가 매장 기준 50m를 초과했어요. 매장 좌표와 휴대폰 위치를 확인하고 다시 시도해 주세요.',low_accuracy:'GPS 오차가 ±50m를 초과했어요. 창가 또는 실외에서 다시 측정해 주세요.',invalid_request:'인증 정보를 확인하고 다시 시도해 주세요.',rate_limited:'요청이 많아요. 잠시 후 다시 시도해 주세요.',shop_location_missing:'등록된 매장 좌표가 없습니다. 카드샵 정보를 확인해 주세요.',server_error:'인증을 처리하지 못했어요. 다시 시도해 주세요.'};
let shopId='',rewardEnabled=false;
function tell(message){status.textContent=message}
async function api(body,access=''){
 const response=await fetch(endpoint,{method:'POST',headers:{apikey:key,'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},body:JSON.stringify(body),cache:'no-store'});
 const data=await response.json().catch(()=>({ok:false,error:'server_error'}));
 if(!response.ok||!data.ok)throw Error(messages[data.error]||messages.server_error);
 return data;
}
async function authSession(){
 const a=window.FUNY_WEB_AUTH;await a?.init();if(!a?.client)throw Error(messages.login_required);
 let access=String(window.__FUNY_ACCESS_TOKEN||a.session?.access_token||'');
 if(!access&&window.ReactNativeWebView){await new Promise(r=>setTimeout(r,900));access=String(window.__FUNY_ACCESS_TOKEN||a.session?.access_token||'')}
 if(!access)throw Error(messages.login_required);
 const {data,error}=await a.client.auth.getUser(access);
 if(error||!data?.user)throw Error(messages.login_required);
 return access;
}
login.onclick=()=>window.FUNY_WEB_AUTH?.goLogin(location.pathname+location.search);
submit.onclick=async()=>{
 submit.disabled=true;login.hidden=true;tell('로그인과 현재 위치를 확인 중이에요.');
 try{
  const access=await authSession();
  if(!navigator.geolocation)throw Error('현재 기기에서 위치 서비스를 사용할 수 없어요.');
  const point=await new Promise((resolve,reject)=>{
   let watch=null,finished=false,best=null,timer=null;
   const done=(error,value)=>{if(finished)return;finished=true;clearTimeout(timer);if(watch!==null)navigator.geolocation.clearWatch(watch);error?reject(error):resolve(value)};
   timer=setTimeout(()=>done(best?null:Error('GPS 위치 정보를 받지 못했어요. 위치 권한을 확인해 주세요.'),best),20000);
   watch=navigator.geolocation.watchPosition(p=>{
    if(finished)return;
    const fix={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,fix_time:p.timestamp||Date.now()};
    if(!Number.isFinite(fix.accuracy)||fix.accuracy<0)return;
    if(!best||fix.accuracy<best.accuracy)best=fix;
    tell('GPS 재측정 중… 가장 작은 오차 반경 ±'+Math.round(best.accuracy)+'m (허용 ±50m)');
    if(best.accuracy<=50)done(null,best);
   },e=>{if(e.code===1)done(Error('위치 권한을 허용해 주세요.'));else if(e.code!==3)done(Error('위치 정보를 확인하지 못했어요.'))},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
   if(finished&&watch!==null)navigator.geolocation.clearWatch(watch);
  });
  if(point.accuracy>50)throw Error('현재 GPS 오차 반경 ±'+Math.round(point.accuracy)+'m입니다. ±50m 이하에서만 인증할 수 있어요.');
  tell('매장과 NFC 태그를 확인 중이에요.');
  const result=await api({action:'checkin',token,...point},access);
  const confirmed=result.reward_enabled===true;
  const success=confirmed
    ?(result.reward_applied?'매장 방문인증 완료! MY 방문 기록과 미션에 반영했어요.':'오늘 이미 방문인증한 매장이에요. 기존 인증 내역을 유지합니다.')
    :(result.new?'NFC 파일럿 인증 완료! 정식 MY 미션·코인에는 반영되지 않습니다.':'오늘 이 매장의 NFC 파일럿 인증을 이미 완료했어요.');
  tell(success);
  if(result.new){try{window.FUNY_TRACK?.('shop_visit_checkin',{shop_id:shopId,is_new:true,source:confirmed?'nfc_ntag213_gps':'nfc_ntag213_pilot',reward_applied:!!result.reward_applied})}catch(_){}}
 }catch(e){tell(e.message||messages.server_error);if(e.message===messages.login_required)login.hidden=false}
 finally{submit.disabled=!shopId}
};
(async()=>{
 if(!/^[a-f0-9]{48}$/.test(token)){tell(messages.invalid_tag);$('shopName').textContent='유효하지 않은 NFC 태그';return}
 try{
  const result=await api({action:'info',token});
  shopId=result.shop_id;rewardEnabled=result.reward_enabled===true;$('shopName').textContent=result.shop_name;
  $('shopDetail').textContent=rewardEnabled?'NTAG213 · 정식 방문인증 (MY 미션 연동)':'NTAG213 · 파일럿 인증 (MY 미션 미연동)';
  submit.disabled=false;tell('태그 확인 완료. 방문인증 버튼을 눌러 주세요.');
 }catch(e){$('shopName').textContent='태그 확인 실패';tell(e.message||messages.server_error)}
})();
})();
</script></body></html>
