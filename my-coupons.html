<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>쿠폰함 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my3"><style>.coupon{display:grid;grid-template-columns:minmax(0,1fr) 98px;overflow:hidden}.coupon-left{padding:17px}.coupon-kicker{color:#6749bd;font-size:8px;font-weight:900;letter-spacing:1px}.coupon-title{margin-top:7px;font-size:15px;font-weight:900}.coupon-desc{margin-top:5px;color:#7e7684;font-size:10.5px;line-height:1.5}.coupon-shop{margin-top:7px;color:#6749bd;font-size:10px;font-weight:800}.coupon-right{padding:12px;background:#eee8fa;border-left:1px solid #ded3ef;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.coupon-code{font-size:11px;font-weight:900;word-break:break-all}.coupon-date{margin-top:7px;color:#81798a;font-size:9px}</style><script src="/web-auth.js?v=20261014-web-auth6"></script><script src="/my-web-common.js?v=20261014-my2"></script><link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-back-align2"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"></head><body><div class="my-page"><header class="my-head funy-sub-header"><button class="my-back funy-sub-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title funy-sub-title">쿠폰함</div></header><main id="root" class="my-content"><div class="my-loading">쿠폰을 불러오는 중...</div></main></div><script>(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-coupons.html');if(!A)return;const root=document.getElementById('root');try{const {data,error}=await A.client.from('user_coupons').select('id,title,description,code,status,issued_at,expires_at,source_type,shop_name').order('issued_at',{ascending:false});if(error)throw error;if(!data?.length){root.innerHTML='<div class="my-empty"><strong>사용 가능한 쿠폰이 없어요</strong>이벤트 등을 통해 발급된 쿠폰이 이곳에 표시됩니다.</div>';return}root.innerHTML='<div class="my-list">'+data.map(x=>'<article class="my-card coupon"><div class="coupon-left"><div class="coupon-kicker">FUNY PIN COUPON</div><div class="coupon-title">'+H.esc(x.title)+'</div>'+(x.description?'<div class="coupon-desc">'+H.esc(x.description)+'</div>':'')+(x.shop_name?'<div class="coupon-shop">'+H.esc(x.shop_name)+'</div>':'')+'</div><div class="coupon-right"><div class="coupon-code">'+H.esc(x.code||'COUPON')+'</div><div class="coupon-date">'+(x.expires_at?'~ '+H.date(x.expires_at):H.date(x.issued_at))+'</div></div></article>').join('')+'</div>'}catch(e){root.innerHTML='<div class="my-empty"><strong>사용 가능한 쿠폰이 없어요</strong>이벤트 등을 통해 발급된 쿠폰이 이곳에 표시됩니다.</div>'}})();</script></body></html>
