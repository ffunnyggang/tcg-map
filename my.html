<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F7F4FC;color:#28232e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{padding:0}
.portal-shell{width:min(100%,420px)!important;max-width:420px!important;min-height:100dvh!important;margin:0 auto!important;background:#F7F4FC!important}
.portal-header{position:sticky!important;top:0!important;z-index:55!important;height:54px!important;padding:0 14px!important;display:flex!important;align-items:center!important;background:rgba(255,255,255,.97)!important;border:0!important;box-shadow:none!important}
.portal-brand{height:100%!important;display:flex!important;align-items:center!important;gap:0!important}
.portal-logo,.portal-logo svg{width:30px!important;height:34px!important;display:block!important}

.profile-avatar{width:78px;height:78px;border-radius:39px;background:#EEE8FA;border:1px solid #E0D5F1;display:grid;place-items:center;overflow:hidden;color:#6749bd;font-size:26px;font-weight:900}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-copy{margin-top:11px;width:100%;text-align:center}
.profile-nickname{font-size:21px;line-height:1.25;font-weight:900;color:#28232e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-join{margin-top:5px;font-size:11.5px;color:#8f8794}
.profile-edit{margin-top:14px;width:100%;height:42px;border-radius:12px;background:#F0EBF9;color:#6749bd;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:900}
.my-section{margin-top:23px}
.section-head{display:flex;align-items:baseline;padding:0 3px;margin-bottom:8px}
.section-title{margin:0;font-size:14.5px;line-height:18px;font-weight:800;letter-spacing:-.2px;color:#28232e}
.activity-card,.support-card,.settings-card{border-radius:19px;background:#fff;border:1px solid #E3DDED;overflow:hidden}
.activity-row{min-height:72px;padding:0 14px;display:flex;align-items:center;color:inherit;text-decoration:none;border-bottom:1px solid #EEEAF1}
.activity-row:last-child{border-bottom:0}
.activity-icon{flex:0 0 auto;width:42px;height:42px;border-radius:14px;background:#F0EBF9;display:grid;place-items:center;color:#6749bd;font-size:19px;line-height:1}
.activity-copy{flex:1;min-width:0;margin-left:12px}
.activity-label{display:block;font-size:14px;font-weight:900;color:#28232e}
.activity-sub{display:block;margin-top:4px;font-size:10.5px;color:#8f8794;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{flex:0 0 auto;margin-left:8px;color:#B0A9B5;font-size:21px;font-weight:400}
.language-row{min-height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.settings-card .language-row{border-bottom:1px solid #EEEAF1}
.support-label{font-size:13.5px;font-weight:700;color:#514b56}
.language-toggle{height:34px;padding:2px;border-radius:17px;background:#F1EDF6;display:flex;align-items:center}
.language-option{height:30px;min-width:52px;padding:0 10px;border:0;border-radius:15px;background:transparent;color:#8f8794;font-size:11px;font-weight:800;cursor:pointer}
.language-option.is-on{background:#6749bd;color:#fff}
.support-row{min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:inherit;text-decoration:none;border-bottom:1px solid #EEEAF1}
.support-row:last-child{border-bottom:0}
.account-actions{margin-top:18px;display:flex;flex-direction:column;align-items:center}
.logout-button{width:100%;height:54px;border:0;border-radius:16px;background:#6749bd;color:#fff;font-size:13px;font-weight:900;cursor:pointer}
.delete-button{margin-top:8px;min-height:34px;padding:0 12px;border:0;background:transparent;color:#b42318;font-size:12px;font-weight:800;cursor:pointer}
.logout-button:disabled,.delete-button:disabled{opacity:.55}
.legal-links{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}
.legal-links a{color:#8f8794;text-decoration:none;font-size:10.5px;font-weight:700}
.legal-divider{color:#C5BDC9;font-size:10px}
.my-message{margin-top:10px;color:#b42318;text-align:center;font-size:11px;line-height:1.5}.my-toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:2147483600;transform:translate(-50%,12px);max-width:calc(100% - 36px);padding:10px 14px;border-radius:999px;background:rgba(32,29,36,.92);color:#fff;font-size:11px;font-weight:750;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .2s ease}.my-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.portal-main{padding-left:14px!important;padding-right:14px!important}.activity-sub{font-size:10px}.language-option{min-width:48px}}
</style>

<body class="portal-body">
<div class="portal-shell">
<header class="portal-header">
  <div class="portal-brand">
    <span class="portal-logo" aria-hidden="true"><img src="/favicon.svg?v=20261016-app-logo1" alt=""></span>
    <strong>MY</strong>
  </div>
</header>
<main class="portal-main"><div id="myRoot" class="loading">계정 정보를 불러오는 중...</div></main>
<nav class="portal-bottom-nav" aria-label="하단 메뉴">
  <a href="./"><img class="nav-icon" data-nav-icon="home" src="/assets/nav-icons-final-v2/funypin_nav_home_off.png?v=20261013-nav-unify" alt=""><span>HOME</span></a>
  <a href="shops.html"><img class="nav-icon" data-nav-icon="map" src="/assets/nav-icons-final-v2/funypin_nav_map_off.png?v=20261013-nav-unify" alt=""><span>TCG MAP</span></a>
  <a href="reviews.html"><img class="nav-icon" data-nav-icon="pick" src="/assets/nav-icons-final-v2/funypin_nav_pick_off.png?v=20261013-nav-unify" alt=""><span>PICK</span></a>
  <a href="talk.html"><img class="nav-icon" data-nav-icon="talk" src="/assets/nav-icons-final-v2/funypin_nav_talk_off.png?v=20261013-nav-unify" alt=""><span>TALK</span></a>

</nav>
</div><div id="myToast" class="my-toast" role="status" aria-live="polite"></div>
<script>
(async()=>{
  const A=window.FUNY_WEB_AUTH,root=document.getElementById('myRoot');
  if(A.isAppShell()){location.replace('/');return}
  await A.init();
  if(!A.session){A.goLogin('/my.html');return}
  const user=A.session.user,en=localStorage.getItem('funy-pin-lang')==='en';
  const T={
    activity:en?'My activity':'내 활동',settings:en?'Settings':'설정',support:en?'Support':'고객지원',
    edit:en?'Edit profile':'프로필 편집',joined:en?'Joined':'가입일',
    fav:en?'Favorites':'관심 목록',favSub:en?'Save card shops and trades in one place':'카드샵과 거래를 한곳에 모아보세요',
    mon:en?'FUNY MON Collection':'퍼니몬 도감',monSub:en?'See all the FUNY MON you caught':'포획한 퍼니몬을 한눈에 확인',
    entries:en?'Entries':'응모 내역',entriesSub:en?'View events you joined on FUNY PIN':'퍼니핀에서 참여한 이벤트 확인',
    coupons:en?'Coupons':'쿠폰함',couponsSub:en?'Check your issued coupons':'발급받은 쿠폰을 확인하세요',
    blocked:en?'Blocked Users':'차단한 사용자',blockedSub:en?'Manage users blocked in FUNY TALK':'FUNY TALK 차단 목록을 관리해요',
    language:en?'Language':'언어',security:en?'Account security':'계정 보안',notice:en?'Notices':'공지사항',faq:en?'FAQ':'자주 묻는 질문',inquiry:en?'Support':'온라인 문의',
    survey:en?'Service Survey':'서비스 만족도 조사',shopRequest:en?'Add / Update Shop':'매장 등록 · 정보 수정 요청',partner:en?'Advertising & Partnerships':'광고 · 제휴 문의',
    logout:en?'Log out':'로그아웃',deleting:en?'Deleting…':'삭제 중…',loggingOut:en?'Signing out…':'처리 중…',deleteAccount:en?'Delete account':'계정 삭제',
    terms:en?'Terms of Service':'이용약관',privacy:en?'Privacy Policy':'개인정보처리방침',guidelines:en?'Community Guidelines':'커뮤니티 운영정책'
  };
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const date=v=>{if(!v)return'-';const d=new Date(v);if(Number.isNaN(d.getTime()))return'-';return d.toLocaleDateString(en?'en-US':'ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,'')};
  const {data:profile}=await A.client.from('profiles').select('*').eq('user_id',user.id).maybeSingle();
  const name=profile?.nickname||user.user_metadata?.nickname||user.user_metadata?.name||('FUNY회원'+String(user.id||'').replace(/-/g,'').slice(-4).toUpperCase());
  const avatar=profile?.avatar_url||user.user_metadata?.avatar_url||user.user_metadata?.picture||'';
  const initial=String(name).trim().slice(0,1).toUpperCase()||'M';
  const joined=profile?.created_at||user.created_at||null;

  root.className='';
  root.innerHTML=
    '<section class="profile-card">'+
      '<div class="profile-avatar">'+(avatar?'<img src="'+esc(avatar)+'" alt="">':esc(initial))+'</div>'+
      '<div class="profile-copy"><div class="profile-nickname">'+esc(name)+'</div><div class="profile-join">'+T.joined+' '+esc(date(joined))+'</div></div>'+
      '<a class="profile-edit" href="/my-profile.html">'+T.edit+'</a>'+
    '</section>'+
    '<section class="my-section"><div class="section-head"><h2 class="section-title">'+T.activity+'</h2></div><div class="activity-card">'+
      '<a class="activity-row" href="/my-favorites.html"><span class="activity-icon" aria-hidden="true">⭐</span><span class="activity-copy"><span class="activity-label">'+T.fav+'</span><span class="activity-sub">'+T.favSub+'</span></span><span class="chevron">›</span></a>'+
      '<a class="activity-row" href="/my-funymon.html"><span class="activity-icon" aria-hidden="true">👾</span><span class="activity-copy"><span class="activity-label">'+T.mon+'</span><span class="activity-sub">'+T.monSub+'</span></span><span class="chevron">›</span></a>'+
      '<a class="activity-row" href="/my-entries.html"><span class="activity-icon" aria-hidden="true">🎟️</span><span class="activity-copy"><span class="activity-label">'+T.entries+'</span><span class="activity-sub">'+T.entriesSub+'</span></span><span class="chevron">›</span></a>'+
      '<a class="activity-row" href="/my-coupons.html"><span class="activity-icon" aria-hidden="true">🎫</span><span class="activity-copy"><span class="activity-label">'+T.coupons+'</span><span class="activity-sub">'+T.couponsSub+'</span></span><span class="chevron">›</span></a>'+
      '<a class="activity-row" href="/my-blocked-users.html"><span class="activity-icon" aria-hidden="true">🚫</span><span class="activity-copy"><span class="activity-label">'+T.blocked+'</span><span class="activity-sub">'+T.blockedSub+'</span></span><span class="chevron">›</span></a>'+
    '</div></section>'+
    '<section class="my-section"><div class="section-head"><h2 class="section-title">'+T.settings+'</h2></div><div class="settings-card"><div class="language-row"><span class="support-label">'+T.language+'</span><div class="language-toggle"><button class="language-option '+(!en?'is-on':'')+'" data-lang="ko" type="button">한국어</button><button class="language-option '+(en?'is-on':'')+'" data-lang="en" type="button">EN</button></div></div><a class="support-row" href="/my-security.html?v=20261018-sms2"><span class="support-label">'+T.security+'</span><span class="chevron">›</span></a></div></section>'+
    '<section class="my-section"><div class="section-head"><h2 class="section-title">'+T.support+'</h2></div><div class="support-card">'+
      '<a class="support-row" href="/notice.html"><span class="support-label">'+T.notice+'</span><span class="chevron">›</span></a>'+
      '<a class="support-row" href="/faq.html"><span class="support-label">'+T.faq+'</span><span class="chevron">›</span></a>'+
      '<a class="support-row" href="/support.html"><span class="support-label">'+T.inquiry+'</span><span class="chevron">›</span></a>'+
      '<a class="support-row" href="/feedback.html"><span class="support-label">'+T.survey+'</span><span class="chevron">›</span></a>'+
      '<a class="support-row" href="/shop-request.html"><span class="support-label">'+T.shopRequest+'</span><span class="chevron">›</span></a>'+
      '<a class="support-row" href="/partner.html"><span class="support-label">'+T.partner+'</span><span class="chevron">›</span></a>'+
    '</div></section>'+
    '<div class="account-actions"><button id="logout" class="logout-button" type="button">'+T.logout+'</button><button id="deleteAccount" class="delete-button" type="button">'+T.deleteAccount+'</button><div id="myMessage" class="my-message"></div></div>'+
    '<div class="legal-links"><a href="/terms.html">'+T.terms+'</a><span class="legal-divider">·</span><a href="/privacy.html">'+T.privacy+'</a><span class="legal-divider">·</span><a href="/community-guidelines.html">'+T.guidelines+'</a></div>';

  const toast=document.getElementById('myToast');
  const toastMessage=()=>{
    const value=sessionStorage.getItem('funy-my-lang-toast');
    if(!value)return;
    sessionStorage.removeItem('funy-my-lang-toast');
    toast.textContent=value;requestAnimationFrame(()=>toast.classList.add('show'));setTimeout(()=>toast.classList.remove('show'),1800);
  };
  const savedScroll=Number(sessionStorage.getItem('funy-my-lang-scroll')||'');
  if(Number.isFinite(savedScroll)&&savedScroll>0){
    sessionStorage.removeItem('funy-my-lang-scroll');
    requestAnimationFrame(()=>{window.scrollTo(0,savedScroll);setTimeout(()=>window.scrollTo(0,savedScroll),80)});
  }
  toastMessage();
  document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>{
    const next=btn.dataset.lang==='en'?'en':'ko';
    if((en?'en':'ko')===next)return;
    sessionStorage.setItem('funy-my-lang-scroll',String(window.scrollY||document.documentElement.scrollTop||0));
    sessionStorage.setItem('funy-my-lang-toast',next==='en'?'Language changed to English.':'언어가 한국어로 변경되었습니다.');
    localStorage.setItem('funy-pin-lang',next);
    location.reload();
  }));

  const logout=document.getElementById('logout'),del=document.getElementById('deleteAccount'),msg=document.getElementById('myMessage');
  logout.onclick=async()=>{
    if(logout.disabled||del.disabled)return;
    if(!confirm(en?'Log out of FUNY PIN?\n\nYour saved favorite shops and activity history will remain in your account.':'로그아웃할까요?\n\n로그아웃해도 저장된 관심 매장과 활동 내역은 계정에 유지돼요.'))return;
    logout.disabled=true;del.disabled=true;logout.textContent=T.loggingOut;
    try{await A.signOut();location.replace('/')}catch(e){msg.textContent=en?'Could not log out. Please try again.':'로그아웃에 실패했습니다. 다시 시도해주세요.';logout.disabled=false;del.disabled=false;logout.textContent=T.logout}
  };
  del.onclick=async()=>{
    if(logout.disabled||del.disabled)return;
    const ok=confirm(en?'Delete your account? Your profile, favorites, and account-linked data will be deleted. This cannot be undone.':'계정을 삭제할까요?\n계정과 프로필, 관심 매장 등 계정에 연결된 정보가 삭제됩니다. 이 작업은 되돌릴 수 없습니다.');
    if(!ok)return;
    logout.disabled=true;del.disabled=true;del.textContent=T.deleting;
    try{
      const {data,error}=await A.client.functions.invoke('delete-account',{body:{}});
      if(error)throw error;
      if(data&&data.ok===false)throw new Error(data.message||'delete_failed');
      try{await A.client.auth.signOut({scope:'local'})}catch(_){}
      location.replace('/');
    }catch(e){
      msg.textContent=en?'Could not delete the account. Please try again.':'계정 삭제에 실패했습니다. 다시 시도해주세요.';
      logout.disabled=false;del.disabled=false;del.textContent=T.deleteAccount;
    }
  };
})();
</script>
<script src="/funy-mon-account-migrate.js?v=20261014-account-link1"></script>
