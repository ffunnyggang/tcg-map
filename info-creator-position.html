<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INFO 탭 좌표 설정 | FUNY PIN</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#242128;font-family:'Pretendard Variable',Pretendard,sans-serif}.page{width:min(100%,420px);min-height:100vh;margin:auto;background:#fff}.head{padding:18px;border-bottom:8px solid #f5f4f7}.back{font-size:30px;color:#29262e;text-decoration:none}.brand{margin-top:12px;color:#8062d8;font-size:10px;font-weight:800;letter-spacing:.18em}.head h1{margin:7px 0 5px;font-size:24px}.head p{margin:0;color:#8d8792;font-size:12px;line-height:1.55}.controls{padding:18px;border-bottom:8px solid #f5f4f7}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;margin-bottom:7px;font-size:11px;color:#77717c}.field input{width:100%;height:42px;border:1px solid #ddd8e2;border-radius:10px;padding:0 11px;font:inherit;font-size:13px}.value{margin:13px 0 0;padding:11px;border-radius:10px;background:#f7f4fc;color:#6749bd;font-size:11px;line-height:1.55}.preview-title{padding:16px 18px 10px;font-size:12px;font-weight:800}.preview{width:100%;overflow:hidden;background:#fff}.crop{position:relative;width:100%;overflow:hidden;height:1230px}.crop iframe{position:absolute;left:0;top:0;width:100%;height:10000px;border:0;transform:translateY(-4265px);transform-origin:top left}</style></head><body><main class="page"><header class="head"><a class="back" href="./reviews.html">‹</a><div class="brand">FUNY PIN · INFO SETTING</div><h1>INFO 탭 좌표 설정</h1><p>CREATOR와 깽퐌커플 리뷰의 Y 좌표와 표시 높이를 각각 조절할 수 있어요.</p></header><section class="controls"><div class="field" style="margin-bottom:12px"><label for="target">설정할 탭</label><select id="target" style="width:100%;height:42px;border:1px solid #ddd8e2;border-radius:10px;padding:0 11px;background:#fff;font:inherit;font-size:13px"><option value="creator">CREATOR</option><option value="review">깽퐌커플 리뷰</option></select></div><div class="row"><div class="field"><label for="y">Y 좌표</label><input id="y" type="number" step="5"></div><div class="field"><label for="h">표시 높이</label><input id="h" type="number" min="100" step="10"></div></div><div class="value" id="value"></div></section><div class="preview-title" id="preview-title">CREATOR 미리보기</div><section class="preview"><div class="crop" id="crop"><iframe id="frame" src="https://link.inpock.co.kr/tcg_map" title="INFO 탭 좌표 미리보기" scrolling="no"></iframe></div></section></main><script>const target=document.getElementById('target'),y=document.getElementById('y'),h=document.getElementById('h'),crop=document.getElementById('crop'),frame=document.getElementById('frame'),value=document.getElementById('value'),title=document.getElementById('preview-title');const settings={creator:{name:'CREATOR',y:-4265,h:1230},review:{name:'깽퐌커플 리뷰',y:-3525,h:730}};function load(){const s=settings[target.value];y.value=s.y;h.value=s.h;apply()}function apply(){const s=settings[target.value],yy=Number(y.value)||0,hh=Math.max(100,Number(h.value)||900);s.y=yy;s.h=hh;crop.style.height=hh+'px';frame.style.transform='translateY('+yy+'px)';title.textContent=s.name+' 미리보기';value.textContent=s.name+': Y '+yy+' / H '+hh+'  →  이 값을 알려주면 실제 INFO 페이지에 적용할게요.'}target.addEventListener('change',load);[y,h].forEach(el=>el.addEventListener('input',apply));load();</script></body></html>
