<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 권한 관리 | FUNY PIN</title><link rel="stylesheet" href="/funy-ui-guide.css"><style>*{box-sizing:border-box}body{font-family:Pretendard,-apple-system,sans-serif;background:#f6f5f8;margin:0;color:#27232f}.wrap{max-width:720px;padding:24px 15px;margin:auto}.panel{background:#fff;padding:22px;border:1px solid #e7e1ec;border-radius:14px}h1{font-size:20px}p{font-size:12px;color:#777181;line-height:1.6}.row{display:flex;align-items:center;gap:8px;margin-top:14px}input[type=email]{flex:1;min-width:0;height:42px;padding:8px 11px;border:1px solid #e1dbe6;border-radius:9px}button{border:0;border-radius:9px;background:#8062d8;color:#fff;padding:11px 15px;font-weight:750;cursor:pointer}.entry{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #efebf2;overflow-wrap:anywhere;font-size:13px}.entry label{display:flex;align-items:center;gap:7px}a{font-size:12px;color:#6749bd}</style></head><body><main class="wrap"><a href="/admin.html">← 관리자</a><h1>관리자 권한 관리</h1><div class="panel"><h2 style="font-size:15px">BOX 가격 관리 페이지 접근 권한</h2><p>전체 관리자 권한과 별도로 특정 계정에 BOX 가격 관리 페이지만 허용합니다. 계정이 아직 가입하지 않은 경우에도 이메일로 미리 등록할 수 있습니다.</p><form id="add"><div class="row"><input id="email" type="email" required placeholder="계정 이메일"><button type="submit">권한 부여</button></div></form><p id="message" role="status">관리자 권한을 확인하는 중...</p><div id="list"></div></div></main><script>
(async()=>{const root=document.getElementById('list'),msg=document.getElementById('message'),KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq',BASE='https://wdttzpbmqavaqfcbaywj.supabase.co';const token=sessionStorage.getItem('funypin_admin_token');if(!token){msg.textContent='전체 관리자 로그인이 필요합니다.';return}async function call(action,params={}){const r=await fetch(BASE+'/functions/v1/box-price-admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action,...params})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'요청 실패');return d}async function load(){try{const d=await call('permission_list');root.replaceChildren();for(const row of d.rows||[]){const el=document.createElement('div');el.className='entry';const email=document.createElement('span');email.textContent=row.email;const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=row.box_price_manage;cb.addEventListener('change',async()=>{cb.disabled=true;try{await call('permission_set',{email:row.email,enabled:cb.checked});msg.textContent='권한을 변경했습니다.'}catch(e){cb.checked=!cb.checked;msg.textContent=e.message}finally{cb.disabled=false}});label.append(cb,document.createTextNode('BOX 가격 관리'));el.append(email,label);root.append(el)}msg.textContent='권한이 등록된 계정 '+(d.rows||[]).length+'개'}catch(e){msg.textContent='권한 조회 실패: '+e.message}}document.getElementById('add').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('email');try{await call('permission_set',{email:input.value.trim(),enabled:true});input.value='';await load()}catch(error){msg.textContent=error.message}});await load()})();
</script></body></html>
