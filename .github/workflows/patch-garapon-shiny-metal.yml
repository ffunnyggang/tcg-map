name: Patch garapon shiny gold and silver

on:
  push:
    paths:
      - '.github/workflows/patch-garapon-shiny-metal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shiny metal refinements
        run: python .github/scripts/patch_garapon_shiny_metal.py

      - name: Validate JavaScript and cache versions
        run: |
          node --check garapon-three-v2.js
          node --check garapon-three-machine-v2.js
          grep -q "#ffd95a" garapon-three-v2.js
          grep -q "#f2f5fa" garapon-three-v2.js
          grep -q "metallicGlintMaterial" garapon-three-machine-v2.js
          grep -q "metallicShimmer" garapon-three-v2.css
          grep -q "20261016-shiny-metal1" garapon.html

      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/scripts/patch_garapon_shiny_metal.py
          rm -f .github/workflows/patch-garapon-shiny-metal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garapon-three-v2.js garapon-three-machine-v2.js garapon-three-v2.css garapon.html tcg-tools.html .github/scripts/patch_garapon_shiny_metal.py .github/workflows/patch-garapon-shiny-metal.yml
          git commit -m "refine: brighten shiny gold and silver garapon balls"
          git push
