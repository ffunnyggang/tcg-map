name: Mobile release check

on:
  workflow_dispatch:
  push:
    branches: [app-mvp]
    paths:
      - 'mobile/**'
      - 'talk-community-v1.js'
      - 'talk-safety-v1.js'
      - 'map-country-stability-v1.js'
      - 'map-cluster-v1.js'
      - 'map-country-v1.js'
      - 'ga4-events.js'
      - 'admin-community-v1.js'
      - '.github/workflows/mobile-release-check.yml'

jobs:
  android-release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Launch-critical web JavaScript syntax
        run: |
          node --check ../talk-community-v1.js
          node --check ../talk-safety-v1.js
          node --check ../map-country-stability-v1.js
          node --check ../map-cluster-v1.js
          node --check ../map-country-v1.js
          node --check ../ga4-events.js
          node --check ../admin-community-v1.js
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo config
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: npx expo config --type public > /tmp/expo-config.json
      - name: Expo doctor
        run: npx expo-doctor
