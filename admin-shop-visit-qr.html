<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>방문 QR 관리 | FUNY PIN Admin</title><link rel="stylesheet" href="/funy-ui-guide.css"><script src="/web-auth.js?v=20261018-web-auth10"></script><script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f4f8;color:#24202c;font-family:Pretendard,-apple-system,sans-serif}.wrap{max-width:750px;margin:0 auto;padding:22px 18px}h1{font-size:21px}.card{margin:18px 0;padding:18px;border-radius:14px;background:white;border:1px solid #eae4f2}input,button{font:inherit;padding:11px 12px;border:1px solid #ded5ec;border-radius:10px}input{width:100%;max-width:310px}button{background:#7b3dff;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{font-size:12px;line-height:1.7;color:#81798a}.url{overflow-wrap:anywhere;font-size:12px;color:#6946bc}#qr{padding:14px;background:white;display:inline-block}#tags li{padding:12px 0;border-bottom:1px solid #eee6f3;font-size:13px}#tags button{background:#f2eaf9;color:#6e4caa;padding:7px 10px;margin-left:9px}</style></head><body><main class="wrap"><p><a href="/admin.html">← 전체 관리자</a></p><h1>매장 방문 QR · 1차 테스트</h1><p class="muted">기존 GPS 인증은 유지합니다. QR 발급은 선택한 매장에만 적용되며, 생성된 URL은 이 화면에서 한 번만 표시됩니다. 카드샵에 부착할 출력물을 저장해 주세요.</p><div id="msg" role="status">관리자 권한을 확인하는 중입니다.</div><section class="card" id="editor" hidden><label for="shop">매장 ID (예: KR-SEO-009)</label><div class="row" style="margin-top:10px"><input id="shop" placeholder="KR-SEO-009" maxlength="48" autocomplete="off"><button id="create">매장 QR 생성</button></div><p class="muted">QR이 유출되면 아래 목록에서 즉시 사용 정지할 수 있습니다. 새 QR은 재발급 후 기존 QR을 폐기하세요.</p><div id="output" hidden><h2>신규 QR (최초 발급 시만 표시)</h2><div id="qr"></div><p id="link" class="url"></p><div class="row"><button id="copy">URL 복사</button><button id="print">QR 인쇄</button></div></div><h2>발급 이력</h2><ul id="tags"></ul></section></main><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),msg=$('msg');let currentUrl='';const a=window.FUNY_WEB_AUTH;try{await a.init();if(!a.session)throw Error('관리자로 로그인 후 이용해 주세요.');const {data,error}=await a.client.rpc('is_funypin_admin');if(error||data!==true)throw Error('관리자 권한이 없습니다.');$('editor').hidden=false;msg.textContent='관리자 확인 완료';}catch(e){msg.textContent=e.message;return}async function call(action,extra={}){const {data,error}=await a.client.functions.invoke('shop-visit-qr-otp',{body:{action,...extra}});if(error||!data?.ok)throw Error(data?.error||'요청에 실패했습니다.');return data}async function list(){try{const d=await call('admin_list');$('tags').replaceChildren();for(const t of d.tags||[]){const li=document.createElement('li');li.textContent=t.shop_id+' · '+t.status+' · '+new Date(t.created_at).toLocaleString('ko-KR');if(t.status==='active'){const b=document.createElement('button');b.textContent='사용 정지';b.onclick=async()=>{if(!confirm(t.shop_id+' QR을 폐기할까요?'))return;try{await call('admin_disable',{tag_id:t.id});await list()}catch(e){msg.textContent=e.message}};li.append(b)}$('tags').append(li)}}catch(e){msg.textContent=e.message}}$('create').onclick=async()=>{const b=$('create');b.disabled=true;try{const d=await call('admin_create',{shop_id:$('shop').value.trim()});currentUrl=d.url;$('output').hidden=false;$('link').textContent=d.url;const qr=$('qr');qr.replaceChildren();if(typeof QRCode==='function')new QRCode(qr,{text:d.url,width:210,height:210,correctLevel:QRCode.CorrectLevel.M});else qr.textContent='QR 라이브러리를 불러오지 못했습니다. URL을 복사해 QR을 생성하세요.';msg.textContent=d.shop_name+' QR 발급 완료';await list()}catch(e){msg.textContent='QR 발급 실패: '+e.message}finally{b.disabled=false}};$('copy').onclick=async()=>{if(currentUrl)await navigator.clipboard.writeText(currentUrl);msg.textContent='URL 복사 완료'};$('print').onclick=()=>window.print();await list();
})();
</script></body></html>
