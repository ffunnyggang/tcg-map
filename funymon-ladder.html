<script>
(()=>{
const STORAGE_KEY='funypin-ladder-v3';
const MONS=[
{id:'ponanyang',name:'포냐냥',src:'assets/funymon/01-ponanyang.png'},
{id:'bubblelong',name:'버블롱',src:'assets/funymon/02-bubblelong.png'},
{id:'hatring',name:'해트링',src:'assets/funymon/03-hatring.png'},
{id:'bulgi',name:'불기',src:'assets/funymon/04-bulgi.png'},
{id:'namumong',name:'나무몽',src:'assets/funymon/05-namumong.png'},
{id:'ggomagureum',name:'꼬마구름',src:'assets/funymon/06-ggomagureum.png'},
{id:'bawidong',name:'바위동',src:'assets/funymon/07-bawidong.png'},
{id:'grimjamong',name:'그림자몽',src:'assets/funymon/08-grimjamong.png'},
{id:'beonjjeogi',name:'번쩍이',src:'assets/funymon/09-beonjjeogi.png'},
{id:'neon',name:'네온',src:'assets/funymon/10-neon.png'},
{id:'longnyang',name:'롱냥',src:'assets/funymon/11-longnyang.png'},
{id:'shuffleling',name:'셔플링',src:'assets/funymon/12-shuffleling.png'},
{id:'neonkong',name:'네온콩',src:'assets/funymon/13-neonkong.png'},
{id:'paoring',name:'파오링',src:'assets/funymon/14-paoring.png'},
{id:'jokerbi',name:'조커비',src:'assets/funymon/15-jokerbi.png'}

const $=id=>document.getElementById(id);
const els={count:$('countValue'),minus:$('minusButton'),plus:$('plusButton'),instruction:$('instruction'),content:$('boardContent'),settings:$('settingsGrid'),presetButton:$('presetButton'),presetMenu:$('presetMenu'),reset:$('resetButton'),sheet:$('monSheet'),sheetClose:$('sheetClose'),sheetTitle:$('sheetTitle'),monGrid:$('monGrid'),toast:$('toast')};
let toastTimer=0,pickerIndex=-1;
const saved=loadSaved();
const state={count:saved.count,monIds:saved.monIds,labels:saved.labels,mode:'setup',rungs:[],rowCount:0,selected:null,animating:false,revealed:{}};
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function defaultLabels(count){return Array.from({length:count},(_,i)=>i===0?'당첨':'꽝')}
function normalizeMonIds(values,count){const available=MONS.map(x=>x.id),out=[];for(const value of Array.isArray(values)?values:[]){if(available.includes(value)&&!out.includes(value)&&out.length<count)out.push(value)}for(const id of available){if(out.length>=count)break;if(!out.includes(id))out.push(id)}return out}
function normalizeLabels(values,count){const defaults=defaultLabels(count);return Array.from({length:count},(_,i)=>{const v=String(Array.isArray(values)?values[i]??'':'').trim();return v||defaults[i]})}
function loadSaved(){try{const current=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(current){const count=clamp(Number(current.count)||6,2,12);return{count,monIds:normalizeMonIds(current.monIds,count),labels:normalizeLabels(current.labels,count)}}const legacy=JSON.parse(localStorage.getItem('funypin-ladder-v2')||localStorage.getItem('funypin-ladder-v1')||'null')||{};const count=6;return{count,monIds:normalizeMonIds(legacy.monIds,count),labels:normalizeLabels(legacy.labels,count)}}catch(_){return{count:6,monIds:normalizeMonIds([],6),labels:defaultLabels(6)}}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({count:state.count,monIds:state.monIds,labels:state.labels}))}catch(_){}}
function monAt(i){return MONS.find(x=>x.id===state.monIds[i])||MONS[i%MONS.length]}
function secureInt(max){if(max<=1)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}catch(_){return Math.floor(Math.random()*max)}}
function random(){return secureInt(1000000)/1000000}
function shuffle(values){const out=values.slice();for(let i=out.length-1;i>0;i--){const j=secureInt(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function showToast(msg){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1700)}
function track(name,params={}){try{window.FUNY_TRACK?.(name,{tool_name:'funymon_ladder',...params})}catch(_){}}
function setInstruction(){
 if(state.mode==='setup')els.instruction.innerHTML='퍼니몬을 선택하고 사다리를 시작해보세요<span class="instruction-sub">퍼니몬을 눌러 원하는 캐릭터로 바꿀 수 있어요</span>';
 else if(state.mode==='ready')els.instruction.innerHTML='퍼니몬을 눌러 결과를 확인하세요<span class="instruction-sub">선택한 퍼니몬의 경로가 표시됩니다</span>';
 else if(state.mode==='revealed'){const route=computeRoute(state.selected),mon=monAt(state.selected);els.instruction.innerHTML=escapeHtml(mon.name)+'의 결과는 <b>“'+escapeHtml(state.labels[route.end])+'”</b>이에요<span class="instruction-sub">다른 퍼니몬도 눌러 결과를 확인할 수 있어요</span>'}
 else els.instruction.innerHTML='전체 결과를 확인했어요<span class="instruction-sub">다시 하기를 누르면 새로운 사다리가 만들어집니다</span>';
}
function render(){document.documentElement.style.setProperty('--count',String(state.count));els.count.textContent=state.count+'명';els.minus.disabled=state.count<=2;els.plus.disabled=state.count>=12;setInstruction();renderSettings();state.mode==='all'?renderAllResults():renderBoard();save()}
function participantMarkup(){return '<div class="participant-row">'+Array.from({length:state.count},(_,i)=>{const mon=monAt(i),active=state.selected===i,wasRevealed=Object.prototype.hasOwnProperty.call(state.revealed,i),leavingNow=state.animating&&active,dim=state.animating&&!active&&!wasRevealed,silhouette=wasRevealed||leavingNow;return '<button class="mon-button '+(active?'active ':'')+(dim?'dim ':'')+(silhouette?'silhouette':'')+'" data-participant="'+i+'" type="button"><span class="mon-orb"><img src="'+mon.src+'" alt="'+mon.name+'">'+(state.mode==='setup'?'<i class="edit-dot">↻</i>':'')+'</span><span class="mon-index">'+(i+1)+'</span></button>'}).join('')+'</div>'}
function destinationMarkup(){const byEnd={};Object.keys(state.revealed).forEach(key=>{const start=Number(key),end=state.revealed[key];byEnd[end]=start});return '<div class="destination-row">'+Array.from({length:state.count},(_,i)=>{if(Object.prototype.hasOwnProperty.call(byEnd,i)){const start=byEnd[i],mon=monAt(start);return '<div class="destination-slot"><span class="slot-result-mon"><img src="'+mon.src+'" alt="'+mon.name+'"></span></div>'}return '<div class="destination-slot"><span class="slot-number">'+(i+1)+'</span></div>'}).join('')+'</div>'}
function renderBoard(){const center=state.mode==='setup'?'<div class="setup-center"><button class="start-button" id="startButton" type="button">시작하기 ›</button></div>':'<div class="ladder-wrap"><svg class="ladder-svg" id="ladderSvg" viewBox="0 0 1000 620" preserveAspectRatio="none"></svg></div>';const actions=state.mode==='setup'?'<div class="board-actions placeholder"><button class="board-button" type="button">전체 결과</button><button class="board-button" type="button">다시 하기</button></div>':'<div class="board-actions"><button class="board-button" id="allButton" type="button">☰ 전체 결과</button><button class="board-button" id="againButton" type="button">↻ 다시 하기</button></div>';els.content.innerHTML='<div class="board-inner">'+participantMarkup()+center+destinationMarkup()+'</div>'+actions;els.content.querySelectorAll('[data-participant]').forEach(btn=>btn.addEventListener('click',()=>onParticipant(Number(btn.dataset.participant))));$('startButton')?.addEventListener('click',startGame);$('allButton')?.addEventListener('click',showAll);$('againButton')?.addEventListener('click',restartGame);if(state.mode!=='setup')drawLadder()}
function renderAllResults(){const rows=Array.from({length:state.count},(_,i)=>{const route=computeRoute(i),mon=monAt(i);return '<div class="result-row"><span class="result-num">'+(i+1)+'</span><img class="result-mon" src="'+mon.src+'" alt="'+mon.name+'"><span class="result-copy"><b>'+escapeHtml(mon.name)+'</b><strong>'+escapeHtml(state.labels[route.end])+'</strong></span></div>'}).join('');els.content.innerHTML='<div class="result-summary">'+rows+'</div><div class="board-actions"><button class="board-button" id="againButton" type="button">↻ 다시 하기</button></div>';$('againButton')?.addEventListener('click',restartGame)}
function renderSettings(){state.labels=normalizeLabels(state.labels,state.count);els.settings.innerHTML=Array.from({length:state.count},(_,i)=>'<label class="setting-item"><span class="setting-num">'+(i+1)+'</span><input class="setting-input" data-label-index="'+i+'" maxlength="14" value="'+escapeHtml(state.labels[i])+'" placeholder="입력해주세요"></label>').join('');els.settings.querySelectorAll('[data-label-index]').forEach(input=>{input.addEventListener('input',()=>{state.labels[Number(input.dataset.labelIndex)]=input.value.slice(0,14);if(state.mode==='revealed'||state.mode==='all')state.mode='ready';setInstruction();save()});input.addEventListener('blur',()=>{const i=Number(input.dataset.labelIndex);if(!String(input.value).trim()){state.labels[i]=defaultLabels(state.count)[i];input.value=state.labels[i]}save()})})}
function generateRungs(){const n=state.count,rowCount=clamp(8+Math.ceil(n/2),9,14),rows=Array.from({length:rowCount},()=>new Set());for(let row=0;row<rowCount;row++){const candidates=shuffle(Array.from({length:n-1},(_,i)=>i)),p=n<=3?.62:n<=6?.50:.40;for(const left of candidates){if(random()>p)continue;if(rows[row].has(left-1)||rows[row].has(left)||rows[row].has(left+1))continue;rows[row].add(left)}}for(let left=0;left<n-1;left++){if(rows.some(s=>s.has(left)))continue;const row=shuffle(Array.from({length:rowCount},(_,i)=>i)).find(r=>!rows[r].has(left-1)&&!rows[r].has(left)&&!rows[r].has(left+1));if(row!==undefined)rows[row].add(left)}state.rowCount=rowCount;state.rungs=[];rows.forEach((set,row)=>[...set].sort((a,b)=>a-b).forEach(left=>state.rungs.push({row,left})))}
function xFor(col){return 70+col*(860/(state.count-1))}
function yFor(row){return 70+row*(480/Math.max(1,state.rowCount-1))}
function computeRoute(start){let col=start;const pts=[{x:xFor(col),y:18}];for(let row=0;row<state.rowCount;row++){const y=yFor(row);pts.push({x:xFor(col),y});const rung=state.rungs.find(x=>x.row===row&&(x.left===col||x.left+1===col));if(rung){col=rung.left===col?col+1:col-1;pts.push({x:xFor(col),y})}}pts.push({x:xFor(col),y:602});return{start,end:col,points:pts}}
function pathData(points){return points.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ')}
function drawLadder(){
 const svg=$('ladderSvg');if(!svg)return;
 const verticals=Array.from({length:state.count},(_,i)=>'<path class="ladder-line" d="M '+xFor(i)+' 18 L '+xFor(i)+' 602"/>').join('');
 const rungs=state.rungs.map(r=>'<path class="ladder-line" d="M '+xFor(r.left)+' '+yFor(r.row)+' L '+xFor(r.left+1)+' '+yFor(r.row)+'"/>').join('');
 let route='',moving='';
 if(state.mode==='revealed'&&state.selected!==null&&state.animating){
   const routeData=pathData(computeRoute(state.selected).points),mon=monAt(state.selected);
   route='<path class="route-path" id="routePath" d="'+routeData+'"/>';
   moving='<image class="moving-mon" id="movingMon" href="'+mon.src+'" width="88" height="88" x="-44" y="-44" preserveAspectRatio="xMidYMid meet"/>';
 }
 svg.innerHTML=verticals+rungs+route+moving;
 const path=$('routePath');if(!path)return;
 const len=path.getTotalLength(),movingMon=$('movingMon'),duration=1650,start=performance.now();
 path.style.strokeDasharray=String(len);path.style.strokeDashoffset=String(len);
 function frame(now){
   if(!state.animating||!movingMon||!document.body.contains(movingMon))return;
   const t=Math.min(1,(now-start)/duration),eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,dist=len*eased,p=path.getPointAtLength(dist);
   movingMon.setAttribute('x',String(p.x-44));movingMon.setAttribute('y',String(p.y-44));
   path.style.strokeDashoffset=String(len*(1-eased));
   if(t<1)requestAnimationFrame(frame);
   else{
     const end=computeRoute(state.selected).end;
     state.revealed[state.selected]=end;
     state.animating=false;
     render();
   }
 }
 requestAnimationFrame(frame);
}
function syncLabels(){els.settings.querySelectorAll('[data-label-index]').forEach(input=>{const i=Number(input.dataset.labelIndex),v=String(input.value).trim();state.labels[i]=v||defaultLabels(state.count)[i]})}
function startGame(){syncLabels();generateRungs();state.mode='ready';state.selected=null;state.animating=false;state.revealed={};render();track('ladder_game_start',{participant_count:state.count})}
function restartGame(){syncLabels();generateRungs();state.mode='ready';state.selected=null;state.animating=false;state.revealed={};render();showToast('새로운 사다리를 만들었어요.')}
function onParticipant(i){if(state.mode==='setup'){openMonPicker(i);return}if(state.mode==='all'||state.animating||Object.prototype.hasOwnProperty.call(state.revealed,i))return;state.selected=i;state.mode='revealed';state.animating=true;render();const route=computeRoute(i);track('ladder_game_result',{participant_index:i+1,result_index:route.end+1,result_label:state.labels[route.end]})}
function showAll(){if(!state.rungs.length||state.animating)return;state.mode='all';state.selected=null;state.animating=false;render()}
function changeCount(delta){const next=clamp(state.count+delta,2,12);if(next===state.count)return;syncLabels();state.count=next;state.monIds=normalizeMonIds(state.monIds,next);state.labels=normalizeLabels(state.labels,next);state.mode='setup';state.rungs=[];state.selected=null;state.animating=false;state.revealed={};render()}
function resetAll(){state.count=6;state.monIds=normalizeMonIds([],6);state.labels=defaultLabels(6);state.mode='setup';state.rungs=[];state.selected=null;state.animating=false;state.revealed={};try{localStorage.removeItem(STORAGE_KEY)}catch(_){}render();showToast('설정을 초기화했어요.')}
function applyPreset(name){const n=state.count;if(name==='winner')state.labels=Array.from({length:n},(_,i)=>i===0?'당첨':'꽝');if(name==='order')state.labels=Array.from({length:n},(_,i)=>(i+1)+'순위');if(name==='first')state.labels=Array.from({length:n},(_,i)=>i===0?'선공':i===1?'후공':'대기');if(name==='coffee')state.labels=Array.from({length:n},(_,i)=>i===0?'커피 사기':'면제');if(name==='snack')state.labels=Array.from({length:n},(_,i)=>i===0?'간식 사기':'면제');if(name==='cleanup')state.labels=Array.from({length:n},(_,i)=>i===0?'정리 담당':'면제');state.mode='setup';state.rungs=[];state.selected=null;state.animating=false;state.revealed={};closePreset();render();showToast('추천 내기를 적용했어요.')}
function togglePreset(){const open=!els.presetMenu.classList.contains('open');els.presetMenu.classList.toggle('open',open);els.presetButton.setAttribute('aria-expanded',String(open))}
function closePreset(){els.presetMenu.classList.remove('open');els.presetButton.setAttribute('aria-expanded','false')}
function openMonPicker(i){pickerIndex=i;els.sheetTitle.textContent=(i+1)+'번 퍼니몬 선택';renderMonPicker();els.sheet.classList.add('open');els.sheet.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeMonPicker(){els.sheet.classList.remove('open');els.sheet.setAttribute('aria-hidden','true');document.body.style.overflow='';pickerIndex=-1}
function renderMonPicker(){const current=state.monIds[pickerIndex];els.monGrid.innerHTML=MONS.map(mon=>{const used=state.monIds.indexOf(mon.id)>=0&&mon.id!==current;return '<button class="mon-choice '+(mon.id===current?'selected ':'')+(used?'used':'')+'" data-mon-id="'+mon.id+'" type="button"><img src="'+mon.src+'" alt="'+mon.name+'"><span>'+mon.name+'</span></button>'}).join('');els.monGrid.querySelectorAll('[data-mon-id]').forEach(btn=>btn.addEventListener('click',()=>selectMon(btn.dataset.monId)))}
function selectMon(monId){if(pickerIndex<0)return;const selectedIndex=pickerIndex,existing=state.monIds.indexOf(monId);if(existing>=0&&existing!==selectedIndex)[state.monIds[selectedIndex],state.monIds[existing]]=[state.monIds[existing],state.monIds[selectedIndex]];else state.monIds[selectedIndex]=monId;state.mode='setup';state.rungs=[];state.selected=null;state.animating=false;state.revealed={};closeMonPicker();render()}
function goBack(){try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({type:'NATIVE_BACK'}));return}}catch(_){}if(history.length>1)history.back();else location.href='tcg-tools.html'}
$('backButton').addEventListener('click',goBack);els.minus.addEventListener('click',()=>changeCount(-1));els.plus.addEventListener('click',()=>changeCount(1));els.reset.addEventListener('click',resetAll);els.presetButton.addEventListener('click',e=>{e.stopPropagation();togglePreset()});els.presetMenu.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>applyPreset(btn.dataset.preset)));document.addEventListener('click',e=>{if(!e.target.closest('.preset-wrap'))closePreset()});els.sheetClose.addEventListener('click',closeMonPicker);els.sheet.addEventListener('click',e=>{if(e.target===els.sheet)closeMonPicker()});window.addEventListener('keydown',e=>{if(e.key==='Escape'){closePreset();if(els.sheet.classList.contains('open'))closeMonPicker()}});render();track('ladder_game_view',{participant_count:state.count});
})();
</script>
