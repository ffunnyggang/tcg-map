<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FUNY CARD CHECK</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f6f8;color:#17171b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 16px 48px}h1{font-size:24px;margin:8px 0 4px}.sub{font-size:13px;color:#777;margin:0 0 18px}.upload{display:block;text-align:center;padding:13px;border-radius:12px;background:#8062d8;color:#fff;font-weight:700;cursor:pointer}.upload input{display:none}.stage{display:none;position:relative;margin-top:16px;background:#222;overflow:hidden;touch-action:none;min-height:300px}.stage img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.line{position:absolute;background:#8062d8;z-index:2;touch-action:none}.line.v{width:3px;height:100%;top:0}.line.h{height:3px;width:100%;left:0}.line:after{content:"";position:absolute;inset:-12px}.result{display:none;background:#fff;border-radius:14px;padding:16px;margin-top:16px}.ratios{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f4f1fb;border-radius:10px;padding:12px;text-align:center}.box b{display:block;font-size:19px}.help{font-size:12px;color:#777;line-height:1.55;margin-top:12px}</style></head>
<body><main class="wrap"><h1>FUNY CARD CHECK</h1><p class="sub">카드 사진에서 가이드라인을 움직여 센터링을 확인해보세요.</p>
<label class="upload">카드 사진 선택<input id="file" type="file" accept="image/*"></label>
<div id="stage" class="stage"><img id="img"><i class="line v" data-k="ol"></i><i class="line v" data-k="il"></i><i class="line v" data-k="ir"></i><i class="line v" data-k="or"></i><i class="line h" data-k="ot"></i><i class="line h" data-k="it"></i><i class="line h" data-k="ib"></i><i class="line h" data-k="ob"></i></div>
<section id="result" class="result"><div class="ratios"><div class="box">좌 : 우<b id="lr">-</b></div><div class="box">상 : 하<b id="tb">-</b></div></div><p class="help">바깥쪽 4개 선은 카드 외곽, 안쪽 4개 선은 테두리 안쪽 경계에 맞춰주세요. 측정값은 사진 각도와 촬영 상태에 따라 달라질 수 있으며 참고용입니다.</p></section></main>
<script>
const stage=document.getElementById('stage'),img=document.getElementById('img'),file=document.getElementById('file'),result=document.getElementById('result'),lines=[...document.querySelectorAll('.line')];
const pos={ol:.06,il:.16,ir:.84,or:.94,ot:.06,it:.16,ib:.84,ob:.94};
function draw(){lines.forEach(l=>{const v=pos[l.dataset.k]*100;l.style[l.classList.contains('v')?'left':'top']=v+'%'});calc()}
function calc(){const L=pos.il-pos.ol,R=pos.or-pos.ir,T=pos.it-pos.ot,B=pos.ob-pos.ib;const pct=(a,b)=>{const s=a+b;if(s<=0)return'-';return Math.round(a/s*100)+':'+Math.round(b/s*100)};lr.textContent=pct(L,R);tb.textContent=pct(T,B)}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.src=URL.createObjectURL(f);stage.style.display='block';result.style.display='block';img.onload=draw};
lines.forEach(l=>{l.onpointerdown=e=>{e.preventDefault();l.setPointerCapture(e.pointerId);const vertical=l.classList.contains('v');const move=x=>{const r=stage.getBoundingClientRect(),v=vertical?(x.clientX-r.left)/r.width:(x.clientY-r.top)/r.height;pos[l.dataset.k]=Math.max(0,Math.min(1,v));draw()};l.onpointermove=move;l.onpointerup=()=>l.onpointermove=null}});
</script></body></html>
