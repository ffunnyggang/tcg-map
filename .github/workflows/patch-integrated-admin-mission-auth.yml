name: Patch integrated admin missions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-integrated-admin-mission-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed mission management in admin shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'/web-auth\.js\?v=[^"\']+',
              '/web-auth.js?v=20261019-admin-refresh4',
              text,
              count=1,
          )

          text = re.sub(
              r'<script src="/admin-missions-integrated\.js\?v=[^"]+"></script>',
              '',
              text,
          )

          pattern = r'<script src="cms-layout-fix\.js\?v=[^"]+"></script>'
          replacement = (
              '<script src="cms-layout-fix.js?v=20261019-integrated-missions1"></script>'
              '<script src="/admin-missions-integrated.js?v=20261019-integrated1"></script>'
          )
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('cms-layout-fix script reference not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integrated mission admin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No admin.html changes required."
            exit 0
          fi
          git commit -m "feat: embed mission management in integrated admin"
          git push
