<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUNY PIN · URL 메타데이터 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7fa;color:#292532;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:840px;margin:auto;padding:24px 16px 64px}h1{font-size:22px;margin:0 0 8px}.desc{color:#777080;font-size:13px;line-height:1.6}.panel{background:white;border:1px solid #e9e4ed;border-radius:16px;padding:18px;margin-top:16px}.label{font-size:12px;font-weight:700;margin:0 0 9px}input{width:100%;height:44px;border-radius:10px;border:1px solid #ddd5e4;padding:0 12px;font-size:13px}.tests{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}button{border:1px solid #dfd5eb;border-radius:9px;background:#fff;padding:10px 12px;font-size:12px;cursor:pointer;color:#6a52a3;font-weight:700}button.primary{background:#8062d8;color:white;border-color:#8062d8;width:100%;height:44px}button:disabled{opacity:.5}.result{display:grid;grid-template-columns:160px 1fr;gap:18px}.image{width:160px;aspect-ratio:1;background:#f1eff4;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#9d93ab;font-size:12px}.image img{width:100%;height:100%;object-fit:cover}.data{min-width:0;overflow-wrap:anywhere}.field{margin:0 0 10px}.field b{display:block;font-size:11px;color:#8b8191;margin-bottom:3px}.field span{font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#faf9fc;border-radius:10px;padding:12px;font-size:11px;line-height:1.6}.small{font-size:11px;color:#8b8191}@media(max-width:500px){.result{grid-template-columns:1fr}.image{width:100%;aspect-ratio:16/9}}</style></head><body><main class="wrap"><h1>🔗 URL 메타데이터 테스트</h1><p class="desc">FUNY PIN CMS 사전 검증 전용 · 저장/게시 없음 · Instagram, YouTube, Naver Blog URL만 허용 · 관리자 로그인 후 실행</p><section class="panel"><p class="label">외부 콘텐츠 URL</p><input id="url" type="url" placeholder="https://..." aria-label="외부 콘텐츠 URL"><div class="tests"><button data-i="0">인스타 게시물</button><button data-i="1">인스타 릴스</button><button data-i="2">유튜브 쇼츠</button><button data-i="3">유튜브 영상</button><button data-i="4">네이버 블로그</button></div><button id="run" class="primary">메타데이터 분석</button><p class="small">관리자 인증 토큰을 이 브라우저의 세션에서 조회합니다. 해당 세션이 없으면 관리자로 로그인하세요.</p></section><section class="panel" id="output" aria-live="polite">URL을 선택한 다음 분석 버튼을 누르세요.</section></main><script>const urls=['https://www.instagram.com/p/DeYMUH4H_AB/?img_index=1','https://www.instagram.com/reel/De6ajSGCXNH/','https://www.youtube.com/shorts/urCihNoqAfs','https://www.youtube.com/watch?v=1M9b4DOHQeE','https://blog.naver.com/ffunyggang/224362855173'];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('url').value=urls[Number(b.dataset.i)];$('output').textContent='URL 선택됨. 분석을 누르세요.'});function token(){const t=sessionStorage.getItem('funypin_admin_token');if(t)return t;for(const store of [sessionStorage,localStorage])for(const k of Object.keys(store))if(k.startsWith('sb-')&&k.endsWith('-auth-token'))try{const v=JSON.parse(store.getItem(k));if(v?.access_token)return v.access_token}catch{}return ''}$('run').onclick=async()=>{const url=$('url').value.trim();if(!url)return;const t=token();if(!t){$('output').textContent='관리자 로그인 토큰을 찾지 못했습니다. 관리자 페이지 로그인 후 다시 시도하세요.';return}const b=$('run');b.disabled=true;$('output').textContent='분석 중...';try{const r=await fetch('https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/cms-metadata-probe-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t,'apikey':'sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok||!d.ok){$('output').textContent='분석 실패: '+(d.error||'HTTP '+r.status)+(d.status?' (원본 HTTP '+d.status+')':'');return}const fields=[['제목',d.title],['설명',d.description],['사이트',d.site_name],['콘텐츠 유형',d.type],['HTTP 상태',d.status],['HTML 수집량',d.html_length+'자'],['메타 태그',d.fields?.join(', ')],['참고',d.note]];$('output').innerHTML='<div class="result"><div class="image">'+(d.image?'<img src="'+esc(d.image)+'" alt="자동 추출 썸네일" onerror="this.replaceWith(document.createTextNode(\'이미지 로드 실패\'))">':'썸네일 없음')+'</div><div class="data">'+fields.map(([k,v])=>'<p class="field"><b>'+k+'</b><span>'+esc(v||'없음')+'</span></p>').join('')+'<p class="field"><b>원본 이미지 URL</b><span>'+esc(d.image||'없음')+'</span></p></div></div><details><summary>전체 응답 JSON</summary><pre>'+esc(JSON.stringify(d,null,2))+'</pre></details>'}catch(e){$('output').textContent='연결 오류: '+e.message}finally{b.disabled=false}};$('url').value=urls[0];</script></body></html>
