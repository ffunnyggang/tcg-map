<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관심 목록 | FUNY PIN</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-v2.css?v=20261020-back-align2">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<style>
.favorite-list{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.manage-tab-count{margin-left:5px;color:inherit;font-size:9.5px;font-weight:900;opacity:.72}
.fav-map-card{position:relative;border:1px solid #E6DFE8;border-radius:17px;background:#fff;box-shadow:0 3px 13px rgba(42,34,54,.035);overflow:visible}
.fav-card-link{position:relative;display:block;color:inherit;text-decoration:none!important}
.fav-shop-card{height:128px}
.fav-shop-card .fav-card-link{height:100%;padding:11px 47px 11px 11px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center}
.fav-shop-thumb,.fav-market-thumb{width:90px;height:90px;border-radius:13px;background:#F1EEF4;object-fit:cover;display:block}
.fav-shop-copy{min-width:0}
.fav-shop-name{margin:0 0 5px;color:#211E24;font-size:16px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-meta-line{margin:0;display:flex;align-items:center;gap:5px;min-width:0;color:#847C88;font-size:10.8px;line-height:16px}
.fav-meta-line+.fav-meta-line{margin-top:1px;color:#706978}
.fav-meta-line svg{width:13px;height:13px;flex:0 0 13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fav-meta-line span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-tag-row{display:flex;gap:5px;margin-top:8px;max-height:42px;overflow:hidden;flex-wrap:wrap}
.fav-tag{height:21px;padding:0 7px;display:inline-flex;align-items:center;border-radius:999px;background:#F2ECEF;color:#6D5D6A;font-size:9.8px;font-weight:650;white-space:nowrap}
.fav-market-card{min-height:122px}
.fav-market-card .fav-card-link{min-height:122px;padding:13px 47px 12px 11px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center}
.fav-market-copy{min-width:0;width:100%}
.fav-market-badges{display:flex;align-items:center;gap:4px;min-width:0;margin-bottom:6px;overflow:hidden}
.fav-market-badge{height:18px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;flex:0 0 auto;background:#F4F2F6;color:#716B79;font-size:8px;font-weight:800;line-height:1}
.fav-market-badge.provider.daangn{background:#FFF0E8;color:#DC5B08}.fav-market-badge.provider.bunjang{background:#FFF0F2;color:#D94050}.fav-market-badge.provider.break{background:#EEF4FF;color:#2F67D8}.fav-market-badge.category{background:#F3EFFC;color:#6749BD}
.fav-market-title{display:block;margin:0;color:#29252D;font-size:15px;font-weight:780;line-height:1.28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-market-price{display:block;margin-top:4px;color:#29252D;font-size:14px;font-weight:900}
.fav-market-location{display:flex;align-items:center;gap:4px;min-width:0;margin-top:5px;color:#8E8794;font-size:9.5px}
.fav-market-location svg{width:12px;height:12px;flex:0 0 12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fav-market-location span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-remove{position:absolute;right:8px;top:8px;z-index:6;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:#fff;color:#8062D8;display:grid;place-items:center;cursor:pointer}
.fav-remove svg{width:22px;height:22px;display:block}.fav-remove:active{background:#F5F1FA}.fav-remove:disabled{opacity:.45}
.fav-chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#9B88C5;font-size:20px;font-weight:400;line-height:1;pointer-events:none}
.favorite-empty{padding:74px 22px 36px;text-align:center;color:#8D8993;font-size:11px;line-height:1.65}.favorite-empty strong{display:block;margin-bottom:7px;color:#28232E;font-size:14px}.favorite-empty .btn{margin-top:16px}
.toast{position:fixed;left:50%;bottom:28px;z-index:2147483600;transform:translate(-50%,18px);opacity:0;pointer-events:none;min-width:180px;max-width:calc(100% - 32px);padding:11px 14px;border-radius:12px;background:rgba(38,34,43,.94);color:#fff;text-align:center;font-size:11px;font-weight:750;transition:.2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.fav-shop-card{height:124px}.fav-market-card,.fav-market-card .fav-card-link{min-height:118px}.fav-shop-name{font-size:15px}}
</style>
<link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-header4">
</head>
<body><div class="test-shell">
<header class="test-head funy-sub-header"><button class="test-back funy-sub-back" onclick="location.href='/my.html'" aria-label="뒤로가기">‹</button><div class="test-title funy-sub-title">관심 목록</div><span></span></header>
<main class="test-main">
<div class="tabs" role="tablist" aria-label="관심 목록 구분">
 <button class="tab on" type="button" data-fav-tab="shops"><span>카드샵</span><span class="manage-tab-count" id="shopCount">0</span></button>
 <button class="tab" type="button" data-fav-tab="market"><span>거래</span><span class="manage-tab-count" id="marketCount">0</span></button>
</div>
<div id="root"><div class="loading">관심 목록을 불러오는 중...</div></div>
</main></div><div id="favToast" class="toast" role="status" aria-live="polite"></div>
<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],root=$('#root');
 await A.init();if(!A.session){A.goLogin('/my-favorites.html');return}
 const uid=A.session.user.id;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원';
 const img=v=>!v?'':/^https?:\/\//i.test(v)?v:'/'+String(v).replace(/^\//,'');
 const providerNames={daangn:'당근',bunjang:'번개장터',break:'BREAK'};
 const categoryNames={pokemon:'포켓몬스터',onepiece:'원피스',dragonball:'드래곤볼',other:'기타'};
 const typeNames={single:'싱글카드',vintage:'빈티지카드',graded:'등급카드',box:'박스제품',other:'기타'};
 const featureNames={single:'싱글카드',graded:'등급카드',vintage:'빈티지카드',oripa:'오리파',box:'박스제품',pack:'낱개팩',supplies:'카드용품',buy:'카드매입',consignment:'위탁판매',grading:'등급대행',play_space:'플레이공간',unmanned:'무인매장',tax_free:'면세'};
 const pin='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg>';
 const clock='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
 const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.2-4.35-9.55-8.36C.48 9.27 1.53 5.1 5.2 3.74 7.54 2.87 10.08 3.7 12 5.7c1.92-2 4.46-2.83 6.8-1.96 3.67 1.36 4.72 5.53 2.75 8.9C19.2 16.65 12 21 12 21Z"/></svg>';
 let current=location.hash.replace('#','')||'shops';if(!['shops','market'].includes(current))current='shops';let items=[];
 let toastTimer=0;const toast=m=>{const t=$('#favToast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)};

 const dayNames=['일','월','화','수','목','금','토'];
 function dayIncluded(expr,day){
   expr=String(expr||'').replace(/요일/g,'').trim();if(expr==='매일')return true;
   for(const part of expr.split(/[,，]\s*/)){
     if(part.includes('~')){const [a,b]=part.split('~').map(x=>dayNames.indexOf(x.trim())),d=dayNames.indexOf(day);if(a>=0&&b>=0&&(a<=b?(d>=a&&d<=b):(d>=a||d<=b)))return true}
     else if(part.trim()===day)return true;
   }
   return false;
 }
 function todayHours(s){
   const hours=String(s.hours_display||'').trim(),closed=String(s.closed_display||'').trim();if(!hours)return'영업시간 정보 없음';
   if(/^24\s*시간$/.test(hours))return'운영 중 · 24시간';
   const now=new Date(),parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now),day=parts.find(x=>x.type==='weekday')?.value.replace('요일','').replace('주','')||'',hh=Number(parts.find(x=>x.type==='hour')?.value||0),mm=Number(parts.find(x=>x.type==='minute')?.value||0);
   if(closed&&dayIncluded(closed,day))return'오늘 휴무';
   let slot=null;
   for(const seg of hours.split('/').map(x=>x.trim())){
     const m=seg.match(/^(.+?)\s+(\d{1,2}:\d{2})~(\d{1,2}:\d{2})$/);if(m&&dayIncluded(m[1],day)){slot={open:m[2],close:m[3]};break}
   }
   if(!slot){
     const m=hours.match(/^(?:매일\s+)?(\d{1,2}:\d{2})~(\d{1,2}:\d{2})$/);if(m)slot={open:m[1],close:m[2]};
   }
   if(!slot)return hours;
   const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},cur=hh*60+mm,op=mins(slot.open),cl=mins(slot.close),open=cl<=op?(cur>=op||cur<cl):(cur>=op&&cur<cl);
   return (open?'운영 중':'영업마감')+' · '+slot.open+'–'+slot.close;
 }
 function shopLocation(s){
   const city=String(s.city||'').trim(),area=String(s.area||'').trim(),station=String(s.nearest_station||'').trim(),walk=s.walk_minutes!=null?Number(s.walk_minutes):null;
   const base=[city,area].filter(Boolean).join(' ');
   const st=station?(station+(Number.isFinite(walk)?' 도보 '+walk+'분':'')):'';
   return [base,st].filter(Boolean).join(' · ')||String(s.address||'').trim()||'위치 정보 없음';
 }
 function shopTags(s){
   const f=s.features&&typeof s.features==='object'?s.features:{};
   return Object.entries(featureNames).filter(([k])=>f[k]?.value===true).map(([,v])=>v);
 }
 function marketAddress(m){return String(m.road_address||m.location_name||'거래 희망 위치').replace(/\s+/g,' ').trim()||'거래 희망 위치'}
 function shopCard(x){
   const s=x.data,tags=shopTags(s),shown=tags.slice(0,3),extra=tags.length-shown.length,imgs=Array.isArray(s.images)?s.images:[],im=imgs.slice().sort((a,b)=>Number(b.is_primary)-Number(a.is_primary))[0],src=img(im?.storage_path||im?.source_path||'');
   return '<article class="fav-map-card fav-shop-card" data-kind="shops" data-id="'+esc(x.id)+'"><a class="fav-card-link" href="/shops.html#/shop/'+encodeURIComponent(x.id)+'">'+(src?'<img class="fav-shop-thumb" src="'+esc(src)+'" alt="" loading="lazy">':'<span class="fav-shop-thumb"></span>')+'<div class="fav-shop-copy"><h3 class="fav-shop-name">'+esc(s.name||'카드샵')+'</h3><p class="fav-meta-line">'+pin+'<span>'+esc(shopLocation(s))+'</span></p><p class="fav-meta-line">'+clock+'<span>'+esc(todayHours(s))+'</span></p><div class="fav-tag-row">'+shown.map(t=>'<span class="fav-tag">'+esc(t)+'</span>').join('')+(extra>0?'<span class="fav-tag">+'+extra+'</span>':'')+'</div></div><span class="fav-chev" aria-hidden="true">›</span></a><button class="fav-remove" type="button" aria-label="관심 카드샵 해제">'+heart+'</button></article>';
 }
 function marketCard(x){
   const m=x.data,src=m.thumbnail_url||'';
   return '<article class="fav-map-card fav-market-card" data-kind="market" data-id="'+esc(x.id)+'"><a class="fav-card-link" href="/shops.html#market/'+encodeURIComponent(x.id)+'">'+(src?'<img class="fav-market-thumb" src="'+esc(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="fav-market-thumb"></span>')+'<div class="fav-market-copy"><div class="fav-market-badges"><span class="fav-market-badge provider '+esc(m.provider||'')+'">'+esc(providerNames[m.provider]||'외부 플랫폼')+'</span><span class="fav-market-badge category">'+esc(categoryNames[m.tcg_category]||'기타')+'</span><span class="fav-market-badge">'+esc(typeNames[m.item_type]||'기타')+'</span></div><strong class="fav-market-title">'+esc(m.title||'거래')+'</strong><span class="fav-market-price">'+money(m.price)+'</span><span class="fav-market-location">'+pin+'<span>'+esc(marketAddress(m))+'</span></span></div><span class="fav-chev" aria-hidden="true">›</span></a><button class="fav-remove" type="button" aria-label="관심 거래 해제">'+heart+'</button></article>';
 }
 function syncCounts(){
   $('#shopCount').textContent=String(items.filter(x=>x.kind==='shops').length);
   $('#marketCount').textContent=String(items.filter(x=>x.kind==='market').length);
 }
 const emptyHtml=tab=>tab==='shops'
  ?'<div class="favorite-empty"><strong>아직 관심 카드샵이 없어요</strong>카드샵 상세에서 ♡ 버튼을 눌러 관심 목록에 추가해보세요.<br><a href="/shops.html" class="btn primary">TCG MAP 둘러보기</a></div>'
  :'<div class="favorite-empty"><strong>아직 관심 거래가 없어요</strong>거래 상세에서 ♡ 버튼을 눌러 관심 목록에 추가해보세요.<br><a href="/shops.html" class="btn primary">TCG 거래 둘러보기</a></div>';
 function render(){
   $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.favTab===current));syncCounts();
   const list=items.filter(x=>x.kind===current);
   root.innerHTML=list.length?'<div class="favorite-list">'+list.map(x=>x.kind==='shops'?shopCard(x):marketCard(x)).join('')+'</div>':emptyHtml(current);
   root.querySelectorAll('.fav-remove').forEach(btn=>btn.onclick=async e=>{
     e.preventDefault();e.stopPropagation();
     const card=btn.closest('[data-id]'),id=card?.dataset.id,kind=card?.dataset.kind;if(!id||!kind)return;btn.disabled=true;
     const q=kind==='shops'
       ?A.client.from('shop_favorites').delete().eq('user_id',uid).eq('shop_id',id)
       :A.client.from('market_listing_favorites').delete().eq('user_id',uid).eq('listing_id',id);
     const {error}=await q;if(error){btn.disabled=false;alert('관심 목록 해제에 실패했습니다.');return}
     items=items.filter(x=>!(x.kind===kind&&x.id===id));render();
     toast(kind==='shops'?'관심 카드샵에서 해제했습니다.':'관심 거래에서 해제했습니다.');
   });
 }
 $$('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.favTab;history.replaceState(null,'','#'+current);render()});
 async function load(){
   const [shopFavRes,marketFavRes,marketBlockRes]=await Promise.all([
     A.client.from('shop_favorites').select('shop_id,created_at').eq('user_id',uid).order('created_at',{ascending:false}),
     A.client.from('market_listing_favorites').select('listing_id,created_at').eq('user_id',uid).order('created_at',{ascending:false}),
     A.client.from('market_user_blocks').select('blocked_user_id').eq('blocker_user_id',uid)
   ]);
   if(shopFavRes.error)throw shopFavRes.error;if(marketFavRes.error)throw marketFavRes.error;
   const blockedMarketUsers=new Set((marketBlockRes.data||[]).map(x=>String(x.blocked_user_id)));
   const shopFavs=shopFavRes.data||[],marketFavs=marketFavRes.data||[],shopIds=shopFavs.map(x=>x.shop_id),marketIds=marketFavs.map(x=>x.listing_id);
   const [shopsRes,marketRes]=await Promise.all([
     shopIds.length?A.client.from('v_app_shops').select('*').in('id',shopIds):Promise.resolve({data:[],error:null}),
     marketIds.length?A.client.from('market_listings').select('id,title,price,thumbnail_url,provider,tcg_category,item_type,road_address,location_name,place_name,seller_user_id,listing_status,created_at').in('id',marketIds):Promise.resolve({data:[],error:null})
   ]);
   if(shopsRes.error)throw shopsRes.error;if(marketRes.error)throw marketRes.error;
   const shopBy=new Map((shopsRes.data||[]).map(x=>[String(x.id),x])),marketBy=new Map((marketRes.data||[]).filter(x=>!blockedMarketUsers.has(String(x.seller_user_id))).map(x=>[String(x.id),x]));
   items=[
     ...shopFavs.map(f=>({kind:'shops',id:String(f.shop_id),favAt:f.created_at,data:shopBy.get(String(f.shop_id))})).filter(x=>x.data),
     ...marketFavs.map(f=>({kind:'market',id:String(f.listing_id),favAt:f.created_at,data:marketBy.get(String(f.listing_id))})).filter(x=>x.data)
   ].sort((a,b)=>new Date(b.favAt)-new Date(a.favAt));
   render();
 }
 try{await load()}catch(e){root.innerHTML='<div class="favorite-empty"><strong>불러오지 못했어요</strong>잠시 후 다시 시도해주세요.</div>'}
})();
</script></body></html>
