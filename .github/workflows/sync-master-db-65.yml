name: Sync Master DB 65 shops
on:
  push:
    paths:
      - .github/workflows/sync-master-db-65.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app data only
        env:
          SNAPSHOT_B64: 
        run: |
          python - <<'PY2'
          import os,re,zlib,base64,json
          p='app.js'
          s=open(p,encoding='utf-8').read()
          prefix=zlib.decompress(base64.b64decode(os.environ['SNAPSHOT_B64'])).decode('utf-8')
          out,n=re.subn(r'^const SHOPS = .*?;\nconst REVIEWS=.*?;',prefix,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'prefix replacement count={n}')
          shops=json.loads(re.search(r'^const SHOPS = (.*?);\nconst REVIEWS=',out,re.S).group(1))
          assert len(shops)==65 and shops[-1]['id']=='JP-TYO-023'
          open(p,'w',encoding='utf-8').write(out)
          print('verified 65 shops')
          PY2
      - name: Commit app data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m "Sync 65 card shops from Master DB" || true
          git push
