<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>퍼니핀 공급계약 전자서명</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f2f7;color:#241f2b;font:16px/1.65 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px 16px}header{border-top:4px solid #6343a0;padding:16px 0}header b{color:#6343a0}h1{margin:4px 0;font-size:28px}section,article{background:white;padding:20px;border-radius:12px;margin-bottom:16px}article{white-space:pre-line}label{display:block;margin:10px 0}input:not([type=checkbox]){display:block;width:100%;padding:10px;font:inherit}canvas{width:100%;height:160px;border:1px solid #aaa;touch-action:none}button{padding:10px 16px;margin:4px;font:inherit;cursor:pointer}button[type=submit]{background:#513686;color:white;border:0;border-radius:6px}img{width:170px;display:block}h2{font-size:19px}[hidden]{display:none!important}@media print{button,form,#access,#status{display:none!important}body,main{background:white;padding:0}section,article{padding:0}}</style>
<style>html{-webkit-text-size-adjust:100%}#documentBody{white-space:normal;font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;padding:clamp(16px,4vw,32px);border:1px solid #ded9e6}#documentBody p{margin:.4em 0}#documentBody .meta{font-size:13px;color:#605668}#documentBody h2{margin:1.5em 0 .65em;border-top:1px solid #ded9e6;padding-top:.8em;font-size:19px}#documentBody .docTitle{margin:.4em 0;border:0;padding:0;font-size:24px}#documentBody h3{font-size:16px;color:#513686;margin:1.2em 0 .25em}#documentBody dl{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.55fr);margin:12px 0;border:1px solid #dfdae6;border-radius:8px;overflow:hidden}#documentBody dt,#documentBody dd{padding:8px 10px;margin:0;border-bottom:1px solid #e7e2ec}#documentBody dt{background:#f2eff6;color:#53485f;font-weight:600}#documentBody dd{min-width:0}#documentBody ul{padding-left:1.25em;margin:14px 0}#documentBody li{margin:.55em 0}#status{color:#584969}input[type=checkbox]{width:auto}@media print{#documentBody{border:0;padding:0;font-size:10pt}#documentBody h3{break-after:avoid}}</style><script src="/web-auth.js"></script><main><header><b>FUNYFRAME</b><h1>공급계약 전자서명</h1></header><p id="status" role="status">접근 권한 확인 중…</p><button hidden id="access">Google 계정으로 서명하기</button><section hidden id="emailOption"><details><summary>Google 로그인 오류 시 이메일로 인증하기</summary><form id="emailForm"><label>계약에 지정된 이메일<input name="email" type="email" autocomplete="email" required></label><button type="submit">인증 메일 받기</button></form><p id="emailStatus" role="status"></p></details></section><article hidden id="documentBody"></article><section hidden id="records"></section><form hidden id="signForm"><section><h2 id="formTitle"></h2><div id="buyerFields"><label>사업자 상호<input name="business" maxlength="80"></label><label>사업자등록번호<input name="number" inputmode="numeric" placeholder="000-00-00000"></label><label>연락처<input name="phone" type="tel"></label></div><label>서명자 성명<input name="signer" required autocomplete="name"></label><p>아래에 손가락이나 마우스로 서명해 주세요.</p><canvas id="pad" width="900" height="250"></canvas><button id="clearInk" type="button">서명 지우기</button><label><input type="checkbox" name="agree" required> 계약 내용을 확인하고 본인 명의로 전자서명합니다.</label><button type="submit">동의하고 서명 제출</button><p id="feedback" role="status"></p></section></form><button hidden id="printCopy">계약서 인쇄 / PDF 저장</button></main>
<script>
(async function(){
const el=id=>document.getElementById(id),auth=window.FUNY_WEB_AUTH,id=new URLSearchParams(location.search).get('id'),status=el('status'),login=el('access'),form=el('signForm'),pad=el('pad'),ctx=pad.getContext('2d');let state,active=null,ink=false;
const point=e=>{const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]};
pad.onpointerdown=e=>{if(active!==null)return;active=e.pointerId;pad.setPointerCapture(active);ctx.beginPath();ctx.lineWidth=4;ctx.lineCap='round';ctx.moveTo(...point(e))};
pad.onpointermove=e=>{if(active!==e.pointerId)return;ctx.lineTo(...point(e));ctx.stroke();ink=true};
pad.onpointerup=pad.onpointercancel=e=>{if(active===e.pointerId)active=null};
el('clearInk').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);ink=false};
el('printCopy').onclick=()=>window.print();
async function request(submission=null){const {data,error}=await auth.client.rpc('funy_supply_sign',{p_id:id,p_submission:submission});if(error)throw Error(error.message);return data}
function renderAgreement(body){
 const root=el('documentBody');root.replaceChildren();
 const add=(tag,txt,parent=root)=>{const node=document.createElement(tag);node.textContent=txt;parent.append(node);return node};
 let group=null, bullets=null,last=null;
 for(const raw of body.split('\n')){
  const line=raw.trim();if(!line)continue;
  if(line.startsWith('•')){group=null;if(!bullets)bullets=add('ul','');last=add('li',line.slice(1).trim(),bullets);continue}
  if(raw.startsWith(' ')&&last?.tagName==='LI'){last.append(' '+line);continue}
  bullets=null;
  if(line.includes('　')){if(!group)group=add('dl','');const split=line.indexOf('　');add('dt',line.slice(0,split),group);add('dd',line.slice(split+1),group);last=null;continue}
  group=null;
  if(/^\d{2}\s/.test(line)){last=add('h2',line);continue}
  if(line.startsWith('공급계약서')){last=add('h2',line);last.className='docTitle';continue}
  if(/^(발주 및 확정|결제 및 출고|배송 및 검수|교환 및 반품|반품 조건|계약기간)$/.test(line)){last=add('h3',line);continue}
  if(last?.tagName==='P'&&/으로$/.test(last.textContent)&&line.startsWith('갱신')){last.append(' '+line);continue}
  last=add('p',line);
  if(line==='FUNYFRAME'||line.endsWith('/  공급계약')||line.startsWith('작성일'))last.className='meta';
 }
}
function display(data){state=data;renderAgreement(data.body);el('documentBody').hidden=false;const list=el('records');list.hidden=false;list.replaceChildren();for(const p of data.parties){const row=document.createElement('p');row.textContent=(p.role==='buyer'?'매입처':'공급자')+' · '+p.name+' · '+(p.signed?new Date(p.signed).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국시간)':'서명 대기');list.append(row);if(p.signed){if(p.role==='buyer'){const d=document.createElement('p');d.textContent=[p.details.business,p.details.number,p.details.phone].join(' / ');list.append(d)}const im=document.createElement('img');im.src=p.ink;im.alt=p.name+' 서명';list.append(im)}}
const mine=data.parties.find(p=>p.role===data.role),waiting=data.role==='supplier'&&!data.parties.find(p=>p.role==='buyer').signed;
form.hidden=Boolean(mine.signed)||waiting;el('buyerFields').hidden=data.role!=='buyer';el('formTitle').textContent=data.name+' 님 전자서명';el('printCopy').hidden=false;status.textContent=data.parties.every(p=>p.signed)?'양측 서명이 완료되었습니다.':mine.signed?'서명이 저장되었습니다. 상대방 서명 대기 중입니다.':waiting?'매입처 서명 후 이 링크에서 공급자 서명을 진행해 주세요.':'계약 내용을 확인한 뒤 아래에서 서명해 주세요.'}
form.onsubmit=async e=>{e.preventDefault();const f=form.elements,msg=el('feedback'),btn=form.querySelector('[type=submit]');if(!ink||f.signer.value.trim()!==state.name){msg.textContent='지정된 서명자의 성명과 자필 서명을 확인해 주세요.';return}const input={hash:state.hash,name:state.name,ink:pad.toDataURL(),agree:f.agree.checked,business:f.business.value.trim(),number:f.number.value.replace(/[- ]/g,''),phone:f.phone.value.replace(/[- ]/g,'')};if(state.role==='buyer'&&(!input.business||!/^\d{10}$/.test(input.number)||!/^\d{9,15}$/.test(input.phone))){msg.textContent='상호, 사업자등록번호 10자리 및 연락처를 확인해 주세요.';return}btn.disabled=true;try{display(await request(input));window.scrollTo(0,0)}catch{msg.textContent='저장 결과를 확인할 수 없습니다. 새로고침하여 서명 상태를 확인해 주세요.'}finally{btn.disabled=false}};
el('emailForm').onsubmit=async event=>{
  event.preventDefault();
  const field=event.currentTarget.elements.email, button=event.currentTarget.querySelector('button'), hint=el('emailStatus');
  button.disabled=true;
  try{
    await auth.init();
    auth.rememberReturn(location.href);
    const {error}=await auth.client.auth.signInWithOtp({email:field.value.trim(),options:{emailRedirectTo:location.origin+'/login.html'}});
    if(error)throw error;
    hint.textContent='메일함을 확인해 주세요. 인증 링크를 이 요청을 시작한 브라우저에서 열면 계약서로 돌아옵니다.';
  }catch(error){
    hint.textContent=error.status===429?'인증 요청이 많습니다. 잠시 뒤 다시 시도해 주세요.':'인증 메일 발송 요청에 실패했습니다. '+(error.code||'연결 상태 확인');
  }finally{button.disabled=false}
};
login.onclick=async()=>{
  login.disabled=true;
  try{
    await auth.init();
    auth.rememberReturn(location.href);
    const {error}=await auth.client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/login.html',queryParams:{prompt:'select_account'}}});
    if(error)throw error;
  }catch{
    status.textContent='Google 계정 선택 화면을 열지 못했습니다. 잠시 후 다시 시도해 주세요.';
    login.disabled=false;
  }
};
try{if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('INVALID');await auth.init();if(!auth.session){status.textContent='계약에 지정된 Google 계정으로 로그인해 주세요.';login.hidden=false;el("emailOption").hidden=false;return}display(await request())}catch(e){status.textContent=e.message.includes('ACCESS_DENIED')?'이 계정에는 열람 권한이 없습니다. 지정된 Google 계정으로 전환해 주세요.':'계약을 열 수 없습니다. 링크와 연결 상태를 확인해 주세요.';login.hidden=false;el('emailOption').hidden=false}
})();</script></html>
