name: Sync LIVE PIN database locations

on:
  push:
    branches:
      - main
      - app-mvp
    paths:
      - 'scripts/patch-live-pin-locations.js'
      - '.github/workflows/live-pin-location-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch LIVE PIN location selectors
        run: node scripts/patch-live-pin-locations.js
      - name: Commit generated LIVE PIN changes
        shell: bash
        run: |
          if git diff --quiet -- live-pin-test.html; then
            echo 'No LIVE PIN changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-pin-test.html
          git commit -m 'feat: load LIVE PIN shops and vending machines from DB'
          git push origin HEAD:${GITHUB_REF_NAME}
