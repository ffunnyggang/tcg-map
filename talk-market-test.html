  <style>

    html,body{margin:0;min-height:100%;background:#f5f3f7;color:#181720;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    button,input,a{font:inherit}
    button{cursor:pointer}
    .shell{width:min(100%,420px);min-height:100dvh;margin:0 auto;background:#fff}
    .head{position:sticky;top:0;z-index:30;height:54px;padding:0 14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.97);border:0}
    .logo{width:30px;height:34px;object-fit:contain}
    .head strong{font-size:19px;line-height:24px;font-weight:800;letter-spacing:-.35px}
    .test-badge{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f1ecfb;color:#684bbf;font-size:9px;font-weight:900;letter-spacing:.04em}
    .page{padding:14px 14px 80px}
    .intro{margin-bottom:16px;padding:14px;border:1px solid #ece8ef;border-radius:15px;background:#faf9fc}
    .intro b{display:block;font-size:14px}

    .url-row{display:flex;gap:7px;margin-top:12px}

    .load-btn{flex:0 0 72px;height:42px;border:0;border-radius:11px;background:#28232e;color:#fff;font-size:11px;font-weight:850}
    .status{display:flex;align-items:center;gap:6px;margin:9px 2px 0;color:#918997;font-size:9.5px}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#c8c2cc}

    .status.warn .status-dot{background:#d39a3d}
    .section-title{margin:22px 0 10px;font-size:12px;font-weight:900;color:#504a54}
    .feed-card{width:100%;padding:13px 0;border:0;border-bottom:1px solid #eeeaf2;background:#fff;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:center;text-align:left;color:inherit}
    .tags{display:flex;gap:5px;align-items:center}
    .source,.category{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:9px;font-weight:850}
    .source{background:#fff2e7;color:#d9691f}
    .category{background:#f0ebfb;color:#704fc5}
    .feed-title{margin:7px 0 4px;font-size:15px;line-height:1.35;font-weight:850;letter-spacing:-.025em}
    .feed-price{font-size:14px;font-weight:900;color:#181720}
    .feed-desc{margin-top:5px;color:#7e7784;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .feed-meta{margin-top:7px;color:#aaa3af;font-size:9.5px}
    .thumb,.hero-image{display:block;width:100%;object-fit:cover;background:#f1eff3}
    .thumb{width:92px;height:92px;border-radius:13px}
    .thumb-fallback{width:92px;height:92px;border-radius:13px;background:linear-gradient(145deg,#f3eff9,#ebe6f3);display:grid;place-items:center;color:#8e829d;font-size:10px;font-weight:800}
    .detail{display:none}
    .shell.is-detail .list-view{display:none}
    .shell.is-detail .detail{display:block}
    .detail-head{position:sticky;top:0;z-index:35;height:54px;padding:0 14px;display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:#fff}
    .back{width:36px;height:36px;border:0;background:transparent;font-size:28px;line-height:30px;color:#181720}
    .detail-label{text-align:center;font-size:13px;font-weight:850}
    .detail-body{padding:0 16px 110px}
    .hero-wrap{margin:0 -16px;background:#f3f0f5;aspect-ratio:1/1;overflow:hidden}
    .hero-image{height:100%}
    .detail-tags{margin-top:18px}
    .detail-title{margin:12px 0 4px;font-size:23px;line-height:1.32;font-weight:900;letter-spacing:-.04em}
    .detail-price{font-size:20px;line-height:1.35;font-weight:900}
    .detail-source{margin-top:7px;color:#9a929e;font-size:10px}
    .detail-desc{margin-top:22px;padding-top:18px;border-top:1px solid #eeeaf2;color:#514b56;font-size:13px;line-height:1.7;white-space:pre-wrap}
    .origin-box{margin-top:22px;padding:13px;border:1px solid #ece8ef;border-radius:14px;background:#faf9fb}
    .origin-box b{display:block;font-size:11px}
    .origin-box span{display:block;margin-top:5px;color:#958e9a;font-size:9.5px;line-height:1.45;word-break:break-all}
    .trade-bar{position:fixed;left:50%;bottom:0;z-index:40;width:min(100%,420px);transform:translateX(-50%);padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,.72),#fff 26%)}
    .trade-btn{height:50px;width:100%;border:0;border-radius:14px;background:#ff7e36;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;box-shadow:0 8px 22px rgba(228,103,34,.18)}
    .debug{margin-top:18px;color:#aaa3af;font-size:9px;line-height:1.5}
  </style>
</head>
<body>
<div class="shell" id="shell">
  <div class="list-view">
    <header class="head">
      <img class="logo" src="/favicon.svg" alt="">
      <strong>TALK</strong>
      <span class="test-badge">MARKET TEST</span>
    </header>
    <main class="page">
      <section class="intro">
        <b>당근 매물 링크 → FUNY PIN 거래 카드 테스트</b>
        <p>실제 TALK에는 반영되지 않은 테스트 화면입니다. 링크 메타데이터를 읽어 목록 카드와 FUNY PIN 내부 상세를 구성합니다.</p>
        <div class="url-row">
          <input class="url-input" id="urlInput" value="https://www.daangn.com/articles/1263844918?share=true" aria-label="당근 매물 URL">
          <button class="load-btn" id="loadBtn" type="button">불러오기</button>
        </div>
        <div class="status" id="status"><span class="status-dot"></span><span id="statusText">샘플 데이터를 준비했어요.</span></div>
      </section>

      <h2 class="section-title">TALK 목록 카드 미리보기</h2>
      <button class="feed-card" id="feedCard" type="button">
        <div>
          <div class="tags"><span class="source">당근</span><span class="category">카드거래</span></div>
          <div class="feed-title" id="feedTitle">포켓몬카드 팬텀 홀로</div>
          <div class="feed-price" id="feedPrice">23,000원</div>
          <div class="feed-desc" id="feedDesc">매력적인 포켓몬카드 팬텀 홀로입니다. 희귀한 일러스트와 홀로그램이 돋보이는 카드예요.</div>
          <div class="feed-meta">FUNY PIN · 외부 매물 연동</div>
        </div>
        <div id="feedThumbWrap"><img class="thumb" id="feedThumb" alt="" referrerpolicy="no-referrer"></div>
      </button>

      <div class="debug" id="debugText">목록 카드를 누르면 FUNY PIN 내부 상세 미리보기로 이동합니다.</div>
    </main>
  </div>

  <section class="detail" id="detail">
    <header class="detail-head">
      <button class="back" id="backBtn" type="button" aria-label="뒤로가기">‹</button>
      <div class="detail-label">카드거래</div>
      <span></span>
    </header>
    <div class="detail-body">
      <div class="hero-wrap" id="heroWrap"><img class="hero-image" id="heroImage" alt="" referrerpolicy="no-referrer"></div>
      <div class="detail-tags tags"><span class="source">당근</span><span class="category">카드거래</span></div>
      <h1 class="detail-title" id="detailTitle">포켓몬카드 팬텀 홀로</h1>
      <div class="detail-price" id="detailPrice">23,000원</div>
      <div class="detail-source">외부 매물 정보를 FUNY PIN 형식으로 표시한 테스트 화면</div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="origin-box">
        <b>원본 거래 페이지</b>
        <span id="originUrl"></span>
      </div>
    </div>
    <div class="trade-bar">
      <a class="trade-btn" id="tradeBtn" href="https://www.daangn.com/articles/1263844918?share=true" target="_blank" rel="noopener" data-funy-link-mode="external">당근에서 거래하기</a>
    </div>
  </section>
</div>

<script>
(()=>{
  const ENDPOINT='https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/daangn-listing-preview-test';
  const FALLBACK={
    ok:true,
    provider:'daangn',
    article_id:'1263844918',
    source_url:'https://www.daangn.com/articles/1263844918?share=true',
    final_url:'https://www.daangn.com/kr/buy-sell/h3g5y6z4998y/?share=true',
    title:'포켓몬카드 팬텀 홀로',
    price:'23,000원',
    image:'https://img.kr.gcp-karroter.net/origin/article/202610/17913773329091ea3fdf1661e9d11ef797ab0d33ec7a1e3d8d869d7bb18ecbb6c5812fbb80e690.webp?f=webp&q=95&s=1440x1440&service=webapp&t=inside',
    description:'매력적인 포켓몬카드 팬텀 홀로입니다. 희귀한 일러스트와 홀로그램이 돋보이는 카드예요. 소장 가치가 높은 특별한 카드이니 눈여겨봐 주세요.'
  };
  let data={...FALLBACK};
  const $=s=>document.querySelector(s);
  const shell=$('#shell'),input=$('#urlInput'),status=$('#status'),statusText=$('#statusText');
  const escText=v=>String(v||'').trim();

  function setImage(imgEl,wrap,url){
    if(!url){wrap.innerHTML='<div class="thumb-fallback">NO IMAGE</div>';return}
    imgEl.src=url;
    imgEl.onerror=()=>{if(wrap)wrap.innerHTML='<div class="thumb-fallback">IMAGE</div>'};
  }
  function render(next){
    data={...FALLBACK,...next};
    const title=escText(data.title)||'상품명 확인 중';
    const price=escText(data.price)||'가격 정보 없음';
    const desc=escText(data.description)||'등록된 상품 설명이 없습니다.';
    $('#feedTitle').textContent=title;
    $('#feedPrice').textContent=price;
    $('#feedDesc').textContent=desc;
    const feedWrap=$('#feedThumbWrap');
    feedWrap.innerHTML='<img class="thumb" id="feedThumb" alt="" referrerpolicy="no-referrer">';
    setImage($('#feedThumb'),feedWrap,data.image);
    $('#detailTitle').textContent=title;
    $('#detailPrice').textContent=price;
    $('#detailDesc').textContent=desc;
    const heroWrap=$('#heroWrap');
    heroWrap.innerHTML='<img class="hero-image" id="heroImage" alt="" referrerpolicy="no-referrer">';
    setImage($('#heroImage'),heroWrap,data.image);
    const target=data.final_url||data.source_url||input.value.trim();
    $('#originUrl').textContent=target;
    $('#tradeBtn').href=target;
  }
  async function load(){
    const url=input.value.trim();
    status.className='status';
    statusText.textContent='당근 매물 정보를 불러오는 중...';
    $('#loadBtn').disabled=true;
    try{
      const r=await fetch(ENDPOINT+'?url='+encodeURIComponent(url),{cache:'no-store'});
      const json=await r.json().catch(()=>({ok:false,error:'응답을 읽지 못했습니다.'}));
      if(!r.ok||!json.ok)throw new Error(json.error||'매물 정보를 불러오지 못했습니다.');
      render(json);
      status.className='status ok';
      statusText.textContent='실시간 메타데이터를 불러왔어요 · '+(json.price||'가격 없음');
      $('#debugText').textContent='article '+(json.article_id||'-')+' · JSON-LD '+(json.debug?.has_json_ld?'확인':'미확인')+' · OG 이미지 '+(json.debug?.has_og_image?'확인':'미확인');
    }catch(e){
      render(FALLBACK);
      status.className='status warn';
      statusText.textContent='실시간 추출 실패 · 검증된 샘플 데이터로 표시 중';
      $('#debugText').textContent=String(e?.message||e);
    }finally{$('#loadBtn').disabled=false}
  }
  function openDetail(){
    shell.classList.add('is-detail');
    history.pushState({market:true},'',location.pathname+location.search+'#/market');
    window.scrollTo(0,0);
  }
  function closeDetail(){
    shell.classList.remove('is-detail');
    if(location.hash)history.replaceState({},'',location.pathname+location.search);
    window.scrollTo(0,0);
  }
  $('#feedCard').addEventListener('click',openDetail);
  $('#backBtn').addEventListener('click',closeDetail);
  $('#loadBtn').addEventListener('click',load);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
  window.addEventListener('popstate',()=>{shell.classList.toggle('is-detail',location.hash==='#/market')});
  render(FALLBACK);
  if(location.hash==='#/market')shell.classList.add('is-detail');
  load();
})();
</script>
</body>
</html>
