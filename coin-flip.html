      if(raw&&raw.date===today&&Array.isArray(raw.items))return raw.items.filter(v=>v===0||v===1).slice(-20);
      return[];
    }catch(_){return[]}
  }
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({date:kstDate(),items:history}))}catch(_){}}
  function ensureToday(){
    try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!raw||raw.date!==kstDate()){history=[];save();renderHistory()}}catch(_){}
  }
  function loadDuration(){const v=Number(localStorage.getItem(DURATION_KEY)||3);return [3,5,7].includes(v)?v:3}
  function applyDuration(){
    const b=$('durationToggle');if(b){b.textContent=flipSeconds+'초';b.setAttribute('aria-label','공중 회전 시간 '+flipSeconds+'초 · 눌러서 변경')};
  }
  function cycleDuration(){
    if(busy)return;flipSeconds=flipSeconds===3?5:flipSeconds===5?7:3;
    try{localStorage.setItem(DURATION_KEY,String(flipSeconds))}catch(_){}
    applyDuration();showToast('공중 회전 시간을 '+flipSeconds+'초로 설정했어요.');track('coin_flip_duration_change',{seconds:flipSeconds});
  }
  function cancelFlightAnimations(){
    flightAnimations.forEach(a=>{try{a.cancel()}catch(_){}});flightAnimations=[];
  }
  function animateFlight(totalMs,ascentMs,dwellMs,descentMs,bounceMs){
    cancelFlightAnimations();
    if(!els.rise||!els.shadow||!els.stage||typeof els.rise.animate!=='function')return;
    const a=ascentMs/totalMs,d1=(ascentMs+dwellMs*.34)/totalMs,d2=(ascentMs+dwellMs*.68)/totalMs,top=(ascentMs+dwellMs)/totalMs,land=(ascentMs+dwellMs+descentMs)/totalMs,bounce=(ascentMs+dwellMs+descentMs+bounceMs*.52)/totalMs;
    flightAnimations=[
      els.rise.animate([
        {offset:0,transform:'translateY(0) scale(.98)'},
        {offset:a,transform:'translateY(-210px) scale(1.07)'},
        {offset:d1,transform:'translateY(-217px) scale(1.075)'},
        {offset:d2,transform:'translateY(-205px) scale(1.065)'},
        {offset:top,transform:'translateY(-210px) scale(1.07)'},
        {offset:land,transform:'translateY(5px) scale(.99)'},
        {offset:bounce,transform:'translateY(-12px) scale(1.008)'},
        {offset:1,transform:'translateY(0) scale(1)'}
      ],{duration:totalMs,easing:'linear',fill:'forwards'}),
      els.shadow.animate([
        {offset:0,opacity:.82,transform:'translateX(-50%) scale(1)'},
        {offset:a,opacity:.13,transform:'translateX(-50%) scale(.34)'},
        {offset:d1,opacity:.11,transform:'translateX(-50%) scale(.32)'},
        {offset:d2,opacity:.16,transform:'translateX(-50%) scale(.38)'},
        {offset:top,opacity:.13,transform:'translateX(-50%) scale(.34)'},
        {offset:land,opacity:.92,transform:'translateX(-50%) scale(1.08)'},
        {offset:bounce,opacity:.60,transform:'translateX(-50%) scale(.86)'},
        {offset:1,opacity:.82,transform:'translateX(-50%) scale(1)'}
      ],{duration:totalMs,easing:'linear',fill:'forwards'}),
      els.stage.animate([
        {offset:0,transform:'perspective(1100px) rotateX(0deg) scale(1)'},
        {offset:a,transform:'perspective(1350px) rotateX(6deg) scale(.84)'},
        {offset:d1,transform:'perspective(1350px) rotateX(5.4deg) scale(.84)'},
        {offset:d2,transform:'perspective(1320px) rotateX(5deg) scale(.86)'},
        {offset:top,transform:'perspective(1350px) rotateX(6deg) scale(.84)'},
        {offset:land,transform:'perspective(1150px) rotateX(1deg) scale(.98)'},
        {offset:bounce,transform:'perspective(1100px) rotateX(0deg) scale(1.01)'},
        {offset:1,transform:'perspective(1100px) rotateX(0deg) scale(1)'}
      ],{duration:totalMs,easing:'linear',fill:'forwards'})
    ];
  }
  function openSkinDb(){
    return new Promise((resolve,reject)=>{try{const req=indexedDB.open(SKIN_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('skins'))db.createObjectStore('skins')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(e){reject(e)}})
  }
  async function skinDbGet(side){try{const db=await openSkinDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('skins','readonly'),req=tx.objectStore('skins').get(side);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}catch(_){return null}}
  async function skinDbSet(side,blob){const db=await openSkinDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('skins','readwrite');tx.objectStore('skins').put(blob,side);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error)}})}
  async function skinDbDelete(side){try{const db=await openSkinDb();await new Promise((resolve,reject)=>{const tx=db.transaction('skins','readwrite');tx.objectStore('skins').delete(side);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error)}})}catch(_){}}
  function revokeSkinUrl(side){try{if(skinUrls[side])URL.revokeObjectURL(skinUrls[side])}catch(_){}skinUrls[side]=null}
  function applySkinBlob(side,blob){
    revokeSkinUrl(side);const face=$(side==='front'?'coinFront':'coinBack'),img=$(side+'SkinImg'),preview=$(side+'Preview'),previewImg=$(side+'PreviewImg');
    if(!blob){face?.classList.remove('has-skin');if(img)img.removeAttribute('src');preview?.classList.remove('has-image');if(previewImg)previewImg.removeAttribute('src');return}
    const url=URL.createObjectURL(blob);skinUrls[side]=url;face?.classList.add('has-skin');if(img)img.src=url;preview?.classList.add('has-image');if(previewImg)previewImg.src=url;
  }
  async function loadSkins(){for(const side of ['front','back'])applySkinBlob(side,await skinDbGet(side))}
  async function saveSkin(side,file){if(!file||!file.type.startsWith('image/'))return;try{await skinDbSet(side,file);applySkinBlob(side,file);showToast((side==='front'?'앞면':'뒷면')+' 스킨을 저장했어요.');track('coin_flip_skin_change',{side,action:'set'})}catch(_){showToast('이미지를 저장하지 못했어요.')}}
  async function resetSkin(side){await skinDbDelete(side);applySkinBlob(side,null);showToast((side==='front'?'앞면':'뒷면')+' 스킨을 초기화했어요.');track('coin_flip_skin_change',{side,action:'reset'})}
  function setSkinModal(open){const m=$('skinModal');m.classList.toggle('open',open);m.setAttribute('aria-hidden',String(!open));}

  function secureRandom(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0}catch(_){return Math.floor(Math.random()*4294967296)>>>0}}
  function setBusy(v){busy=v;els.stage.disabled=v;els.flip.disabled=v;els.flip.textContent=v?'코인 플립 중...':'코인 던지기'}
  function showToast(message){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1500)}
  function audio(){
    if(!soundOn)return null;
    try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(_){return null}
  }
  function makeNoise(duration=.045,delay=0,volume=.035,low=900,high=9200){
    const ctx=audio();if(!ctx)return;const len=Math.max(1,Math.floor(ctx.sampleRate*duration)),buffer=ctx.createBuffer(1,len,ctx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<len;i++){const env=Math.exp(-i/(ctx.sampleRate*(duration*.11)));data[i]=(Math.random()*2-1)*env}
    const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),gain=ctx.createGain(),t=ctx.currentTime+delay;
    src.buffer=buffer;hp.type='highpass';hp.frequency.value=low;lp.type='lowpass';lp.frequency.value=high;
    gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    src.connect(hp);hp.connect(lp);lp.connect(gain);gain.connect(ctx.destination);src.start(t);src.stop(t+duration+.02)
  }
  function resonant(freq,duration=.34,volume=.04,delay=0,detune=0){
    const ctx=audio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;
    o.type='sine';o.frequency.setValueAtTime(freq,t);o.detune.setValueAtTime(detune,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,volume),t+.0015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.03)
  }
  function brightPing(delay=0,volume=.085,pitch=1){
    makeNoise(.020,delay,volume*.20,1800,9800);
    const partials=[
      [1760,.42,1.00],
      [2640,.34,.56],
      [3520,.26,.30],
      [5280,.17,.13]
    ];
    partials.forEach(([f,d,v],i)=>resonant(f*pitch,d,volume*v,delay+i*.0007,(Math.random()-.5)*5));
  }
  function softTick(delay=0,volume=.012){
    makeNoise(.015,delay,volume,2200,10500);
    resonant(3100+Math.random()*260,.055,volume*.75,delay,(Math.random()-.5)*8);
  }
  function playLaunch(){
    brightPing(0,.092,.985);
  }
  function playSpin(durationMs){
    const seconds=Math.max(1,durationMs/1000),count=Math.min(7,Math.max(3,Math.round(seconds)));
    for(let i=1;i<=count;i++){const d=(seconds*.68)*(i/(count+1));softTick(d,.007)}
  }
  function playLand(){
    makeNoise(.032,0,.032,700,7200);
    brightPing(.008,.118,1.00);
    resonant(980,.12,.018,.002,(Math.random()-.5)*4);
    softTick(.115,.013);
  }
  function track(name,params={}){try{window.FUNY_TRACK?.(name,{tool_name:'coin_flip',...params})}catch(_){}}
  function align(outcome){
    const base=Math.floor(currentAngle/360)*360;
    currentAngle=base+(outcome===1?180:0);
    els.coin.style.transition='none';
    els.coin.style.transform=`rotateX(${currentAngle+50}deg) rotateZ(-10deg)`;
    void els.coin.offsetWidth;
    els.coin.style.removeProperty('transition');
  }
  function renderResult(){
    if(history.length){const last=history[history.length-1];els.kicker.textContent='LAST RESULT';els.text.textContent=LABELS[last]+'!';els.text.classList.add('emphasis');els.sub.textContent='코인을 다시 눌러 새로운 결과를 확인해보세요.'}
    else{els.kicker.textContent='READY';els.text.textContent='코인을 던져보세요';els.text.classList.remove('emphasis');els.sub.textContent='결과는 브라우저에서 무작위로 결정됩니다.'}
  }
  function renderHistory(){
    const total=history.length;
    els.historyCount.textContent=total+'회';els.reset.disabled=!total;
    if(!total){els.historyList.innerHTML='<div class="history-empty">아직 결과가 없습니다.</div>';return}
    els.historyList.innerHTML=history.slice().reverse().map((value,index)=>`<div class="history-chip ${value===0?'front':'back'}"><b>${LABELS[value]}</b><span>${total-index}번째</span></div>`).join('');
  }
  function renderDailyStats(stats){
    const total=Number(stats?.total_count||0),front=Number(stats?.heads_count||0),back=Number(stats?.tails_count||0);
    els.frontCount.textContent=front+'회';els.backCount.textContent=back+'회';els.frontRate.textContent=(total?Math.round(front/total*100):0)+'%';els.backRate.textContent=(total?Math.round(back/total*100):0)+'%';els.dailyTotal.textContent=String(total);
  }
  async function loadDailyStats(){
    try{
      const date=kstDate(),res=await fetch(SUPABASE_URL+'/rest/v1/v_coin_flip_daily_stats?select=flip_date,total_count,heads_count,tails_count&flip_date=eq.'+encodeURIComponent(date),{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},cache:'no-store'});
      if(!res.ok)throw new Error('stats '+res.status);
      const rows=await res.json();renderDailyStats(rows?.[0]||null);
    }catch(_){renderDailyStats(null)}
  }
  async function saveFlipToDb(outcome){
    try{
      const res=await fetch(SUPABASE_URL+'/rest/v1/coin_flip_events',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({outcome})});
      if(!res.ok)throw new Error('insert '+res.status);
      await loadDailyStats();
    }catch(_){showToast('오늘 전체 확률 집계 연결을 확인해주세요.')}
  }
  function finish(outcome,token){
    if(token!==flipToken)return;
    history.push(outcome);if(history.length>20)history.shift();save();setBusy(false);cancelFlightAnimations();els.stage.classList.remove('flipping');els.coin.style.removeProperty('transition');
    els.kicker.textContent='RESULT';els.text.textContent=LABELS[outcome]+'!';els.text.classList.add('emphasis');els.sub.textContent='코인플립 결과가 결정되었습니다.';
    renderHistory();saveFlipToDb(outcome);playLand();try{navigator.vibrate?.([30,30,55])}catch(_){}track('coin_flip_result',{result:outcome===0?'front':'back',flip_count:history.length});
  }
  function flip(){
    if(busy)return;
    const token=++flipToken,outcome=secureRandom()&1,reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    const ascentMs=reduced?90:620,dwellMs=reduced?80:flipSeconds*1000,descentMs=reduced?90:620,bounceMs=reduced?60:240,totalMs=ascentMs+dwellMs+descentMs+bounceMs;
    const spins=Math.max(8,Math.round((totalMs/1000)*3.1))+(secureRandom()%3);
    const normalized=((currentAngle%360)+360)%360,desired=outcome*180,delta=(desired-normalized+360)%360;
    currentAngle+=spins*360+delta;
    setBusy(true);els.kicker.textContent='FLIPPING';els.text.textContent='코인이 회전 중...';els.text.classList.remove('emphasis');els.sub.textContent=reduced?'잠시만 기다려주세요.':'공중에서 '+flipSeconds+'초 동안 회전해요.';
    els.stage.classList.remove('flipping');void els.stage.offsetWidth;els.stage.classList.add('flipping');
    animateFlight(totalMs,ascentMs,dwellMs,descentMs,bounceMs);
    els.coin.style.transition='transform '+totalMs+'ms linear';
    const tilt=(secureRandom()%9)-4;
    playLaunch();playSpin(totalMs);requestAnimationFrame(()=>{els.coin.style.transform=`rotateX(${currentAngle+50}deg) rotateZ(${-10+tilt}deg)`});
    try{navigator.vibrate?.(22)}catch(_){}track('coin_flip_start',{air_time_seconds:flipSeconds,total_motion_ms:totalMs});setTimeout(()=>finish(outcome,token),totalMs+60);
  }
  function reset(){
    if(busy||!history.length)return;history=[];save();align(0);renderResult();renderHistory();showToast('내 오늘 기록을 초기화했어요.');track('coin_flip_reset');
  }
  $('backButton').addEventListener('click',()=>{try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({type:'NATIVE_BACK'}));return}}catch(_){}if(window.history.length>1)window.history.back();else location.href='./'});
  $('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('funypin-coin-sound',soundOn?'on':'off')}catch(_){}syncSoundButton();if(soundOn){brightPing(0,.045,1);showToast('효과음을 켰어요.')}else showToast('효과음을 껐어요.');track('coin_flip_sound_toggle',{sound_on:soundOn})});
  $('durationToggle').addEventListener('click',cycleDuration);
  $('skinButton').addEventListener('click',()=>setSkinModal(true));$('skinClose').addEventListener('click',()=>setSkinModal(false));$('skinModal').addEventListener('click',e=>{if(e.target===$('skinModal'))setSkinModal(false)});
  $('frontPick').addEventListener('click',()=>$('frontFile').click());$('backPick').addEventListener('click',()=>$('backFile').click());
  $('frontFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(file)saveSkin('front',file);e.target.value=''});
  $('backFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(file)saveSkin('back',file);e.target.value=''});
  $('frontReset').addEventListener('click',()=>resetSkin('front'));$('backReset').addEventListener('click',()=>resetSkin('back'));
  els.stage.addEventListener('click',flip);els.flip.addEventListener('click',flip);els.reset.addEventListener('click',reset);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy){flipToken++;setBusy(false);cancelFlightAnimations();els.stage.classList.remove('flipping');els.coin.style.removeProperty('transition');renderResult();align(history.length?history[history.length-1]:0)}if(!document.hidden){ensureToday();loadDailyStats()}});
  syncSoundButton();applyDuration();loadSkins();ensureToday();renderResult();renderHistory();renderDailyStats(null);loadDailyStats();align(history.length?history[history.length-1]:0);setInterval(()=>{const nowDate=kstDate();if(nowDate!==activeDate){activeDate=nowDate;history=[];save();renderResult();renderHistory();renderDailyStats(null);loadDailyStats();align(0);showToast('새로운 날짜의 기록이 시작됐어요.')}},15000);track('coin_flip_view');window.addEventListener('pagehide',()=>{revokeSkinUrl('front');revokeSkinUrl('back')});
})();
</script>
