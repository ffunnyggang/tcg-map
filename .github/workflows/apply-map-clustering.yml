name: Apply FUNY PIN map clustering
on:
  push:
    paths:
      - '.github/workflows/apply-map-clustering.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Korea and Japan clustering
        shell: python
        run: |
          from pathlib import Path
          core=Path('map-country-core-v1.js')
          s=core.read_text()
          needle="window.FUNY_MAP_COUNTRY={get:()=>country,set:applyCountry};"
          repl=needle+"window.FUNY_GOOGLE_MAP_API={getMap:()=>googleMap,getMarkers:()=>googleMarkers,getCountry:()=>country,clearSelection:clearGoogleSelection};window.dispatchEvent(new CustomEvent('funy:googlemapready'));"
          if 'FUNY_GOOGLE_MAP_API' not in s:
              s=s.replace(needle,repl)
              core.write_text(s)
          cluster=Path('map-cluster-v1.js')
          cluster.write_text(r'''/* FUNY PIN lightweight marker clustering - Korea/Naver + Japan/Google */
          (function(){
          'use strict';
          const MAX_CLUSTER_ZOOM=13,GRID_PX=68;let krClusters=[],krTimer=0,krBound=false,jpManager=null;
          const css=document.createElement('style');css.textContent='.funy-map-cluster{width:48px;height:48px;border:3px solid rgba(255,255,255,.96);border-radius:50%;background:linear-gradient(145deg,#8b5cf6,#6337d8);box-shadow:0 7px 18px rgba(87,52,177,.28),0 2px 5px rgba(68,43,128,.16);display:grid;place-items:center;padding:0;color:#fff;font:800 15px/1 "Pretendard Variable",Pretendard,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}.funy-map-cluster.jp{background:linear-gradient(145deg,#ef6b7c,#b9002d);box-shadow:0 7px 18px rgba(185,0,45,.24)}.funy-map-cluster:active{transform:scale(.94)}.funy-map-cluster span{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16)}.funy-google-cluster{position:absolute;transform:translate(-50%,-50%);z-index:30}';document.head.appendChild(css);
          const clusterHTML=(n,jp=false)=>`<button type="button" class="funy-map-cluster${jp?' jp':''}" aria-label="카드샵 ${n}곳 묶음"><span>${n}</span></button>`;
          function country(){try{return window.FUNY_MAP_COUNTRY?.get?.()||'KR'}catch(e){return'KR'}}
          function clearKR(){krClusters.forEach(m=>{try{m.setMap(null)}catch(e){}});krClusters=[]}
          function renderKR(){if(typeof naver==='undefined'||!naver.maps||typeof map==='undefined'||typeof markerById==='undefined')return;clearKR();if(country()!=='KR')return;const zoom=map.getZoom();if(zoom>MAX_CLUSTER_ZOOM){markerById.forEach(m=>m.setMap(map));return}const projection=map.getProjection();if(!projection)return;const cells=new Map();markerById.forEach((marker,id)=>{const pos=marker.getPosition?.();if(!pos)return;const p=projection.fromCoordToOffset(pos);if(!p)return;const key=Math.floor(p.x/GRID_PX)+':'+Math.floor(p.y/GRID_PX);if(!cells.has(key))cells.set(key,[]);cells.get(key).push({marker,pos})});cells.forEach(items=>{if(items.length<2){items[0].marker.setMap(map);return}items.forEach(x=>x.marker.setMap(null));const lat=items.reduce((a,x)=>a+x.pos.y,0)/items.length,lng=items.reduce((a,x)=>a+x.pos.x,0)/items.length;const cm=new naver.maps.Marker({position:new naver.maps.LatLng(lat,lng),map,icon:{content:clusterHTML(items.length),anchor:new naver.maps.Point(24,24)},zIndex:120});naver.maps.Event.addListener(cm,'click',()=>{const b=new naver.maps.LatLngBounds();items.forEach(x=>b.extend(x.pos));try{map.fitBounds(b,{top:90,right:40,bottom:220,left:40})}catch(e){map.fitBounds(b)}setTimeout(()=>{if(map.getZoom()<=zoom)map.setZoom(Math.min(zoom+2,MAX_CLUSTER_ZOOM+1))},120)});krClusters.push(cm)})}
          function scheduleKR(){clearTimeout(krTimer);krTimer=setTimeout(renderKR,60)}
          function bindKR(){if(krBound||typeof naver==='undefined'||!naver.maps||typeof map==='undefined')return;krBound=true;naver.maps.Event.addListener(map,'zoom_changed',scheduleKR);naver.maps.Event.addListener(map,'idle',scheduleKR);scheduleKR()}
          function initJP(){const api=window.FUNY_GOOGLE_MAP_API,gmap=api?.getMap?.();if(!gmap||!window.google?.maps?.OverlayView)return;if(jpManager){jpManager.draw();return}class ClusterManager extends google.maps.OverlayView{constructor(){super();this.els=[];this.setMap(gmap)}onAdd(){}clear(){this.els.forEach(e=>e.remove());this.els=[]}onRemove(){this.clear()}draw(){this.clear();const markers=api.getMarkers?.();if(!markers)return;const zoom=gmap.getZoom();if(api.getCountry?.()!=='JP'){markers.forEach(m=>m.setMap(null));return}if(zoom>MAX_CLUSTER_ZOOM){markers.forEach(m=>m.setMap(gmap));return}const proj=this.getProjection();if(!proj)return;const cells=new Map();markers.forEach(m=>{const p=proj.fromLatLngToDivPixel(m.pos);const key=Math.floor(p.x/GRID_PX)+':'+Math.floor(p.y/GRID_PX);if(!cells.has(key))cells.set(key,[]);cells.get(key).push({m,p})});cells.forEach(items=>{if(items.length<2){items[0].m.setMap(gmap);return}items.forEach(x=>x.m.setMap(null));const x=items.reduce((a,v)=>a+v.p.x,0)/items.length,y=items.reduce((a,v)=>a+v.p.y,0)/items.length;const el=document.createElement('div');el.className='funy-google-cluster';el.style.left=x+'px';el.style.top=y+'px';el.innerHTML=clusterHTML(items.length,true);el.onclick=e=>{e.stopPropagation();api.clearSelection?.();const b=new google.maps.LatLngBounds();items.forEach(v=>b.extend(v.m.pos));gmap.fitBounds(b,70);setTimeout(()=>{if(gmap.getZoom()<=zoom)gmap.setZoom(Math.min(zoom+2,MAX_CLUSTER_ZOOM+1))},120)};this.getPanes().overlayMouseTarget.appendChild(el);this.els.push(el)})}}jpManager=new ClusterManager();gmap.addListener('zoom_changed',()=>jpManager?.draw());gmap.addListener('idle',()=>jpManager?.draw())}
          function refresh(){scheduleKR();setTimeout(initJP,80);setTimeout(()=>jpManager?.draw(),180)}
          window.addEventListener('funy:mapfitrequest',refresh);window.addEventListener('funy:googlemapready',()=>setTimeout(initJP,100));document.addEventListener('change',e=>{if(e.target.closest?.('.country-filter-select'))setTimeout(refresh,220)});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{bindKR();refresh()},0));else setTimeout(()=>{bindKR();refresh()},0);window.FUNY_MAP_CLUSTER={refresh};
          })();
          ''')
          loader=Path('map-country-v1.js')
          t=loader.read_text().replace('20260916-1407','20260916-1419')
          loader.write_text(t)
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-map-clustering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-country-core-v1.js map-country-v1.js map-cluster-v1.js .github/workflows/apply-map-clustering.yml
          git commit -m "Add Korea and Japan marker clustering"
          git push