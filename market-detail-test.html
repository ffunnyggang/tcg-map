<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>매물 상세 TEST | FUNY PIN</title><link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1">
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=zi1ymjvxt9"></script><script src="/web-auth.js?v=20261014-web-auth6"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f3f7;color:#211e25;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:88px}.head{position:sticky;top:0;z-index:30;height:54px;padding:0 14px;display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:#fff}.back{width:36px;height:36px;border:0;background:transparent;color:#181720;font-size:28px}.ht{text-align:center;font-size:16px;font-weight:900}.page{padding:0 16px 36px}.hero{margin:0 -16px;aspect-ratio:1/1;background:#f1eef4;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.ph{height:100%;display:grid;place-items:center;color:#948c99;font-size:11px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:17px}.tag{height:21px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;font-size:9px;font-weight:900}.source{background:#fff2e7;color:#d9691f}.cat{background:#f0ebfb;color:#6749bd}.type{background:#eef3ff;color:#4b6ab4}.status{background:#edf7ef;color:#4a8759}.status.sold{background:#f1eff2;color:#85808a}.title{margin:11px 0 3px;font-size:23px;line-height:1.3;font-weight:900;letter-spacing:-.04em}.price{font-size:20px;font-weight:900}.meta{margin-top:8px;color:#948d99;font-size:10px}.desc{margin-top:22px;padding-top:18px;border-top:1px solid #eeeaf2;color:#514b56;font-size:13px;line-height:1.75;white-space:pre-wrap}.section{margin-top:26px}.section h2{margin:0 0 10px;font-size:13px;font-weight:900}.loc-card{border:1px solid #e9e4ed;border-radius:15px;overflow:hidden}.map{height:190px;background:#eeeaf2}.loc-copy{padding:11px 12px;color:#625b67;font-size:11px;font-weight:800}.origin{padding:12px;border:1px solid #e9e4ed;border-radius:14px;background:#faf9fc;color:#938b98;font-size:9.5px;line-height:1.55;word-break:break-all}.owner{display:none;margin-top:22px;padding:13px;border:1px dashed #dcd5e2;border-radius:14px}.owner.show{display:block}.owner b{font-size:11px}.owner-actions{display:flex;gap:7px;margin-top:9px}.owner-actions button{flex:1;height:38px;border-radius:11px;border:1px solid #ddd7e3;background:#fff;color:#625b68;font-size:10px;font-weight:850}.owner-actions .danger{color:#bf4c5a}.bottom{position:fixed;left:50%;bottom:0;z-index:40;width:min(100%,420px);transform:translateX(-50%);padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,.65),#fff 24%)}.trade{height:50px;border-radius:14px;background:#ff7e36;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}.trade.disabled{background:#c9c5cc;pointer-events:none}.loading,.error{padding:80px 20px;text-align:center;color:#99919d;font-size:12px;line-height:1.6}
</style></head>
<body><div class="shell"><header class="head"><button id="back" class="back" type="button">‹</button><div class="ht">매물 상세</div><span></span></header><div id="root"><div class="loading">매물을 불러오는 중...</div></div></div>
<script>
(async()=>{const A=window.FUNY_WEB_AUTH,$=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원';const cats={pokemon:'포켓몬',onepiece:'원피스',dragonball:'드래곤볼',other:'기타'},types={single:'싱글카드',vintage:'빈티지카드',graded:'등급카드',box:'박스제품',other:'기타'};const id=new URLSearchParams(location.search).get('id');$('#back').onclick=()=>history.length>1?history.back():location.replace('/market-test.html');if(!id){$('#root').innerHTML='<div class="error">매물 ID가 없습니다.</div>';return}
const s=await A.init();if(!s){alert('MARKET 테스트는 로그인 후 이용할 수 있어요.');A.goLogin(location.pathname+location.search);return}
try{const {data:x,error}=await A.client.from('market_listings').select('*').eq('id',id).maybeSingle();if(error)throw error;if(!x)throw Error('매물을 찾을 수 없습니다.');const ended=['sold','expired','hidden'].includes(x.listing_status),status=x.listing_status==='reserved'?'예약중':ended?'판매완료':'판매중';
$('#root').innerHTML='<main class="page"><div class="hero">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" alt="" referrerpolicy="no-referrer">':'<div class="ph">NO IMAGE</div>')+'</div><div class="tags"><span class="tag source">당근</span><span class="tag cat">'+esc(cats[x.tcg_category]||'카드거래')+'</span><span class="tag type">'+esc(types[x.item_type]||'매물')+'</span><span class="tag status '+(ended?'sold':'')+'">'+status+'</span></div><h1 class="title">'+esc(x.title)+'</h1><div class="price">'+money(x.price)+'</div><div class="meta">FUNY PIN · '+esc(x.seller_nickname)+' · '+esc(x.location_name||'거래 희망 위치')+'</div><div class="desc">'+esc(x.description||'등록된 설명이 없습니다.')+'</div><section class="section"><h2>거래 희망 위치</h2><div class="loc-card"><div id="detailMap" class="map"></div><div class="loc-copy">'+esc(x.location_name||'거래 희망 위치')+'</div></div></section><section class="section"><h2>원본 매물</h2><div class="origin">'+esc(x.external_url)+'</div></section><div id="owner" class="owner"><b>내 매물 관리 · 테스트</b><div class="owner-actions"><button id="sold" type="button">판매완료</button><button id="hide" class="danger" type="button">숨기기</button></div></div></main><div class="bottom"><a id="trade" class="trade '+(ended?'disabled':'')+'" href="'+esc(x.external_url)+'" target="_blank" rel="noopener">'+(ended?'판매가 종료된 매물입니다':'당근에서 거래하기')+'</a></div>';
const map=new naver.maps.Map('detailMap',{center:new naver.maps.LatLng(+x.latitude,+x.longitude),zoom:16,draggable:false,scrollWheel:false,disableDoubleClickZoom:true,zoomControl:false,mapDataControl:false,scaleControl:false,logoControl:false});new naver.maps.Marker({position:new naver.maps.LatLng(+x.latitude,+x.longitude),map,icon:{content:'<div style="width:36px;height:36px;border:3px solid #fff;border-radius:50% 50% 50% 6px;background:#17151b;transform:rotate(-45deg);box-shadow:0 4px 12px rgba(20,18,25,.22);display:grid;place-items:center"><b style="transform:rotate(45deg);color:#fff;font-size:14px">₩</b></div>',anchor:new naver.maps.Point(18,32)}});
$('#trade')?.addEventListener('click',e=>{if(ended)return;if(window.ReactNativeWebView){e.preventDefault();try{window.ReactNativeWebView.postMessage(JSON.stringify({type:'OPEN_EXTERNAL',url:x.external_url}))}catch(_){location.href=x.external_url}}});
if(A.session?.user?.id===x.seller_user_id){$('#owner').classList.add('show');const update=async st=>{const {error}=await A.client.from('market_listings').update({listing_status:st,updated_at:new Date().toISOString()}).eq('id',x.id);if(error){alert('상태 변경 실패: '+error.message);return}location.reload()};$('#sold').onclick=()=>update('sold');$('#hide').onclick=()=>update('hidden')}}catch(e){$('#root').innerHTML='<div class="error">매물을 불러오지 못했습니다.<br>'+esc(String(e?.message||e))+'</div>'}})();
</script></body></html>
