document.getElementById('hitClose').addEventListener('click',close);
document.getElementById('hitPrev').addEventListener('click',()=>show(index-1));
document.getElementById('hitNext').addEventListener('click',()=>show(index+1));
viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
document.addEventListener('keydown',e=>{if(viewer.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});
let touchX=0;viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});viewer.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>65)show(index+(delta<0?1:-1))},{passive:true});
fetch('data/box-hit-cards-30th.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('hitcards');return r.json()}).then(data=>{
cards=(data.cards||[]).sort((a,b)=>a.sort_order-b.sort_order);grid.replaceChildren();
cards.forEach((card,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='hit-card';btn.setAttribute('aria-label',card.name+' '+card.card_number+' 전체보기');const thumb=document.createElement('img');thumb.loading='lazy';thumb.src=base+encodeURIComponent(card.image_path);thumb.alt=card.name;thumb.onerror=()=>{thumb.style.display='none';const ph=document.createElement('div');ph.className='hit-img-placeholder';ph.textContent='이미지 등록 대기';btn.prepend(ph)};const title=document.createElement('strong');title.textContent=card.name;const number=document.createElement('small');number.textContent=card.card_number+' '+card.rarity;btn.append(thumb,title,number);btn.addEventListener('click',()=>open(i));grid.append(btn)});
}).catch(()=>{grid.textContent='히트카드 정보를 불러오지 못했습니다.'})
})();
</script><script>
(function(){
const supa='https://wdttzpbmqavaqfcbaywj.supabase.co';
const anon='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';
const productId=new URLSearchParams(location.search).get('id');
const list=document.getElementById('boxReviewList'),form=document.getElementById('boxReviewForm'),toggle=document.getElementById('boxReviewCompose'),message=document.getElementById('boxReviewFeedback');
if(!list||!productId)return;
function create(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function fmt(date){return new Date(date).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'})}
async function readReviews(){
 const url=supa+'/rest/v1/box_product_reviews?select=id,user_id,title,body,created_at&product_id=eq.'+encodeURIComponent(productId)+'&status=eq.published&order=created_at.desc&limit=30';
 const r=await fetch(url,{headers:{apikey:anon}});if(!r.ok)throw Error('review read failed');
 const data=await r.json();list.replaceChildren();
 if(!data.length){list.append(create('div','empty','아직 등록된 카드깡 후기가 없습니다. 첫 후기를 남겨보세요.'));return}
 for(const x of data){
 const card=create('article','box-review-card'),author=create('div','box-review-author'),avatar=create('div','box-review-avatar','◯'),meta=create('div');
 meta.append(create('div','box-review-nick','FUNY PIN 회원'),create('div','box-review-date',fmt(x.created_at)));
 author.append(avatar,meta);card.append(author,create('h3','',x.title),create('p','',x.body));list.append(card)
 }
}
toggle.addEventListener('click',()=>{form.hidden=!form.hidden;if(!form.hidden)document.getElementById('boxReviewTitle').focus()});
document.getElementById('boxReviewCancel').addEventListener('click',()=>{form.hidden=true;message.textContent=''});
form.addEventListener('submit',async e=>{
 e.preventDefault();message.textContent='로그인 상태를 확인하고 있습니다.';
 try{
  const auth=window.FUNY_WEB_AUTH||null;
  const session=auth?.getSession?await auth.getSession():null;
  const access=session?.data?.session?.access_token||session?.access_token;
  const userId=session?.data?.session?.user?.id||session?.user?.id;
  if(!access||!userId){message.textContent='후기 작성은 로그인이 필요합니다. 로그인 후 다시 시도해주세요.';return}
  const title=document.getElementById('boxReviewTitle').value.trim(),body=document.getElementById('boxReviewBody').value.trim();
  if(title.length<2||body.length<2){message.textContent='제목과 내용을 2자 이상 입력해주세요.';return}
  const result=await fetch(supa+'/rest/v1/box_product_reviews',{method:'POST',headers:{apikey:anon,Authorization:'Bearer '+access,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({product_id:productId,user_id:userId,title,body})});
  if(!result.ok)throw Error('save failed');
  form.reset();form.hidden=true;message.textContent='';await readReviews();
 }catch(_){message.textContent='등록에 실패했습니다. 로그인 또는 연결 상태를 확인해주세요.'}
});
readReviews().catch(()=>{list.replaceChildren(create('div','empty','후기를 불러오지 못했습니다.'))});
})();
</script></body></html>
