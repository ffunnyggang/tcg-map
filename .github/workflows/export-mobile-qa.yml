name: Export AOS QA workspace

on:
  push:
    branches:
      - aos-local-qa-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          mkdir -p export
          cp -a mobile export/mobile
          mkdir -p export/.github/workflows
          cp .github/workflows/mobile-release-check.yml export/.github/workflows/mobile-release-check.yml
          printf '%s\n' "$(git rev-parse HEAD)" > export/QA_BASE_COMMIT.txt

      - name: Upload QA workspace
        uses: actions/upload-artifact@v4
        with:
          name: tcg-map-aos-qa-workspace
          path: export
          include-hidden-files: true
          retention-days: 1
