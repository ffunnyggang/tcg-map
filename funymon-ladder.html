<div class="shell"><header class="tool-header"><button class="back" id="backButton" type="button" aria-label="뒤로가기">‹</button><div class="header-title">퍼니몬 사다리</div><div class="header-space"></div></header><main><section class="people-control" aria-label="참여 인원 설정"><span class="people-label">인원수</span><button class="count-button" id="minusButton" type="button" aria-label="인원 줄이기">−</button><strong class="count-value" id="countValue">6명</strong><button class="count-button" id="plusButton" type="button" aria-label="인원 늘리기">＋</button><span class="count-hint">최소 2명 · 최대 12명</span></section><section class="board" id="board" aria-label="퍼니몬 사다리 게임"><div class="board-instruction" id="instruction">퍼니몬을 선택하고 사다리를 시작해보세요.</div><div id="boardContent"></div></section><section class="settings" aria-labelledby="settingsTitle"><div class="settings-head"><h2 class="settings-title" id="settingsTitle">내기 설정</h2><div class="settings-actions"><button class="soft-button" id="resetButton" type="button">↻ 초기화</button><div class="preset-wrap"><button class="soft-button preset-button" id="presetButton" type="button" aria-expanded="false">추천 내기 <i class="chevron"></i></button><div class="preset-menu" id="presetMenu" role="menu"><button class="preset-option" data-preset="winner" type="button">1명 당첨 · 나머지 꽝</button><button class="preset-option" data-preset="order" type="button">순서 정하기</button><button class="preset-option" data-preset="first" type="button">선공 · 후공 정하기</button><button class="preset-option" data-preset="coffee" type="button">커피 사기</button><button class="preset-option" data-preset="snack" type="button">간식 사기</button><button class="preset-option" data-preset="cleanup" type="button">정리 담당 정하기</button></div></div></div></div><div class="settings-grid" id="settingsGrid"></div></section><p class="tip"><b>TIP ·</b> 사다리가 시작되면 원하는 퍼니몬을 눌러 결과를 확인할 수 있어요.</p></main></div><div class="sheet-bg" id="monSheet" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><div class="sheet-head"><strong class="sheet-title" id="sheetTitle">퍼니몬 선택</strong><button class="sheet-close" id="sheetClose" type="button" aria-label="닫기">×</button></div><p class="sheet-desc" id="sheetDesc">참여할 퍼니몬을 선택해주세요. 이미 선택된 퍼니몬을 고르면 서로 자리가 바뀝니다.</p><div class="mon-grid" id="monGrid"></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const STORAGE_KEY='funypin-ladder-v1';
const MONS=[{id:'ponanyang',name:'포냐냥',src:'assets/funymon/01-ponanyang.png'},{id:'bubblelong',name:'버블롱',src:'assets/funymon/02-bubblelong.png'},{id:'hatring',name:'해트링',src:'assets/funymon/03-hatring.png'},{id:'bulgi',name:'불기',src:'assets/funymon/04-bulgi.png'},{id:'namumong',name:'나무몽',src:'assets/funymon/05-namumong.png'},{id:'ggomagureum',name:'꼬마구름',src:'assets/funymon/06-ggomagureum.png'},{id:'bawidong',name:'바위동',src:'assets/funymon/07-bawidong.png'},{id:'grimjamong',name:'그림자몽',src:'assets/funymon/08-grimjamong.png'},{id:'beonjjeogi',name:'번쩍이',src:'assets/funymon/09-beonjjeogi.png'},{id:'neon',name:'네온',src:'assets/funymon/10-neon.png'},{id:'longnyang',name:'롱냥',src:'assets/funymon/11-longnyang.png'},{id:'shuffleling',name:'셔플링',src:'assets/funymon/12-shuffleling.png'}];
const $=id=>document.getElementById(id);const els={count:$('countValue'),minus:$('minusButton'),plus:$('plusButton'),instruction:$('instruction'),content:$('boardContent'),settings:$('settingsGrid'),presetButton:$('presetButton'),presetMenu:$('presetMenu'),reset:$('resetButton'),sheet:$('monSheet'),sheetClose:$('sheetClose'),sheetTitle:$('sheetTitle'),monGrid:$('monGrid'),toast:$('toast')};let toastTimer=0,pickerIndex=-1;const saved=loadSaved();const state={count:saved.count,monIds:saved.monIds,labels:saved.labels,mode:'setup',rungs:[],rowCount:0,selected:null};
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}function defaultLabels(count){return Array.from({length:count},(_,i)=>i===0?'당첨':'꽝')}function normalizeMonIds(values,count){const available=MONS.map(x=>x.id),out=[];for(const value of Array.isArray(values)?values:[]){if(available.includes(value)&&!out.includes(value)&&out.length<count)out.push(value)}for(const id of available){if(out.length>=count)break;if(!out.includes(id))out.push(id)}return out}function normalizeLabels(values,count){const defaults=defaultLabels(count);return Array.from({length:count},(_,i)=>{const value=String(Array.isArray(values)?values[i]??'':'').trim();return value||defaults[i]})}function loadSaved(){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||{};const count=clamp(Number(raw.count)||6,2,12);return{count,monIds:normalizeMonIds(raw.monIds,count),labels:normalizeLabels(raw.labels,count)}}catch(_){return{count:6,monIds:normalizeMonIds([],6),labels:defaultLabels(6)}}}function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({count:state.count,monIds:state.monIds,labels:state.labels}))}catch(_){}}function monAt(index){return MONS.find(x=>x.id===state.monIds[index])||MONS[index%MONS.length]}function secureInt(max){if(max<=1)return 0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max}catch(_){return Math.floor(Math.random()*max)}}function random(){return secureInt(1000000)/1000000}function shuffle(values){const out=values.slice();for(let i=out.length-1;i>0;i--){const j=secureInt(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}function showToast(message){clearTimeout(toastTimer);els.toast.textContent=message;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1700)}function track(name,params={}){try{window.FUNY_TRACK?.(name,{tool_name:'funymon_ladder',...params})}catch(_){}}
function setInstruction(){if(state.mode==='setup')els.instruction.textContent='퍼니몬을 선택하고 사다리를 시작해보세요.';else if(state.mode==='ready')els.instruction.textContent='퍼니몬을 눌러 결과를 확인해보세요.';else if(state.mode==='revealed'){const route=computeRoute(state.selected),mon=monAt(state.selected);els.instruction.textContent=mon.name+'의 결과는 “'+state.labels[route.end]+'”이에요.'}else els.instruction.textContent='전체 결과를 확인해보세요.'}function render(){document.documentElement.style.setProperty('--count',String(state.count));els.count.textContent=state.count+'명';els.minus.disabled=state.count<=2;els.plus.disabled=state.count>=12;setInstruction();renderSettings();if(state.mode==='all')renderAllResults();else renderBoard();save()}function participantMarkup(){return'<div class="participant-row">'+Array.from({length:state.count},(_,i)=>{const mon=monAt(i),active=state.selected===i,dim=state.mode==='revealed'&&!active;return'<button class="mon-button '+(active?'active ':'')+(dim?'dim':'')+'" data-participant="'+i+'" type="button" aria-label="'+(i+1)+'번 '+mon.name+'"><span class="mon-orb"><img src="'+mon.src+'" alt="'+mon.name+'">'+(state.mode==='setup'?'<i class="edit-dot">↻</i>':'')+'</span><span class="mon-index">'+(i+1)+'</span></button>'}).join('')+'</div>'}function destinationMarkup(endIndex){return'<div class="destination-row">'+Array.from({length:state.count},(_,i)=>{if(endIndex===i&&state.selected!==null){const mon=monAt(state.selected);return'<div class="destination-slot"><span class="slot-result-mon" aria-label="'+mon.name+' 도착"><img src="'+mon.src+'" alt="'+mon.name+'"></span></div>'}return'<div class="destination-slot"><span class="slot-number">'+(i+1)+'</span></div>'}).join('')+'</div>'}
function renderBoard(){const end=state.mode==='revealed'&&state.selected!==null?computeRoute(state.selected).end:null;let center='';if(state.mode==='setup')center='<div class="setup-center"><button class="start-button" id="startButton" type="button">사다리 시작하기 ›</button></div>';else center='<div class="ladder-wrap"><svg class="ladder-svg" id="ladderSvg" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-label="사다리"></svg></div>';const actions=state.mode==='setup'?'':'<div class="board-actions"><button class="chalk-button" id="allButton" type="button">☰ 전체 결과</button><button class="chalk-button" id="againButton" type="button">↻ 다시 하기</button></div>';els.content.innerHTML='<div class="board-main">'+participantMarkup()+center+destinationMarkup(end)+'</div>'+actions;els.content.querySelectorAll('[data-participant]').forEach(btn=>btn.addEventListener('click',()=>onParticipant(Number(btn.dataset.participant))));$('startButton')?.addEventListener('click',startGame);$('allButton')?.addEventListener('click',showAll);$('againButton')?.addEventListener('click',restartGame);if(state.mode!=='setup')drawLadder()}function renderAllResults(){const rows=Array.from({length:state.count},(_,i)=>{const route=computeRoute(i),mon=monAt(i);return'<div class="result-row"><span class="result-num">'+(i+1)+'</span><img class="result-mon" src="'+mon.src+'" alt="'+mon.name+'"><span class="result-copy"><b>'+mon.name+'</b><strong>'+escapeHtml(state.labels[route.end])+'</strong></span></div>'}).join('');els.content.innerHTML='<div class="result-summary">'+rows+'</div><div class="board-actions"><button class="chalk-button" id="againButton" type="button">↻ 다시 하기</button></div>';$('againButton')?.addEventListener('click',restartGame)}function renderSettings(){state.labels=normalizeLabels(state.labels,state.count);els.settings.innerHTML=Array.from({length:state.count},(_,i)=>'<label class="setting-item"><span class="setting-num">'+(i+1)+'</span><input class="setting-input" data-label-index="'+i+'" type="text" maxlength="14" value="'+escapeAttr(state.labels[i])+'" placeholder="입력해주세요"></label>').join('');els.settings.querySelectorAll('[data-label-index]').forEach(input=>{input.addEventListener('input',()=>{state.labels[Number(input.dataset.labelIndex)]=input.value.slice(0,14);if(state.mode==='revealed'||state.mode==='all')state.mode='ready';setInstruction();save()});input.addEventListener('blur',()=>{const i=Number(input.dataset.labelIndex);if(!String(input.value).trim()){state.labels[i]=defaultLabels(state.count)[i];input.value=state.labels[i]}save()})})}function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function escapeAttr(value){return escapeHtml(value)}
function generateRungs(){const n=state.count,rowCount=clamp(8+Math.ceil(n/2),9,14),rows=Array.from({length:rowCount},()=>new Set());for(let row=0;row<rowCount;row++){const candidates=shuffle(Array.from({length:n-1},(_,i)=>i));const probability=n<=3?.62:n<=6?.50:.40;for(const left of candidates){if(random()>probability)continue;if(rows[row].has(left-1)||rows[row].has(left)||rows[row].has(left+1))continue;rows[row].add(left)}}for(let left=0;left<n-1;left++){if(rows.some(set=>set.has(left)))continue;const candidates=shuffle(Array.from({length:rowCount},(_,i)=>i));const row=candidates.find(r=>!rows[r].has(left-1)&&!rows[r].has(left)&&!rows[r].has(left+1));if(row!==undefined)rows[row].add(left)}const rungs=[];rows.forEach((set,row)=>[...set].sort((a,b)=>a-b).forEach(left=>rungs.push({row,left})));state.rowCount=rowCount;state.rungs=rungs}function xFor(column){if(state.count===1)return 500;return 70+column*(860/(state.count-1))}function yFor(row){return 70+row*(480/Math.max(1,state.rowCount-1))}function computeRoute(start){let column=start;const points=[{x:xFor(column),y:18}];for(let row=0;row<state.rowCount;row++){const y=yFor(row);points.push({x:xFor(column),y});const rung=state.rungs.find(x=>x.row===row&&(x.left===column||x.left+1===column));if(rung){column=rung.left===column?column+1:column-1;points.push({x:xFor(column),y})}}points.push({x:xFor(column),y:602});return{start,end:column,points}}function pathData(points){return points.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ')}function drawLadder(){const svg=$('ladderSvg');if(!svg)return;const verticals=Array.from({length:state.count},(_,i)=>'<path class="ladder-line" d="M '+xFor(i)+' 18 L '+xFor(i)+' 602"/>').join('');const rungs=state.rungs.map(r=>'<path class="ladder-line" d="M '+xFor(r.left)+' '+yFor(r.row)+' L '+xFor(r.left+1)+' '+yFor(r.row)+'"/>').join('');let route='';if(state.mode==='revealed'&&state.selected!==null){const data=pathData(computeRoute(state.selected).points);route='<path class="route-path" id="routePath" d="'+data+'"/>'}svg.innerHTML=verticals+rungs+route;const path=$('routePath');if(path){const len=path.getTotalLength();path.style.strokeDasharray=String(len);path.style.strokeDashoffset=String(len);path.getBoundingClientRect();path.style.transition='stroke-dashoffset 1.05s cubic-bezier(.22,.74,.2,1)';requestAnimationFrame(()=>path.style.strokeDashoffset='0')}}
function syncLabelsFromInputs(){els.settings.querySelectorAll('[data-label-index]').forEach(input=>{const i=Number(input.dataset.labelIndex),value=String(input.value).trim();state.labels[i]=value||defaultLabels(state.count)[i]})}function startGame(){syncLabelsFromInputs();generateRungs();state.mode='ready';state.selected=null;render();track('ladder_game_start',{participant_count:state.count})}function restartGame(){syncLabelsFromInputs();generateRungs();state.mode='ready';state.selected=null;render();showToast('새로운 사다리를 만들었어요.');track('ladder_game_reset',{participant_count:state.count})}function onParticipant(index){if(state.mode==='setup'){openMonPicker(index);return}if(state.mode==='all')return;state.selected=index;state.mode='revealed';render();const route=computeRoute(index);track('ladder_game_result',{participant_index:index+1,result_index:route.end+1,result_label:state.labels[route.end]})}function showAll(){if(!state.rungs.length)return;state.mode='all';state.selected=null;render();track('ladder_game_all_results',{participant_count:state.count})}function changeCount(delta){const next=clamp(state.count+delta,2,12);if(next===state.count)return;syncLabelsFromInputs();state.count=next;state.monIds=normalizeMonIds(state.monIds,next);state.labels=normalizeLabels(state.labels,next);state.mode='setup';state.rungs=[];state.selected=null;render();track('ladder_game_participant_change',{participant_count:next})}function resetAll(){state.count=6;state.monIds=normalizeMonIds([],6);state.labels=defaultLabels(6);state.mode='setup';state.rungs=[];state.selected=null;try{localStorage.removeItem(STORAGE_KEY)}catch(_){}render();showToast('설정을 초기화했어요.');track('ladder_game_reset_all')}
function applyPreset(name){const n=state.count;if(name==='winner')state.labels=Array.from({length:n},(_,i)=>i===0?'당첨':'꽝');if(name==='order')state.labels=Array.from({length:n},(_,i)=>(i+1)+'순위');if(name==='first')state.labels=Array.from({length:n},(_,i)=>i===0?'선공':i===1?'후공':'대기');if(name==='coffee')state.labels=Array.from({length:n},(_,i)=>i===0?'커피 사기':'면제');if(name==='snack')state.labels=Array.from({length:n},(_,i)=>i===0?'간식 사기':'면제');if(name==='cleanup')state.labels=Array.from({length:n},(_,i)=>i===0?'정리 담당':'면제');state.mode='setup';state.rungs=[];state.selected=null;closePreset();render();showToast('추천 내기를 적용했어요.');track('ladder_game_preset',{preset:name,participant_count:n})}function togglePreset(){const open=!els.presetMenu.classList.contains('open');els.presetMenu.classList.toggle('open',open);els.presetButton.setAttribute('aria-expanded',String(open))}function closePreset(){els.presetMenu.classList.remove('open');els.presetButton.setAttribute('aria-expanded','false')}function openMonPicker(index){pickerIndex=index;els.sheetTitle.textContent=(index+1)+'번 퍼니몬 선택';renderMonPicker();els.sheet.classList.add('open');els.sheet.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeMonPicker(){els.sheet.classList.remove('open');els.sheet.setAttribute('aria-hidden','true');document.body.style.overflow='';pickerIndex=-1}function renderMonPicker(){const current=state.monIds[pickerIndex];els.monGrid.innerHTML=MONS.map(mon=>{const usedBy=state.monIds.indexOf(mon.id),selected=mon.id===current,used=usedBy>=0&&!selected;return'<button class="mon-choice '+(selected?'selected ':'')+(used?'used':'')+'" data-mon-id="'+mon.id+'" type="button"><img src="'+mon.src+'" alt="'+mon.name+'"><span>'+mon.name+'</span></button>'}).join('');els.monGrid.querySelectorAll('[data-mon-id]').forEach(btn=>btn.addEventListener('click',()=>selectMon(btn.dataset.monId)))}function selectMon(monId){if(pickerIndex<0)return;const selectedIndex=pickerIndex,existing=state.monIds.indexOf(monId);if(existing>=0&&existing!==selectedIndex){[state.monIds[selectedIndex],state.monIds[existing]]=[state.monIds[existing],state.monIds[selectedIndex]]}else state.monIds[selectedIndex]=monId;state.mode='setup';state.rungs=[];state.selected=null;save();closeMonPicker();render();track('ladder_game_funymon_change',{participant_index:selectedIndex+1,funymon_id:monId})}function goBack(){try{if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify({type:'NATIVE_BACK'}));return}}catch(_){}if(history.length>1)history.back();else location.href='tcg-tools.html'}
$('backButton').addEventListener('click',goBack);els.minus.addEventListener('click',()=>changeCount(-1));els.plus.addEventListener('click',()=>changeCount(1));els.reset.addEventListener('click',resetAll);els.presetButton.addEventListener('click',e=>{e.stopPropagation();togglePreset()});els.presetMenu.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>applyPreset(btn.dataset.preset)));document.addEventListener('click',e=>{if(!e.target.closest('.preset-wrap'))closePreset()});els.sheetClose.addEventListener('click',closeMonPicker);els.sheet.addEventListener('click',e=>{if(e.target===els.sheet)closeMonPicker()});window.addEventListener('keydown',e=>{if(e.key==='Escape'){closePreset();if(els.sheet.classList.contains('open'))closeMonPicker()}});render();track('ladder_game_view',{participant_count:state.count});
})();
