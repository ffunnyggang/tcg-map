<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>매장 QR 방문인증 | FUNY PIN</title><link rel="stylesheet" href="/funy-ui-guide.css"><script src="/web-auth.js?v=20261018-web-auth10"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fa;color:#25202c;font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:420px;min-height:100dvh;background:white;margin:auto;padding:20px 20px 48px}.brand{font-size:13px;color:#7952c8;font-weight:800}.card{margin-top:27px;padding:23px 17px;border-radius:17px;border:1px solid #eee8f4;background:#fff}h1{font-size:22px;margin:12px 0}p{font-size:13px;line-height:1.7;color:#797181}.otp{font-weight:850;letter-spacing:5px;font-size:38px;text-align:center;background:#f4f0fd;border-radius:14px;padding:20px 0;margin:19px 0;color:#6943c4;font-variant-numeric:tabular-nums}button{border:0;border-radius:11px;padding:14px;font-weight:750;font-size:14px;cursor:pointer}button.primary{width:100%;background:#7b3dff;color:#fff}button.secondary{background:#f4f0fd;color:#6c49b8;width:100%}.hint{font-size:12px;color:#887e8f;line-height:1.65}.msg{font-size:13px;color:#7b3dff;min-height:23px}button:disabled{opacity:.55}</style></head><body><main class="wrap"><div class="brand">FUNY PIN · 방문 체크인</div><div class="card"><h1>매장 QR 인증번호</h1><p>매장에 부착된 QR을 스캔하셨다면, 로그인한 퍼니핀 계정으로 1회용 인증번호를 발급받을 수 있어요. 발급 후 퍼니핀 앱의 TCG MAP 방문인증 화면에서 입력해 주세요.</p><div id="otp" class="otp" hidden>000 000</div><p id="timer" class="hint" hidden></p><button id="issue" type="button" class="primary">인증번호 발급하기</button><button id="copy" type="button" class="secondary" hidden>인증번호 복사</button><p id="msg" class="msg" role="status"></p><p class="hint">인증번호는 2분 동안 유효하고, 로그인한 본인 계정에서만 사용할 수 있습니다. 앱에서 GPS 정확도 50m 이내이며 매장 반경 50m 이내인 경우에만 인증할 수 있어요. QR 사진 공유·GPS 위치 조작은 방문 사실을 증명하지 않습니다.</p></div></main><script>
(()=>{'use strict';const token=new URLSearchParams(location.search).get('t')||'',issue=document.getElementById('issue'),otp=document.getElementById('otp'),copy=document.getElementById('copy'),msg=document.getElementById('msg'),timer=document.getElementById('timer');let code='',expiry=0,clock;const errors={login_required:'로그인 후 발급할 수 있어요.',invalid_tag:'유효하지 않은 QR 코드예요.',tag_not_active:'사용할 수 없는 매장 QR이에요.',already_checked_in:'오늘 이미 방문 인증한 매장이에요.',cooldown:'잠시 후 다시 발급해 주세요.',issue_limit:'오늘 발급 가능 횟수를 초과했어요.',server_error:'발급하지 못했어요. 다시 시도해 주세요.'};function tick(){const seconds=Math.max(0,Math.ceil((expiry-Date.now())/1000));timer.textContent='남은 시간 '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(!seconds){clearInterval(clock);otp.hidden=true;copy.hidden=true;issue.hidden=false;issue.textContent='새 인증번호 발급하기';msg.textContent='이전 번호가 만료됐어요.'}}if(!/^[a-f0-9]{64}$/.test(token)){issue.disabled=true;msg.textContent='QR 주소를 확인해 주세요.'}issue.addEventListener('click',async()=>{issue.disabled=true;msg.textContent='인증번호를 발급하고 있어요.';try{const a=window.FUNY_WEB_AUTH;await a.init();if(!a.session){a.goLogin(location.href);return}const {data,error}=await a.client.functions.invoke('shop-visit-qr-otp',{body:{action:'issue',token}});if(error||!data?.ok)throw Error(data?.error||'server_error');code=data.code;expiry=new Date(data.expires_at).getTime();otp.textContent=code.slice(0,3)+' '+code.slice(3);otp.hidden=false;copy.hidden=false;issue.hidden=true;timer.hidden=false;msg.textContent=(data.shop_name||'카드샵')+' 인증번호가 발급됐어요. 퍼니핀 앱에서 입력해 주세요.';clearInterval(clock);clock=setInterval(tick,250);tick()}catch(e){msg.textContent=errors[e.message]||errors.server_error}finally{issue.disabled=false}});copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code);msg.textContent='인증번호를 복사했어요.'}catch{msg.textContent='번호를 길게 눌러 복사해 주세요.'}});
})();
</script></body></html>
