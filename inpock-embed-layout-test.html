<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TCG MAP · Inpock 7-region Test</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f6f2eb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.wrap{width:min(100%,460px);margin:auto;padding:18px 14px 36px}.title{font-size:20px;font-weight:800;letter-spacing:-.5px}.sub{margin-top:6px;font-size:12px;line-height:1.55;color:#766e64}.group{margin:22px 2px 8px;font-size:12px;font-weight:800;color:#8b6f47}.panel{margin-top:10px;background:#fff;border:1px solid #e6dfd4;border-radius:18px;padding:14px;box-shadow:0 7px 24px rgba(46,37,25,.05)}.panel h2{margin:0 0 4px;font-size:15px}.desc{margin:0 0 12px;font-size:11px;color:#8b8277}.crop{position:relative;overflow:hidden;border-radius:14px;background:#eee8df;border:1px solid #e7e0d7}.crop iframe{position:absolute;left:0;top:0;width:100%;height:2400px;border:0;background:#fff;transform:translateY(var(--y));transform-origin:top left}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.controls button,.hrow button{border:1px solid #ded5ca;background:#faf8f4;border-radius:10px;padding:9px 4px;font-size:12px}.hrow{display:flex;gap:7px;margin-top:8px}.hrow button{flex:1}.readout{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#665e55}.value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b6f47;font-weight:700}.copy{margin-top:10px;width:100%;border:0;border-radius:11px;padding:10px;background:#8b6f47;color:#fff;font-weight:700}.copyall{position:sticky;bottom:12px;margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;background:#222;color:#fff;font-weight:800;box-shadow:0 6px 18px #0002}.note{font-size:11px;line-height:1.55;color:#81786e;margin-top:16px}</style></head><body><main class="wrap"><header><div class="title">TCG MAP · 인포크 좌표 테스트</div><div class="sub">기준: link.inpock.co.kr/tcg_map<br>신규 홈 6개 + 리뷰 1개, 총 7개 영역의 좌표와 높이를 각각 설정합니다.</div></header><div id="panels"></div><button class="copyall" id="copyAll">7개 설정값 전체 복사</button><p class="note">각 영역의 ▲/▼로 Y좌표를 맞추고 높이를 조절하세요. 개별 복사 또는 하단의 전체 복사를 사용할 수 있습니다.</p></main><script>
const SRC='https://link.inpock.co.kr/tcg_map';
const defs=[
{id:'homeRecommend1',group:'HOME · 카드샵 추천',title:'홈 · 카드샵 추천 1',desc:'첫 번째 카드샵 추천 영역',y:-300,h:260},
{id:'homeRecommend2',group:'HOME · 카드샵 추천',title:'홈 · 카드샵 추천 2',desc:'두 번째 카드샵 추천 영역',y:-600,h:260},
{id:'homeRecommend3',group:'HOME · 카드샵 추천',title:'홈 · 카드샵 추천 3',desc:'세 번째 카드샵 추천 영역',y:-900,h:260},
{id:'homeRecommend4',group:'HOME · 카드샵 추천',title:'홈 · 카드샵 추천 4',desc:'네 번째 카드샵 추천 영역',y:-1200,h:260},
{id:'homeReview',group:'HOME · 리뷰',title:'홈 · 리뷰',desc:'홈에 노출할 깽퐌커플 리뷰 영역',y:-1500,h:300},
{id:'homeLinks',group:'HOME · 링크',title:'홈 · 링크 모음',desc:'홈의 링크 모음 영역',y:-1800,h:240},
{id:'reviewAll',group:'REVIEW',title:'리뷰 · 전체 영역',desc:'리뷰 화면에서 사용할 전체 방문기 영역',y:-1500,h:650}
];
const root=document.getElementById('panels');let last='';root.innerHTML=defs.map(d=>{const g=d.group!==last?`<div class="group">${last=d.group}</div>`:'';return g+`<section class="panel" data-id="${d.id}" data-y="${d.y}" data-h="${d.h}"><h2>${d.title}</h2><p class="desc">${d.desc}</p><div class="crop" style="height:${d.h}px"><iframe src="${SRC}" title="${d.title}" style="--y:${d.y}px" loading="eager"></iframe></div><div class="controls"><button data-move="-200">▲ 200</button><button data-move="-50">▲ 50</button><button data-move="50">▼ 50</button><button data-move="200">▼ 200</button></div><div class="hrow"><button data-height="-100">높이 -100</button><button data-height="100">높이 +100</button></div><div class="readout"><span>현재 설정</span><span class="value">Y ${d.y}px · H ${d.h}px</span></div><button class="copy" data-copy>설정값 복사</button></section>`}).join('');
function sync(p){const y=+p.dataset.y,h=+p.dataset.h;p.querySelector('iframe').style.setProperty('--y',y+'px');p.querySelector('.crop').style.height=h+'px';p.querySelector('.value').textContent=`Y ${y}px · H ${h}px`}
function text(p){return `${p.dataset.id}: Y ${p.dataset.y}px / H ${p.dataset.h}px`}
async function copy(t,b){try{await navigator.clipboard.writeText(t);const old=b.textContent;b.textContent='복사 완료';setTimeout(()=>b.textContent=old,900)}catch{prompt('아래 값을 복사해주세요',t)}}
root.addEventListener('click',e=>{const p=e.target.closest('.panel');if(!p)return;if(e.target.dataset.move){p.dataset.y=String(+p.dataset.y + +e.target.dataset.move);sync(p)}if(e.target.dataset.height){p.dataset.h=String(Math.max(120,+p.dataset.h + +e.target.dataset.height));sync(p)}if(e.target.matches('[data-copy]'))copy(text(p),e.target)});
document.getElementById('copyAll').onclick=e=>copy([...document.querySelectorAll('.panel')].map(text).join('\n'),e.currentTarget);
</script></body></html>
