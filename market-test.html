<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MARKET TEST | FUNY PIN</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1">
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=zi1ymjvxt9"></script>
<script src="/web-auth.js?v=20261014-web-auth6"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f2f6;color:#211e25;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff;position:relative;padding-bottom:96px}
.head{height:54px;padding:0 14px;display:flex;align-items:center;background:#fff;gap:8px}.head img{width:30px;height:34px}.head strong{font-size:19px;font-weight:850}.test{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f0ebfb;color:#6749bd;font-size:9px;font-weight:900}
.map-wrap{height:370px;position:relative;background:#eeeaf2;overflow:hidden}.map{position:absolute;inset:0;width:100%;height:100%}
.search{position:absolute;z-index:10;left:14px;right:14px;top:10px;height:44px;border-radius:22px;background:#fff;box-shadow:0 5px 18px rgba(32,28,42,.12);display:flex;align-items:center;padding:0 14px;gap:8px}.search span{color:#9a929e;font-size:17px}.search input{border:0;outline:0;min-width:0;flex:1;font-size:12px;color:#3f3943;background:transparent}
.map-note{position:absolute;z-index:9;left:14px;top:64px;padding:7px 9px;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.88);font-size:9px;font-weight:850;box-shadow:0 4px 14px rgba(30,25,38,.08)}
.list-wrap{position:relative;z-index:11;margin-top:-18px;border-radius:22px 22px 0 0;background:#fff;padding:15px 14px 30px}.handle{width:42px;height:5px;border-radius:99px;background:#d8d2dd;margin:0 auto 12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.toolbar strong{font-size:14px}.count{font-size:10px;color:#948d99}
.chips{display:flex;gap:6px;overflow:auto;padding:11px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip,.sort{flex:0 0 auto;height:32px;padding:0 11px;border:1px solid #e5e0e9;border-radius:16px;background:#fff;color:#716a76;font-size:10px;font-weight:800}.chip.on{background:#f0ebfb;border-color:#d9cdf3;color:#6749bd}.sort{padding-right:8px}
.card{display:grid;grid-template-columns:88px minmax(0,1fr) 14px;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #eeeaf2;text-decoration:none;color:inherit}.thumb,.ph{width:88px;height:88px;border-radius:13px;background:#f1eef4}.thumb{object-fit:cover}.ph{display:grid;place-items:center;color:#968d9b;font-size:9px}.title{font-size:14px;font-weight:850;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{margin-top:4px;font-size:15px;font-weight:900}.meta{margin-top:6px;color:#928b96;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:21px;color:#9b8eac}.empty{padding:50px 12px;text-align:center;color:#9b94a0;font-size:12px;line-height:1.6}
.fab{position:fixed;right:max(16px,calc((100vw - 420px)/2 + 16px));bottom:22px;z-index:50;width:128px;height:46px;border-radius:23px;background:#17151b;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;box-shadow:0 8px 24px rgba(17,16,21,.24)}
.pin{width:36px;height:36px;border:3px solid #fff;border-radius:50% 50% 50% 6px;background:#17151b;transform:rotate(-45deg);box-shadow:0 4px 12px rgba(20,18,25,.22);display:grid;place-items:center}.pin b{transform:rotate(45deg);color:#fff;font-size:14px}
.bubble{width:270px;padding:10px;border:1px solid #e5dfe9;border-radius:17px;background:#fff;box-shadow:0 14px 34px rgba(34,28,43,.18);display:grid;grid-template-columns:66px minmax(0,1fr) 12px;gap:10px;align-items:center}.bubble img,.bph{width:66px;height:66px;border-radius:11px;object-fit:cover;background:#f1eef4}.bph{display:grid;place-items:center;color:#948b99;font-size:8px}.bt{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bp{margin-top:4px;font-size:13px;font-weight:900}.bm{margin-top:5px;color:#958e99;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bc{font-size:20px;color:#9b8eac}
</style>
<link rel="stylesheet" href="/market-ui-v1.css?v=20261014-ui1"></head>
<body><div class="shell">
<header class="head"><img src="/favicon.svg" alt=""><strong>MARKET</strong><span class="test">HIDDEN TEST</span></header>
<section class="map-wrap"><div id="marketMap" class="map"></div><div class="search"><span>⌕</span><input id="search" placeholder="카드명·상품명으로 검색"></div><div class="map-note">등록된 TCG 매물</div></section>
<section class="list-wrap"><div class="handle"></div><div class="toolbar"><strong>팝니다</strong><span id="count" class="count">0개</span></div>
<div class="chips"><button class="sort" id="sort">최신순⌄</button><button class="chip on" data-cat="all">전체</button><button class="chip" data-cat="pokemon">포켓몬</button><button class="chip" data-cat="onepiece">원피스</button><button class="chip" data-cat="dragonball">드래곤볼</button><button class="chip" data-cat="other">기타</button></div>
<div id="list"><div class="empty">매물을 불러오는 중...</div></div></section>
<a class="fab" href="/market-register-test.html">등록하기 ›</a>
</div>
<script>
(async()=>{const A=window.FUNY_WEB_AUTH;const s=await A.init();if(!s){alert('MARKET 테스트는 로그인 후 이용할 수 있어요.');A.goLogin(location.pathname);return}
const $=q=>document.querySelector(q),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>n==null?'가격 정보 없음':Number(n).toLocaleString('ko-KR')+'원',ago=v=>{const m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));if(m<60)return m+'분 전';if(m<1440)return Math.floor(m/60)+'시간 전';return Math.floor(m/1440)+'일 전'};
let rows=[],cat='all',sort='latest',markers=[],info=null;const map=new naver.maps.Map('marketMap',{center:new naver.maps.LatLng(37.5665,126.9780),zoom:12,minZoom:7,maxZoom:19,zoomControl:false,mapDataControl:false,scaleControl:false,logoControl:false});setTimeout(()=>naver.maps.Event.trigger(map,'resize'),80);
const durl=x=>'/market-detail-test.html?id='+encodeURIComponent(x.id);
function filtered(){let a=rows.filter(x=>cat==='all'||x.tcg_category===cat);const q=$('#search').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.title||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q));if(sort==='low')a.sort((a,b)=>(a.price??9e18)-(b.price??9e18));else if(sort==='high')a.sort((a,b)=>(b.price??-1)-(a.price??-1));else a.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return a}
function render(){const a=filtered();$('#count').textContent=a.length+'개';$('#list').innerHTML=a.length?a.map(x=>'<a class="card" href="'+durl(x)+'">'+(x.thumbnail_url?'<img class="thumb" src="'+esc(x.thumbnail_url)+'" alt="" referrerpolicy="no-referrer">':'<div class="ph">NO IMAGE</div>')+'<div><div class="title">'+esc(x.title)+'</div><div class="price">'+money(x.price)+'</div><div class="meta">'+esc(x.location_name||'거래 희망 위치')+' · '+ago(x.created_at)+'</div></div><span class="chev">›</span></a>').join(''):'<div class="empty">조건에 맞는 매물이 없습니다.</div>';markers.forEach(m=>m.setMap(null));markers=[];if(info){info.close();info=null}const bounds=new naver.maps.LatLngBounds();a.forEach(x=>{if(!Number.isFinite(+x.latitude)||!Number.isFinite(+x.longitude))return;const p=new naver.maps.LatLng(+x.latitude,+x.longitude);bounds.extend(p);const marker=new naver.maps.Marker({map,position:p,icon:{content:'<div class="pin"><b>₩</b></div>',anchor:new naver.maps.Point(18,32)}});markers.push(marker);naver.maps.Event.addListener(marker,'click',()=>{if(info)info.close();info=new naver.maps.InfoWindow({content:'<div class="bubble" data-mid="'+esc(x.id)+'">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" alt="" referrerpolicy="no-referrer">':'<div class="bph">NO IMAGE</div>')+'<div><div class="bt">'+esc(x.title)+'</div><div class="bp">'+money(x.price)+'</div><div class="bm">'+esc(x.location_name||'거래 희망 위치')+'</div></div><div class="bc">›</div></div>',borderWidth:0,backgroundColor:'transparent',disableAnchor:true,pixelOffset:new naver.maps.Point(0,-8)});info.open(map,marker);setTimeout(()=>document.querySelector('[data-mid="'+CSS.escape(x.id)+'"]')?.addEventListener('click',()=>location.href=durl(x)),0)})});if(a.length===1){map.setCenter(new naver.maps.LatLng(+a[0].latitude,+a[0].longitude));map.setZoom(15)}else if(a.length>1)map.fitBounds(bounds,{top:80,right:35,bottom:45,left:35})}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});$('#search').addEventListener('input',render);$('#sort').onclick=()=>{sort=sort==='latest'?'low':sort==='low'?'high':'latest';$('#sort').textContent=sort==='latest'?'최신순⌄':sort==='low'?'낮은가격순⌄':'높은가격순⌄';render()};
const {data,error}=await A.client.from('market_listings').select('id,title,description,price,thumbnail_url,latitude,longitude,location_name,listing_status,tcg_category,item_type,created_at').in('listing_status',['active','reserved']).eq('listing_side','sell').order('created_at',{ascending:false});if(error){$('#list').innerHTML='<div class="empty">매물 정보를 불러오지 못했습니다.<br>'+esc(error.message)+'</div>';return}rows=data||[];render()})();
</script></body></html>
