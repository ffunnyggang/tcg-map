name: Fix detail info fields
on:
  push:
    paths:
      - '.github/workflows/fix-detail-info-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean detail address and SNS row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old_addr="`서울 ${s.city||''} ${s.address}`.replace(/\\s+/g,' ').trim()"
          if old_addr in s:
              s=s.replace(old_addr,'s.address',1)
          else:
              raise SystemExit('Address expression not found')
          old_sns=",['SNS',s.instagram]"
          if old_sns in s:
              s=s.replace(old_sns,'',1)
          else:
              raise SystemExit('SNS row not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Clean detail address and remove duplicate SNS row'
          git push
