<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서비스 개선 의견 | FUNY PIN</title>
<meta name="description" content="FUNY PIN 이용 경험과 개선 의견을 들려주세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f4f7;color:#1d1b22;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.page{width:min(100%,420px);min-height:100vh;margin:0 auto;background:#fff}.header{padding:18px 18px 20px;border-bottom:8px solid #f5f4f7}.back{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:flex-start;color:#29262e;text-decoration:none;font-size:30px;line-height:1}.brand{margin-top:12px;color:#8062d8;font-size:10px;font-weight:800;letter-spacing:.2em}.header h1{margin:8px 0 7px;font-size:26px;line-height:1.25;letter-spacing:-.045em}.header p{margin:0;color:#85818b;font-size:13px;line-height:1.6}.section{padding:25px 18px;border-bottom:8px solid #f5f4f7}.section h2{margin:0 0 22px;font-size:16px;letter-spacing:-.025em}.field{margin-top:24px}.field:first-of-type{margin-top:0}.label{display:block;margin-bottom:10px;color:#4d4852;font-size:13px}.required{color:#8062d8;font-weight:800}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rate{position:relative}.rate input{position:absolute;opacity:0;pointer-events:none}.rate span{display:flex;height:44px;align-items:center;justify-content:center;border:1px solid #e4e0e8;border-radius:10px;background:#fff;color:#625d67;font-size:14px}.rate input:checked+span{border-color:#8062d8;background:#f5f1ff;color:#6749bd;font-weight:800}.rating-labels{display:flex;justify-content:space-between;margin:8px 2px 0;color:#a09aa5;font-size:11px}.textarea{width:100%;height:150px;padding:14px 13px;border:1px solid #dedbe2;border-radius:10px;background:#fff;color:#242128;font:inherit;font-size:14px;line-height:1.55;resize:vertical;outline:none;transition:.18s}.textarea:focus{border-color:#8062d8;box-shadow:0 0 0 3px rgba(128,98,216,.08)}::placeholder{color:#c2bec6}.submit-wrap{padding:24px 18px calc(24px + env(safe-area-inset-bottom))}.submit{width:100%;height:54px;border:0;border-radius:13px;background:#8062d8;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55;cursor:default}.submit:active{transform:scale(.99)}.status{min-height:18px;margin:11px 2px 0;color:#85818b;font-size:11px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<main class="page">
<header class="header"><a class="back" href="javascript:history.back()" aria-label="뒤로가기">‹</a><div class="brand">FUNY PIN · FEEDBACK</div><h1>만족도 조사</h1><p>더 나은 FUNY PIN을 만들 수 있도록<br>이용 경험과 의견을 들려주세요.</p></header>
<form id="feedback-form">
<section class="section"><h2>서비스 이용 경험에 얼마나 만족하시나요? <span class="required">*</span></h2><div class="rating">
<label class="rate"><input type="radio" name="rating" value="1" required><span>1</span></label><label class="rate"><input type="radio" name="rating" value="2"><span>2</span></label><label class="rate"><input type="radio" name="rating" value="3"><span>3</span></label><label class="rate"><input type="radio" name="rating" value="4"><span>4</span></label><label class="rate"><input type="radio" name="rating" value="5"><span>5</span></label></div><div class="rating-labels"><span>아쉬워요</span><span>만족해요</span></div></section>
<section class="section"><div class="field"><label class="label" for="inconvenience">불편한점을 알려주세요. <span class="required">*</span></label><textarea class="textarea" id="inconvenience" name="inconvenience" minlength="2" maxlength="2000" required placeholder="답변을 적어주세요."></textarea></div><div class="field"><label class="label" for="improvement">개선할 부분이 있다면 알려주세요. <span class="required">*</span></label><textarea class="textarea" id="improvement" name="improvement" minlength="2" maxlength="2000" required placeholder="답변을 적어주세요."></textarea></div></section>
<div class="submit-wrap"><button class="submit" id="submit-btn" type="submit">제출하기</button><p class="status" id="form-status" aria-live="polite"></p></div>
</form>
</main>
<script>
const FEEDBACK_ENDPOINT='https://script.google.com/macros/s/AKfycbyRvpY-nGktR-xPX009kuEUhv-tOGozPWDlXxHiQKpMVFdLDLcig7Q3PiQh9sNvPe29yw/exec';
const FEEDBACK_DONE_KEY='funypin_feedback_submitted_at',FEEDBACK_ACCESS_KEY='funypin_feedback_accessed_at',COOLDOWN=30*24*60*60*1000,ACCESS_COOLDOWN=24*60*60*1000;
const form=document.getElementById('feedback-form'),btn=document.getElementById('submit-btn'),statusEl=document.getElementById('form-status');
const access=Number(localStorage.getItem(FEEDBACK_ACCESS_KEY)||0),now=Date.now();if(access&&now-access<ACCESS_COOLDOWN&&!Number(localStorage.getItem(FEEDBACK_DONE_KEY)||0)){alert('만족도 조사는 하루에 한 번 참여할 수 있어요.\n내일 다시 참여해주세요.');if(history.length>1)history.back();else location.replace('./');}else{localStorage.setItem(FEEDBACK_ACCESS_KEY,String(now));}
const last=Number(localStorage.getItem(FEEDBACK_DONE_KEY)||0);if(last&&Date.now()-last<COOLDOWN){btn.disabled=true;btn.textContent='제출 완료';statusEl.textContent='이미 의견을 보내주셨어요. 30일 후 다시 참여할 수 있어요.'}
form.addEventListener('submit',async e=>{e.preventDefault();const previous=Number(localStorage.getItem(FEEDBACK_DONE_KEY)||0);if(previous&&Date.now()-previous<COOLDOWN){statusEl.textContent='이미 의견을 보내주셨어요. 30일 후 다시 참여할 수 있어요.';return}if(!form.reportValidity())return;const fd=new FormData(form);btn.disabled=true;btn.textContent='제출 중...';statusEl.textContent='';try{await fetch(FEEDBACK_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({satisfaction:fd.get('rating'),inconvenience:String(fd.get('inconvenience')||'').trim(),improvement:String(fd.get('improvement')||'').trim()})});localStorage.setItem(FEEDBACK_DONE_KEY,String(Date.now()));form.reset();statusEl.textContent='소중한 의견 감사합니다.';btn.textContent='제출 완료';setTimeout(()=>history.back(),500)}catch(err){statusEl.textContent='제출하지 못했어요. 잠시 후 다시 시도해 주세요.';btn.disabled=false;btn.textContent='제출하기'}});
</script>
</body>
</html>
