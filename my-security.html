<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>계정 보안 | FUNY PIN</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-back-align2">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f2f6;color:#28232e;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff}
.head{height:56px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 10px;border-bottom:1px solid #f0ecf2;background:#fff;position:sticky;top:0;z-index:10}
.back{width:40px;height:40px;border:0;background:transparent;color:#28232e;font-size:27px;line-height:1;cursor:pointer}.title{text-align:center;font-size:16px;font-weight:900}
.page{padding:18px 16px 40px}.intro{padding:14px;border-radius:16px;background:#f8f6fb;border:1px solid #ebe5f2}.intro strong{display:block;font-size:14px}.intro span{display:block;margin-top:6px;color:#817986;font-size:10.5px;line-height:1.55}
.section{margin-top:22px}.section h2{margin:0 0 8px 3px;font-size:13px}.card{border:1px solid #e8e3ec;border-radius:17px;overflow:hidden;background:#fff}
.row{min-height:68px;padding:13px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0ecf2}.row:last-child{border-bottom:0}.copy{flex:1;min-width:0}.label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:850}.sub{margin-top:4px;color:#928a97;font-size:10px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:0 0 auto;padding:6px 8px;border-radius:999px;background:#f1eef4;color:#756e79;font-size:9px;font-weight:850}.badge.ok{background:#edf7f0;color:#4d8c60}.badge.future{background:#f4f1fb;color:#7356b5}
.phone-box{margin-top:10px;padding:14px;border:1px solid #e8e3ed;border-radius:16px;background:#faf9fb}.phone-box[hidden]{display:none!important}.input-row{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:7px;margin-top:8px}.input-row:first-child{margin-top:0}.input{width:100%;height:42px;border:1px solid #ddd7e2;border-radius:11px;padding:0 11px;outline:0;font-size:12px}.input:focus{border-color:#8d76d1}.btn{height:42px;border:0;border-radius:11px;background:#28232e;color:#fff;font-size:10px;font-weight:850;cursor:pointer}.btn:disabled{opacity:.45}.message{min-height:18px;margin-top:8px;color:#766f7b;font-size:10px;line-height:1.5}.message.error{color:#b42318}
.action{border:0;background:transparent;color:#6749bd;font-size:10px;font-weight:900;cursor:pointer;padding:8px 0}.note{margin-top:18px;padding:12px 13px;border-radius:14px;background:#f7f5f8;color:#817986;font-size:9.5px;line-height:1.6}
.loading{padding:50px 0;text-align:center;color:#918a96;font-size:11px}html.app-shell .head{display:none!important}html.app-shell .page{padding-top:18px}
@media(max-width:360px){.input-row{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="head funy-sub-header"><button class="back funy-sub-back" type="button" aria-label="이전" onclick="history.back()">‹</button><div class="title funy-sub-title">계정 보안</div><span></span></header>
<main id="root" class="page"><div class="loading">계정 보안 정보를 불러오는 중...</div></main>
</div>
<script>
(async()=>{
  const A=window.FUNY_WEB_AUTH,root=document.getElementById('root');
  await A.init();
  if(!A.session){A.goLogin('/my-security.html');return}
  const en=localStorage.getItem('funy-pin-lang')==='en',user=A.session.user;
  const tr=(ko,enText)=>en?enText:ko;
  const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const provider=String(user?.app_metadata?.provider||user?.app_metadata?.providers?.[0]||'email');
  const providerLabel={google:'Google',apple:'Apple',kakao:'Kakao',email:'Email'}[provider]||provider;
  const normalizePhone=raw=>{
    const digits=String(raw||'').replace(/\D/g,'');
    if(/^010\d{8}$/.test(digits))return '+82'+digits.slice(1);
    if(/^8210\d{8}$/.test(digits))return '+'+digits;
    return '';
  };
  const maskPhone=raw=>{
    const d=String(raw||'').replace(/\D/g,'');
    if(d.length<4)return '';
    return '•••• '+d.slice(-4)
  };
  async function verification(){
    const [rowResult,settingResult]=await Promise.all([
      A.client.from('user_verifications')
        .select('account_verified_at,email_verified_at,phone_verified_at,identity_verified_at,verification_level')
        .eq('user_id',A.session.user.id).maybeSingle(),
      A.client.from('account_verification_settings')
        .select('phone_sms_enabled,sms_provider')
        .eq('id',1).maybeSingle()
    ]);
    return {
      ...(rowResult?.data||{}),
      phone_sms_enabled:settingResult?.data?.phone_sms_enabled===true,
      sms_provider:String(settingResult?.data?.sms_provider||'solapi')
    }
  }
  async function render(){
    const fresh=(await A.getUser())||A.session.user;
    const v=await verification();
    const accountOk=Number(v.verification_level||0)>=1;
    const phoneOk=!!v.phone_verified_at&&!!fresh.phone_confirmed_at;
    const phoneAvailable=v.phone_sms_enabled===true;
    const emailText=fresh.email||((provider==='kakao')?'OAuth 계정에서 이메일을 제공하지 않음':'이메일 정보 없음');
    root.innerHTML=
      '<div class="intro"><strong>계정 검증 상태</strong><span>FUNY PIN 로그인 검증과 거래용 휴대폰 인증을 분리해서 관리합니다.</span></div>'+
      '<section class="section"><h2>계정</h2><div class="card">'+
        '<div class="row"><div class="copy"><div class="label">로그인 계정</div><div class="sub">'+esc(providerLabel)+' 로그인</div></div><span class="badge '+(accountOk?'ok':'')+'">'+(accountOk?'검증 완료':'확인 필요')+'</span></div>'+
        '<div class="row"><div class="copy"><div class="label">이메일</div><div class="sub">'+esc(emailText)+'</div></div><span class="badge '+(v.email_verified_at?'ok':'')+'">'+(v.email_verified_at?'인증 완료':provider!=='email'?'OAuth 확인':'미인증')+'</span></div>'+
      '</div></section>'+
      '<section class="section"><h2>추가 인증</h2><div class="card">'+
        '<div class="row"><div class="copy"><div class="label">휴대폰 SMS 인증</div><div class="sub">'+(phoneOk?esc(maskPhone(fresh.phone))+' · 거래 기능 이용 가능':phoneAvailable?'거래 기능 이용 전 최초 1회 필요':'SOLAPI 문자 인증 연동 준비 중')+'</div></div>'+(phoneOk?'<span class="badge ok">인증 완료</span>':phoneAvailable?'<button id="phoneOpen" class="action" type="button">인증하기 ›</button>':'<span class="badge future">준비 중</span>')+'</div>'+
        '<div class="row"><div class="copy"><div class="label">PASS / KCP 본인확인</div><div class="sub">'+tr('필요 시 검증 레벨 3으로 도입 예정','Planned as verification level 3 when needed')+'</div></div><span class="badge future">'+tr('준비 중','Coming soon')+'</span></div>'+
      '</div></section>'+
      '<div id="phoneBox" class="phone-box" hidden>'+
        '<div class="input-row"><input id="phone" class="input" type="tel" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="'+tr('휴대폰 번호 입력','Enter phone number')+'"><button id="send" class="btn" type="button">인증번호 받기</button></div>'+
        '<div id="otpRow" class="input-row" hidden><input id="otp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증번호 6자리"><button id="verify" class="btn" type="button">인증 확인</button></div>'+
        '<div id="msg" class="message" role="status" aria-live="polite"></div>'+
      '</div>'+
      '<div class="note">휴대폰 SMS 인증은 해당 번호를 실제로 사용할 수 있는지 확인하는 절차입니다. PASS/KCP와 같은 법적 본인확인과는 구분됩니다.</div>';
    if(phoneOk||!phoneAvailable)return;
    const box=document.getElementById('phoneBox'),open=document.getElementById('phoneOpen'),phone=document.getElementById('phone'),send=document.getElementById('send'),otpRow=document.getElementById('otpRow'),otp=document.getElementById('otp'),verify=document.getElementById('verify'),msg=document.getElementById('msg');
    const message=(t,e=false)=>{msg.textContent=t||'';msg.classList.toggle('error',!!e)};
    const edgeMessage=async(error,fallbackKo,fallbackEn)=>{
      try{
        const ctx=error?.context;
        if(ctx?.clone){
          const data=await ctx.clone().json().catch(()=>null);
          const localized=String(en?data?.error_en:data?.error||'').trim();
          if(localized)return localized;
        }
      }catch(_){}
      const raw=String(error?.message||'').trim();
      if(/Token has expired or is invalid|otp_expired/i.test(raw))return tr('인증번호가 올바르지 않거나 만료되었습니다. 새 인증번호를 받아 다시 시도해주세요.','The verification code is incorrect or has expired. Request a new code and try again.');
      if(/rate.?limit/i.test(raw))return tr('인증번호 요청이 너무 많습니다. 잠시 후 다시 시도해주세요.','Too many verification code requests. Please try again later.');
      return tr(fallbackKo,fallbackEn);
    };
    if(open)open.onclick=()=>{box.hidden=false;phone.focus()};
    phone.oninput=()=>{phone.dataset.e164='';otpRow.hidden=true;message('')};
    let resendTimer=0,resendLeft=0;
    const startResendCooldown=()=>{
      clearInterval(resendTimer);resendLeft=60;send.disabled=true;send.textContent='60초 후 재전송';
      resendTimer=setInterval(()=>{
        resendLeft-=1;
        if(resendLeft<=0){clearInterval(resendTimer);resendTimer=0;send.disabled=false;send.textContent='인증번호 다시 받기';return}
        send.textContent=resendLeft+'초 후 재전송';
      },1000);
    };
    send.onclick=async()=>{
      if(send.disabled||resendLeft>0)return;
      const e164=normalizePhone(phone.value);
      if(!e164){message(tr('휴대폰 번호를 정확히 입력해주세요.','Please enter a valid phone number.'),true);return}
      send.disabled=true;send.textContent='전송 중...';message('');
      let sent=false;
      try{
        const data=await A.invokeFunction('account-verification',{action:'send_phone_otp',phone:e164});
        if(!data?.ok)throw Error(data?.error||'인증번호를 전송하지 못했습니다.');
        if(data?.already_verified){await render();return}
        sent=true;phone.dataset.e164=e164;otpRow.hidden=false;message('인증번호를 전송했습니다. 문자로 받은 6자리 번호를 입력해주세요.');otp.focus();startResendCooldown()
      }catch(e){
        const raw=await edgeMessage(e,'인증번호를 전송하지 못했습니다. 잠시 후 다시 시도해주세요.','We couldn\'t send the verification code. Please try again shortly.');
        message(raw,true)
      }finally{if(!sent&&document.getElementById('send')){send.disabled=false;send.textContent='인증번호 받기'}}
    };
    verify.onclick=async()=>{
      const e164=String(phone.dataset.e164||normalizePhone(phone.value)||''),token=String(otp.value||'').replace(/\D/g,'');
      if(!e164){message(tr('먼저 인증번호를 요청해주세요.','Please request a verification code first.'),true);return}
      if(!/^\d{6}$/.test(token)){message(tr('문자로 받은 인증번호 6자리를 입력해주세요.','Enter the 6-digit verification code from the text message.'),true);return}
      verify.disabled=true;verify.textContent='확인 중...';message('');
      try{
        const data=await A.invokeFunction('account-verification',{action:'verify_phone_otp',phone:e164,token});
        if(!data?.ok||!data?.phone_verified)throw Error(data?.error||'휴대폰 인증 완료 상태를 확인하지 못했습니다.');
        await render()
      }catch(e){message(await edgeMessage(e,'인증번호를 확인하지 못했습니다. 다시 시도해주세요.','We couldn\'t verify the code. Please try again.'),true)}
      finally{if(document.getElementById('verify')){verify.disabled=false;verify.textContent='인증 확인'}}
    };
  }
  await render();
})();
</script>
</body>
</html>
