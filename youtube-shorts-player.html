<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영상 보기 | FUNY PIN</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}.header{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;color:#201d25}.header button{border:0;background:none;font-size:23px;color:inherit}.player{height:calc(100dvh - 54px);display:grid;place-items:center}.player iframe{border:0;width:min(100vw,calc((100dvh - 54px)*9/16));height:min(calc(100dvh - 54px),177.78vw);max-height:100%;aspect-ratio:9/16}</style></head><body><header class="header"><button onclick="history.length>1?history.back():location.assign('index.html')" aria-label="뒤로 가기">‹</button><strong>영상 보기</strong></header><div class="player"><iframe id="yt" title="YouTube Shorts 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><script>const id=new URLSearchParams(location.search).get('id');if(/^[\w-]{11}$/.test(id||''))document.getElementById('yt').src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1';else location.replace('index.html');</script></body></html>
