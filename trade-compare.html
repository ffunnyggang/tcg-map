<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--p:#8062d8;--pd:#6749bd;--ps:#f3effb;--ink:#28232e;--muted:#857e8a;--line:#ebe6ef;--bg:#f5f3f7;--good:#208a55;--bad:#b42318}
*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;min-height:100%;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink)}button,input,select{font:inherit}
.shell{width:min(100%,440px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:max(36px,env(safe-area-inset-bottom))}
header{height:58px;padding:0 14px;display:flex;align-items:center;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #f0edf3}
.back{width:38px;height:38px;border:0;background:transparent;font-size:28px;line-height:1;color:#3e3943;padding:0;text-align:left}.brand{margin-left:auto;font-weight:900;font-size:15px}.spacer{width:38px;margin-left:auto}
main{padding:18px 16px}.eyebrow{font-size:10px;font-weight:900;color:var(--p);letter-spacing:.1em}.title{margin:6px 0 5px;font-size:26px;letter-spacing:-.05em}.desc{margin:0;color:#77717c;font-size:12px;line-height:1.6}
.card{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff}.section-title{font-size:12px;font-weight:900;margin-bottom:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;margin:0 0 6px;font-size:10px;font-weight:800;color:#77717c}.field input,.field select{width:100%;height:46px;border:1px solid #dfd9e4;border-radius:12px;background:#fff;padding:0 12px;font-size:15px;outline:none}.field input:focus,.field select:focus{border-color:#a68ce8;box-shadow:0 0 0 3px rgba(128,98,216,.08)}
.hero-result{margin-top:16px;padding:20px;border-radius:22px;background:linear-gradient(145deg,#f5f1fd,#faf9fc);text-align:center;border:1px solid #e7def5}.hero-result span{display:block;font-size:10px;color:#817986;font-weight:800}.hero-result strong{display:block;margin-top:6px;font-size:34px;letter-spacing:-.06em;color:var(--pd)}.hero-result small{display:block;margin-top:5px;font-size:10px;color:#8c8590;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.metric{padding:13px 10px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric span{font-size:9px;color:#928a96;font-weight:750}.metric strong{display:block;margin-top:5px;font-size:16px}.note{margin:12px 2px 0;color:#9b949f;font-size:10px;line-height:1.55}.error{margin-top:10px;color:var(--bad);font-size:10px;font-weight:750;min-height:16px}.btn{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;font-weight:900}
.list{display:grid;gap:7px}.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:#f8f6fa}.row b{font-size:11px}.row span{margin-left:auto;font-size:11px;font-weight:850;color:var(--pd)}
</style><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"><link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-header4">
<link rel="stylesheet" href="/web-safe-area.css?v=20261023-safe1"><script defer src="/web-safe-area.js?v=20261023-safe1"></script><meta name="theme-color" content="#ffffff"></head><body><div class="shell"><header class="funy-sub-header"><button class="back funy-sub-back" onclick="history.length>1?history.back():location.href='tcg-tools.html'" aria-label="뒤로가기">‹</button><div class="brand funy-sub-title">트레이딩 가치 비교</div><div class="spacer"></div></header><main>
<style>.side{margin-top:16px}.side-head{display:flex;align-items:center;margin-bottom:9px}.side-head b{font-size:13px}.add{margin-left:auto;border:0;border-radius:9px;background:var(--ps);color:var(--pd);height:32px;padding:0 10px;font-size:10px;font-weight:850}.trade-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(84px,.8fr) 92px 32px;gap:6px;margin-top:7px}.trade-row input,.trade-row select{min-width:0;height:42px;border:1px solid #dfd9e4;border-radius:10px;padding:0 8px;background:#fff}.remove{border:0;background:#f5f2f6;border-radius:9px;color:#8b828e}.total-line{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px}.total-line strong{font-size:15px}</style>
<div class="eyebrow">FUNY TCG TOOL</div><h1 class="title">트레이딩 가치 비교</h1><p class="desc">양쪽 카드 가격과 상태를 입력해 교환 가치 차이를 빠르게 비교합니다.</p>
<section class="card side" data-side="mine"><div class="side-head"><b>내가 주는 카드</b><button class="add" type="button">+ 카드 추가</button></div><div class="rows"></div><div class="total-line"><span>보정 총가치</span><strong class="total">₩0</strong></div></section>
<section class="card side" data-side="theirs"><div class="side-head"><b>상대가 주는 카드</b><button class="add" type="button">+ 카드 추가</button></div><div class="rows"></div><div class="total-line"><span>보정 총가치</span><strong class="total">₩0</strong></div></section>
<section class="hero-result"><span>트레이딩 가치 차이</span><strong id="diff">₩0</strong><small id="verdict">양쪽 카드 가치를 입력해주세요.</small></section>
<section class="metrics"><div class="metric"><span>내 카드 총가치</span><strong id="mineTotal">₩0</strong></div><div class="metric"><span>상대 카드 총가치</span><strong id="theirTotal">₩0</strong></div></section>
<p class="note">상태 보정 기본값: Mint 100% · NM 95% · LP 85% · MP 70%. 실제 거래가격과 개인 선호도에 따라 가치는 달라질 수 있습니다.</p>
</main></div><script>
(()=>{const fmt=n=>'₩'+Math.round(n).toLocaleString('ko-KR'),conditions={Mint:1,NM:.95,LP:.85,MP:.70};
function row(name='카드',value=''){const d=document.createElement('div');d.className='trade-row';d.innerHTML='<input class="name" aria-label="카드명" placeholder="카드명" value="'+name+'"><input class="value" aria-label="카드 가치" type="number" min="0" placeholder="가격" value="'+value+'"><select class="cond" aria-label="상태"><option>Mint</option><option selected>NM</option><option>LP</option><option>MP</option></select><button class="remove" type="button">×</button>';d.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));d.querySelector('.remove').onclick=()=>{d.remove();calc()};return d}
document.querySelectorAll('.side').forEach(s=>{const rows=s.querySelector('.rows');rows.append(row('',100000));s.querySelector('.add').onclick=()=>{rows.append(row('',0));calc()}})
function sum(side){let t=0;side.querySelectorAll('.trade-row').forEach(r=>{const v=Math.max(0,Number(r.querySelector('.value').value)||0),c=conditions[r.querySelector('.cond').value]||1;t+=v*c});side.querySelector('.total').textContent=fmt(t);return t}
function calc(){const sides=document.querySelectorAll('.side'),mine=sum(sides[0]),theirs=sum(sides[1]),diff=theirs-mine,base=Math.max(mine,theirs,1),pct=Math.abs(diff)/base*100;$('mineTotal').textContent=fmt(mine);$('theirTotal').textContent=fmt(theirs);$('diff').textContent=(diff>0?'+':'')+fmt(diff);$('diff').style.color=Math.abs(diff)/base<=.05?'var(--good)':diff>0?'var(--good)':'var(--bad)';
$('verdict').textContent=!mine&&!theirs?'양쪽 카드 가치를 입력해주세요.':pct<=5?'가치 차이가 5% 이내로 비교적 균형적입니다.':diff>0?'상대 카드 쪽 가치가 약 '+pct.toFixed(1)+'% 높습니다.':'내 카드 쪽 가치가 약 '+pct.toFixed(1)+'% 높습니다.';
try{window.FUNY_TRACK?.('trade_compare_change',{my_total:Math.round(mine),their_total:Math.round(theirs)})}catch(_){}
}function $(id){return document.getElementById(id)}calc()})();
</script><script src="funy-i18n.js?v=20261013-tools-i18n"></script></body></html>
