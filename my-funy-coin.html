<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>퍼니코인 | FUNY PIN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/my-v2.css?v=20261020-back-align2">
<link rel="stylesheet" href="/funy-ui-guide.css?v=20261020-back-align2">
<script src="/web-auth.js?v=20261018-web-auth10"></script>
<style>
.coin-title{display:flex!important;align-items:center!important;height:36px!important;line-height:24px!important}
.coin-hero{margin-top:12px;padding:21px 18px;border-radius:20px;background:linear-gradient(145deg,#2B2630,#6047A1);color:#fff}.coin-hero small{font-size:10px;opacity:.72}.coin-hero strong{display:flex;align-items:baseline;gap:5px;margin-top:6px;font-size:34px}.coin-hero strong small{font-size:14px;font-weight:800;opacity:.8}.coin-hero span{font-size:10px;opacity:.8}.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:13px;border:1px solid #EAE5EE;border-radius:14px;background:#fff}.tx b{display:block;font-size:11px}.tx span{display:block;margin-top:4px;color:#958D99;font-size:9px;line-height:1.45}.tx strong{font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:100%}.plus{color:#368554}.minus{color:#B34D5C}
</style></head><body><div class="test-shell">
<header class="test-head funy-sub-header"><button class="test-back funy-sub-back" onclick="location.href='/my.html'" aria-label="뒤로가기">‹</button><div class="test-title funy-sub-title coin-title">FUNY COIN</div><span></span></header>
<main class="test-main">
<div id="summary"><div class="loading">퍼니코인을 불러오는 중...</div></div>
<div class="segment"><button class="chip on" data-filter="all">전체</button><button class="chip" data-filter="earn">적립</button><button class="chip" data-filter="spend">사용</button></div>
<div id="root"></div></main></div>
<script>
(async()=>{
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),date=v=>v?new Date(v).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 const labels={signup_bonus:'회원가입 보너스',mission_reward:'미션 보상',event_reward:'이벤트 보상',garapon_spend:'가라폰 참여',garapon_refund:'가라폰 환불',admin_grant:'관리자 지급',admin_deduct:'관리자 회수'};
 await A.init();if(!A.session){A.goLogin('/my-funy-coin.html');return}const uid=A.session.user.id;
 const [w,l]=await Promise.all([A.client.from('funy_coin_wallets').select('balance').eq('user_id',uid).maybeSingle(),A.client.from('funy_coin_ledger').select('id,amount,balance_after,transaction_type,source_type,source_id,description,metadata,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(100)]);
 if(w.error)throw w.error;if(l.error)throw l.error;const rows=l.data||[],balance=Number(w.data?.balance||0);$('#summary').innerHTML='<section class="coin-hero"><small>현재 사용 가능한 코인</small><strong>'+balance.toLocaleString('ko-KR')+' <small>C</small></strong><span>FUNY COIN</span></section>';
 let filter='all';
 function render(){const list=rows.filter(x=>filter==='all'||(filter==='earn'?Number(x.amount)>0:Number(x.amount)<0));$('#root').innerHTML='<div class="list">'+(list.length?list.map(x=>'<article class="tx"><div><b>'+esc(x.description||labels[x.transaction_type]||x.transaction_type||'퍼니코인')+'</b><span>'+date(x.created_at)+' · 잔액 '+Number(x.balance_after||0).toLocaleString('ko-KR')+' C'+(x.source_type?' · '+esc(x.source_type):'')+'</span></div><strong class="'+(Number(x.amount)>0?'plus':'minus')+'">'+(Number(x.amount)>0?'+':'')+Number(x.amount||0).toLocaleString('ko-KR')+' C</strong></article>').join(''):'<div class="empty"><strong>해당 내역이 없어요</strong>적립하거나 사용한 퍼니코인이 이곳에 표시됩니다.</div>')+'</div>'}
 $$('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});render();
})().catch(e=>{document.getElementById('summary').innerHTML='<div class="error"><strong>퍼니코인을 불러오지 못했어요</strong>'+String(e?.message||e)+'</div>'});
</script></body></html>
