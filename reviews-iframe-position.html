<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INFO iframe 좌표 설정 | FUNY PIN</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Pretendard",sans-serif;background:#f4f2f7;color:#24212a}.bar{position:sticky;top:0;z-index:10;padding:12px;background:#fff;border-bottom:1px solid #e7e2eb}.bar h1{font-size:16px;margin:0 0 9px}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.controls button,.controls input{height:36px;border:1px solid #ddd6e3;border-radius:9px;background:#fff;padding:0 10px;font-size:13px}.controls button{cursor:pointer}.controls .active{background:#272331;color:#fff;border-color:#272331}.value{font-weight:800;color:#6749bd}.hint{margin:8px 0 0;font-size:11px;color:#8a8490}.frame-wrap{width:min(100%,420px);height:calc(100vh - 115px);margin:0 auto;overflow:hidden;background:#fff;position:relative}.frame-wrap iframe{position:absolute;left:0;top:0;width:100%;height:4000px;border:0;transform:translateY(var(--y));transform-origin:top left}.guide{position:fixed;left:0;right:0;top:115px;height:2px;background:#ff4d67;z-index:5;pointer-events:none}</style></head><body><div class="bar"><h1>reviews.html · 인포크 좌표 설정</h1><div class="controls"><button data-mode="information" class="active">💡 정보</button><button data-mode="review">📝 리뷰</button><button id="minus10">-10</button><button id="minus1">-1</button><span class="value" id="value"></span><button id="plus1">+1</button><button id="plus10">+10</button><input id="direct" type="number" step="1" aria-label="Y 좌표"><button id="copy">좌표 복사</button></div><p class="hint">빨간 선이 콘텐츠 시작점입니다. 버튼 또는 숫자 입력으로 Y 좌표를 맞춘 뒤 좌표를 복사해 알려주세요.</p></div><div class="guide"></div><div class="frame-wrap"><iframe id="frame" src="https://link.inpock.co.kr/tcg_map" scrolling="no"></iframe></div><script>(()=>{const vals={information:-1238,review:-1847};let mode="information";const frame=document.getElementById("frame"),value=document.getElementById("value"),direct=document.getElementById("direct");function draw(){frame.style.setProperty("--y",vals[mode]+"px");value.textContent="Y "+vals[mode]+"px";direct.value=vals[mode];document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode))}document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});function move(n){vals[mode]+=n;draw()}minus10.onclick=()=>move(-10);minus1.onclick=()=>move(-1);plus1.onclick=()=>move(1);plus10.onclick=()=>move(10);direct.onchange=()=>{vals[mode]=Number(direct.value)||0;draw()};copy.onclick=async()=>{const t=(mode==="information"?"정보":"리뷰")+" Y 좌표: "+vals[mode]+"px";try{await navigator.clipboard.writeText(t);copy.textContent="복사 완료";setTimeout(()=>copy.textContent="좌표 복사",1000)}catch(e){prompt("아래 좌표를 복사하세요",t)}};draw()})();</script></body></html>
