<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f3f7;color:#211e25;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:0 auto;background:#fff}.head{position:sticky;top:0;z-index:30;height:54px;padding:0 14px;display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:#fff}.back{width:36px;height:36px;border:0;background:transparent;color:#181720;font-size:28px;line-height:30px}.head-title{text-align:center;font-size:16px;font-weight:900}.page{padding:14px 14px 40px}.notice{padding:12px 13px;border:1px solid #e9e4ee;border-radius:14px;background:#faf9fc;color:#756e79;font-size:10px;line-height:1.55}.section{margin-top:22px}.label{display:block;margin:0 0 8px;font-size:12px;font-weight:900}.url-row{display:flex;gap:7px}.url-input{flex:1;min-width:0;height:44px;padding:0 11px;border:1px solid #ded8e3;border-radius:12px;outline:0;font-size:11px;color:#49434e}.load{width:74px;border:0;border-radius:12px;background:#28232e;color:#fff;font-size:11px;font-weight:900}.status{margin-top:7px;color:#978f9b;font-size:9.5px}.preview{display:none;margin-top:12px;padding:10px;border:1px solid #e9e4ed;border-radius:15px;background:#fff;grid-template-columns:92px minmax(0,1fr);gap:11px}.preview.show{display:grid}.thumb{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#f1eef4}.ph{width:92px;height:92px;border-radius:12px;background:#f1eef4;display:grid;place-items:center;color:#948b9a;font-size:9px}.ptitle{font-size:14px;font-weight:900;line-height:1.35}.pprice{margin-top:5px;font-size:15px;font-weight:900}.pdesc{margin-top:7px;color:#817985;font-size:10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.map-box{height:330px;border-radius:16px;overflow:hidden;position:relative;background:#eeeaf2}.market-map-canvas{position:absolute;inset:0;width:100%;height:100%}.center-pin{position:absolute;z-index:5;left:50%;top:50%;width:42px;height:42px;margin:-38px 0 0 -21px;border:3px solid #fff;border-radius:50% 50% 50% 7px;background:#17151b;transform:rotate(-45deg);box-shadow:0 7px 18px rgba(24,20,30,.24);pointer-events:none}.center-pin:after{content:'₩';position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg);color:#fff;font-size:16px;font-weight:900}.map-tip{position:absolute;z-index:6;left:50%;top:12px;transform:translateX(-50%);padding:7px 10px;border:1px solid rgba(255,255,255,.9);border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 5px 16px rgba(30,25,38,.10);font-size:9px;font-weight:850;white-space:nowrap}.loc-row{margin-top:9px;display:flex;align-items:center;gap:8px}.loc-copy{flex:1;min-width:0}.loc-name{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.coords{margin-top:3px;color:#a099a4;font-size:9px}.loc-btn{height:34px;padding:0 10px;border:1px solid #ddd7e3;border-radius:10px;background:#fff;color:#625b68;font-size:10px;font-weight:850}.submit{width:100%;height:50px;margin-top:26px;border:0;border-radius:14px;background:#17151b;color:#fff;font-size:13px;font-weight:900}.submit:disabled,.load:disabled{opacity:.45}.error{display:none;margin-top:10px;color:#c94d5c;font-size:10px;line-height:1.5}
</style>

<body><div class="shell">
<header class="head"><button class="back" type="button" onclick="history.back()">‹</button><div class="head-title">매물 등록</div><span></span></header>
<main class="page">
<div class="notice">테스트 기능입니다. 공개 TCG MAP에는 노출되지 않으며, 판매자의 실제 거주지가 아닌 <b>거래 희망 장소</b>를 지정해주세요.</div>

<section class="section">
<label class="label" for="url">당근 매물 URL</label>
<div class="url-row"><input id="url" class="url-input" value="https://www.daangn.com/articles/1263844918?share=true" placeholder="당근 매물 URL"><button id="load" class="load" type="button">불러오기</button></div>
<div id="status" class="status">당근 링크를 입력하면 상품명·가격·이미지를 자동으로 불러옵니다.</div>
<div id="preview" class="preview">
  <div id="thumbWrap"></div>
  <div><div id="ptitle" class="ptitle"></div><div id="pprice" class="pprice"></div><div id="pdesc" class="pdesc"></div></div>
</div>
</section>

<section class="section">
<div class="label">거래 희망 위치</div>
<div class="map-box"><div id="marketRegisterMap" class="market-map-canvas"></div><div class="map-tip" id="mapTip">지도를 움직여 거래 장소를 지정하세요</div><div class="center-pin"></div></div>
<div class="loc-row"><div class="loc-copy"><div id="locName" class="loc-name">위치를 확인하는 중...</div><div id="coords" class="coords"></div></div><button id="myLoc" class="loc-btn" type="button">내 위치</button></div>
</section>

<div id="error" class="error"></div>
<button id="submit" class="submit" type="button" disabled>매물 등록하기</button>
</main></div>

<script>
(async()=>{
 const ENDPOINT='https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/daangn-listing-preview-test';
 const A=window.FUNY_WEB_AUTH,$=s=>document.querySelector(s);let product=null,locationName='',lat=37.5665,lng=126.9780,reverseTimer=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const session=await A.init();
 if(!session){alert('매물 등록은 로그인 후 이용할 수 있어요.');A.goLogin(location.pathname+location.search);return}
 const waitForNaver=()=>new Promise((resolve,reject)=>{let tries=0;const tick=()=>{if(window.naver?.maps?.Map){resolve(window.naver);return}if(++tries>=80){reject(new Error('네이버 지도 API를 불러오지 못했습니다.'));return}setTimeout(tick,100)};tick()});
 let map;try{await waitForNaver();map=new naver.maps.Map('marketRegisterMap',{center:new naver.maps.LatLng(lat,lng),zoom:15,minZoom:7,maxZoom:19,zoomControl:false,mapDataControl:false,scaleControl:false,logoControl:false});setTimeout(()=>{try{naver.maps.Event.trigger(map,'resize')}catch(_){}},80)}catch(e){document.getElementById('mapTip').textContent='지도를 불러오지 못했습니다.';document.getElementById('marketRegisterMap').innerHTML='<div style="height:100%;display:grid;place-items:center;padding:30px;text-align:center;color:#8d8792;font-size:12px;line-height:1.6">네이버 지도를 불러오지 못했습니다.<br>잠시 후 다시 열어주세요.</div>';setError(String(e?.message||e));return}
 function setError(msg){const e=$('#error');e.textContent=msg||'';e.style.display=msg?'block':'none'}
 function setPreview(x){product=x;$('#preview').classList.add('show');$('#ptitle').textContent=x.title||'상품명 없음';$('#pprice').textContent=x.price||'가격 정보 없음';$('#pdesc').textContent=x.description||'상품 설명 없음';$('#thumbWrap').innerHTML=x.image?'<img class="thumb" src="'+esc(x.image)+'" alt="" referrerpolicy="no-referrer">':'<div class="ph">NO IMAGE</div>';$('#submit').disabled=false}
 async function loadPreview(){
   const url=$('#url').value.trim();if(!url)return;
   setError('');$('#load').disabled=true;$('#status').textContent='당근 매물 정보를 불러오는 중...';
   try{const {data:j,error}=await A.client.functions.invoke('daangn-listing-preview-test',{body:{url}});if(error)throw error;if(!j?.ok)throw Error(j?.error||'매물 정보를 불러오지 못했습니다.');setPreview(j);$('#status').textContent='매물 정보를 불러왔어요. 내용을 확인하고 거래 위치를 지정해주세요.'}
   catch(e){product=null;$('#preview').classList.remove('show');$('#submit').disabled=true;setError(e.message);$('#status').textContent='매물 정보를 불러오지 못했습니다.'}
   finally{$('#load').disabled=false}
 }
 function reverse(){
   const center=map.getCenter();lat=center.lat();lng=center.lng();$('#coords').textContent=lat.toFixed(6)+', '+lng.toFixed(6);
   clearTimeout(reverseTimer);reverseTimer=setTimeout(()=>{if(!naver.maps.Service?.reverseGeocode){locationName='거래 희망 위치';$('#locName').textContent=locationName;return}naver.maps.Service.reverseGeocode({coords:new naver.maps.LatLng(lat,lng),orders:[naver.maps.Service.OrderType.ROAD_ADDR,naver.maps.Service.OrderType.ADDR].join(',')},(status,res)=>{if(status!==naver.maps.Service.Status.OK){locationName='거래 희망 위치';$('#locName').textContent=locationName;return}const item=res.v2?.results?.[0],region=item?.region;locationName=item?.land?.name||[region?.area1?.name,region?.area2?.name,region?.area3?.name].filter(Boolean).join(' ')||'거래 희망 위치';$('#locName').textContent=locationName})},180)
 }
 naver.maps.Event.addListener(map,'idle',reverse);reverse();
 $('#myLoc').onclick=()=>{if(!navigator.geolocation){alert('현재 위치를 사용할 수 없습니다.');return}navigator.geolocation.getCurrentPosition(p=>{map.setCenter(new naver.maps.LatLng(p.coords.latitude,p.coords.longitude));map.setZoom(16)},()=>alert('위치 권한을 확인해주세요.'),{enableHighAccuracy:true,timeout:7000})};
 $('#load').onclick=loadPreview;$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')loadPreview()});
 $('#submit').onclick=async()=>{
   if(!product)return;setError('');$('#submit').disabled=true;$('#submit').textContent='등록 중...';
   try{
     const profile=await A.getProfile();const user=A.session.user;const nick=profile?.nickname||user.user_metadata?.nickname||user.user_metadata?.name||('FUNY회원'+String(user.id).replace(/-/g,'').slice(-4).toUpperCase());
     const raw=String(product.price_raw||'').replace(/,/g,'').trim();const price=raw&&Number.isFinite(Number(raw))?Math.round(Number(raw)):null;
     const row={seller_user_id:user.id,seller_nickname:nick,provider:'daangn',external_url:product.final_url||product.source_url||$('#url').value.trim(),external_listing_id:product.article_id||null,title:product.title||'당근 매물',description:product.description||null,price,currency:product.currency||'KRW',thumbnail_url:product.image||null,external_status:product.availability||null,listing_status:'active',country_code:'KR',latitude:lat,longitude:lng,location_name:locationName||'거래 희망 위치',fetched_at:product.fetched_at||new Date().toISOString(),updated_at:new Date().toISOString()};
     const {data,error}=await A.client.from('market_listings').insert(row).select('id').single();if(error)throw error;location.href='/market-detail-test.html?id='+encodeURIComponent(data.id);
   }catch(e){setError(String(e?.message||e));$('#submit').disabled=false;$('#submit').textContent='매물 등록하기'}
 };
 loadPreview();
})();
</script>
</body></html>
