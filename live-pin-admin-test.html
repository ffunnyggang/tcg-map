<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUNY PIN | LIVE PIN 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#28232e;font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,sans-serif}.shell{width:min(100%,420px);min-height:100dvh;margin:auto;background:#fff;padding-bottom:40px}.head{height:58px;padding:0 14px;display:flex;align-items:center;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #f0edf2}.head strong{font-size:20px}.test{margin-left:auto;padding:5px 8px;border-radius:999px;background:#f0e9ff;color:#7557c8;font-size:10px;font-weight:800}.box{margin:18px 14px;padding:16px;border:1px solid #ece8ef;border-radius:17px}.box h1{font-size:20px;margin:0 0 5px}.sub{font-size:11px;color:#918996;line-height:1.5;margin:0 0 14px}.input{width:100%;height:45px;border:1px solid #e4dfe8;border-radius:12px;padding:0 12px;margin:0 0 9px;font-size:14px}.primary{width:100%;height:45px;border:0;border-radius:12px;background:#28232e;color:#fff;font-weight:800}.toolbar{display:none;padding:14px;gap:8px;align-items:center}.toolbar.show{display:flex}.toolbar b{font-size:13px}.toolbar button{margin-left:auto;border:0;background:#f4f1f6;border-radius:9px;padding:7px 10px;font-size:10px}.feed{padding:0 14px}.card{padding:14px;margin-bottom:10px;border:1px solid #ece8ef;border-radius:16px}.top{display:flex;gap:7px;align-items:center}.reason{font-size:12px;font-weight:850}.time{font-size:9px;color:#aaa3af}.status{margin-left:auto;font-size:9px;padding:4px 7px;border-radius:999px;background:#fff3df;color:#a16b14}.status.done{background:#edf8f0;color:#4d8c60}.shop{margin:10px 0 5px;font-size:14px;font-weight:850}.meta,.body{font-size:11px;color:#716a76;line-height:1.5}.body{margin-top:8px;padding:10px;background:#faf8fc;border-radius:10px;color:#514b56}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:11px}.actions button{border:1px solid #e4dfe8;background:#fff;border-radius:9px;padding:8px 3px;font-size:9px}.actions .hide-post{border-color:#efc7cc;color:#b42318;background:#fff7f8}.hidden-badge{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:999px;background:#f5e9eb;color:#a33b48;font-size:9px;font-weight:800}.empty{padding:35px 10px;text-align:center;color:#9c949f;font-size:12px}.error{color:#b42318}.hidden{display:none}
</style></head><body><main class="shell"><header class="head"><strong>LIVE PIN 관리자</strong><span class="test">ADMIN TEST</span></header>
<section id="login" class="box"><h1>관리자 로그인</h1><p class="sub">Supabase에 등록한 FUNY PIN 관리자 계정으로 로그인하세요.</p><input id="email" class="input" type="email" autocomplete="username" placeholder="이메일"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="비밀번호"><button id="loginBtn" class="primary">로그인</button><p id="loginMsg" class="sub" style="margin-top:10px"></p></section>
<div id="toolbar" class="toolbar"><b>신고 관리</b><button id="logout">로그아웃</button></div><section id="feed" class="feed"></section></main>
<script>
const BASE='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';let token='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const h={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.message||('HTTP '+r.status))}return r.status===204?null:r.json()}
async function login(){const b=$('loginBtn');b.disabled=true;b.textContent='로그인 중...';$('loginMsg').textContent='';try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.access_token;sessionStorage.setItem('funypin_admin_token',token);await verify()}catch(e){$('loginMsg').className='sub error';$('loginMsg').textContent='로그인 실패: '+e.message}finally{b.disabled=false;b.textContent='로그인'}}
async function verify(){try{const rows=await api('/rest/v1/admin_users?select=user_id&limit=1');if(!rows.length)throw new Error('관리자 권한이 없는 계정입니다.');$('login').classList.add('hidden');$('toolbar').classList.add('show');await load()}catch(e){token='';sessionStorage.removeItem('funypin_admin_token');$('login').classList.remove('hidden');$('toolbar').classList.remove('show');$('loginMsg').className='sub error';$('loginMsg').textContent=e.message}}
async function load(){const f=$('feed');f.innerHTML='<div class="empty">불러오는 중...</div>';try{const flags=await api('/rest/v1/live_report_flags?select=*&order=created_at.desc&limit=100');if(!flags.length){f.innerHTML='<div class="empty">접수된 신고가 없습니다.</div>';return}const ids=[...new Set(flags.map(x=>x.report_id))].join(',');let reports=[];if(ids)reports=await api('/rest/v1/live_reports?select=id,shop_name,post_type,category,status,content,created_at,is_hidden&id=in.('+ids+')');const map=Object.fromEntries(reports.map(x=>[x.id,x]));f.innerHTML='';flags.forEach(x=>{const r=map[x.report_id]||{},c=document.createElement('article');c.className='card';c.innerHTML='<div class="top"><span class="reason">'+esc(x.reason)+'</span><span class="time">'+new Date(x.created_at).toLocaleString('ko-KR')+'</span><span class="status '+(x.admin_status!=='pending'?'done':'')+'">'+esc(({pending:'미처리',reviewed:'검토 중',dismissed:'문제없음',actioned:'조치완료'})[x.admin_status]||x.admin_status)+'</span></div><div class="shop">📍 '+esc(r.shop_name||'삭제된 게시물')+'</div><div class="meta">'+esc((r.post_type==='request'?'정보 요청':'현장 제보')+' · '+(r.category||''))+'</div><div class="body">'+esc(r.status||'')+(r.status&&r.content?'<br>':'')+esc(r.content||'내용 없음')+'</div>'+(r.is_hidden?'<span class="hidden-badge">게시물 숨김 처리됨</span>':'')+'<div class="actions"><button data-id="'+x.id+'" data-status="dismissed">문제없음</button>'+(r.is_hidden?'<button class="unhide-post" data-flag="'+x.id+'" data-report="'+x.report_id+'">숨김 취소</button>':'<button class="hide-post" data-flag="'+x.id+'" data-report="'+x.report_id+'" data-reason="'+esc(x.reason)+'">문제 있음 · 숨김</button>')+'</div>';f.appendChild(c)});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status));document.querySelectorAll('.hide-post').forEach(b=>b.onclick=()=>hidePost(b.dataset.flag,b.dataset.report,b.dataset.reason));document.querySelectorAll('.unhide-post').forEach(b=>b.onclick=()=>unhidePost(b.dataset.flag,b.dataset.report))}catch(e){f.innerHTML='<div class="empty error">신고 조회 실패: '+esc(e.message)+'</div>'}}
async function unhidePost(flagId,reportId){if(!confirm('숨김 처리를 취소하고 LIVE PIN에 다시 표시할까요?'))return;try{await api('/rest/v1/live_reports?id=eq.'+encodeURIComponent(reportId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_hidden:false,hidden_at:null,hidden_reason:null})});await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(flagId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:'pending',reviewed_at:null})});await load()}catch(e){alert('숨김 취소 실패: '+e.message)}}
async function hidePost(flagId,reportId,reason){if(!confirm('문제가 있는 게시물로 판단하고 LIVE PIN에서 숨길까요?\n\n원문과 신고 기록은 DB에 유지됩니다.'))return;try{const now=new Date().toISOString();await api('/rest/v1/live_reports?id=eq.'+encodeURIComponent(reportId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_hidden:true,hidden_at:now,hidden_reason:reason})});await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(flagId),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:'actioned',reviewed_at:now})});await load()}catch(e){alert('숨김 처리 실패: '+e.message)}}
async function setStatus(id,status){try{await api('/rest/v1/live_report_flags?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({admin_status:status,reviewed_at:new Date().toISOString()})});await load()}catch(e){alert('처리 실패: '+e.message)}}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=()=>{token='';sessionStorage.removeItem('funypin_admin_token');location.reload()};token=sessionStorage.getItem('funypin_admin_token')||'';if(token)verify();
</script></body></html>
