<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui3"><link rel="stylesheet" href="/web-responsive-420.css?v=20261014-1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><title>포켓몬 BOX 시세 | FUNY PIN</title><style>*{box-sizing:border-box}html{background:#f5f3f8;overflow-x:hidden}body{margin:0;overflow-x:hidden;font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--funy-text,#181720)}main{max-width:var(--funy-content-max,420px);background:var(--funy-bg,#fff);min-height:100dvh;margin:0 auto;padding:0 var(--funy-screen-pad,14px) 44px}header{height:54px;display:flex;align-items:center;gap:0;border:0;margin:0 -14px 18px;padding:0 14px;background:#fff}header a{text-decoration:none;color:#24202b;font-size:30px;line-height:1}header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.35px}.muted{font-size:12px;color:#89818e;line-height:1.55}.placeholder{background:var(--funy-surface-soft,#FAF9FC);border:1px dashed #ded8e5;display:grid;place-items:center;color:#aaa2b0;text-align:center;font-size:12px;border-radius:12px}.divider{height:9px;background:#f6f4f8;margin:24px -16px}h2{font-size:17px;margin:0 0 15px}button,input,select{font:inherit}button{cursor:pointer}.note{font-size:11px;line-height:1.65;color:#8a8290}.empty{border:1px dashed #e0dbe6;border-radius:14px;background:#fcfbfd;text-align:center;color:#857c8d;padding:25px 15px;font-size:13px;line-height:1.7}a{color:inherit}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}.intro{padding-top:4px}.intro h2{font-size:23px;margin:5px 0 8px;letter-spacing:-.5px}.tools{display:flex;gap:8px;margin:23px 0 16px}.tools input{width:100%;min-width:0;flex:1;padding:12px;border:1px solid #e5e1e9;border-radius:11px;outline-color:var(--funy-purple,#8062D8)}.tools select{width:113px;border-radius:11px;background:white;border:1px solid #e5e1e9;padding:9px 6px;font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px;font-size:12px}.toolbar strong{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.item{text-decoration:none;min-width:0;display:block}.item .placeholder{aspect-ratio:1/1;width:100%;margin-bottom:10px}.item strong{display:block;font-size:14px;line-height:1.4;min-height:39px;overflow-wrap:anywhere}.item .price{display:block;margin-top:8px;font-size:13px;font-weight:750;color:#5b5363}.item .delta{display:block;font-size:11px;color:#918a97;margin-top:4px}.item:focus-visible{outline:3px solid #8063d7;outline-offset:3px;border-radius:10px}#empty[hidden]{display:none}html.app-shell header.funy-sub-header{display:none!important}html.app-shell main{padding-top:0} .placeholder img{max-width:100%;max-height:100%;display:block;object-fit:contain}.item .placeholder{overflow:hidden} .item .placeholder img{transition:transform .2s ease}@media(hover:hover){.item:hover .placeholder img{transform:scale(1.025)}}@media(max-width:360px){.grid{gap:16px 10px}.item strong{font-size:13px}.tools select{width:102px}} .funy-sub-header{position:sticky!important;top:0!important;z-index:95!important;background:#fff!important;margin-bottom:18px!important}html.app-shell .portal-bottom-nav,html.app-shell .shops-bottom-nav,html.app-shell .bottom-nav,html.app-shell .tab-bar{display:none!important}html.app-shell body{padding-bottom:0!important}</style></head><body><main><header class="funy-sub-header"><a class="funy-sub-back" href="/" aria-label="이전">‹</a><h1 class="funy-sub-title">BOX 시세</h1></header><div class="tools"><input id="search" type="search" placeholder="BOX 상품명 검색" aria-label="BOX 상품명 검색"><select id="sort" aria-label="정렬"><option value="name">이름순</option><option value="oldest">출시 오래된순</option><option value="newest" selected>최신 출시순</option></select></div><div class="toolbar"><strong id="count">BOX 17개</strong><span class="muted">포켓몬 · 일본판</span></div><section id="grid" class="grid" aria-label="BOX 상품 목록"></section><div id="empty" class="empty" hidden>해당 상품을 찾을 수 없습니다.<br>검색어를 다시 확인해주세요.</div></main><script>const BOX_PRODUCTS=[{id:"jp-30th",name:"포켓몬카드 30주년 일본판 BOX",short:"30주년 일본판",popularity:1},{id:"jp-storm-emerald",name:"스톰에메랄다 일본판 BOX",short:"스톰에메랄다",popularity:2},{id:"jp-inferno-x",name:"인페르노X 일본판 BOX",short:"인페르노X",popularity:3},{id:"jp-mega-dream-ex",name:"메가드림 ex 일본판 BOX",short:"메가드림 ex",popularity:4},{id:"jp-black-bolt",name:"블랙볼트 일본판 BOX",short:"블랙볼트",popularity:5},{id:"jp-white-flare",name:"화이트플레어 일본판 BOX",short:"화이트플레어",popularity:6},{id:"jp-151",name:"포켓몬카드 151 일본판 BOX",short:"포켓몬카드 151",popularity:7},{id:"jp-shiny-treasure",name:"샤이니 트레저 ex 일본판 BOX",short:"샤이니 트레저 ex",popularity:8}];
const qs=new URLSearchParams(location.search),search=document.getElementById('search'),sort=document.getElementById('sort'),grid=document.getElementById('grid'),empty=document.getElementById('empty');search.value=qs.get('q')||'';
function render(){const q=search.value.trim().toLocaleLowerCase('ko'),items=BOX_PRODUCTS.filter(p=>p.name.toLocaleLowerCase('ko').includes(q));if(sort.value==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sort.value==='oldest')items.sort((a,b)=>(a.release_date||'9999').localeCompare(b.release_date||'9999'));if(sort.value==='newest')items.sort((a,b)=>(b.release_date||'0000').localeCompare(a.release_date||'0000'));grid.replaceChildren();document.getElementById('count').textContent='BOX '+items.length+'개';empty.hidden=items.length>0;for(const p of items){const link=document.createElement('a');link.className='item';link.href='box-detail.html?id='+encodeURIComponent(p.id);const img=document.createElement('div');img.className='placeholder';img.textContent='상품 이미지 준비 중';if(p.image_path){const photo=document.createElement('img');photo.src='https://wdttzpbmqavaqfcbaywj.supabase.co/storage/v1/object/public/box-products/'+encodeURIComponent(p.image_path);photo.alt=p.name;photo.loading='lazy';photo.style.cssText='width:100%;height:100%;object-fit:contain;';photo.onerror=()=>{photo.remove();img.textContent='상품 이미지 준비 중'};img.textContent='';img.append(photo);}const name=document.createElement('strong');name.textContent=p.name;const price=document.createElement('span');price.className='price';price.textContent='시세 준비 중';link.append(img,name,price);grid.append(link)}}
search.addEventListener('input',render);sort.addEventListener('change',render);render();</script><script>fetch('data/box-products-v1.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(d=>{if(!Array.isArray(d.products))return;BOX_PRODUCTS.splice(0,BOX_PRODUCTS.length,...d.products.map((p,i)=>({...p,popularity:i+1})));render()}).catch(()=>{});</script><style>.box-price-date{text-align:right;color:#8d8993;font-size:11px;margin:3px 0 13px}.item .candidate-price{display:block;margin-top:8px;font-size:13px;color:#5c5265;font-weight:700}.item .candidate-caption{display:block;margin-top:5px;font-size:10px;color:#9a849f}.item .seller-quotes{margin-top:8px;display:grid;gap:5px}.item .seller-quote{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:11px;line-height:1.4}.item .seller-quote .seller-name{color:#776e7e;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .seller-quote strong{font-size:12px;font-weight:750;min-height:0;white-space:nowrap;text-align:left}.item .seller-quote{align-items:center}.item .seller-quote .seller-name{font-size:11px;text-align:right;max-width:50%;flex-shrink:1}.seller-price-left{min-width:0;display:flex;flex-direction:column;gap:2px}.seller-price-line{padding:5px 0;border-bottom:1px solid #f1edf5}.seller-price-line:last-child{border:0}.seller-date{font-size:10px;color:#9b95a2;display:block;text-align:left;margin-top:2px}.seller-quotes{border-top:1px solid #f0edf4;padding-top:5px}.item .price.lowest-quote{font-size:15px;font-weight:800;color:var(--funy-text,#181720)}</style><script>(function(){let quotes;function apply(){if(!quotes)return;const date=document.getElementById('boxReferenceDate');if(date)date.textContent='자료 접수 '+quotes.received_date+' · 판매처별 기준일 표기';for(const link of document.querySelectorAll('#grid a.item')){let id;try{id=new URL(link.href).searchParams.get('id')}catch(_){continue}const entries=quotes.sources.filter(s=>Object.prototype.hasOwnProperty.call(s.quotes,id)).sort((a,b)=>a.quotes[id]-b.quotes[id]);const old=link.querySelector('.candidate-price');if(old)old.remove();const oldLabel=link.querySelector('.candidate-caption');if(oldLabel)oldLabel.remove();if(!entries.length){link.remove();continue;}const oldGroup=link.querySelector('.seller-quotes');if(oldGroup)oldGroup.remove();const group=document.createElement('div');group.className='seller-quotes';for(const seller of entries.slice(0,3)){const row=document.createElement('div');row.className='seller-quote';const name=document.createElement('span');name.className='seller-name';name.textContent=seller.source;const amount=document.createElement('strong');amount.textContent=Number(seller.quotes[id]).toLocaleString('ko-KR')+'원';const lineDate=document.createElement('small');lineDate.className='seller-date';lineDate.textContent=seller.price_effective_date?'기준 '+seller.price_effective_date.replaceAll('-','.'):'기준일 미확인';const left=document.createElement('div');left.className='seller-price-left';left.append(amount,lineDate);row.append(left,name);const wrap=document.createElement('div');wrap.className='seller-price-line';wrap.append(row);group.append(wrap)}const current=link.querySelector('.price');if(current){current.textContent='최저 '+Number(entries[0].quotes[id]).toLocaleString('ko-KR')+'원';current.classList.add('lowest-quote')}link.append(group)}document.getElementById('count').textContent='BOX '+document.getElementById('grid').querySelectorAll('a.item').length+'개';document.getElementById('empty').hidden=document.getElementById('grid').querySelectorAll('a.item').length>0}fetch('data/box-price-candidates-v1.json',{cache:'no-store'}).then(r=>r.json()).then(async data=>{try{const resp=await fetch('https://wdttzpbmqavaqfcbaywj.supabase.co/functions/v1/box-price-public',{cache:'no-store'});if(resp.ok){const payload=await resp.json();for(const row of payload.rows||[]){let source=data.sources.find(x=>x.source===row.seller);if(!source){source={source:row.seller,quotes:{},price_effective_date:row.price_effective_date};data.sources.push(source)}source.quotes[row.product_id]=row.price_krw;source.price_effective_date=row.price_effective_date||source.price_effective_date}}}catch(_){}return data}).then(d=>{quotes=d;const grid=document.getElementById('grid');apply();const observer=new MutationObserver(()=>{observer.disconnect();apply();observer.observe(grid,{childList:true})});observer.observe(grid,{childList:true})}).catch(()=>{})})();</script></body></html>
