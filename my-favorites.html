<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>관심 매장 | FUNY PIN</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/my-web.css?v=20261014-my2"><style>.fav-card{position:relative;display:flex;min-height:108px;overflow:hidden;text-decoration:none;color:inherit}.fav-img{width:108px;min-width:108px;background:#eee;object-fit:cover}.fav-fallback{width:108px;min-width:108px;display:grid;place-items:center;background:#eee8fa;color:#6749bd;font-size:10px;font-weight:900}.fav-copy{min-width:0;flex:1;padding:15px 42px 13px 14px}.fav-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fav-meta{margin-top:7px;color:#6749bd;font-size:10.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fav-address{margin-top:5px;color:#918996;font-size:10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.fav-remove{position:absolute;right:9px;top:9px;width:28px;height:28px;border:1px solid #e2dce7;border-radius:50%;background:#fff;color:#655e69;font-size:19px;line-height:1;cursor:pointer}</style><script src="/web-auth.js?v=20261014-web-auth4"></script><script src="/my-web-common.js?v=20261014-my2"></script><link rel="stylesheet" href="/funy-ui-guide.css?v=20261014-ui1"></head><body><div class="my-page"><header class="my-head"><button class="my-back" onclick="FUNY_MY_WEB.back()" aria-label="뒤로가기">‹</button><div class="my-title">관심 매장</div></header><main id="root" class="my-content"><div class="my-loading">관심 매장을 불러오는 중...</div></main></div><script>(async()=>{const H=FUNY_MY_WEB,A=await H.ready('/my-favorites.html');if(!A)return;const root=document.getElementById('root');async function load(){const {data:favs,error}=await A.client.from('shop_favorites').select('shop_id,created_at').order('created_at',{ascending:false});if(error)throw error;const ids=(favs||[]).map(x=>x.shop_id);if(!ids.length){root.innerHTML='<div class="my-empty"><strong>아직 관심 매장이 없어요</strong>카드샵 상세에서 ♡ 버튼을 눌러 관심 매장을 등록해보세요.<br><br><a href="/shops.html" class="my-btn" style="display:inline-flex;align-items:center;padding:0 17px;text-decoration:none">TCG MAP 둘러보기</a></div>';return}const {data:shops,error:e}=await A.client.from('v_app_shops').select('*').in('id',ids);if(e)throw e;const by=new Map((shops||[]).map(x=>[String(x.id),x]));root.innerHTML='<div class="my-list">'+ids.map(id=>{const s=by.get(String(id));if(!s)return'';const imgs=Array.isArray(s.images)?s.images:[],im=imgs.slice().sort((a,b)=>Number(b.is_primary)-Number(a.is_primary))[0],src=H.img(im?.storage_path||im?.source_path||''),station=s.nearest_station?(s.nearest_station+(s.walk_minutes!=null?' 도보 '+s.walk_minutes+'분':'')):'카드샵';return '<article class="my-card fav-card" data-id="'+H.esc(id)+'">'+(src?'<img class="fav-img" src="'+H.esc(src)+'" alt="">':'<div class="fav-fallback">FUNY PIN</div>')+'<a class="fav-copy" href="/shops.html#/shop/'+encodeURIComponent(id)+'"><div class="fav-name">'+H.esc(s.name)+'</div><div class="fav-meta">'+H.esc((s.area||s.city||'카드샵')+' · '+station)+'</div><div class="fav-address">'+H.esc(s.address||'')+'</div></a><button class="fav-remove" type="button" aria-label="관심 매장 해제">×</button></article>'}).join('')+'</div>';root.querySelectorAll('.fav-remove').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('[data-id]'),id=card?.dataset.id;if(!id)return;btn.disabled=true;const {error}=await A.client.from('shop_favorites').delete().eq('user_id',A.session.user.id).eq('shop_id',id);if(error){btn.disabled=false;alert('관심 매장 해제에 실패했습니다.');return}card.remove();if(!root.querySelector('[data-id]'))load()})}try{await load()}catch(e){root.innerHTML='<div class="my-empty"><strong>불러오지 못했어요</strong>잠시 후 다시 시도해주세요.</div>'}})();</script></body></html>
