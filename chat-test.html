(()=>{const URL='https://wdttzpbmqavaqfcbaywj.supabase.co',KEY='sb_publishable__wrSzngSE-JbGnyE7PZX9w_2QaW8bpq';const db=supabase.createClient(URL,KEY);const box=document.getElementById('messages'),form=document.getElementById('form'),nick=document.getElementById('nickname'),input=document.getElementById('message'),send=document.getElementById('send'),err=document.getElementById('error'),status=document.getElementById('status');nick.value=localStorage.getItem('funypin_chat_nickname')||'';const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};const time=v=>new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(new Date(v));function render(rows){box.innerHTML=rows.length?rows.map(x=>'<article class="msg"><div class="meta"><span class="nick">'+esc(x.nickname)+'</span><span>'+time(x.created_at)+'</span></div><div class="bubble">'+esc(x.message)+'</div></article>').join(''):'<div class="empty">아직 메시지가 없어요.<br>첫 이야기를 남겨보세요 🙂</div>';box.scrollTop=box.scrollHeight}async function load(){const {data,error}=await db.from('messages').select('id,nickname,message,created_at').order('created_at',{ascending:true}).limit(200);if(error){box.innerHTML='<div class="empty">메시지를 불러오지 못했습니다.</div>';showError(error.message);return}render(data||[])}function showError(s){err.textContent=s;err.style.display='block'}form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';const n=nick.value.trim(),m=input.value.trim();if(!n||!m)return;send.disabled=true;localStorage.setItem('funypin_chat_nickname',n);const {error}=await db.from('messages').insert({nickname:n,message:m});send.disabled=false;if(error){showError('전송 실패: '+error.message);return}input.value='';input.focus()});db.channel('funypin-chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe(s=>{if(s==='SUBSCRIBED'){status.classList.add('on');status.querySelector('span:last-child').textContent='실시간 연결됨'}else if(s==='
