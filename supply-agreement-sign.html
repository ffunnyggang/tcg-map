<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>FUNYFRAME 공급계약 전자서명</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f2f7;color:#241f2b;font:16px/1.65 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px 16px}header{border-top:4px solid #6343a0;padding:16px 0}header b{color:#6343a0}h1{margin:4px 0;font-size:28px}section,article{background:white;padding:20px;border-radius:12px;margin-bottom:16px}article{white-space:pre-line}label{display:block;margin:10px 0}input:not([type=checkbox]){display:block;width:100%;padding:10px;font:inherit}canvas{width:100%;height:160px;border:1px solid #aaa;touch-action:none}button{padding:10px 16px;margin:4px;font:inherit;cursor:pointer}button[type=submit]{background:#513686;color:white;border:0;border-radius:6px}img{width:170px;display:block}h2{font-size:19px}[hidden]{display:none!important}@media print{button,form,#access,#status{display:none!important}body,main{background:white;padding:0}section,article{padding:0}}.bankDetails{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:15px;break-inside:avoid}.bankDetails caption{text-align:left;font-weight:700;margin-bottom:5px}.bankDetails th,.bankDetails td{border:1px solid #d9d3e2;text-align:left;padding:7px 10px}.bankDetails th{background:#f2eff6;width:5.5em}.bankDetails td{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}</style>
<style>html{-webkit-text-size-adjust:100%}#documentBody{white-space:normal;font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;padding:clamp(16px,4vw,32px);border:1px solid #ded9e6}#documentBody p{margin:.4em 0}#documentBody .meta{font-size:13px;color:#605668}#documentBody h2{margin:1.5em 0 .65em;border-top:1px solid #ded9e6;padding-top:.8em;font-size:19px}#documentBody .docTitle{margin:.4em 0;border:0;padding:0;font-size:24px}#documentBody h3{font-size:16px;color:#513686;margin:1.2em 0 .25em}#documentBody dl{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.55fr);margin:12px 0;border:1px solid #dfdae6;border-radius:8px;overflow:hidden}#documentBody dt,#documentBody dd{padding:8px 10px;margin:0;border-bottom:1px solid #e7e2ec}#documentBody dt{background:#f2eff6;color:#53485f;font-weight:600}#documentBody dd{min-width:0}#documentBody ul{padding-left:1.25em;margin:14px 0}#documentBody li{margin:.55em 0}#status{color:#584969}input[type=checkbox]{width:auto}@media print{#documentBody{border:0;padding:0;font-size:10pt}#documentBody h3{break-after:avoid}}</style><style>
#authPanel{padding:22px;border:1px solid #e5dfed;border-radius:18px;box-shadow:0 6px 24px #38245c08}
#authPanel h2{font-size:20px;line-height:1.4;margin:0 0 6px;letter-spacing:-.04em}
#authPanel p{font-size:14px;color:#71677d;line-height:1.55;margin:0 0 18px}
.authSteps{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:#857b90;margin-bottom:20px}
.authSteps strong{color:#513686;font-weight:700}.authSteps span{white-space:nowrap}
.authChoice{display:flex;align-items:center;text-align:left;gap:13px;width:100%;margin:0 0 10px;padding:15px 14px;min-height:76px;border:1px solid #ded8e7;border-radius:12px;background:#fff;color:#292332}
.authChoice:focus-visible,#authPanel button:focus-visible,#authPanel input:focus-visible{outline:3px solid #ab94db;outline-offset:2px}
.authChoice.primary{background:#f8f5fc;border-color:#bfaedb}
.authIcon{width:36px;height:36px;display:grid;place-items:center;flex:none;background:white;border-radius:9px;color:#513686;border:1px solid #e7e0ef}
.authIcon svg{width:21px;height:21px}
.authCopy{flex:1;min-width:0}.authCopy strong{display:block;font-size:15px;line-height:1.4}.authCopy small{display:block;font-size:12px;line-height:1.5;margin-top:4px;color:#746b7e}.authChevron{font-size:21px;color:#8e809f;flex:none}
#authPanel .authFoot{font-size:12px;line-height:1.6;margin:14px 0 0;color:#756c80}
#emailOption{padding:0;margin:0;border:0;background:transparent}#emailOption label{font-size:13px;font-weight:650;color:#43384e;margin:12px 0}
#emailOption input{margin-top:6px;min-height:48px;border:1px solid #d9d3e1;border-radius:10px;background:white;padding:11px 12px;font-size:16px;color:#241f2b}
#emailOption button[type=submit]{margin:4px 0 0;width:100%;min-height:48px;border-radius:10px;font-size:15px;font-weight:700}
#emailOption #emailStatus{margin:12px 0 0;font-size:13px;overflow-wrap:anywhere;color:#625173}
#emailOption #backMethods{margin:0 0 16px;padding:6px 0;border:0;background:transparent;color:#6343a0;font-size:13px;font-weight:650}
#otpForm{border-top:1px solid #eee8f3;margin-top:16px;padding-top:7px}
#authPanel button:disabled{opacity:.55;cursor:wait}#authPanel input[name=code]{letter-spacing:.18em;font-variant-numeric:tabular-nums}
#status{font-size:14px;line-height:1.6;margin:0 0 16px}header h1{font-size:clamp(23px,5.6vw,28px);line-height:1.35;letter-spacing:-.04em}header b{font-size:15px;letter-spacing:.045em}
@media print{#authPanel{display:none!important}}
</style><script src="/web-auth.js"></script><main><header><b>FUNYFRAME</b><h1>공급계약 전자서명</h1></header><p id="status" role="status">접근 권한 확인 중…</p><section hidden id="authPanel" aria-label="본인 인증"><div class="authSteps" aria-label="진행 순서"><strong>01 본인 인증</strong><span aria-hidden="true">›</span><span>02 계약 확인</span><span aria-hidden="true">›</span><span>03 전자서명</span></div><div id="authMethods"><h2>본인 인증 방법 선택</h2><p>아래 두 가지 방법 중 하나만 선택해 주세요.</p><button hidden id="access" type="button" class="authChoice primary"><span class="authIcon" aria-hidden="true"><svg viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.7-.4-4H24v7.6h11a9.4 9.4 0 0 1-4.1 6.2v5h6.6c3.9-3.6 6.1-8.8 6.1-14.8z"/><path fill="#34A853" d="M24 44c5.5 0 10.2-1.8 13.5-4.7l-6.6-5A12.2 12.2 0 0 1 12.5 28H5.7v5.2A20 20 0 0 0 24 44z"/><path fill="#FBBC05" d="M12.5 28a12 12 0 0 1 0-8V14.8H5.7a20 20 0 0 0 0 18.4z"/><path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3l5.8-5.8A19.3 19.3 0 0 0 24 4 20 20 0 0 0 5.7 14.8l6.8 5.2C14.1 15.3 18.7 12 24 12z"/></svg></span><span class="authCopy"><strong>Google 계정으로 인증</strong><small>계약에 등록된 Google 계정으로 로그인</small></span><span class="authChevron" aria-hidden="true">›</span></button><button id="chooseEmail" type="button" class="authChoice"><span class="authIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><span class="authCopy"><strong>이메일 인증번호로 인증</strong><small>등록된 이메일로 받은 인증번호 입력</small></span><span class="authChevron" aria-hidden="true">›</span></button><p class="authFoot">인증 방법과 관계없이 동일한 계약서를 확인하고 전자서명을 진행합니다.</p></div><div hidden id="emailOption"><button id="backMethods" type="button">‹ 다른 인증 방법 선택</button><h2>이메일 인증</h2><p>계약에 등록된 이메일로 인증번호를 보내드립니다.</p><form id="emailForm"><label>이메일 주소<input name="email" type="email" autocomplete="email" placeholder="이메일 주소 입력" required></label><button type="submit">인증번호 받기</button></form><form hidden id="otpForm"><label>인증번호 (6~8자리)<input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" minlength="6" maxlength="8" placeholder="인증번호 입력" required></label><button type="submit">인증하고 계약서 열기</button></form><p id="emailStatus" role="status" aria-live="polite"></p></div></section><article hidden id="documentBody"></article><section hidden id="records"></section><form hidden id="signForm"><section><h2 id="formTitle"></h2><div id="buyerFields"><label>사업자 상호<input name="business" maxlength="80"></label><label>사업자등록번호<input name="number" inputmode="numeric" placeholder="000-00-00000"></label><label>대표자명<input name="representative" maxlength="80"></label><label>사업장 주소<input name="address" maxlength="300" autocomplete="street-address"></label><label>세금계산서 수신 이메일<input name="tax_email" type="email" maxlength="254"></label><label>연락처<input name="phone" type="tel"></label></div><label>서명자 성명<input name="signer" required autocomplete="name"></label><p>아래에 손가락이나 마우스로 서명해 주세요.</p><canvas id="pad" width="900" height="250"></canvas><button id="clearInk" type="button">서명 지우기</button><label><input type="checkbox" name="agree" required> 계약 내용을 확인하고 본인 명의로 전자서명합니다.</label><button type="submit">동의하고 서명 제출</button><p id="feedback" role="status"></p></section></form><button hidden id="printCopy">계약서 인쇄 / PDF 저장</button></main>
<script>
(async function(){
const el=id=>document.getElementById(id),auth=window.FUNY_WEB_AUTH,id=new URLSearchParams(location.search).get('id'),status=el('status'),login=el('access'),form=el('signForm'),pad=el('pad'),ctx=pad.getContext('2d');let state,active=null,ink=false;
const point=e=>{const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]};
pad.onpointerdown=e=>{if(active!==null)return;active=e.pointerId;pad.setPointerCapture(active);ctx.beginPath();ctx.lineWidth=4;ctx.lineCap='round';ctx.moveTo(...point(e))};
pad.onpointermove=e=>{if(active!==e.pointerId)return;ctx.lineTo(...point(e));ctx.stroke();ink=true};
pad.onpointerup=pad.onpointercancel=e=>{if(active===e.pointerId)active=null};
el('clearInk').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);ink=false};
el('printCopy').onclick=()=>window.print();
async function request(submission=null){const {data,error}=await auth.client.rpc('funy_supply_sign',{p_id:id,p_submission:submission});if(error)throw Error(error.message);return data}
function renderAgreement(body){
 const root=el('documentBody');root.replaceChildren();
 const add=(tag,txt,parent=root)=>{const node=document.createElement(tag);node.textContent=txt;parent.append(node);return node};
 let group=null, bullets=null,last=null;
 for(const raw of body.split('\n')){
  const line=raw.trim();if(!line)continue;
  if(line.startsWith('•')){group=null;if(!bullets)bullets=add('ul','');last=add('li',line.slice(1).trim(),bullets);continue}
  if(raw.startsWith(' ')&&last?.tagName==='LI'){last.append(' '+line);continue}
  bullets=null;
  const bank=line.match(/^입금 계좌\s+([^/]+)\s*\/\s*([\d-]+)\s*\/\s*(.+)$/);
  if(bank){
   group=null;last=null;
   const table=add('table','');table.className='bankDetails';
   add('caption','입금 계좌',table);
   const rows=add('tbody','',table);
   ['은행','계좌번호','예금주'].forEach((label,i)=>{
    const row=add('tr','',rows);
    add('th',label,row).scope='row';
    add('td',bank[i+1].trim(),row);
   });
   continue;
  }
  if(line.includes('　')){if(!group)group=add('dl','');const split=line.indexOf('　');add('dt',line.slice(0,split),group);add('dd',line.slice(split+1),group);last=null;continue}
  group=null;
  if(/^\d{2}\s/.test(line)){last=add('h2',line);continue}
  if(line.startsWith('공급계약서')){last=add('h2',line);last.className='docTitle';continue}
  if(/^(발주 및 확정|결제 및 출고|배송 및 검수|교환 및 반품|반품 조건|계약기간)$/.test(line)){last=add('h3',line);continue}
  if(last?.tagName==='P'&&/으로$/.test(last.textContent)&&line.startsWith('갱신')){last.append(' '+line);continue}
  last=add('p',line);
  if(line==='FUNYFRAME'||line.endsWith('/  공급계약')||line.startsWith('작성일'))last.className='meta';
 }
}
function display(data){el('authPanel').hidden=true;state=data;renderAgreement(data.body);el('documentBody').hidden=false;const list=el('records');list.hidden=false;list.replaceChildren();for(const p of data.parties){const row=document.createElement('p');row.textContent=(p.role==='buyer'?'매입처':'공급자')+' · '+p.name+' · '+(p.signed?new Date(p.signed).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국시간)':'서명 대기');list.append(row);if(p.signed){if(p.role==='buyer'){const d=document.createElement('dl');for(const [label,key] of [['사업자 상호','business'],['사업자등록번호','number'],['대표자명','representative'],['사업장 주소','address'],['세금계산서 수신 이메일','tax_email'],['연락처','phone']]){if(!p.details?.[key])continue;const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=p.details[key];d.append(dt,dd)}list.append(d)}const im=document.createElement('img');im.src=p.ink;im.alt=p.name+' 서명';list.append(im)}}
const mine=data.parties.find(p=>p.role===data.role),waiting=data.role==='supplier'&&!data.parties.find(p=>p.role==='buyer').signed;
form.hidden=Boolean(mine.signed)||waiting;el('buyerFields').hidden=data.role!=='buyer';for(const field of el('buyerFields').querySelectorAll('input')){field.disabled=data.role!=='buyer';field.required=data.role==='buyer';}el('formTitle').textContent=data.name+' 님 전자서명';el('printCopy').hidden=false;status.textContent=data.parties.every(p=>p.signed)?'양측 서명이 완료되었습니다.':mine.signed?'서명이 저장되었습니다. 상대방 서명 대기 중입니다.':waiting?'매입처 서명 후 이 링크에서 공급자 서명을 진행해 주세요.':'계약 내용을 확인한 뒤 아래에서 서명해 주세요.'}
form.onsubmit=async e=>{e.preventDefault();const f=form.elements,msg=el('feedback'),btn=form.querySelector('[type=submit]');if(!ink||f.signer.value.trim()!==state.name){msg.textContent='지정된 서명자의 성명과 자필 서명을 확인해 주세요.';return}const input={hash:state.hash,name:state.name,ink:pad.toDataURL(),agree:f.agree.checked,business:f.business.value.trim(),number:f.number.value.replace(/[- ]/g,''),phone:f.phone.value.replace(/[- ]/g,''),representative:f.representative.value.trim(),address:f.address.value.trim(),tax_email:f.tax_email.value.trim()};if(state.role==='buyer'&&(!input.business||!/^\d{10}$/.test(input.number)||!/^\d{9,15}$/.test(input.phone)||!input.representative||input.representative.length>80||!input.address||input.address.length>300||input.tax_email.length>254||!/^\S+@[^\s@]+\.[^\s@]+$/.test(input.tax_email))){msg.textContent='사업자 상호, 사업자등록번호 10자리, 대표자명, 사업장 주소, 세금계산서 수신 이메일 및 연락처를 확인해 주세요.';return}btn.disabled=true;try{display(await request(input));window.scrollTo(0,0)}catch(error){msg.textContent=String(error?.message).includes('CHECK_BUYER')?'매입처 사업자 정보를 다시 확인해 주세요.':'저장 결과를 확인할 수 없습니다. 새로고침하여 서명 상태를 확인해 주세요.'}finally{btn.disabled=false}};
let otpEmail='',resendAfter=0,otpBusy=false;
const otpForm=el('otpForm'),emailForm=el('emailForm'),hint=el('emailStatus'),authPanel=el('authPanel'),authMethods=el('authMethods'),emailOption=el('emailOption');
function showMethods(message){authPanel.hidden=false;authMethods.hidden=false;login.hidden=false;emailOption.hidden=true;status.textContent=message||'안전한 계약 열람을 위해 본인 인증이 필요합니다.';}
el('chooseEmail').onclick=()=>{if(otpBusy||login.disabled)return;authMethods.hidden=true;emailOption.hidden=false;emailForm.elements.email.focus();};
el('backMethods').onclick=()=>{if(otpBusy)return;emailOption.hidden=true;authMethods.hidden=false;el('chooseEmail').focus();};

emailForm.elements.email.addEventListener('input',()=>{otpEmail='';otpForm.hidden=true;otpForm.reset();hint.textContent='';emailForm.querySelector('button').textContent='인증번호 받기';});
emailForm.onsubmit=async event=>{
  event.preventDefault();
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||''))return;
  if(otpBusy)return;
  if(Date.now()<resendAfter){hint.textContent='잠시 후 다시 요청해 주세요. (60초 간격)';return;}
  const field=emailForm.elements.email,button=emailForm.querySelector('button'),email=field.value.trim();
  otpBusy=true;button.disabled=true;field.readOnly=true;
  try{
    await auth.init();
    const {error}=await auth.client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/supply-agreement-sign.html'}});
    if(error)throw error;
    otpEmail=email;resendAfter=Date.now()+60000;otpForm.reset();otpForm.hidden=false;button.textContent='인증번호 재발송';
    hint.textContent='메일에 포함된 6~8자리 인증번호를 입력해 주세요. 로그인 링크는 누르지 마세요.';
    otpForm.elements.code.focus();
  }catch(error){hint.textContent=error.status===429?'인증 요청이 많습니다. 잠시 뒤 다시 시도해 주세요.':'인증번호 발송 요청에 실패했습니다. 다시 시도해 주세요.';}
  finally{otpBusy=false;button.disabled=false;field.readOnly=false;}
};
otpForm.onsubmit=async event=>{
  event.preventDefault();
  if(otpBusy||!otpEmail||otpEmail!==emailForm.elements.email.value.trim())return;
  const code=otpForm.elements.code.value.trim(),button=otpForm.querySelector('button');
  if(!/^[0-9]{6,8}$/.test(code))return;
  otpBusy=true;button.disabled=true;emailForm.elements.email.readOnly=true;
  try{
    const {data,error}=await auth.client.auth.verifyOtp({email:otpEmail,token:code,type:'email'});
    if(error||!data?.session)throw Error('OTP_INVALID');
    const agreement=await request();
    display(agreement);login.hidden=true;el('emailOption').hidden=true;otpForm.reset();
  }catch(error){
    hint.textContent=String(error.message).includes('ACCESS_DENIED')?'계약에 지정된 이메일로 다시 인증해 주세요.':'인증번호가 올바르지 않거나 만료되었거나 계약을 열 수 없습니다. 다시 확인해 주세요.';
  }finally{otpBusy=false;button.disabled=false;emailForm.elements.email.readOnly=false;}
};
login.onclick=async()=>{
  login.disabled=true;el('chooseEmail').disabled=true;
  try{
    await auth.init();
    const target=new URL(location.pathname,location.origin);
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||''))throw Error('INVALID');
    target.searchParams.set('id',id);
    sessionStorage.setItem('funy-supply-oauth-return',JSON.stringify({url:target.href,at:Date.now()}));
    status.textContent='FUNYFRAME · Google 인증 중…';
    await auth.signInSocial('google',target.href);
  }catch{
    try{sessionStorage.removeItem('funy-supply-oauth-return')}catch(_){}
    status.textContent='Google 계정 선택 화면을 열지 못했습니다. 잠시 후 다시 시도해 주세요.';
    login.disabled=false;el('chooseEmail').disabled=false;
  }
};
