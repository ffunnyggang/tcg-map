name: Mobile release check

on:
  workflow_dispatch:
  push:
    branches: [app-mvp]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-release-check.yml'

jobs:
  android-release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo config
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: npx expo config --type public > /tmp/expo-config.json
      - name: Expo doctor
        run: npx expo-doctor
